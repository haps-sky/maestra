["Strategi yang muncul dari pengalaman dan pembelajaran manajer saat menghadapi perubahan disebut…", ["Intended", "Unrealized", "Emergent", "Planned"], 2, "Setelah dijalankan, emergent strategy menjadi realized strategy."],
["Dalam kerangka strategic management Henry, yang menentukan goals organisasi adalah…", ["Pesaing", "Values", "Pemasok", "Regulator"], 1, "Values menentukan goals, lalu goals menentukan resources dan capabilities yang dibutuhkan."],
["Sebuah perusahaan menolak kontrak besar yang menguntungkan karena kontrak itu mengharuskan mengorbankan keselamatan pelanggan. Prinsip yang dipegang perusahaan ini paling tepat disebut…",["Vision","Goals jangka pendek","Core values","Template strategy"],2,"Core values (Collins dan Porras) adalah prinsip yang tidak dikorbankan demi keuntungan jangka pendek dan tidak ikut berubah saat persaingan berubah."],
["Karyawan merasa nilai pribadi mereka sejalan dengan nilai organisasi sehingga muncul komitmen emosional. Menurut Campbell, ini disebut…",["Mission statement","Theory of the business","Strategic fit","Sense of mission"],3,"Campbell membedakan mission (konsep intelektual untuk memandu kebijakan) dari sense of mission (komitmen emosional karena nilai organisasi cocok dengan nilai pribadi)."],
["Manajer menyusun strategi dengan maju dalam langkah-langkah kecil dari kondisi sekarang, bukan lewat rencana besar yang menyeluruh. Pendekatan ini dikaitkan dengan…",["Lindblom: muddling through","Andrews: pencocokan SWOT","Ansoff: growth vector","Porter: generic strategies"],0,"Lindblom (learning school) menyebutnya muddling through atau branch method: maju dalam langkah kecil dari kondisi sekarang."],
["Menurut Cyert dan March, organisasi paling tepat dipahami sebagai…",["Satu pengambil keputusan rasional tunggal","Kumpulan aset yang bisa disusun ulang","Koalisi pihak dengan kepentingan yang berbeda","Rantai aktivitas penambah nilai"],2,"Cyert dan March (learning school) melihat organisasi sebagai koalisi dengan kepentingan berbeda, sehingga strategi dibentuk lewat tawar-menawar dan pembelajaran."],
["Corporate planning era 1960-an yang berbasis budget jangka panjang (sekitar lima tahun) paling cocok untuk kondisi…",["Pasar yang stabil dan relatif dapat diprediksi","Hypercompetition","Industri yang sedang disrupsi","Pasar dengan siklus produk sangat pendek"],0,"Corporate planning bertumpu pada sistem budgetary control dan mengasumsikan lingkungan yang stabil."],
["Keputusan divisi R&D, marketing, dan finance yang dirancang untuk mendukung cara sebuah unit bisnis bersaing disebut strategi tingkat…",["Corporate","Transnational","Hybrid","Functional"],3,"Functional strategy adalah keputusan per lini fungsi yang mendukung business strategy. Henry memasukkannya dalam pembahasan business strategy."],
["Kaum rationalist melihat dominasi Honda di pasar motor AS sebagai strategi yang disengaja, sedangkan Mintzberg melihatnya sebagai…",["Strategi unrealized","Strategi emergent","Corporate strategy","Strategi cost leadership"],1,"Mintzberg melihat keberhasilan Honda sebagai emergent strategy yang muncul dari pembelajaran. Strategi yang viable biasanya punya unsur deliberate dan emergent."],
["Pada 1990-an banyak perusahaan melakukan downsizing dan outsourcing sambil memusatkan diri pada core competences. Pendekatan yang berkembang pada masa itu adalah…",["Corporate planning berbasis budget","Diversification ala Ansoff","Resource-based view","Analisis competitive forces"],2,"1990-an: RBV (Grant, Kay, Prahalad dan Hamel). Competitive forces dominan di 1980-an, diversification di 1970-an, corporate planning di 1960-an."],
["Mana yang termasuk alat operational management menurut Henry?",["Scenario planning, PEST, dan analisis industri","Five Forces, value net, dan strategic groups","Diversification, merger, dan joint venture","TQM, benchmarking, outsourcing, dan BPR"],3,"Operational management adalah pencarian efisiensi dengan alat seperti TQM, benchmarking, outsourcing, dan BPR. Tiga pilihan lain adalah alat analisis strategi atau cara tumbuh."],
["Sebuah perusahaan memperbaiki akuntansi, SDM, dan teknologinya sampai setara praktik terbaik industri. Mengapa Henry menilai hal itu bukan strategi?",["Karena akuntansi dan SDM tidak berpengaruh pada kinerja","Karena strategi hanya berkaitan dengan keuangan","Karena praktik terbaik mudah ditiru pesaing","Karena strategi tidak boleh bersifat oportunistik"],2,"Strategi berdasar apa yang tidak bisa atau tidak mudah dilakukan pesaing. Best practice industri bisa disalin, jadi itu operational management."],["Blockbuster menolak tawaran Netflix pada 2000 karena merasa jauh lebih dominan, lalu akhirnya bangkrut. Menurut konsep theory of the business, masalah utamanya adalah…", ["Blockbuster tidak memiliki misi tertulis", "Asumsi lama tentang cara menang tidak diuji ulang", "Karyawan toko kurang terlatih sehingga layanan buruk", "Jumlah toko Blockbuster masih terlalu sedikit"], 1, "Asumsi bahwa toko yang besar cukup untuk menang kedaluwarsa. Dominasi yang dulu membawa sukses menjadi penghambat adaptasi (Icarus paradox)."],
["Unilever mengakuisisi Dollar Shave Club untuk masuk ke pasar pisau cukur. Keputusan ini termasuk level strategi…", ["Business strategy", "Functional strategy", "Corporate strategy", "Operational management"], 2, "Memilih industri yang dimasuki dan melakukan akuisisi adalah urusan corporate strategy."]];
const E1=[["Bedakan strategy, strategic management, dan business model.", "<b>Strategy</b>: pilihan aktivitas yang berbeda untuk meraih competitive advantage. <b>Strategic management</b>: prosesnya (analysis, formulation, implementation) yang saling bergantung. <b>Business model</b>: cerita tentang bagaimana organisasi bekerja dan menghasilkan uang; harus melengkapi strategi bersaing."],
["Jelaskan tiga level strategi dan beri contoh.", "Corporate (industri mana yang dimasuki, M&A, alokasi sumber daya antar SBU; contoh Unilever dan Dollar Shave Club). Business (cara bersaing di satu industri; manajer SBU otonom). Functional (keputusan per fungsi seperti R&D, marketing, finance untuk mendukung business strategy)."],
["Bandingkan rationalist school dan learning school. Bagaimana keduanya menjelaskan keberhasilan Honda?", "Rationalist: analisis lalu memilih strategi terbaik (SWOT). Learning: strategi muncul bertahap lewat pembelajaran. Rationalist melihat Honda sebagai strategi yang disengaja, Mintzberg melihatnya sebagai emergent strategy. Strategi yang viable biasanya punya unsur keduanya."],
["Mengapa theory of the business bisa membuat perusahaan besar gagal? Jelaskan dengan Intel.", "Asumsi tentang market, pelanggan, pesaing, dan kapabilitas bisa tidak cocok lagi dengan kenyataan. Intel tetap yakin pada memory chip walau pesaing Jepang menguasai pasar (30% menjadi 60%), karena sumber daya dan keyakinan terpusat di sana. Itu Icarus paradox."],
["Gambarkan kerangka strategic management Henry dan hubungan antar elemennya.", "Values menentukan goals. Goals menentukan resources and capabilities serta structure and processes. Strategy menghubungkan organisasi (strengths dan weaknesses) dengan lingkungan (opportunities dan threats). Stakeholders berhubungan dua arah dengan strategy, dan ada feedback bila intended strategy berubah."]];
const Q2=[["Macro-environment disebut general environment karena…", ["Selalu stabil", "Dampaknya melampaui satu industri", "Hanya memengaruhi satu perusahaan", "Hanya berisi pesaing"], 1, "Perubahan di macro-environment memengaruhi banyak perusahaan dan industri sekaligus."],
["Perubahan yang paling langsung dan cepat memengaruhi organisasi biasanya berasal dari…", ["Macro-environment", "Competitive environment", "Lingkungan internal", "Tidak ada yang berpengaruh"], 1, "Competitive environment (industri dan market) paling dekat dengan organisasi."],
["Melacak weak signals sampai membentuk pola yang lebih jelas disebut…", ["Scanning", "Monitoring", "Forecasting", "Benchmarking"], 1, "Scanning luas ('kuas lebar'), monitoring lebih halus dan mengikuti sinyal."],
["Kejadian unik tanpa data historis untuk menghitung probabilitas termasuk…", ["Risks", "Structural uncertainties", "Unknowables", "Kepastian"], 1, "Jenis ini cocok dianalisis dengan scenario planning."],
["Kejadian yang bahkan tidak bisa dibayangkan disebut…", ["Risks", "Structural uncertainties", "Unknowables", "Weak signals"], 2, "Unknowables tidak bisa diramal; organisasi menunggu kejadian lalu bereaksi."],
["Scenario planning paling tepat dipahami sebagai…", ["Metode membayangkan beberapa masa depan", "Anggaran tahunan yang disetujui direksi", "Analisis laporan keuangan lima tahun", "Prediksi satu angka yang pasti"], 0, "Scenario adalah cerita alternatif masa depan, bukan prediksi tunggal."],
["Langkah pertama membangun scenario adalah…", ["Menentukan scope (time frame dan ruang lingkup)", "Menyusun model kuantitatif yang terperinci", "Menunjuk konsultan eksternal terbaik", "Menentukan strategi final perusahaan"], 0, "Model kuantitatif justru langkah terakhir (setelah riset)."],
["Mengapa scenario perlu dicek konsistensi dan plausibility-nya?", ["Agar sesuai anggaran", "Agar murah dibuat", "Agar jumlahnya banyak", "Agar skenario masuk akal"], 3, "Skenario harus masuk akal secara internal."],
["Suku bunga, inflasi, GDP, dan kurs termasuk faktor…", ["Political", "Economic", "Social", "Technological"], 1, "Perubahan aktivitas ekonomi tercermin lewat indikator seperti ini."],
["Populasi menua dan perubahan budaya konsumen termasuk faktor…", ["Political", "Economic", "Social", "Technological"], 2, "Social mencakup demografi dan budaya."],
["Kecepatan teknologi baru menggantikan teknologi lama (rate of obsolescence) termasuk faktor…", ["Political", "Economic", "Social", "Technological"], 3, "Teknologi dapat melahirkan industri baru dan mengubah cara bersaing."],
["Kesalahan umum dalam membuat PEST analysis adalah…", ["Memakai istilah bahasa Inggris", "Memakai terlalu sedikit data", "Daftar poin tanpa implikasi", "Menganalisis macro-environment"], 2, "PEST bukan 'shopping list'; setiap faktor perlu ditarik implikasinya."],
["Menurut Henry, faktor Legal dalam PESTLE bisa dimasukkan ke faktor…", ["Political", "Economic", "Social", "Technological"], 0, "Legal dimasukkan ke political; environmental ke social."],
["Dalam SWOT, strengths dan weaknesses berasal dari…", ["Lingkungan eksternal yang tidak bisa dikendalikan", "Lingkungan internal yang bisa dikendalikan perusahaan", "Pesaing dan pemasok utama di industri", "Regulator dan kebijakan pemerintah"], 1, "Opportunities dan threats berasal dari lingkungan eksternal."],
["Five Forces dianalisis dari sudut pandang…", ["Entrant baru yang ingin masuk ke industri", "Incumbent (perusahaan yang sudah ada di industri)", "Pemerintah sebagai regulator industri", "Konsumen sebagai pembeli akhir produk"], 1, "Paling pas dipakai di level SBU."],
["Mana yang BUKAN barrier to entry utama menurut Henry?", ["Economies of scale", "Capital requirement", "Product differentiation", "Jumlah karyawan yang besar"], 3, "Barriers utama: economies of scale, capital requirement, product differentiation, access to distribution channels, cost advantages independent of size."],
["Supplier berkuasa ketika…", ["Supplier sedikit dan sulit diganti", "Produknya standar", "Pembeli terkonsentrasi", "Banyak supplier pengganti"], 0, "Faktornya mirror image dari buyer power."],
["Substitutes membatasi industri terutama dengan…", ["Menurunkan fixed cost seluruh pemain industri", "Menaikkan harga yang bisa dikenakan perusahaan", "Menambah jumlah entrant baru ke industri", "Menjadi batas atas (ceiling) harga yang bisa dikenakan"], 3, "Pelanggan pindah ke substitusi saat harga naik."],
["Rivalry cenderung semakin intens ketika…", ["Pertumbuhan industri lambat dan fixed costs tinggi", "Fixed costs rendah dan produk berbeda-beda", "Pertumbuhan industri tinggi dan permintaan naik", "Hanya ada satu pemain yang menguasai pasar"], 0, "Pangsa hanya bisa direbut dari pesaing; fixed costs tinggi mendorong perang harga (contoh airline)."],
["Dua keterbatasan Five Forces menurut Henry adalah…", ["Asumsi zero-sum dan analisis yang statis", "Terlalu fokus macro dan terlalu fokus HR", "Hanya untuk startup dan hanya untuk UMKM", "Terlalu murah dan terlalu rumit"], 0, "Value net menambahkan sisi kerja sama dan dinamika."],
["Value net (Brandenburger dan Nalebuff) menambahkan…", ["Rasio keuangan dan analisis laba", "Pesaing baru dan entrant potensial", "Game theory dan complementors", "Analisis PEST dan faktor makro"], 2, "Bisnis bukan hanya permainan menang-kalah."],
["Tahap industry life cycle dengan penjualan naik cepat, economies of scale, dan banyak entrant baru adalah…", ["Introduction", "Growth", "Maturity", "Decline"], 1, "Profit yang naik menarik entrant baru."],
["Pada tahap introduction, profit biasanya negatif karena…", ["Persaingan harga antar banyak pemain", "Penjualan lambat dan biaya R&D tinggi", "Pasar sudah jenuh dan pemain berkurang", "Regulasi ketat dan pajak yang tinggi"], 1, "Biaya produksi terbatas dan R&D belum tertutup oleh penjualan."],
["Pada tahap maturity, persaingan bergeser ke…", ["First-mover advantage", "Efisiensi biaya", "Teknologi baru", "Brand awareness"], 1, "Rivalry makin intens, apalagi bila ada exit barriers."],
["Mobility barriers adalah…", ["Hambatan bagi pembeli", "Hambatan keluar dari industri", "Hambatan masuk ke industri baru", "Hambatan pindah antar strategic group"], 3, "Mobility barrier = batasan replikasi atau peniruan posisi strategis. Bedakan dari barriers to entry."],
["Hypercompetition (D'Aveni) ditandai oleh…", ["Gerakan kompetitif intens dan cepat", "Regulasi ketat", "Persaingan lambat dan stabil", "Monopoli"], 0, "Contoh Henry: Apple yang terus memperbarui produk."],
["Menurut Christensen, perusahaan kecil menembus incumbent dengan cara…", ["Masuk lewat segmen yang diabaikan", "Menunggu regulasi", "Meniru produk incumbent", "Menyerang segmen high-end"], 0, "Incumbent sibuk mengejar pelanggan paling menguntungkan di high-end."],
["Menyapu lingkungan secara luas untuk menemukan weak signals, sebelum tahu mana yang penting, adalah aktivitas…",["Scanning","Monitoring","Forecasting","Benchmarking"],0,"Scanning adalah kuas lebar untuk menemukan weak signals. Monitoring melacak sinyal sampai menjadi pola, dan forecasting membuat prakiraan tren."],
["Tim strategi membuat prakiraan arah sebuah tren agar strategi bisa disiapkan sebelum tren itu menjadi ancaman besar. Aktivitas ini disebut…",["Scanning","Monitoring","Benchmarking","Forecasting"],3,"Forecasting adalah membuat prakiraan tren sebelum menjadi ancaman besar, sehingga organisasi sempat menyiapkan strategi."],
["Penyewaan DVD kehilangan pelanggan ke streaming. Penjualan dan profit turun, persaingan harga ketat, sebagian pemain keluar atau berkonsolidasi. Tahap industry life cycle yang paling sesuai adalah…",["Introduction","Growth","Maturity","Decline"],3,"Pada decline penjualan dan profit turun, loyalitas pindah ke teknologi baru, terjadi persaingan harga, dan perusahaan keluar atau berkonsolidasi."],
["Beberapa produsen mobil di industri yang sama berada di harga tinggi dengan product range sempit, sedangkan yang lain di harga rendah dengan range luas. Kelompok-kelompok ini digambarkan di strategic map sebagai…",["Complementors","Strategic groups","Substitutes","Value net"],1,"Strategic group adalah perusahaan dalam satu industri yang bersaing dengan posisi strategis serupa, dan posisinya digambarkan di strategic map."],
["Mana kondisi yang membuat ancaman pendatang baru MENINGKAT?",["Economies of scale yang besar bagi incumbent","Capital requirement yang tinggi untuk masuk","Pesaing lama diperkirakan tidak akan melakukan retaliation","Akses ke saluran distribusi yang sulit didapat"],2,"Entrant lebih berani masuk bila retaliation tidak diperkirakan atau profit industri jauh di atas cost of capital. Tiga pilihan lain justru barriers to entry."],
["Dalam urutan langkah scenario planning, langkah yang langsung mengikuti 'identify basic trends' adalah…",["Identify major stakeholders","Construct initial scenario themes","Identify key uncertainties","Develop quantitative models"],2,"Urutan: define scope, identify stakeholders, identify basic trends, identify key uncertainties, construct scenario themes, cek konsistensi, learning scenarios, research needs, model kuantitatif."],
["Pemasok bahan baku mulai membuka gerai sendiri untuk menjual langsung ke konsumen akhir. Ancaman forward integration ini meningkatkan kekuatan…",["Bargaining power of suppliers","Threat of substitutes","Bargaining power of buyers","Rivalry among competitors"],0,"Ancaman forward integration adalah salah satu faktor yang memperkuat bargaining power of suppliers."],["Mana yang paling tepat disebut weak signal bagi Blockbuster sebelum bangkrut?", ["Chapter 11 pada 2010", "Netflix yang masih rugi tetapi loyalitasnya naik", "Penutupan seluruh toko pada 2013", "Valuasi Netflix yang melampaui Disney pada 2020"], 1, "Weak signal adalah tanda awal yang masih samar. Tiga pilihan lain adalah hasil atau kejadian yang sudah jelas dan terlambat."],
["Ketergantungan Ryanair pada Boeing, termasuk dampak keterlambatan 737 MAX, paling terkait dengan force…", ["Bargaining power of suppliers", "Threat of substitutes", "Bargaining power of buyers", "Threat of new entrants"], 0, "Pemasok pesawat sedikit dan sulit digantikan, jadi bargaining power of suppliers tinggi."],
["Mengapa Ryanair tetap untung walaupun banyak force di industri low-cost airline tergolong kuat?", ["Five Forces tidak berlaku untuk maskapai", "Ryanair tidak punya pesaing di rutenya", "Pemasoknya sangat lemah", "Biaya rendah dan load factor tinggi"], 3, "Five Forces menilai daya tarik industri, sedangkan keuntungan sebuah perusahaan juga ditentukan posisinya (cost leadership)."]];
const E2=[["Bedakan scanning, monitoring, dan forecasting. Mengapa weak signals penting?", "Scanning: pemindaian luas untuk menemukan weak signals. Monitoring: melacak sinyal sampai jadi pola. Forecasting: prakiraan tren. Weak signals sering menjadi tanda awal perubahan di competitive environment dan disrupsi."],
["Kapan scenario planning dipakai dan bagaimana langkahnya?", "Dipakai untuk structural uncertainties (kejadian unik tanpa data probabilitas). Prosesnya sembilan langkah yang dikelompokkan menjadi persiapan, mencari bahan, menyusun skenario, dan memperdalam (rincian ada di tabel kartu Scenario planning)."],
["Jelaskan PEST dan keterbatasannya.", "PEST: political, economic, social, technological (PESTLE menambah legal dan environmental). Keterbatasan: bukan 'shopping list', implikasi tiap faktor harus ditarik ke industri, dan perubahan cepat sulit diprediksi."],
["Analisislah industri dengan Five Forces. Apa keterbatasannya dan bagaimana value net melengkapinya?", "Lima forces: threat of new entrants, buyers, suppliers, substitutes, rivalry. Keterbatasan: asumsi zero-sum dan statis. Value net menambah complementors sebagai kekuatan keenam dan melihat peluang win–win."],
["Jelaskan industry life cycle dan hubungannya dengan rivalry.", "Introduction, growth, maturity, decline. Rivalry menguat di maturity karena pasar jenuh dan pangsa hanya bisa diambil dari pesaing; di decline persaingan harga dan konsolidasi."],
["Bedakan hypercompetition dan disruptive innovation.", "Hypercompetition (D'Aveni): gerakan kompetitif cepat dan intens antar pesaing. Disruptive innovation (Christensen): entrant kecil menyasar segmen yang diabaikan incumbent dengan harga lebih rendah, lalu naik ke upmarket."]];
CONTENT.s4={kicker:'Sesi 4 · Henry Ch. 6',title:'Business Strategy dan Functional Planning',desc:'Peran business strategy, generic strategies Porter (cost leadership, differentiation, focus, stuck in the middle), experience curve dan economies of scale, hybrid strategy, blue ocean strategy (value innovation, strategy canvas, ERRC), dan posisi functional strategy.',
materi:[
C("Business strategy: menjawab 'bagaimana kita bersaing?'",P("<b>Business strategy</b> (competitive strategy) adalah strategi di level <b>satu unit bisnis</b>, yaitu strategic business unit (SBU), bagian organisasi yang berfokus pada pasar tertentu untuk produk dan jasanya. Tujuannya selalu sama, yaitu meraih <b>sustainable competitive advantage</b>.")+T(["", "Corporate strategy", "Business strategy"],[["Pertanyaan pokok", "Bisnis atau pasar mana yang ingin kita masuki? (dibahas di Sesi 5)", "Bagaimana kita bersaing di pasar yang sudah dipilih?"], ["Dipegang oleh", "Parent company dan manajemen puncak", "Manajer SBU, yang biasanya punya otonomi cukup besar karena paham pasar, pelanggan, dan pesaing lokal"], ["Batasan", "Menentukan arah keseluruhan", "Tidak boleh lepas dari corporate strategy. Manajer SBU harus menunjukkan kontribusinya."]])+DEF("Market vs industry","<b>Market</b> ditentukan oleh sisi <b>demand</b> (pelanggan dan calon pelanggan), sedangkan <b>industry</b> ditentukan oleh sisi <b>supply</b> (misalnya teknologi atau saluran distribusi yang sama). Dengan memilih pasar yang dilayani, organisasi otomatis menentukan industri tempatnya bersaing.","Kulkas dan mesin cuci memakai teknologi dan saluran distribusi yang mirip, sehingga ada industri peralatan rumah tangga. Tetapi pasarnya berbeda: penyimpanan makanan dingin vs layanan mencuci pakaian.")),
C("Tiga generic strategies (Porter)",P("Competitive advantage berarti melakukan aktivitas yang berbeda, atau aktivitas yang sama dengan cara berbeda, sehingga menghasilkan <b>nilai yang diakui pelanggan lebih unggul dari pesaing</b>. Ada dua jalan: (1) <b>harga lebih rendah</b> tanpa mengorbankan kualitas, atau (2) <b>produk berdiferensiasi</b> yang dinilai lebih bernilai sehingga bisa dijual dengan premium price. Selain itu, organisasi memilih <b>scope</b>: melayani banyak segmen (broad) atau satu niche. Strategi ini disebut generic karena berlaku untuk berbagai jenis organisasi dan industri.")+T(["Strategi", "Inti", "Contoh dalam Henry"],[["Overall cost leadership", "Menjadi produsen berbiaya terendah di industri dengan tetap memenuhi standar industri, dengan target pasar luas (broad)", "Ryanair (no-frills), Toyota"], ["Differentiation", "Produk atau jasa dipersepsikan unik atau superior, sehingga pelanggan mau membayar premium, dengan target pasar luas (broad)", "Apple (desain inovatif)"], ["Focus", "Melayani satu segmen atau niche (kelompok pelanggan, wilayah, atau lini produk) dengan lebih efisien", "Burberry, Aldi, Jaguar F-Pace"]])+T(["Scope \\ Sumber keunggulan", "Biaya rendah", "Differentiation"],[["Industry-wide (broad)", "Overall cost leadership", "Differentiation"], ["Segment only (narrow)", "Cost focus", "Differentiation focus"]])+DEF("Contoh sederhana","Tiga toko sepatu. Toko A menjual sepatu polos dengan harga paling murah (cost leadership). Toko B menjual sepatu berdesain unik dengan harga lebih tinggi (differentiation). Toko C hanya menjual sepatu lari untuk pelari maraton (focus).")+CALL("Apa pun scope-nya, organisasi tetap harus bersandar pada <b>biaya rendah atau differentiation</b>. Tiap strategi butuh resources, capabilities, dan pengaturan organisasi yang berbeda. Karena itu Porter memperingatkan agar tidak mengejar ketiganya sekaligus.")),
C("Overall cost leadership, experience curve, dan risikonya",P("Organisasi mengejar biaya terendah di industri dan menyasar pasar luas. Yang dikendalikan bukan satu aktivitas saja, melainkan <b>seluruh aktivitas value chain</b> (lihat Sesi 3) dan koordinasi antar aktivitasnya. Strategi ini biasanya berarti pangsa pasar tinggi dan produk standar dengan komponen yang sama, sehingga tercapai economies of scale.")+"<h3>Tindakan menurut Porter</h3>"+UL(["Membangun fasilitas berskala efisien secara agresif", "Mengejar penurunan biaya dari pengalaman (experience)", "Mengendalikan biaya dan overhead dengan ketat", "Menghindari akun pelanggan marginal", "Meminimalkan biaya di R&D, service, sales force, dan iklan"])+"<h3>Dari mana biaya turun: experience curve vs economies of scale</h3>"+CALL("<b>Beda singkat:</b> experience curve berarti biaya turun karena <b>pengalaman yang menumpuk</b> (belajar). Economies of scale berarti biaya per unit turun karena <b>volume produksi naik</b> (skala).")+DEF("Experience curve (Boston Consulting Group, 1968)","Experience curve adalah hubungan antara biaya produksi dan <b>akumulasi pengalaman</b>. Setiap kali output berlipat dua, biaya per unit turun sekitar <b>20–30%</b> (persentase pastinya berbeda antar industri).","Produk berbiaya £10 per unit pada 100 unit. Ketika output menjadi 200 unit, biaya turun ke sekitar £7–£8 per unit.")+P("Pemimpin pasar punya pengalaman paling banyak, sehingga selisih biayanya dengan pesaing makin lebar. Implikasinya: tumbuhlah untuk menambah pengalaman, dan tetapkan harga berdasarkan <b>antisipasi penurunan biaya</b> untuk menekan pesaing dan menambah pangsa. Kemampuan belajar ini terkait dynamic capability (Sesi 3). Dalam praktik, laju penurunan biaya cenderung mengecil seiring waktu, dan bila pengalaman kumulatif kurang penting di suatu industri, faktor lain bisa lebih menentukan.")+T(["Kondisi", "Artinya", "Penyebab atau catatan"], [["Economies of scale", "Volume naik, biaya rata-rata per unit dalam jangka panjang (LRATC) turun", "Perusahaan besar bisa membeli peralatan khusus berkapasitas besar. Khas industri berbiaya tetap tinggi (pesawat, pabrik bir)."], ["Constant returns to scale", "Output naik proporsional dengan biaya, sehingga LRATC datar", "Berada di antara economies dan diseconomies"], ["Diseconomies of scale", "Output naik, biaya naik lebih dari proporsional, sehingga LRATC naik", "Manajemen kewalahan mengelola kompleksitas dan koordinasi, dan spesialisasi berlebihan menurunkan motivasi pekerja dan kualitas"]])+DEF("Virtuous circle (lingkaran yang saling menguatkan)","Margin yang lebih tinggi dari posisi biaya rendah memungkinkan reinvestasi di pabrik dan peralatan, yang menurunkan biaya lagi, yang menaikkan margin lagi.","Toyota memakai lean manufacturing di seluruh value chain. Menurut Henry, pendapatan tahunannya lebih besar daripada gabungan tiga produsen mobil terbesar AS, dan laba per mobilnya lebih dari empat kali General Motors. Mobil baru berbagi platform dengan model yang sudah ada untuk menekan biaya.")+"<h3>Keunggulan dan risiko</h3>"+T(["", "Isi"], [["Terhadap pesaing dan buyers", "Tetap untung di tengah persaingan sengit: saat pesaing berbiaya lebih tinggi saling menggerus profit, cost leader masih punya margin. Pembeli hanya bisa menekan harga sampai level pesaing paling efisien berikutnya."], ["Terhadap suppliers", "Menjadi lindung nilai (hedge) saat harga input naik, misalnya bahan bakar bagi Ryanair"], ["Terhadap entrants dan substitutes", "Harga rendah menjadi barrier to entry, dan rasio harga-kinerja yang unggul membantu melawan substitusi (Ryanair vs ferry dan Eurotunnel)"], ["Risiko", "Biaya memperbarui peralatan modal terus-menerus, mudah ditiru, perubahan teknologi menggugurkan investasi lama, dan selera pelanggan bergeser ke produk berdiferensiasi yang kurang sensitif harga"]])+CALL("Porter merangkum risiko semua generic strategy menjadi dua: <b>gagal mencapai atau mempertahankan strategi</b>, atau <b>nilai keunggulannya terkikis</b> seiring evolusi industri.")),
C("Differentiation strategy",P("Organisasi bersaing lewat produk atau jasa yang diakui pelanggan sebagai unik, dan perbedaannya cukup bernilai sehingga pelanggan mau membayar premium. <b>Biaya membuat diferensiasi harus lebih kecil daripada harga premium yang dikenakan.</b> Meski tidak fokus pada biaya, struktur biaya tetap perlu diketahui.")+T(["Dasar diferensiasi", "Contoh dalam Henry"],[["Desain produk atau brand image", "BMW, Apple, Dyson"], ["Kustomisasi sesuai kebutuhan pelanggan", "Apple"], ["Teknologi mutakhir", "Dyson, Intel, Amazon"], ["Kemampuan marketing", "Procter & Gamble, Amazon, Apple"], ["Reliability", "Toyota, BMW"], ["Customer service", "John Lewis, Amazon"]])+P("Biasanya perusahaan memakai lebih dari satu dimensi sekaligus, dan dapat menunjuk aktivitas value chain mana yang membedakannya dari pesaing. Semakin sulit ditiru dasar diferensiasinya, semakin besar peluang keunggulan yang berkelanjutan.")+T(["", "Isi"],[["Keunggulan", "Brand loyalty melindungi dari perang harga (rivalry). Entrant harus mengatasi loyalitas dan keunikan produk. Buyers kurang kuat karena tidak ada alternatif sebanding. Margin tinggi membantu menghadapi tekanan biaya dari supplier. Loyalitas pelanggan melindungi dari substitutes."], ["Risiko", "Harga premium terlalu jauh di atas pesaing sehingga pelanggan merasa tidak sepadan. Kebutuhan pembeli terhadap produk berdiferensiasi menurun (internet menurunkan biaya mencari dan membandingkan produk). Pesaing mempersempit atribut diferensiasi sehingga muncul substitusi yang layak."]])),
C("Focus strategy: cost focus dan differentiation focus",P("Berbeda dari dua strategi lain yang menyasar seluruh industri, <b>focus strategy</b> melayani satu atau beberapa segmen saja. Dengan fokus, organisasi bisa lebih tepat memenuhi kebutuhan segmen daripada pesaing yang melayani seluruh industri. Keunggulan didapat lewat biaya rendah <b>atau</b> diferensiasi di segmen itu.")+T(["", "Cost focus", "Differentiation focus"],[["Inti", "Menjadi cost leader hanya di satu segmen", "Menawarkan produk unik yang sangat dihargai di satu segmen"], ["Logika", "Pesaing besar punya keunggulan skala tetapi sulit efisien di produksi kecil atau pesanan khusus yang tidak bisa distandarkan", "Kebutuhan khusus segmen lebih baik dipenuhi niche player. Cara ini membangun brand loyalty dan mempersulit entrant."], ["Contoh Henry", "Aldi: toko kecil (sekitar 15.000 sq ft), sekitar 700 produk dengan 95% store brand (vs lebih dari 25.000 produk di supermarket biasa), barang disimpan di pallet agar restock cepat. Kualitas tidak dikorbankan.", "Jaguar F-Pace: SUV mewah berperforma tinggi untuk pelanggan muda yang aktif. Burberry di fashion kelas atas."]])+CALL("<b>Risiko focus:</b> segmen tidak tahan lama (selera berubah dan niche player sulit menyesuaikan), pesaing broad-based menganggap segmen itu menarik lalu meng-out-focus sang focuser, dan perbedaan antara segmen dan pasar utama menyempit.")),
C("Stuck in the middle, hybrid strategy, dan kritik generic strategies",T(["Konsep", "Intinya", "Contoh dan bukti"], [["Stuck in the middle (Porter)", "Organisasi mencoba lebih dari satu generic strategy. Ia tidak punya pangsa dan investasi untuk jadi cost leader, tidak punya diferensiasi industri-wide, dan tidak punya kemampuan fokus di segmen tertentu. Menurut Porter, setiap generic strategy saling tidak konsisten sehingga organisasi harus membuat pilihan tegas.", "<b>Sainsbury's:</b> menjual makanan lebih mahal tetapi dengan slogan harga murah. Tidak cukup terdiferensiasi untuk premium dan tidak cukup murah untuk bersaing harga, lalu kehilangan kepemimpinan dari Tesco.<br><b>Marks & Spencer:</b> pakaian tidak lagi dianggap bernilai istimewa. Lini produk usang, identitas hilang, dan tujuan tidak koheren."], ["Hybrid strategy", "Menggabungkan biaya rendah dan diferensiasi secara sengaja. Keduanya sering saling melengkapi karena cost leader punya dana untuk investasi diferensiasi.", "<b>IKEA:</b> produksi berbiaya rendah dengan produk terdiferensiasi.<br><b>Toyota:</b> cost leader sekaligus dikenal reliable, sehingga punya brand loyalty.<br>Studi Pertusa-Ortega dan kolega atas 164 perusahaan Spanyol: hybrid banyak dipakai dan cenderung berkinerja lebih baik daripada satu generic strategy saja."], ["Kritik generic strategies", "Porter dianggap statis dan sulit menghadapi lanskap kompetitif yang dinamis. John Kay: tiap organisasi punya capabilities berbeda sehingga mencari resep generik pasti gagal, dan nilai resep itu hilang begitu dikenali dan dipakai semua orang.", "Bukti empiris tentang stuck in the middle ambigu (Henry): sebagian mendukung bahayanya, sebagian mendukung hybrid."]])+CALL("<b>Era digital dan AI (soal latihan UTS):</b> keduanya tetap relevan, tinggal disesuaikan. Generic strategies = memilih cara bersaing. Blue ocean = menciptakan pasar baru. Digital dan AI = alat untuk menjalankan keduanya. Ini rangkuman penerapan, bukan dari Henry.")),
C("Blue ocean strategy (Kim dan Mauborgne)",P("Kim dan Mauborgne menyarankan perusahaan menciptakan dan merebut <b>blue ocean</b>, yaitu ruang pasar yang belum diperebutkan. Mereka membagi dunia bisnis menjadi red ocean dan blue ocean.")+T(["", "Red ocean", "Blue ocean"],[["Arti", "Semua industri yang ada sekarang (known market space). Batas industri jelas dan diterima pesaing.", "Industri yang belum ada sekarang (unknown market space). Posisi strategis yang belum ditempati pesaing."], ["Tujuan", "Mengungguli pesaing dan merebut pangsa dari permintaan yang sudah ada", "Menciptakan permintaan baru dan pertumbuhan yang sangat menguntungkan"], ["Akibat", "Makin banyak yang bersaing untuk permintaan yang terbatas, sehingga laba dan pertumbuhan turun dan produk menjadi komoditas (blood-red ocean)", "Persaingan menjadi tidak relevan"]])+P("Blue ocean bisa dibuat di luar batas industri yang ada (contoh: eBay untuk lelang online), tetapi <b>kebanyakan dibuat di dalam red ocean</b> dengan memperluas batas industri yang ada. Red ocean tetap penting, tetapi bila penawaran melebihi permintaan, memperebutkan pangsa pasar yang menyusut tidak mengarah ke pertumbuhan berkelanjutan.")+DEF("Unit analisis: strategic move","Kim dan Mauborgne menyimpulkan bahwa perusahaan maupun industri bukan unit analisis terbaik untuk memahami pertumbuhan yang menguntungkan. Yang dianalisis adalah <b>strategic move</b>, yaitu rangkaian tindakan dan keputusan manajerial untuk membuat penawaran yang menciptakan pasar baru dan menaikkan permintaan secara substansial.")+DEF("Value innovation","Value innovation adalah membuat persaingan menjadi tidak relevan dengan menekankan <b>value</b> dan <b>innovation</b> secara sama. Value tanpa inovasi hanya memberi perbaikan inkremental. Inovasi tanpa value cenderung didorong teknologi dan melampaui kesediaan pelanggan membayar. Value innovation tercapai bila inovasi diselaraskan dengan <b>utility, price, dan cost</b>. Konsep ini bertentangan dengan pandangan Porter bahwa organisasi memilih differentiation atau low cost: perusahaan blue ocean bisa menempuh keduanya sekaligus, karena batas pasar dan struktur industri tidak dianggap tetap.","Cirque du Soleil (berdiri 1984) melihat ke seberang batas pasar sirkus dan teater, serta memahami noncustomers (misalnya penonton teater dan balet), sehingga bisa menaikkan nilai bagi pembeli sambil menurunkan biaya.")+P("Kim dan Mauborgne membagi <b>noncustomers</b> menjadi tiga: pembeli yang hanya minimal membeli penawaran industri, pembeli yang menolak memakainya, dan pembeli yang tidak pernah menganggap penawaran itu sebagai pilihan.")+CALL("<b>Strategy canvas dan value curve.</b> Sumbu horizontal strategy canvas memuat faktor yang menjadi dasar persaingan dan investasi industri. Sumbu vertikal menunjukkan nilai yang ditawarkan ke pembeli untuk tiap faktor. Garis hasil plot disebut <b>value curve</b>. Benchmarking terhadap pesaing hanya memperbaiki penjualan secara inkremental dan tidak membuka ruang pasar baru. Fokus strategi perlu bergeser dari pesaing saat ini ke alternatif dan noncustomers.")+DEF("Four Actions Framework dan ERRC grid","Empat pertanyaan untuk membentuk value curve baru. Hasilnya diisi ke <b>eliminate-raise-reduce-create (ERRC) grid</b>.",null,null)+T(["Tindakan", "Pertanyaan", "Contoh Cirque du Soleil"],[["Eliminate", "Faktor mana yang dianggap wajar oleh industri tetapi sebaiknya dieliminasi?", "Pertunjukan hewan, bintang sirkus, dan banyak arena (tiga ring)"], ["Reduce", "Faktor mana yang sebaiknya dikurangi jauh di bawah standar industri?", "Humor slapstick dan unsur menegangkan"], ["Raise", "Faktor mana yang sebaiknya dinaikkan jauh di atas standar industri?", "Kenyamanan venue (satu tenda yang lebih mewah)"], ["Create", "Faktor mana yang sebaiknya diciptakan karena belum pernah ditawarkan industri?", "Banyak produksi dengan alur cerita dan musik orisinal, serta tarian dari balet"]])+P("Eliminate dan reduce menurunkan struktur biaya. Raise dan create menaikkan nilai bagi pembeli dan menciptakan permintaan baru. Manfaat ERRC grid: mudah dipahami manajer sehingga mendorong keterlibatan, dan memaksa perusahaan menilai faktor persaingan industri sehingga asumsi yang tidak disadari menjadi eksplisit.")+P("<b>Blue ocean idea (BOI) index</b> adalah urutan uji untuk merumuskan strategi blue ocean:")+'<div class="tags flow"><span>Buyer utility</span><span>Price</span><span>Target cost</span><span>Hambatan adopsi</span></div>'+P("Tahap pertama bertanya apakah penawaran memberi pembeli utilitas luar biasa (termasuk bagi tiga tingkat noncustomers). Tahap kedua menanyakan apakah harga bisa menarik mayoritas pembeli. Tahap ketiga menanyakan apakah laba yang wajar bisa dicapai pada harga itu (contoh: Tata Nano mencapai target cost lewat penyederhanaan operasi dan inovasi biaya manufaktur). Tahap terakhir memastikan tidak ada hambatan adopsi, karena manajer terbiasa bersaing di red ocean sehingga perubahan ini bisa ditolak.")+P("<b>Catatan tambahan:</b>")+UL(["Studi Kim dan Mauborgne atas 108 peluncuran bisnis: perbaikan inkremental di red ocean adalah 86% peluncuran (62% revenue, 39% laba), sedangkan blue ocean hanya 14% peluncuran tetapi menghasilkan 38% revenue dan 61% laba.", "Tiga ciri strategi blue ocean lewat value curve: <b>focus</b>, <b>divergence</b>, dan <b>compelling tagline</b>."])+CALL("Ringkasan Kim dan Mauborgne: fokus blue ocean strategy bukan membatasi output dengan harga lebih tinggi, melainkan <b>menciptakan permintaan agregat baru lewat lompatan nilai pada harga yang terjangkau</b>."),"Henry 6.4"),
C("Functional strategy: posisi dalam kerangka Henry",P("Henry hanya membahas singkat (Ch. 1, bagian 1.4.3). <b>Functional (operational) strategy</b> adalah keputusan menurut lini fungsi seperti <b>R&D, marketing, dan finance</b> yang mendukung business strategy. Henry menilai istilah 'operational strategy' kurang tepat (sebenarnya operational management), sehingga ia memasukkannya ke dalam pembahasan business strategy.")+CALL("<b>Catatan sumber:</b> RPKPS Sesi 4 juga mencantumkan subtopik marketing/STP/branding/pricing, HR, R&D, operations, dan purchasing yang bersumber dari <b>Modul IAI Bab V dan Bab XI</b>. Modul itu belum ada di berkas yang diunggah, jadi rincian per fungsi belum dimasukkan ke hub ini agar tidak menebak isinya. Tabel di bawah hanya pemetaan bantu dari logika Henry Ch. 6 (bukan kutipan Henry atau IAI).")+T(["Fungsi", "Bila business strategy = cost leadership", "Bila business strategy = differentiation"],[["Marketing", "Fokus pada produk standar dan volume besar, menghindari akun marginal, dan menekan pengeluaran iklan", "Membangun brand image, kustomisasi, dan kemampuan marketing sebagai dasar premium price"], ["R&D", "Biaya R&D diminimalkan, dan investasi diarahkan ke proses yang menekan biaya", "Teknologi dan inovasi produk sebagai sumber keunikan"], ["Operations", "Fasilitas berskala efisien, lean, dan mengejar kurva pengalaman", "Menjaga reliability dan kualitas yang menopang diferensiasi"], ["Purchasing / HR / Finance", "Pengendalian biaya dan overhead yang ketat di seluruh value chain", "Mendukung layanan, talenta, dan investasi pada aktivitas pembeda"]])+P("Intinya: keputusan fungsional harus <b>selaras</b> dengan generic strategy yang dipilih, dan seluruh aktivitas value chain perlu terkoordinasi.")),
C("Disruptive innovation lebih lengkap (Christensen)",P("Ringkasan awalnya ada di Sesi 2. Intinya, perusahaan kecil menantang incumbent bukan dengan produk yang lebih canggih, tetapi dengan penawaran yang berbeda.")+T(["Jenis", "Ciri", "Contoh dari kasus"], [["Sustaining innovation", "Memperbaiki produk untuk pelanggan paling menguntungkan dan mempertahankan harga tinggi", "Gillette: five-blade razors, Fusion ProGlide, FlexBall"], ["Disruptive innovation (low-end)", "Entrant menyasar pelanggan yang merasa produk terlalu mahal atau terlalu rumit dengan penawaran yang lebih sederhana dan murah, lalu naik ke upmarket", "Dollar Shave Club: razor sederhana dan murah ($1, $6, atau $9 per bulan), lalu shave butter dan post-shave cream"], ["Disruptive (model bisnis)", "Penawaran baru lewat model bisnis yang berbeda, bukan hanya produk", "Netflix: langganan lewat pos lalu streaming menghadapi toko Blockbuster"]])+UL(["<b>Innovator's dilemma:</b> incumbent justru jatuh karena rasional melayani pelanggan terbaik dan mengabaikan pesaing kecil yang awalnya dianggap tidak relevan (kasus Blockbuster)."])+CALL("Klasifikasi low-end atau model bisnis adalah penafsiran untuk latihan. Istilah sustaining dan low-end berasal dari literatur Christensen, bukan dari Henry."),"Kasus tugas dosen"),
C("Kasus tugas: Dollar Shave Club (model Christensen dan keamanan dari disruption)","<h3>Pertanyaan 1: apakah sesuai model Christensen?</h3>"+T(["Unsur model Christensen", "Pada Dollar Shave Club", "Cocok?"], [["Entrant kecil menantang incumbent", "DSC (2012) menantang Gillette, pemimpin pasar razor", "Ya"], ["Menyasar yang diabaikan atau kelebihan layanan", "Konsumen yang menganggap harga razor terlalu mahal, sementara Gillette terus menaikkan teknologi untuk harga lebih tinggi", "Ya"], ["Penawaran lebih sederhana dan murah", "Razor sederhana, $1, $6, atau $9 plus biaya packaging", "Ya"], ["Incumbent lambat merespons", "Gillette punya ide subscription, tetapi baru meluncurkan Gillette Shave Club pada September 2015", "Ya"], ["Naik ke upmarket", "Shave butter dan post-shave cream", "Ya"], ["Hanya soal produk", "DSC menang lewat kombinasi harga, subscription, kemudahan, dan marketing humor di social media (video viral 24 juta views)", "Tidak: model bisnis dan pemasaran juga berperan"]])+"<h3>Pertanyaan 2: seberapa aman DSC dari disruption?</h3>"+T(["", "Isi"], [["Faktor yang melemahkan DSC", "Gillette sudah meluncurkan Shave Club sendiri, subscription mudah ditiru, bergerak upmarket mengurangi daya tarik harga murah, dan basis pesaing kuat (Gillette punya inovasi blade dan merek)"], ["Faktor yang menguatkan DSC", "Di bawah Unilever (akuisisi $1 miliar, 2016) punya sumber daya dan jaringan, hubungan langsung dengan konsumen lewat subscription, serta 3 juta lebih subscribers dan pangsa online yang lebih besar"]])+"<h3>Kesimpulan</h3>"+CALL("DSC menguasai sekitar 54% online shaving market pada 2015 (Gillette Shave Club sekitar 21%). Bila ditanya apakah DSC sesuai model Christensen, jawaban yang kuat: sebagian besar ya (low-end, naik upmarket, incumbent lambat), dengan catatan peran model bisnis dan pemasaran. Namun DSC tidak sepenuhnya aman: keunggulannya mudah dipelajari dan ditiru, sehingga perlu terus berinovasi dan memperkuat hubungan dengan pelanggan. Ini argumen untuk latihan, bukan kunci dosen."),"Kasus tugas dosen"),
C("Kasus tugas: Ryanair sebagai cost leadership dan mengapa sulit ditiru","<h3>Fakta kasus</h3>"+P("Ryanair adalah contoh overall cost leadership (sudah disebut di kartu generic strategies). Keunggulannya tidak berasal dari satu langkah, tetapi dari aktivitas yang saling memperkuat.")+T(["Aktivitas", "Efek pada biaya atau pendapatan"],[["Satu jenis pesawat (Boeing 737-800)", "Maintenance, training, dan suku cadang lebih sederhana"], ["Bandara sekunder dan tersier", "Biaya operasional lebih murah dari bandara utama"], ["Layanan dikurangi, biaya tambahan untuk layanan tertentu", "Operating cost rendah, dan ada ancillary revenue (kursi, hotel, makanan, minuman)"], ["Yield management 'load factor-active, yield-passive'", "Pesawat penuh, dan tiket murah menaikkan penumpang serta menurunkan biaya per penumpang"]])+"<h3>Analisis: mengapa sulit ditiru</h3>"+CALL("Kebanyakan maskapai tidak mau mengorbankan layanan dan bandara utama, dan meniru satu langkah saja tidak memberi hasil yang sama karena semua aktivitas saling mendukung. Pesaing seperti easyJet memilih citra yang lebih ramah, sedangkan Ryanair kemudian memperbaiki customer service lewat program Always Getting Better."),"Kasus tugas dosen"),
C("Kasus tugas: pertumbuhan dan keberlanjutan model Netflix","<h3>Fakta dan analisis</h3>"+T(["", "Isi", "Dasar"],[["Alasan pertumbuhan", "Langganan membangun loyalitas dan word of mouth, sementara Blockbuster gagal beradaptasi", "Tertulis di kasus"], ["Alasan pertumbuhan", "Inovasi berlapis: streaming (2007), banyak perangkat (2010), dan konten sendiri sejak sekitar 2013", "Tertulis di kasus"], ["Alasan profitabilitas", "Konten sendiri menjawab lisensi studio yang makin sulit dan mahal (make-or-buy)", "Tertulis di kasus; analisis latihan"], ["Risiko keberlanjutan", "Pendapatan 100% dari langganan, sedangkan Disney lebih terdiversifikasi (meski sempat terpukul pandemi lewat taman hiburan dan box office)", "Tertulis di kasus"], ["Risiko keberlanjutan", "Biaya konten dan persaingan streaming yang makin ramai", "Inferensi"]])+"<h3>Kesimpulan</h3>"+CALL("Model berlangganan cukup berkelanjutan selama Netflix terus berinovasi dan konten sendiri membedakannya, tetapi kurang terdiversifikasi dan rentan pada biaya konten dan peniruan. Ini argumen latihan, bukan kunci dosen."),"Kasus tugas dosen")
].join('')};
const Q4=[["Sebuah toko menjual produk kualitas menengah dengan slogan harga murah, tetapi struktur biayanya sama dengan pesaing dan produknya tidak dipersepsikan istimewa. Diagnosis menurut Porter?", ["Differentiation focus", "Stuck in the middle", "Blue ocean", "Cost focus"], 1, "Tidak punya pangsa dan investasi untuk menjadi cost leader, dan tidak punya keunikan untuk premium price. Mirip kasus Sainsbury's dalam Henry."], ["Biaya produksi per unit Rp100.000 pada volume 1.000 unit. Bila industri mengikuti experience curve dengan penurunan 20% setiap output berlipat dua, perkiraan biaya per unit pada 4.000 unit adalah…", ["Rp40.000", "Rp64.000", "Rp60.000", "Rp80.000"], 1, "1.000 ke 2.000 ke 4.000 = dua kali penggandaan: 100.000 x 0,8 x 0,8 = Rp64.000. Henry menyebut penurunan 20–30% per penggandaan, tergantung industri."], ["Pabrik menggandakan output, tetapi biaya total naik 2,6 kali. Istilah dan penyebab yang paling sesuai dengan Henry adalah…", ["Diseconomies of scale; manajemen kewalahan", "Experience curve; pembelajaran menurunkan biaya", "Constant returns to scale; biaya naik proporsional", "Economies of scale; pembelian peralatan khusus"], 0, "Output naik tetapi biaya naik lebih dari proporsional: LRATC mulai naik."], ["Merek elektronik premium menjual 40% di atas pesaing. Kini situs perbandingan memudahkan pembeli membandingkan spesifikasi, dan pesaing menyamai fitur utamanya. Risiko differentiation yang paling terwujud adalah…", ["Pembeli menilai premium tak sepadan", "Pemasok menaikkan harga input", "Segmen niche menghilang", "Biaya produksi tidak terkendali"], 0, "Henry: internet menurunkan search costs, dan pesaing yang mempersempit atribut diferensiasi menghadirkan substitusi yang layak."], ["Jaringan diskon kecil dengan sekitar 700 produk (mayoritas store brand) dan barang disimpan di pallet merebut pangsa supermarket besar. Mengapa supermarket tradisional sulit menirunya?", ["Karena regulasi melarang", "Karena mereka tidak punya pelanggan", "Karena produk store brand selalu lebih mahal", "Karena butuh capabilities dan biaya berbeda"], 3, "Contoh cost focus Aldi: strategi mengandalkan capabilities berbeda (strategy bergantung pada resources dan capabilities, bukan sekadar niat meniru)."], ["Perusahaan mebel menekan biaya lewat desain flat-pack dan sekaligus dikenal desain khasnya. Penilaian yang paling tepat menurut Henry adalah…", ["Focus strategy murni", "Pasti stuck in the middle karena Porter melarang kombinasi", "Hybrid strategy; bisa berkinerja lebih baik", "Blue ocean; tidak ada pesaing"], 2, "IKEA dan Toyota adalah contoh hybrid; Henry menyebut bukti empiris tentang stuck in the middle ambigu."], ["John Kay mengkritik generic strategies. Argumen intinya adalah…", ["Cost leadership selalu gagal", "Biaya penerapannya terlalu tinggi", "Resep umum dipakai semua, nilainya hilang", "Porter salah mengidentifikasi lima forces"], 2, "Dalam kata-kata Henry: resep seperti itu tidak bisa ada karena nilainya rusak oleh fakta bahwa resep itu dikenali."], ["Saat perang harga di industri, cost leader tetap untung sementara pesaing berbiaya lebih tinggi rugi. Mekanisme yang benar adalah…", ["Pembeli menekan harga sampai batas pesaing efisien", "Cost leader selalu menaikkan harga paling akhir", "Cost leader tidak terkena substitutes", "Pemerintah memberi subsidi"], 0, "Biaya terendah membuat cost leader masih positif setelah pesaing menggerus profit lewat rivalry."], ["Perusahaan memilih differentiation berbasis reliability dan layanan, tetapi divisi pembelian memilih pemasok termurah berkualitas rendah dan anggaran R&D dipangkas. Masalah utamanya adalah…", ["Perusahaan terlalu banyak berinvestasi di marketing", "Corporate parent menghambat keputusan unit bisnis", "Industri terlalu kecil untuk strategi itu", "Functional strategies tidak selaras dengan business strategy"], 3, "Henry: functional strategy mendukung business strategy; keputusan fungsional harus konsisten dengan generic strategy."], ["Manajer SBU mengusulkan strategi harga rendah, padahal corporate strategy menempatkan grup sebagai pemain premium. Menurut Henry…", ["SBU harus menghentikan semua penjualan", "Corporate strategy hanya berlaku untuk perusahaan induk", "SBU otonom, tetapi harus mendukung corporate strategy", "SBU bebas sepenuhnya karena punya otonomi"], 2, "Otonomi muncul dari pengetahuan market lokal, namun tidak boleh lepas dari arah korporat."],
["Kulkas dan mesin cuci memakai teknologi dan saluran distribusi yang mirip, tetapi melayani kebutuhan pelanggan yang berbeda. Menurut Henry, ini menunjukkan bahwa…",["Keduanya satu market sekaligus satu industri","Industri dari sisi supply, market dari sisi demand","Market ditentukan oleh kesamaan teknologi","Industri ditentukan oleh jumlah pesaing"],1,"Market ditentukan kondisi demand (pelanggan), industry ditentukan kondisi supply (teknologi atau saluran distribusi yang sama)."],
["Margin tinggi dari posisi biaya rendah direinvestasikan di pabrik dan peralatan, yang menurunkan biaya lagi dan menaikkan margin lagi. Siklus ini disebut…",["Virtuous circle","Vicious circle","Experience curve","Stuck in the middle"],0,"Virtuous circle adalah ciri cost leadership: margin tinggi, reinvestasi, biaya turun, margin naik lagi."],
["Tindakan yang sesuai untuk mengejar overall cost leadership menurut Porter adalah…",["Menambah belanja iklan besar-besaran","Menambah variasi kustomisasi per pelanggan","Menaikkan belanja R&D untuk produk eksklusif","Menghindari akun marginal dan menekan overhead"],3,"Porter: bangun fasilitas berskala efisien, kejar penurunan biaya dari pengalaman, kendalikan biaya dan overhead, hindari akun marginal, minimalkan biaya R&D, service, sales force, dan iklan."],
["Biaya fitur eksklusif yang ditambahkan sebesar Rp30 per unit, sedangkan harga premium yang bisa dikenakan hanya Rp20 per unit. Menurut Henry, strategi diferensiasi ini…",["Layak karena produknya menjadi unik","Layak asal pelanggan loyal","Tidak layak karena biaya lebih besar dari premium","Tidak relevan karena strategi ini fokus pada biaya"],2,"Henry: biaya membuat diferensiasi harus lebih kecil daripada harga premium yang dikenakan."],

["Porter merangkum risiko semua generic strategy menjadi dua, yaitu…",["Gagal menerapkan, atau keunggulan terkikis","Biaya modal tinggi dan pesaing terlalu sedikit","Regulasi ketat dan teknologi stagnan","Pemasok terlalu kuat dan pembeli terlalu lemah"],0,"Dua risiko umum: gagal mencapai atau mempertahankan strategi, dan nilai keunggulan terkikis seiring evolusi industri."],
["Cirque du Soleil menghapus pertunjukan hewan, bintang sirkus, dan arena tiga ring yang dianggap wajar oleh industri. Dalam Four Actions Framework, tindakan ini menjawab pertanyaan…",["Faktor mana yang harus diciptakan yang belum pernah ditawarkan industri?","Faktor mana yang harus dinaikkan jauh di atas standar industri?","Faktor mana yang dianggap wajar oleh industri tetapi harus dieliminasi?","Faktor mana yang harus dikurangi jauh di bawah standar industri?"],2,"Itu tindakan eliminate. Reduce: slapstick dan unsur menegangkan. Raise: venue yang lebih nyaman. Create: banyak produksi dengan cerita dan musik orisinal."],
["Menurut Kim dan Mauborgne, strategi blue ocean yang dilihat lewat value curve harus memiliki ciri berikut, KECUALI…",["Focus","Divergence dari value curve pemain lain","Compelling tagline","Benchmarking ketat terhadap pesaing terdekat"],3,"Tiga ciri: focus, divergence, dan compelling tagline. Benchmarking terhadap pesaing justru hanya memberi perbaikan inkremental dan tidak membuka ruang pasar baru."],
["Urutan pertanyaan dalam blue ocean idea (BOI) index adalah…",["Utilitas pembeli, harga, target cost, lalu hambatan adopsi","Target cost, harga, utilitas pembeli, hambatan adopsi","Harga, utilitas pembeli, hambatan adopsi, target cost","Hambatan adopsi, utilitas pembeli, harga, target cost"],0,"BOI index dimulai dari buyer utility, lalu price, target cost, dan terakhir memastikan tidak ada hambatan adopsi."],

["Dalam studi 108 peluncuran bisnis oleh Kim dan Mauborgne, peluncuran yang menciptakan blue ocean (14% dari peluncuran) menghasilkan…",["62% dari total revenue dan 39% dari total laba","38% dari total revenue dan 61% dari total laba","14% dari total revenue dan 14% dari total laba","86% dari total revenue dan 61% dari total laba"],1,"Perbaikan inkremental di red ocean (86% peluncuran) menghasilkan 62% revenue dan 39% laba. Blue ocean (14%) menghasilkan 38% revenue dan 61% laba."],["Mengapa incumbent seperti Blockbuster rentan terhadap pendatang kecil menurut model disruptive innovation Christensen?", ["Karena incumbent tidak memiliki pelanggan loyal", "Karena pendatang kecil selalu memiliki teknologi lebih canggih", "Karena hanya melayani pelanggan terbaik dan mengabaikan pesaing kecil", "Karena regulasi selalu berpihak pada pendatang baru"], 2, "Innovator's dilemma: incumbent rasional melayani pelanggan paling menguntungkan dan mengabaikan pesaing kecil sampai terlambat."],
["Dollar Shave Club menawarkan razor sederhana seharga $1, $6, atau $9 per bulan, sementara Gillette terus menambah teknologi mata pisau. Menurut model Christensen, langkah DSC paling tepat disebut…", ["Sustaining innovation yang mengikuti jalur teknologi Gillette", "Disruptive innovation yang lebih sederhana", "Differentiation berbasis teknologi blade terbaru", "Strategi focus pada segmen premium"], 1, "DSC tidak bersaing di teknologi blade, tetapi menawarkan versi lebih sederhana dan murah lewat subscription."],
