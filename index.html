["Bandingkan empat tipe international strategy (multidomestic, global, international, transnational) dari sisi konfigurasi aset, peran operasi luar negeri, dan pengetahuan. Apa kelemahan masing-masing, dan apa itu administrative heritage?", "Multidomestic: aset terdesentralisasi, operasi luar negeri menangkap peluang lokal, pengetahuan disimpan di tiap unit; kelemahan biaya variasi dan pembelajaran terhambat (Walmart di Jerman). Global: aset terpusat dan berskala global, anak usaha menjalankan strategi induk, pengetahuan di pusat; kelemahan menganggap selera sudah sama dan tidak ada slack (Walmart keluar dari Korea Selatan). International: kompetensi inti di pusat dan dialihkan ke luar negeri; kurang efisien dari global dan kurang responsif dari multidomestic; rentan kurs, kontrol jauh, manajer lokal kurang termotivasi (Apple). Transnational: sekaligus efisien, responsif, dan memanfaatkan pembelajaran lewat jaringan terintegrasi dengan pemusatan selektif. Administrative heritage: konfigurasi aset, gaya manajemen, dan nilai organisasi yang dibentuk kepemimpinan, budaya negara asal, dan sejarah; ia membatasi kemampuan perusahaan berubah."],
["Sebuah perusahaan makanan ingin masuk ke pasar baru dengan tingkat risiko negara yang dinilai tinggi. Pilih dan justifikasi entry mode yang cocok dengan memakai kerangka risiko dan kontrol, serta sebutkan kelemahannya.", "Pertimbangan Brouthers: seberapa besar komitmen sumber daya dan kontrol yang diperlukan, yang bergantung pada persepsi risiko (Miller: risiko general environment, industry, dan firm-specific). Bila risiko tinggi, perusahaan cenderung membatasi komitmen, misalnya mulai dengan exporting atau membagi risiko lewat joint venture atau franchise. Exporting: risiko dan komitmen rendah tetapi kontrol rendah dan bergantung pada distributor. Franchising: pengetahuan lokal dan penerimaan host country, tetapi risiko free ride dan reputasi rusak. JV: risiko dibagi dan akses pasar, tetapi butuh tujuan jelas, kepercayaan, dan rentan campur tangan negara (Danone dan HSBC di China). Wholly owned subsidiary memberi kontrol penuh tetapi risiko terbesar sehingga kurang cocok untuk risiko tinggi."],
["Jelaskan Porter's diamond of national advantage dan kritik terhadapnya. Mengapa Rugman mengusulkan double diamond?", "Diamond: factor conditions, demand conditions, related and supporting industries, serta firm strategy, structure, and rivalry, ditambah dua variabel eksternal (chance dan government). Kekuatan utama datang dari rivalitas domestik yang kuat dan konsumen yang menuntut, yang mendorong inovasi dan upgrade sehingga perusahaan siap bersaing di luar negeri. Kritik: Rugman dan D'Cruz menilai diamond tunggal cocok untuk MNE dari triad (AS, Jepang, Uni Eropa) tetapi kurang untuk ekonomi kecil dan terbuka seperti Kanada atau Selandia Baru; Rugman dan Verbeke menilai pembedaan home dan host base mengabaikan realitas. Double diamond: manajer MNE dari negara kecil menganalisis diamond negaranya dan diamond negara besar mitra dagangnya (Kanada dan AS). Contoh: sekitar 95% penjualan Nestlé di luar Swiss."]];

const Q7=[["Aktivitas primer (<i>primary activity</i>) apa yang berfokus pada peningkatan atau pemeliharaan nilai produk melalui kegiatan seperti instalasi, pelatihan, dan perbaikan?", ["Human resource management", "Marketing and sales", "Outbound logistics", "Service", "Operations"], 3, "Jawaban: Service."], ["Apa tujuan utama strategi <i>blue ocean</i> dibandingkan dengan strategi bersaing tradisional?", ["Menciptakan ruang pasar baru yang belum diperebutkan dan membuat persaingan menjadi tidak relevan melalui inovasi nilai", "Mengungguli pesaing di pasar yang sudah ada dengan meningkatkan kualitas produk secara signifikan dan mengenakan harga premium", "Mempertahankan pangsa pasar perusahaan saat ini dari lima kekuatan persaingan dengan mencapai kepemimpinan biaya secara menyeluruh", "Memaksimalkan nilai pemegang saham dengan melepas seluruh unit bisnis yang tidak menunjukkan pertumbuhan tinggi", "Menyasar secara agresif pelanggan paling menguntungkan milik pesaing dengan memanfaatkan berbagai keunggulan jangka pendek"], 0, "Jawaban: Menciptakan ruang pasar baru melalui inovasi nilai."], ["Apakah analisis SWOT dapat digunakan untuk analisis lingkungan internal dalam konteks manajemen stratejik?", ["Ya, sebagian; komponen strengths dan weaknesses mencerminkan kondisi internal, tetapi SWOT lebih berperan merangkum hasil analisis internal dan eksternal", "Tidak, karena SWOT hanya menganalisis peluang dan ancaman dari lingkungan eksternal", "Ya, SWOT merupakan alat utama analisis internal karena seluruh komponennya menilai kondisi di dalam perusahaan", "Ya, SWOT dapat menggantikan analisis VRIO dan rantai nilai karena mencakup seluruh sumber daya perusahaan", "Tidak, karena analisis lingkungan internal hanya dapat dilakukan dengan analisis rantai nilai"], 0, "Jawaban: Strengths dan weaknesses mencerminkan kondisi internal, sedangkan opportunities dan threats mencerminkan kondisi eksternal."], ["Bagaimana lingkungan makro memengaruhi lingkungan kompetitif?", ["Perubahan lingkungan makro berdampak seragam pada semua perusahaan dalam industri sehingga tidak mengubah posisi bersaing relatif", "Lingkungan makro hanya berpengaruh terhadap perusahaan multinasional yang beroperasi di lebih dari satu negara", "Perubahan faktor makro dapat mengubah kekuatan persaingan dalam industri, seperti hambatan masuk, ancaman substitusi, dan daya tawar", "Lingkungan kompetitif suatu industri menentukan kondisi politik, ekonomi, dan sosial di tingkat nasional", "Lingkungan makro dan lingkungan kompetitif bersifat independen sehingga analisis PESTEL dan Five Forces tidak perlu dikaitkan"], 2, "Jawaban: Perubahan faktor makro dapat mengubah kekuatan persaingan dalam industri."], ["Bagaimana strategi diferensiasi yang berhasil secara spesifik berfungsi sebagai pertahanan terhadap daya tawar pembeli dalam suatu industri?", ["Menciptakan loyalitas merek dan penawaran yang unik sehingga pembeli tidak memiliki alternatif yang sebanding", "Mendorong pembeli beralih ke produk substitusi generik dengan menstandarkan fitur fungsional produk", "Memungkinkan perusahaan menurunkan harga hingga setara dengan produsen berbiaya terendah setiap kali pembeli menuntut konsesi", "Meningkatkan hambatan masuk sehingga jumlah pendatang baru dalam industri berkurang", "Mendorong pembeli melakukan integrasi ke hulu untuk mengamankan pasokan produk yang terdiferensiasi"], 0, "Jawaban: Menciptakan loyalitas merek dan penawaran yang unik."], ["Berdasarkan kerangka VRIO, perbedaan antara <i>sustained competitive advantage</i> dan <i>temporary competitive advantage</i> terletak pada...", ["Sustained competitive advantage berasal dari sumber daya yang bernilai dan langka, sedangkan temporary competitive advantage berasal dari sumber daya yang bernilai tetapi tidak langka", "Sustained competitive advantage dapat dicapai tanpa sumber daya yang bernilai asalkan sumber daya tersebut langka dan sulit ditiru", "Sustained competitive advantage hanya membutuhkan dukungan organisasi yang kuat, sedangkan temporary competitive advantage tidak memerlukan dukungan organisasi", "Sustained competitive advantage bertahan lebih dari lima tahun, sedangkan temporary competitive advantage bertahan kurang dari lima tahun", "Sustained competitive advantage berasal dari sumber daya yang bernilai, langka, sulit ditiru, dan didukung organisasi, sedangkan temporary competitive advantage berasal dari sumber daya yang bernilai dan langka tetapi mudah ditiru"], 4, "Jawaban: Sumber daya yang bernilai, langka, sulit ditiru, dan didukung organisasi menghasilkan keunggulan berkelanjutan."], ["Dalam kondisi apa daya tawar pembeli dalam suatu industri umumnya meningkat?", ["Pembeli tersebar dalam jumlah banyak dan masing-masing membeli dalam volume kecil", "Jumlah pemasok bahan baku utama bagi industri sangat terbatas", "Pembeli terkonsentrasi dan membeli dalam volume besar relatif terhadap total penjualan industri", "Produk yang ditawarkan industri sangat terdiferensiasi dan sulit dibandingkan", "Pembeli harus menanggung biaya yang besar untuk beralih ke pemasok lain"], 2, "Jawaban: Pembeli terkonsentrasi dan membeli dalam volume besar."], ["Dalam kondisi manakah sebuah perusahaan paling mungkin memperoleh keunggulan sebagai pendatang akhir (<i>late-mover advantage</i>)?", ["Ketika terdapat efek jaringan yang kuat sehingga nilai produk meningkat seiring bertambahnya jumlah pengguna", "Ketika kurva pembelajaran sangat curam dan sulit ditiru", "Ketika biaya menjadi pionir teknologi baru sangat tinggi dan pasar berkembang dengan cepat", "Ketika loyalitas merek perusahaan pionir begitu kuat sehingga pelanggan enggan beralih ke versi yang lebih baru", "Ketika terdapat hak kekayaan intelektual yang kuat yang melindungi inovasi awal"], 2, "Jawaban: Biaya menjadi pionir tinggi dan pasar berkembang dengan cepat."], ["Manajemen puncak perusahaan XYZ menggunakan model Five Forces Porter untuk menganalisis lingkungan kompetitifnya. hal utama yang dinilai melalui kerangka tersebut adalah
