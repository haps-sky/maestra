<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Materi Strategic Management dalam bahasa Indonesia.">
<title>Strategic Management Hub</title>
<style>
:root{
  --bg:#A3566B; --bg2:#8C4559; --bg3:#7A394D;
  --line:#D4688A; --line-soft:rgba(255,255,255,0.28); --line-faint:rgba(255,255,255,0.08);
  --paper:#FBF0F3; --paper2:#F2DCE3; --ink:#2D1822;
  --white:#FFFFFF; --muted:#FBE9EF; --muted2:#F6DCE4;
  --gold:#C98A3A; --gold-soft:rgba(201,138,58,0.18);
  --warn:#E08A6B; --good:#6FCF97; --maroon:#8E2B3C;
  --sans:'IBM Plex Sans',-apple-system,sans-serif;
  --disp:'Space Grotesk',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);}
body{
  background-image:
    linear-gradient(var(--line-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,.disp{font-family:var(--disp);}
a{color:var(--line);}
.app{display:flex;min-height:100vh;}
.navtoggle{
  position:fixed;top:16px;left:16px;z-index:60;width:38px;height:38px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:0;flex-direction:column;
}
.navtoggle span{display:block;width:16px;height:2px;background:var(--gold);margin:2px 0;transition:transform .2s,opacity .2s;}
.navtoggle.open span:nth-child(1){transform:translateY(4px) rotate(45deg);}
.navtoggle.open span:nth-child(2){opacity:0;}
.navtoggle.open span:nth-child(3){transform:translateY(-4px) rotate(-45deg);}
.sidebar{
  width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--line-soft);
  padding:22px 16px 22px 64px;position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:margin-left .22s ease, transform .22s ease;
}
.sidebar.collapsed{margin-left:-290px;}
.backdrop{display:none;position:fixed;inset:0;background:rgba(45,12,24,.55);z-index:40;}
.backdrop.show{display:block;}
@media(max-width:800px){
  .sidebar{position:fixed;z-index:50;left:0;top:0;margin-left:0 !important;transform:translateX(-100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{padding-left:64px;}
}
.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
.brand h1{font-size:20px;margin:4px 0 2px;color:var(--white);}
.brand .sub{font-size:12px;color:var(--muted);line-height:1.5;}
.navgroup-label{font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.1em;margin:16px 8px 6px;text-transform:uppercase;}
.navitem{
  display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
  margin-bottom:2px;border:1px solid transparent;
}
.navitem:hover{background:var(--bg3);}
.navitem.active{background:var(--bg3);border-color:var(--line-soft);}
.navitem .num{font-family:var(--mono);font-size:11px;color:var(--muted2);width:20px;flex:none;padding-top:1px;}
.navitem .lbl{font-family:var(--sans);font-size:13px;line-height:1.35;color:var(--white);text-transform:none;letter-spacing:0;margin:0;}
.navitem.locked .lbl{color:var(--muted);}
.navitem.locked .num{color:var(--muted2);}
.navitem .tag{font-family:var(--mono);font-size:9px;color:var(--muted2);display:block;margin-top:2px;}
.navitem.ready .tag{color:var(--good);}

.main{flex:1;min-width:0;padding:34px 40px 80px;max-width:980px;}
.topic-head{margin-bottom:6px;}
.topic-head .kicker{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.topic-head h1{font-size:30px;margin:6px 0 8px;color:var(--white);}
.topic-head p{color:var(--muted);font-size:14.5px;max-width:70ch;line-height:1.6;}

.tabs{display:flex;gap:6px;margin:22px 0 22px;border-bottom:1px solid var(--line-soft);}
.tab{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;color:var(--muted);
  padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;
}
.tab.active{color:var(--gold);border-color:var(--gold);}
.tab:hover{color:var(--white);}

.pane{display:none;}
.pane.active{display:block;}

.card{
  background:var(--paper);color:var(--ink);border-radius:10px;padding:22px 24px;margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.card h2{font-size:18px;margin:0 0 10px;color:var(--ink);}
.card h3{font-size:14.5px;margin:16px 0 6px;color:var(--ink);}
.card p{font-size:14px;line-height:1.7;margin:0 0 10px;color:#3A2430;}
.card ul,.card ol{font-size:14px;line-height:1.75;color:#3A2430;padding-left:20px;}
.card ul,.card ol{margin:4px 0 10px;}
.tw td ul{margin:0;padding-left:18px;line-height:1.6;}
.tw td{vertical-align:top;}
.callout{background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:13.5px;margin:12px 0;color:#463618;}
.pu{display:grid;gap:8px;margin:10px 0;}
.pu-item{border-left:3px solid var(--gold);background:#FAEEF2;border-radius:4px;padding:9px 13px;}
.pu-item b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;}
.pu-item p{margin:0;font-size:13.5px;line-height:1.65;color:#3A2430;}
.pu-item ul{margin:3px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;}
.analogy{border-left:3px solid var(--maroon);background:#faeceb;padding:10px 14px;border-radius:4px;font-size:13.5px;margin:10px 0;color:#5a1f28;}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
th,td{border:1px solid #E3C3CE;padding:6px 9px;text-align:left;}
th{background:var(--paper2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}.main{padding:24px 18px 60px;}.sidebar{width:230px;}}

.qcard{background:var(--paper);color:var(--ink);border-radius:10px;padding:20px 22px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.qcard .qnum{font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;}
.qcard .qtext{font-size:14.5px;margin:6px 0 12px;color:var(--ink);line-height:1.6;}
.opt{
  display:block;width:100%;text-align:left;background:var(--paper2);border:1px solid #E3C3CE;border-radius:7px;
  padding:10px 12px;margin-bottom:7px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:var(--sans);
}
.opt:hover{border-color:var(--gold);}
.opt.correct{background:rgba(111,207,151,.35);border-color:var(--good);}
.opt.wrong{background:#F4B7A3;border:2px solid #C9482A;padding:9px 11px;}
.opt:disabled{cursor:default;}
.explain{display:none;background:#fff9ea;border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;font-size:13px;margin-top:8px;color:#463618;}
.explain.show{display:block;}
.quizbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.score{font-family:var(--mono);font-size:13px;color:var(--gold);}
.btn{
  font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--gold);color:#241a06;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;border:1px solid var(--line-soft);color:var(--white);}
.comingsoon{
  border:1px dashed var(--line-soft);border-radius:10px;padding:34px 24px;text-align:center;color:var(--muted);
}
.comingsoon .big{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.footer-note{font-size:11.5px;color:var(--muted2);margin-top:30px;font-family:var(--mono);}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.chip{
  font-family:var(--mono);font-size:12px;background:var(--paper2);border:1px solid #E3C3CE;border-radius:20px;
  padding:6px 13px;cursor:pointer;color:#3A2430;
}
.chip.picked{background:var(--gold);border-color:var(--gold);color:#241a06;}
.quote{border-left:3px solid var(--line);background:#FAECF1;padding:10px 14px;border-radius:4px;font-size:13.5px;margin:10px 0;color:#3A2430;font-style:italic;}

.kuis-note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:13.5px;line-height:1.55;margin:4px 0 16px;color:#F3E3C6;}
.kuis-note b{color:var(--gold);}
.card{overflow-x:auto;}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap;flex:none;}
@media(max-width:800px){
  .tab{padding:9px 11px;font-size:11.5px;}
  .card{padding:18px 16px;}
  .main{padding-top:70px !important;}
  .tabs{gap:2px;}
  .card table{font-size:12px;}
  .card th,.card td{padding:5px 6px;overflow-wrap:anywhere;}
  .card th:first-child,.card td:first-child{overflow-wrap:normal;word-break:normal;min-width:70px;}
  .card th{font-size:10px;}
}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--gold-soft);color:#7a5418;border:1px solid var(--gold);border-radius:20px;padding:2px 8px;vertical-align:middle;margin-left:6px;font-weight:500;}
.tw{overflow-x:auto;}
.formula{font-family:var(--mono);font-size:12.5px;background:#F7E6EC;border:1px solid #E6C6D1;border-radius:6px;padding:9px 13px;margin:9px 0;color:#3A2430;line-height:1.7;}
table.calc td:not(:first-child),table.calc th:not(:first-child){text-align:right;}
table tr.tot td{font-weight:700;background:#F2DAE3;}
.ex .exdata{background:#F8E7ED;border-left:3px solid var(--line);border-radius:4px;padding:10px 14px;margin:8px 0 14px;font-size:13.5px;line-height:1.65;color:#3A2430;}
.ex .exdata p{margin:0 0 6px;} .ex .exdata p:last-child{margin:0;}
.ex .lbl,.result .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9A5468;margin-bottom:4px;}
.st{display:flex;gap:12px;margin:0 0 12px;}
.st .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#241a06;font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.st .sb{flex:1;min-width:0;font-size:13.5px;line-height:1.65;color:#3A2430;}
.st .sb b{display:block;color:var(--ink);margin-bottom:2px;}
.st .sb p{margin:0 0 4px;}
.result{background:#e6f4ea;border:1px solid #6FCF97;border-left:4px solid #3c9d68;border-radius:6px;padding:10px 14px;margin-top:6px;font-size:13.5px;line-height:1.65;color:#1d3a2a;}
.result p{margin:0 0 4px;} .result .lbl{color:#2f7a52;}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;border-radius:20px;padding:1px 9px;}
.pill.ok{background:#d6f0de;color:#1d5a37;} .pill.no{background:#f8dcd2;color:#8a3318;}
.prbox{border:1px dashed var(--line-soft);border-radius:10px;padding:34px 24px;text-align:center;color:var(--muted);}
.prbox .big{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}

/* Komponen baca: definisi & perbandingan */
.def{background:#FDF5F7;border:1px solid #EBCFD8;border-radius:10px;padding:14px 16px;margin:12px 0}
.def .dt{font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.def .dt::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.def>p{margin:0 0 4px;font-size:14px;line-height:1.65}
.def>ul{margin:0 0 4px;padding-left:20px;font-size:14px;line-height:1.65}
.eg{background:#F8E7ED;border-left:3px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13.5px;line-height:1.6;color:#3A2430;margin-top:8px}
.eg>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A5468;margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags>span{font-family:var(--mono);font-size:11.5px;background:var(--paper2);border:1px solid #E3C3CE;border-radius:20px;padding:3px 10px;color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vl,.vr{border-radius:8px;padding:10px 12px;background:#fff;border:1px solid #E6C6D1}
.vl{border-top:4px solid var(--line)}
.vr{border-top:4px solid var(--gold)}
.vh{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.vl .vh{color:#9A4560}
.vr .vh{color:#9a6420}
.vsb{align-self:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted2)}
.vs p{font-size:13.5px;line-height:1.6;margin:0}
.def>.callout{margin:10px 0 0}
@media(max-width:640px){.vs{grid-template-columns:1fr;gap:6px}.vsb{justify-self:center}.def{padding:12px}}

.pu{gap:12px}
.pu>.def{margin:0}
.def .dt .nb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#241a06;font-family:var(--mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.def.nm .dt::before{display:none}
.def.exm{background:#F8E7ED;border-color:#EBC9D5;border-left:3px solid var(--line)}
.def.exm .dt{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9A4560}
.def.exm .dt::before{display:none}
.vs ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}
.vs .vl>p+ul,.vs .vr>p+ul{margin-top:4px}
.tags.flow>span:not(:last-child)::after{content:'→';margin-left:8px;color:var(--gold);font-weight:600}
.def>p+p{margin-top:6px}

/* Latihan PR: tampilan soal & jawaban */
.pq{background:var(--paper);color:var(--ink);border-radius:14px;margin-bottom:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pq-h{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#7A394D;color:#fff;flex-wrap:wrap}
.pq-emo{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:26px}
.pq-ht{flex:1;min-width:180px}
.pq-n{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:#f3c77e;font-weight:600}
.pq-t{font-family:var(--disp);font-size:18px;font-weight:600;margin-top:2px;color:#fff}
.pq-chip{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);color:#FDEFF3;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 10px}
.pq-why{padding:9px 20px;background:var(--gold-soft);border-bottom:1px solid #e3d3a8;font-size:13px;color:#5a4115}
.pq-why b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.pq-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.pq-soal{margin:16px 18px 6px;background:#F8E7ED;border:1px solid #EBC9D5;border-left:5px solid var(--line);border-radius:10px;padding:14px 16px}
.pq-soal .pq-lbl{color:#9A4560}
.pq-soal p{font-size:14px}
.pq-ans{padding:10px 18px 4px}
.pq-ans .pq-lbl{color:#9a6420;margin:8px 0}
.pq-step{display:flex;gap:12px;margin-bottom:10px;background:#FDF5F7;border:1px solid #EBCFD8;border-radius:10px;padding:12px 14px}
.pq-step .no{flex:none;width:26px;height:26px;border-radius:50%;background:#7A394D;color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pq-step .bd{flex:1;min-width:0;font-size:14px;line-height:1.65}
.pq-step .bd>b:first-child{display:block;margin-bottom:5px;color:var(--ink);font-size:14.5px}
.pq-step .bd p{margin:4px 0}
.pq-step .bd ul{margin:4px 0;padding-left:18px}
.pq-final{margin:6px 18px 16px;background:#eef6f1;border:1px solid #b9d9c5;border-left:5px solid #3e8e63;border-radius:10px;padding:13px 16px;font-size:14.5px;line-height:1.6;color:#17402a}
.pq-final .pq-lbl{color:#1f7a47;margin-bottom:4px}
.pq-note{margin:0 18px 16px;font-size:12.5px;color:#6b5a30;background:#fff7e0;border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;line-height:1.55}
.pq-note b{color:#8a5a14}
.pq .tw{margin:8px 0}
.pq .formula{margin:6px 0}
.pr-intro{background:#8C4559;border:1px solid var(--line-soft);border-radius:12px;padding:14px 18px;margin-bottom:18px;color:var(--white);font-size:13.5px;line-height:1.6}
.pr-intro b{color:#f3c77e}

/* aksen terang di atas latar pink */
.brand .kicker,.navgroup-label{color:#FFE3A8}
.navtoggle span{background:#FFE3A8}
.topic-head .kicker,.comingsoon .big,.prbox .big,.kuis-note b{color:#FFE3A8}
.tab.active{color:#FFE3A8;border-color:#FFE3A8}
.navitem.ready .tag{color:#D4F7E1}
.vsb{color:#8C4559}
html,body{overflow-x:hidden}.card td,.card th{overflow-wrap:normal;word-break:normal}.tw{-webkit-overflow-scrolling:touch}.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;text-align:center;line-height:1.3}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 5px 2px}.fr>span:last-child{padding:2px 5px 0}.formula{overflow-x:auto}

/* Matriks Ansoff visual (Sesi 5) */
.ans{margin:6px 0 2px}
.ans-grid{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:stretch}
.ans-corner{font-family:var(--mono);font-size:10px;color:#9A5468;line-height:1.4;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding-bottom:6px}
.ans-hint{display:inline-block;background:#FFF3DA;border:1.5px solid var(--gold);color:#7A394D;font:700 12px var(--mono);padding:6px 14px;border-radius:20px;margin:16px 0 0;box-shadow:0 0 0 3px var(--gold-soft)}
.ans-ax{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#7A394D;text-align:center;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.ans-ax.side{font-size:10.5px;flex-direction:column;gap:4px}
.nw{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;background:var(--gold);color:#241a06;border-radius:20px;padding:2px 7px;display:inline-block;animation:ansPulse 1.8s ease-in-out infinite}
@keyframes ansPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(201,138,58,.55)}50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(201,138,58,0)}}
.ans-cell{appearance:none;-webkit-appearance:none;text-align:center;background:#fff;border:2px solid #E6C6D1;border-radius:12px;padding:12px 8px 12px;cursor:pointer;font-family:var(--sans);color:var(--ink);display:flex;flex-direction:column;gap:10px;align-items:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.ans-cell:hover{transform:translateY(-2px);border-color:var(--gold)}
.ans-cell.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.ans-nm{font-family:var(--disp);font-weight:600;font-size:13.5px;line-height:1.25}
.ans-pair{display:flex;align-items:center;gap:7px;justify-content:center}
.ans-plus{font-family:var(--mono);color:#9A5468;font-weight:700}

@keyframes csPop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.sy-op{font:700 22px var(--mono);color:#9A5468}
.sy-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-top:7px;font:11px var(--mono);color:#6b4a56}
.sy-track{position:relative;height:26px;background:#F0DDE4;border-radius:8px;overflow:hidden;display:flex}
.sy-fill{height:100%;flex:none;transition:width .6s ease,background .3s}
.sy-mark{position:absolute;top:0;bottom:0;border-left:2px dashed #7A394D}
.sy-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sy-g h4{margin:0 0 6px;font:600 12.5px var(--disp)}
.sy-t{appearance:none;-webkit-appearance:none;display:block;width:100%;text-align:left;border:1.5px solid #E6C6D1;background:#fff;color:var(--ink);font:12.5px/1.35 var(--sans);padding:7px 10px;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:background .2s,border-color .2s}
.sy-t:hover{border-color:var(--gold)}
.sy-t span{display:block;font-size:11px;color:#6b4a56;margin-top:1px}
.sy-t.b.on{background:#CDEBD8;border-color:#3c9d68}
.sy-t.c.on{background:#F9D4CB;border-color:#8E2B3C}

/* BCG */
.cs-ax{font:11px var(--mono);fill:#9A5468}
.cs-q{font:700 15px var(--disp)}
.cs-b{cursor:pointer;outline:none;transition:transform 1s cubic-bezier(.5,0,.2,1)}
.cs-bs{transition:transform 1s cubic-bezier(.5,0,.2,1)}
.cs-bs circle{stroke:#7A394D;stroke-width:2;transition:fill .8s,stroke-width .2s}
.cs-b:hover .cs-bs circle,.cs-b.on .cs-bs circle{stroke:var(--gold);stroke-width:4}
.cs-b:focus-visible .cs-bs circle{stroke:#7A394D;stroke-width:4}
.cs-bt{font:600 13px var(--sans);fill:#2D1822;text-anchor:middle;pointer-events:none}
.cs-cash{fill:none;stroke:#3c9d68;stroke-width:3.5;stroke-dasharray:9 7;opacity:0;transition:opacity .4s}
.cs-svg.cash .cs-cash{opacity:1;animation:csDash 1s linear infinite}
.cs-svg.cash .cs-cash.off{opacity:0}

/* heartland */
.hl-r1{fill:rgba(201,138,58,.28);stroke:var(--gold);stroke-width:2}
.hl-r2{fill:rgba(207,224,247,.5);stroke:#9db7dc;stroke-width:1.5;stroke-dasharray:5 5}
.hl-r3{fill:rgba(240,221,228,.75);stroke:#d8b3c1;stroke-width:1.5;stroke-dasharray:3 6}
.hl-dot{transition:transform .45s ease}
.hl-pulse{fill:none;stroke:#7A394D;stroke-width:2;animation:csRing 1.8s ease-out infinite}
@keyframes csRing{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.hl-sl{width:100%;accent-color:#C98A3A;margin:12px 0 0}
.hl-ends{display:flex;justify-content:space-between;font:10.5px var(--mono);color:#9A5468}
.hl-m{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;margin-top:8px;font:11px var(--mono);color:#6b4a56}
.hl-bar{height:10px;background:#F0DDE4;border-radius:6px;overflow:hidden}
.hl-bar i{display:block;height:100%;border-radius:6px;transition:width .4s,background .3s}
.hl-q{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:12.5px;line-height:1.45}
.hl-q li{display:flex;gap:8px;align-items:flex-start}
.hl-q i{flex:none;width:19px;height:19px;border-radius:50%;font:700 11px/19px var(--mono);text-align:center;font-style:normal;background:#F9D4CB;color:#8E2B3C;transition:background .3s}
.hl-q i.ok{background:#CDEBD8;color:#24704a}

/* restrukturisasi */
.rs-step{background:#fff;border:2px solid #E6C6D1;border-radius:12px;padding:10px 14px}
.rs-q{font:600 14px/1.4 var(--disp);display:flex;gap:10px;align-items:flex-start}
.rs-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#241a06;font:600 12px/24px var(--mono);text-align:center}
.rs-step .vr-tg{justify-content:flex-start;margin:8px 0 0 34px}
.rs-new{animation:ansIn .4s ease}
.rs-con{width:3px;height:16px;background:var(--gold);margin:0 auto;position:relative}
.rs-con::after{content:'';position:absolute;bottom:-3px;left:-4px;border:5.5px solid transparent;border-top:7px solid var(--gold);border-bottom:0}
.rs-res{background:#fff;border:2px solid var(--c);border-left-width:8px;border-radius:12px;padding:12px 16px}
.rs-res b{font:600 17px var(--disp);color:var(--c)}
.rs-res p{margin:5px 0 0;font-size:13px;line-height:1.55}

/* cara tumbuh */
.gr-lane{display:grid;grid-template-columns:116px 1fr;gap:8px;align-items:center;margin-top:7px}
.gr-nm{font:600 12px/1.3 var(--disp)}
.gr-track{position:relative;height:48px;background:#FDF5F7;border:1px solid #EBCFD8;border-radius:10px;overflow:hidden}
.gr-run{position:absolute;left:3%;top:6px;line-height:0;transform:translateX(-50%)}
.gr-flag{position:absolute;right:8px;top:6px;line-height:0}
.gr-tag{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:#24704a;opacity:0;transition:opacity .4s;max-width:60%}
.gr-lane.done .gr-tag{opacity:1}
.gr-lane.go .gr-run .ico{animation:ansBob .45s ease-in-out infinite}
.gr-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.gr-c{border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:10px 12px;font-size:12.5px;line-height:1.5}
.gr-ch{display:flex;align-items:center;gap:8px;font:600 13.5px var(--disp);margin-bottom:6px}
.gr-b{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-top:5px;font:10.5px var(--mono);color:#6b4a56}
.gr-c p{margin:7px 0 0;font-size:12px}

@media(max-width:560px){.sy-g{grid-template-columns:1fr}.sy-row{grid-template-columns:1fr;gap:3px}.hl-m{grid-template-columns:1fr;gap:3px}.gr-cards{grid-template-columns:1fr}.gr-lane{grid-template-columns:78px 1fr}.cs-ctl3{gap:3px}.gr-tag{font-size:9.5px}}
@media(prefers-reduced-motion:reduce){.cs-lk.rel,.cs-coreg .ico,.cs-svg.cash .cs-cash,.hl-pulse,.sy-box.r.up,.rs-new,.gr-lane.go .gr-run .ico{animation:none!important}.cs-b,.cs-bs,.hl-dot{transition:none}}

/* kartu 1: grup dan unit bisnis */
.cp-frame{fill:rgba(255,255,255,.55);stroke:#D8B3C1;stroke-width:2;stroke-dasharray:6 6;transition:stroke .3s,fill .3s,stroke-width .3s}
.cp-frame.on{stroke:var(--gold);stroke-width:3.5;fill:rgba(255,243,218,.55)}
.cp-hq rect,.cp-u rect{fill:#fff;stroke:#E6C6D1;stroke-width:2;transition:stroke .25s,stroke-width .25s,fill .25s}
.cp-hq.on rect{stroke:var(--gold);stroke-width:4;fill:#FFF3DA}
.cp-u{cursor:pointer;outline:none;transition:opacity .3s}
.cp-u:hover rect{stroke:var(--gold)}
.cp-u.on rect{stroke:var(--gold);stroke-width:4;fill:#FFF3DA}
.cp-u.dim,.cp-lk.dim{opacity:.35}
.cp-u:focus-visible rect{stroke:#7A394D;stroke-width:4}
.cp-lk{fill:none;stroke:#3c9d68;stroke-width:3;stroke-dasharray:7 6;animation:csDash 1.3s linear infinite;transition:opacity .3s}
.cp-lk.nov{stroke:#B895A3;animation:none;stroke-dasharray:2 8;stroke-linecap:round}
.cp-up{fill:none;stroke:#C98A3A;stroke-width:3;stroke-dasharray:7 6;animation:csDash 1.3s linear infinite reverse;opacity:0;transition:opacity .3s}
.cp-up.show{opacity:1}
.cp-up.dim{opacity:.15}
.cp-sm{font:11px var(--mono);fill:#6b4a56;text-anchor:middle}
@media(prefers-reduced-motion:reduce){.cp-lk,.cp-up{animation:none!important}}

/* kartu 9: sistem aktivitas Aldi */
.ad-nd{cursor:pointer;outline:none}
.ad-nd circle{fill:#fff;stroke:var(--gold);stroke-width:3;transition:opacity .25s,stroke .25s,fill .25s}
.ad-nd.off circle{stroke:#C9B3BB;stroke-dasharray:4 4;fill:#F6EDF0}
.ad-nd.off .ico,.ad-nd.off text{opacity:.4}
.ad-nd:hover circle{stroke:#7A394D}
.ad-nd:focus-visible circle{stroke:#7A394D;stroke-width:4}
.ad-sp{stroke:#E6C6D1;stroke-width:2;transition:stroke .3s}
.ad-sp.on{stroke:var(--gold)}
.ad-pr{stroke:#3c9d68;stroke-width:3;stroke-dasharray:7 6;animation:csDash 1.2s linear infinite;transition:opacity .3s;opacity:0}
.ad-pr.on{opacity:1}
.ad-core{fill:#FFF3DA;stroke:var(--gold);stroke-width:3}
/* kartu 10: kartu kilat ringkasan */
.sk-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sk-t{border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:10px 12px;transition:border-color .2s,background .2s}
.sk-t.open{border-color:var(--gold);background:#FFF8E8}
.sk-h{appearance:none;-webkit-appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font:600 13.5px var(--disp);color:var(--ink);padding:0}
.sk-h .ico{flex:none}
.sk-h:focus-visible{outline:2px solid #7A394D;outline-offset:3px;border-radius:6px}
.sk-h small{display:block;font:400 10.5px var(--mono);color:#9A5468;margin-top:1px}
.sk-b{display:none;margin-top:8px;font-size:13px;line-height:1.55}
.sk-t.open .sk-b{display:block;animation:ansIn .3s ease}
.sk-b button{appearance:none;-webkit-appearance:none;border:1.5px solid #E6C6D1;background:#fff;font:11.5px var(--sans);padding:4px 10px;border-radius:14px;cursor:pointer;margin-top:6px;color:var(--ink)}
.sk-b button:hover{border-color:var(--gold)}
@media(max-width:560px){.sk-g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.ad-pr,.sk-t.open .sk-b{animation:none!important}}

/* kartu 1: perbandingan dua level strategi */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:16px 0}
.cmp-c{border:2px solid #E6C6D1;border-radius:14px;padding:14px 16px;background:#fff}
.cmp-c.a{border-color:var(--gold);background:#FFF8E8}
.cmp-c.b{border-color:#9db7dc;background:#F2F7FD}
.cmp-h{display:flex;align-items:center;gap:10px}
.cmp-h b{font:600 16px var(--disp);display:block;line-height:1.2}
.cmp-h small{display:inline-block;margin-top:3px;font:600 10.5px var(--mono);padding:2px 8px;border-radius:10px;background:rgba(122,57,77,.1);color:#7A394D}
.cmp-l{font:600 10.5px var(--mono);color:#9A5468;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 5px}
.cmp-q{border-left:4px solid var(--gold);padding:2px 0 2px 12px;font-size:14.5px;line-height:1.55}
.cmp-c.b .cmp-q{border-left-color:#7ba3d6}
.cmp-vs{align-self:center;width:34px;height:34px;border-radius:50%;background:#7A394D;color:#fff;font:700 12px/34px var(--mono);text-align:center}
@media(max-width:620px){.cmp{grid-template-columns:1fr}.cmp-vs{justify-self:center}}

/* gaya kartu pengganti tabel */
.cmp-c.g{border-color:#8FD0AA;background:#F0FAF4}.cmp-c.g .cmp-q{border-left-color:#6FCF97}
.cmp-c.p{border-color:#D8A3B5;background:#FDF0F4}.cmp-c.p .cmp-q{border-left-color:#C97B97}
.cmp-c .cmp-q+.cmp-l{margin-top:12px}
.stp{display:grid;gap:10px;margin:14px 0}
.stp-i{display:flex;gap:12px;align-items:flex-start;border:2px solid #E6C6D1;border-radius:14px;padding:12px 14px;background:#fff}
.stp-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#241a06;font:700 14px/30px var(--mono);text-align:center}
.stp-t{font:600 15px var(--disp)}
.stp-q{margin-top:3px;font-size:14px;line-height:1.55}
.stp-r{margin-top:8px;font-size:13px;line-height:1.5;background:#F9E3DD;border-left:4px solid #8E2B3C;border-radius:0 8px 8px 0;padding:6px 10px}
.stp-r b{color:#8E2B3C}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt-c{border:2px solid #E6C6D1;border-top:6px solid var(--c);border-radius:14px;padding:12px 14px;background:#fff;font-size:13.5px;line-height:1.5}
.opt-c .cmp-h b{color:var(--c)}
.stk{display:grid;gap:10px;margin:14px 0}
.stk-c{border:2px solid #E6C6D1;border-radius:14px;background:#fff;overflow:hidden}
.stk-h{background:#F7E4EA;font:600 14.5px var(--disp);padding:8px 14px}
.stk-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 14px 12px;font-size:13.5px;line-height:1.55}
.fold{margin:14px 0;border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:0 12px}
.fold summary{cursor:pointer;font:600 13px var(--sans);padding:10px 0;color:#7A394D}
.fold[open] summary{border-bottom:1px solid #EBCFD8;margin-bottom:10px}
.fold .tw{margin-bottom:12px}
@media(max-width:620px){.opt,.stk-g{grid-template-columns:1fr}}

/* ===== Sesi 9: desain organisasi ===== */
.og-b{animation:ogIn .45s ease both}
.og-b rect{fill:#fff;stroke:#C98A3A;stroke-width:2}
.og-b.top rect{fill:#FFE3A8}
.og-b.dup rect{fill:#FFF0B8;stroke-dasharray:4 3}
.og-b.out rect{fill:#E8F1FC;stroke:#7BA3D6;stroke-dasharray:5 4}
.og-b text{font:600 12.5px var(--sans);fill:#2D1822}
.og-l{fill:none;stroke:#B08A98;stroke-width:2;animation:ogFade .5s ease both}
.og-l.dsh{stroke:#7BA3D6;stroke-dasharray:6 5;animation:ogFade .5s ease both,csDash 1.2s linear infinite}
.og-l.hot{stroke:#7A394D;stroke-width:3}
.og-n{font:11.5px var(--mono);fill:#6b4a56}
.og-p{fill:#F0C36A;stroke:#C98A3A;stroke-width:1.5;animation:ogIn .45s ease both}
.og-p.hot{fill:#7A394D;stroke:#7A394D}
@keyframes ogIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ogFade{from{opacity:0}to{opacity:1}}
.og-pro,.og-con{margin:6px 0 0;padding:6px 10px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.5}
.og-pro{background:#EAF7EF;border-left:4px solid #3c9d68}
.og-con{background:#F9E3DD;border-left:4px solid #8E2B3C}
.pl-c{cursor:pointer;outline:none;animation:ogIn .5s ease both}
.pl-c rect{fill:#fff;stroke:#E6C6D1;stroke-width:2;transition:stroke .25s,fill .25s}
.pl-c:hover rect{stroke:var(--gold)}
.pl-c.on rect{stroke:var(--gold);stroke-width:3.5;fill:#FFF3DA}
.pl-c:focus-visible rect{stroke:#7A394D;stroke-width:4}
.pl-roof{fill:#FFE3A8;stroke:var(--gold);stroke-width:2}
.pl-base{fill:#F7E4EA;stroke:#E6C6D1;stroke-width:2}
.sd-g{transition:transform .5s ease}
.sd-g circle{stroke:#7A394D;stroke-width:2}
.sf-row{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:8px 0}
.sf-s{appearance:none;-webkit-appearance:none;flex:1;min-width:104px;border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:9px 8px;text-align:center;cursor:pointer;font:600 12px/1.3 var(--sans);color:var(--ink);transition:border-color .2s,background .2s}
.sf-s:hover{border-color:var(--gold)}
.sf-s.on{border-color:var(--gold);background:#FFF3DA}
.sf-s.run{animation:csPop .5s ease}
.sf-s .sf-n{display:block;font:600 11px var(--mono);color:#9A5468;margin-bottom:3px}
.sf-s .ico{display:block;margin:0 auto 3px}
.sf-a{align-self:center;color:#C98A3A;font-weight:700}
.cb-r{border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:10px 12px;margin-top:8px}
.cb-r b{font:600 14px var(--disp)}
.cb-r small{display:block;font-size:12px;color:#6b4a56;margin:2px 0 6px;line-height:1.45}
.cb-seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.cb-seg button{appearance:none;-webkit-appearance:none;border:1.5px solid #E6C6D1;background:#fff;color:var(--ink);font:12px var(--sans);padding:4px 11px;border-radius:14px;cursor:pointer;transition:background .2s,border-color .2s}
.cb-seg button.on[data-s="2"]{background:#CDEBD8;border-color:#3c9d68}
.cb-seg button.on[data-s="1"]{background:#FFF0B8;border-color:#C98A3A}
.cb-seg button.on[data-s="0"]{background:#F9D4CB;border-color:#8E2B3C}
.ex-i{appearance:none;-webkit-appearance:none;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid #E6C6D1;border-radius:12px;background:#fff;padding:9px 12px;margin-top:7px;cursor:pointer;font:inherit;color:inherit;transition:border-color .25s,background .25s}
.ex-i:hover{border-color:var(--gold)}
.ex-i.done{border-color:#3c9d68;background:#F0FAF4}
.ex-c{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #C9B3BB;font:700 13px/20px var(--mono);text-align:center;color:#fff;transition:background .25s,border-color .25s}
.ex-i.done .ex-c{background:#3c9d68;border-color:#3c9d68}
.ex-t b{display:block;font:600 13.5px var(--disp)}
.ex-t span{font-size:12.5px;line-height:1.5;color:#4a3340}
@media(max-width:560px){.sf-a{display:none}.sf-s{min-width:46%}}
@media(prefers-reduced-motion:reduce){.og-b,.og-l,.og-p,.pl-c,.sf-s.run{animation:none!important}.sd-g{transition:none}}
</style>
