const SES=[[1,'Strategy, Business Forms, and Strategic Direction','s1'],[2,'Macro-environment dan Industry Analysis','s2'],[3,'Value Creation, Resources, and Capabilities','s3'],[4,'Business Strategy dan Functional Planning','s4'],[5,'Strategic Growth dan Competitive Position','s5'],[6,'International Strategy dan Global Business','s6'],[7,'Mid Exam (integrated business case)','s7'],[8,'Corporate Strategy, Diversification, and Portfolio Management','s8'],[9,'Organisational Design and Strategy Execution','s9'],[10,'Internal Operations, Strategic Control, and Performance','s10'],[11,'Organisational Behaviour, Culture, and Strategic Leadership','s11'],[12,'Strategic Change and Organisational Transformation','s12'],[13,'Strategic Information, Data Analytics, and Digital Business','s13']];
CONTENT.s9={kicker:'Sesi 9 · Henry, Organizational Structures and Strategic Change',title:'Organisational Design and Strategy Execution',desc:'Sesi ini membahas cara menyusun organisasi agar strategi bisa dijalankan: membagi tugas, menentukan wewenang, memilih struktur, menempatkan orang, dan memastikan tiap bagian saling berkoordinasi. Fokus mengikuti RPKPS Sesi 9 dan pembahasan struktur organisasi serta implementasi strategi dalam buku Anthony Henry.',materi:[
C("1. Apa itu desain organisasi?",P("<b>Desain organisasi (organisational design)</b> adalah cara perusahaan membagi pekerjaan, menentukan siapa yang berwenang mengambil keputusan, dan mengatur koordinasi antarbagian. Tujuannya bukan sekadar membuat bagan organisasi, tetapi memastikan orang dan proses bekerja untuk menjalankan strategi." )+UL(["Pembagian kerja: siapa mengerjakan tugas apa?","Wewenang: siapa boleh memutuskan dan menyetujui?","Koordinasi: bagaimana bagian pemasaran, keuangan, operasi, dan SDM saling bertukar informasi?","Akuntabilitas: siapa bertanggung jawab atas hasil dan masalah?"])+CALL("Menurut Henry, struktur organisasi membantu membagi tugas khusus sekaligus mengoordinasikan pekerjaan tersebut. Struktur yang terlalu rumit dapat memperlambat keputusan; struktur yang terlalu sederhana dapat membuat tanggung jawab tidak jelas.")),
C("2. Kesesuaian strategi dan struktur (strategy–structure fit)",P("<b>Strategy–structure fit</b> berarti struktur organisasi harus mendukung strategi yang dipilih. Tidak ada satu bentuk struktur yang paling baik untuk semua perusahaan. Struktur perlu disesuaikan dengan ukuran perusahaan, jenis produk, lokasi operasi, kecepatan perubahan, dan tingkat kerumitan koordinasi." )+T(["Kondisi atau strategi","Kebutuhan organisasi","Contoh sederhana"],[["Satu produk dan operasi relatif sederhana","Struktur fungsional yang jelas dapat membantu spesialisasi.","Bagian pemasaran, keuangan, operasi, dan SDM."],["Banyak produk atau kelompok pelanggan berbeda","Unit bisnis atau divisi dapat diberi tanggung jawab lebih jelas.","Divisi produk makanan, minuman, dan kebutuhan rumah tangga."],["Beroperasi di banyak wilayah","Struktur geografis dapat membantu menanggapi kebutuhan daerah.","Manajer wilayah mengelola cabang dan pelanggan lokal."],["Banyak proyek yang membutuhkan beberapa keahlian sekaligus","Koordinasi lintas fungsi perlu diperkuat; struktur matriks dapat dipertimbangkan.","Tim proyek menggabungkan orang dari TI, keuangan, dan operasi."]])+P("Struktur harus membantu strategi, bukan membuat perusahaan sibuk mengurus birokrasi. Jika strategi berubah, struktur, proses, dan pembagian tanggung jawab mungkin juga perlu disesuaikan.")),
C("3. Bentuk-bentuk struktur organisasi",P("Beberapa bentuk struktur yang umum digunakan memiliki kelebihan dan kelemahan masing-masing." )+T(["Bentuk struktur","Cara kerja","Kelebihan","Risiko atau kelemahan"],[["Fungsional","Orang dikelompokkan berdasarkan keahlian, seperti pemasaran, keuangan, operasi, dan SDM.","Spesialisasi dan penggunaan keahlian lebih efisien.","Setiap fungsi bisa terlalu fokus pada targetnya sendiri dan kurang berkoordinasi."],["Divisional","Organisasi dibagi berdasarkan produk, wilayah, atau kelompok pelanggan.","Tanggung jawab hasil tiap unit lebih jelas dan dekat dengan pasar.","Beberapa fungsi bisa terduplikasi sehingga biaya meningkat."],["Matriks","Karyawan dapat melapor kepada manajer fungsi dan manajer proyek/produk.","Keahlian lintas fungsi dapat digunakan untuk proyek bersama.","Dapat terjadi konflik prioritas atau kebingungan tentang siapa yang memberi arahan."],["Jaringan atau kemitraan","Sebagian aktivitas dilakukan bersama mitra atau pihak luar.","Lebih fleksibel dan dapat mengakses kemampuan dari luar.","Perusahaan perlu mengelola ketergantungan, kualitas, dan koordinasi dengan mitra."]])+P("Contoh: perusahaan yang hanya menjual satu jenis produk mungkin cukup memakai struktur fungsional. Ketika produk dan pasar bertambah banyak, struktur divisional bisa membantu memperjelas tanggung jawab tiap bisnis.")),
C("4. Sentralisasi dan desentralisasi",P("<b>Sentralisasi (centralisation)</b> berarti keputusan penting lebih banyak dipusatkan pada pimpinan atau kantor pusat. <b>Desentralisasi (decentralisation)</b> berarti sebagian wewenang diberikan kepada manajer unit atau cabang." )+T(["Aspek","Sentralisasi","Desentralisasi"],[["Keputusan","Banyak keputusan ditetapkan pimpinan pusat.","Manajer unit memiliki ruang mengambil keputusan lokal."],["Kelebihan","Kebijakan konsisten, kontrol lebih mudah, dan sumber daya bisa dikoordinasikan.","Keputusan bisa lebih cepat dan sesuai kondisi setempat; manajer lokal lebih berkembang."],["Kelemahan","Keputusan bisa lambat dan pimpinan pusat jauh dari masalah harian.","Kebijakan antarunit bisa berbeda dan kontrol lebih menantang."],["Cocok ketika","Perusahaan membutuhkan standar ketat, konsistensi, atau pengendalian risiko tinggi.","Pasar berbeda-beda dan unit perlu merespons kondisi lokal dengan cepat."]])+CALL("Dalam praktik, perusahaan tidak harus memilih salah satu secara mutlak. Misalnya, kebijakan keamanan data dan batas risiko dapat ditetapkan pusat, sedangkan promosi lokal dapat diputuskan manajer cabang sesuai anggaran.")),
C("5. Staffing: menempatkan orang yang tepat",P("<b>Staffing</b> adalah memastikan organisasi memiliki orang dengan jumlah, keterampilan, dan pengalaman yang dibutuhkan untuk menjalankan strategi. Strategi baru sering membutuhkan kemampuan baru; rencana yang bagus akan sulit berjalan jika orang dan keterampilannya tidak tersedia." )+UL(["Perencanaan tenaga kerja: tentukan jumlah dan jenis keterampilan yang dibutuhkan.","Rekrutmen dan seleksi: cari orang yang sesuai dengan pekerjaan dan arah organisasi.","Pelatihan dan pengembangan: bantu karyawan menguasai proses, teknologi, atau tanggung jawab baru.","Penempatan peran: tetapkan tanggung jawab dan wewenang secara jelas.","Penilaian dan penghargaan: hubungkan perilaku dan hasil kerja dengan tujuan strategi, tanpa mendorong tindakan yang tidak etis."])+P("Contoh: perusahaan yang ingin memperluas penjualan daring perlu memastikan tersedia kemampuan e-commerce, analisis data, keamanan sistem, pengelolaan pesanan, dan layanan pelanggan digital.")),
C("6. Kapabilitas organisasi",P("<b>Kapabilitas (capabilities)</b> adalah kemampuan organisasi untuk menggabungkan orang, proses, pengetahuan, dan teknologi agar suatu pekerjaan dapat dilakukan dengan baik. Kapabilitas bukan hanya keterampilan satu karyawan, tetapi kemampuan yang dapat dijalankan secara konsisten oleh organisasi." )+T(["Jenis kapabilitas","Contoh","Mengapa penting untuk strategi"],[["Operasional","Memproduksi dengan mutu stabil dan tepat waktu.","Mendukung efisiensi dan keandalan."],["Digital dan analitik","Mengolah data pelanggan untuk memperbaiki keputusan.","Mendukung personalisasi dan keputusan yang lebih cepat."],["Inovasi","Menguji dan meluncurkan produk baru.","Mendukung pertumbuhan dan pembaruan bisnis."],["Koordinasi lintas fungsi","Pemasaran, operasi, dan keuangan bekerja dengan data serta sasaran yang selaras.","Mengurangi konflik dan keterlambatan pelaksanaan strategi."]])+P("Saat strategi baru direncanakan, manajemen perlu menilai kapabilitas apa yang sudah dimiliki, apa yang masih kurang, dan bagaimana kekurangan itu akan ditutup—misalnya melalui pelatihan, perekrutan, teknologi, atau kemitraan.")),
C("7. Dari strategi ke pelaksanaan",P("<b>Strategy execution (pelaksanaan strategi)</b> adalah menerjemahkan arah dan pilihan strategis menjadi pekerjaan nyata. Henry menekankan bahwa strategi yang dirumuskan dengan baik tetap bisa gagal jika pelaksanaannya buruk. Organisasi membutuhkan struktur yang fleksibel, komunikasi yang jelas, sumber daya yang cukup, koordinasi, dan mekanisme untuk mengevaluasi hasil." )+T(["Langkah","Pertanyaan yang harus dijawab"],[["Tetapkan tujuan","Hasil apa yang ingin dicapai dan kapan?"],["Bagi tanggung jawab","Siapa pemilik tiap pekerjaan dan siapa yang menyetujui keputusan?"],["Siapkan sumber daya","Apakah anggaran, orang, waktu, data, dan teknologi tersedia?"],["Komunikasikan perubahan","Apakah pihak yang terdampak memahami alasan dan dampak perubahan?"],["Koordinasikan proses","Bagaimana unit dan mitra bekerja bersama?"],["Pantau dan sesuaikan","Bagaimana mengetahui kemajuan dan kapan rencana perlu diperbaiki?"]])+P("Sesi 10 akan membahas lebih khusus alokasi sumber daya, kebijakan, BSC, KPI, insentif, dan pengendalian strategi. Di sesi ini, fokus utamanya adalah memastikan struktur dan pembagian peran mendukung pelaksanaan.")),
C("8. Contoh kasus: perusahaan membuka kanal penjualan daring",P("Sebuah perusahaan ritel yang sebelumnya mengandalkan toko fisik memutuskan memperluas penjualan melalui situs dan aplikasi. Strategi ini memerlukan lebih dari sekadar membuat situs web." )+UL(["Struktur: tentukan siapa yang bertanggung jawab atas kanal digital dan bagaimana timnya berkoordinasi dengan toko fisik.","Wewenang: pusat menetapkan standar keamanan, data pelanggan, dan kebijakan pengembalian; cabang dapat mengatur pelaksanaan lokal sesuai batas yang ditentukan.","Staffing: siapkan kemampuan digital, analisis data, pemrosesan pesanan, dan layanan pelanggan.","Kapabilitas: integrasikan stok toko, gudang, pembayaran, pengiriman, dan data pelanggan.","Pelaksanaan: tetapkan pemilik tugas, sumber daya, jadwal, komunikasi, dan cara memantau kendala."])+CALL("Pelajaran: strategi digital tidak akan berhasil hanya karena teknologinya tersedia. Struktur, orang, kapabilitas, dan koordinasi harus ikut disiapkan.")),
C("9. Kesalahan umum dalam desain dan pelaksanaan",UL(["Mengubah bagan organisasi tanpa memperjelas proses dan tanggung jawab.","Memilih struktur karena sedang populer, bukan karena cocok dengan strategi.","Memusatkan semua keputusan sehingga respons lambat, atau mendesentralisasi tanpa batas dan kontrol yang jelas.","Mengumumkan strategi baru tanpa menyediakan orang, anggaran, keterampilan, dan teknologi.","Mengabaikan komunikasi serta pihak yang terdampak perubahan.","Menganggap strategi selesai setelah diumumkan, tanpa memantau pelaksanaan dan memperbaiki masalah."]))
]};
CONTENT.s10={kicker:'Sesi 10 · Henry, Strategic Control Systems',title:'Internal Operations, Strategic Control, and Performance',desc:'Sesi ini membahas cara menerjemahkan strategi ke dalam anggaran, kebijakan, ukuran kinerja, insentif, dan pengendalian. Mengikuti RPKPS: resource allocation, policies, Balanced Scorecard (BSC), KPIs, kinerja keuangan dan nonkeuangan, incentives, dan strategic control.',materi:[
C("1. Tujuan sesi dan hubungan dengan strategi",P("Strategi perlu diterjemahkan menjadi keputusan sehari-hari: uang dan orang dialokasikan ke mana, aturan apa yang dipakai, hasil apa yang diukur, dan bagaimana manajemen mengetahui apakah strategi berjalan. <b>Strategic control</b> adalah proses memantau pelaksanaan dan hasil strategi, lalu mengambil tindakan korektif bila diperlukan." )+UL(["Strategi menetapkan arah dan hasil yang ingin dicapai.","Anggaran, kebijakan, dan pembagian sumber daya membantu menjalankan strategi.","KPI dan laporan menunjukkan kemajuan.","Pengendalian membandingkan hasil dengan target dan memicu perbaikan."])),
C("2. Alokasi sumber daya (resource allocation)",P("<b>Resource allocation</b> berarti menentukan bagaimana sumber daya terbatas—anggaran, tenaga kerja, waktu, teknologi, dan kapasitas—dibagikan ke prioritas strategis. Anggaran tidak seharusnya hanya mengikuti kebiasaan tahun lalu; alokasi harus mendukung sasaran yang paling penting." )+T(["Sumber daya","Pertanyaan manajemen","Contoh"],[["Anggaran","Program mana yang paling mendukung strategi?","Menambah dana untuk layanan digital yang menjadi prioritas."],["Orang dan keterampilan","Tim mana yang perlu diperkuat?","Melatih staf analitik untuk memahami perilaku pelanggan."],["Waktu dan kapasitas","Pekerjaan mana yang harus didahulukan?","Mendahulukan perbaikan kualitas sebelum ekspansi."],["Teknologi dan data","Sistem apa yang diperlukan?","Mengintegrasikan data penjualan dan persediaan."]])+P("Risiko yang umum adalah menyebarkan anggaran terlalu tipis ke banyak proyek, mempertahankan program yang tidak lagi mendukung strategi, atau hanya memilih proyek yang hasilnya cepat terlihat.")),
C("3. Kebijakan dan prosedur",P("<b>Kebijakan (policies)</b> memberi batas dan panduan agar keputusan sehari-hari konsisten dengan strategi. Prosedur menjelaskan langkah-langkah untuk menjalankan pekerjaan. Kebijakan harus membantu pelaksanaan, bukan menambah birokrasi tanpa manfaat." )+UL(["Kebijakan harga menetapkan batas diskon dan siapa yang boleh menyetujuinya.","Kebijakan pengadaan menentukan proses pemilihan pemasok dan persetujuan pembelian.","Kebijakan layanan pelanggan menjelaskan standar respons dan penyelesaian keluhan.","Kebijakan keamanan data menetapkan akses, penyimpanan, dan penanganan insiden."])+P("Contoh: jika strategi perusahaan menekankan layanan cepat, prosedur persetujuan pengembalian barang yang terlalu panjang dapat bertentangan dengan strategi tersebut.")),
C("4. Mengukur kinerja: KPI",P("<b>Key Performance Indicator (KPI)</b> adalah ukuran utama untuk melihat apakah tujuan tertentu tercapai. KPI yang baik berkaitan dengan strategi, definisinya jelas, sumber datanya dapat dipercaya, dan memiliki target serta periode pengukuran." )+T(["Tujuan strategis","Contoh KPI","Hal yang perlu diperhatikan"],[["Meningkatkan penjualan","Pertumbuhan penjualan; tingkat konversi","Kenaikan penjualan perlu dibandingkan dengan margin dan biaya."],["Memperbaiki layanan","Waktu penyelesaian keluhan; kepuasan pelanggan","Jangan hanya mengejar kecepatan hingga kualitas turun."],["Meningkatkan efisiensi","Biaya per unit; tingkat produk cacat","Penurunan biaya tidak boleh merusak mutu."],["Meningkatkan SDM","Jam pelatihan; retensi karyawan kunci","Jumlah pelatihan tidak otomatis berarti kemampuan meningkat."],["Memperkuat kas","Arus kas operasi; hari penagihan piutang","Perhatikan dampaknya pada hubungan pelanggan."]])+P("KPI berbeda dari target: KPI adalah ukuran yang dipantau, sedangkan target adalah nilai yang ingin dicapai. Misalnya, KPI = waktu penyelesaian keluhan; target = rata-rata maksimal 24 jam.")),
C("5. Kinerja keuangan dan nonkeuangan",P("Kinerja keuangan menunjukkan hasil dalam bentuk uang, sedangkan kinerja nonkeuangan membantu menjelaskan faktor yang menghasilkan hasil tersebut. Keduanya dibutuhkan karena angka keuangan sering menunjukkan akibat setelah suatu kejadian, sementara indikator nonkeuangan dapat memberi sinyal lebih awal." )+T(["Jenis ukuran","Contoh","Manfaat dan keterbatasan"],[["Keuangan","Laba, margin, arus kas, ROI","Menunjukkan hasil ekonomi, tetapi sering bersifat historis."],["Pelanggan","Kepuasan, retensi, keluhan","Memberi petunjuk tentang kualitas hubungan dengan pelanggan."],["Proses internal","Waktu siklus, kesalahan, tingkat cacat","Menunjukkan efisiensi dan mutu proses."],["Pembelajaran dan pertumbuhan","Keterampilan, pelatihan, inovasi","Menunjukkan kesiapan organisasi untuk hasil jangka panjang."]])+P("Hindari menilai kinerja dari satu angka saja. Penjualan dapat meningkat sementara laba turun karena diskon besar; jumlah keluhan dapat turun karena pelanggan kesulitan menyampaikan keluhan.")),
C("6. Balanced Scorecard (BSC)",P("<b>Balanced Scorecard</b> membantu organisasi melihat kinerja dari beberapa sudut, bukan hanya laba. Kerangka yang umum digunakan memiliki empat perspektif:" )+T(["Perspektif","Pertanyaan utama","Contoh ukuran"],[["Keuangan","Apakah strategi menghasilkan nilai ekonomi?","Margin, arus kas, pengembalian investasi."],["Pelanggan","Bagaimana pelanggan menilai perusahaan?","Kepuasan, retensi, keluhan."],["Proses internal","Proses apa yang harus berjalan baik?","Waktu proses, kesalahan, mutu."],["Pembelajaran dan pertumbuhan","Kemampuan apa yang harus dibangun?","Keterampilan, inovasi, kesiapan sistem."]])+P("Keempat perspektif sebaiknya saling terhubung. Contoh hubungan: pelatihan karyawan meningkatkan kemampuan layanan; layanan yang lebih baik meningkatkan kepuasan dan retensi pelanggan; pelanggan yang bertahan dapat membantu meningkatkan pendapatan dan laba." )+CALL("BSC bukan sekadar daftar KPI. BSC yang baik menghubungkan tujuan, ukuran, target, inisiatif, dan hubungan sebab-akibat yang masuk akal.")),
C("7. Strategy map dan hubungan sebab-akibat",P("<b>Strategy map</b> menggambarkan bagaimana tujuan di berbagai perspektif saling mendukung. Peta ini membantu menjelaskan mengapa suatu investasi atau program dilakukan, bukan hanya apa yang diukur." )+T(["Urutan contoh","Penjelasan"],[["Pembelajaran","Melatih staf layanan dan memperbaiki sistem informasi."],["Proses internal","Keluhan ditangani lebih cepat dan kesalahan pesanan menurun."],["Pelanggan","Kepuasan dan kemungkinan pelanggan kembali meningkat."],["Keuangan","Retensi dan penjualan berulang membantu meningkatkan pendapatan serta laba."]])+P("Hubungan ini adalah hipotesis yang perlu diuji menggunakan data. Pelatihan tidak selalu otomatis meningkatkan laba jika masalah utama justru ada pada harga, produk, atau permintaan pasar.")),
C("8. Insentif dan perilaku",P("<b>Incentives</b> adalah penghargaan atau konsekuensi yang memengaruhi perilaku karyawan. Insentif dapat berupa bonus, kenaikan gaji, pengakuan, promosi, atau kesempatan pengembangan. Sistem insentif perlu selaras dengan tujuan strategi dan nilai etika." )+UL(["Jika staf penjualan hanya dinilai dari jumlah penjualan, mereka mungkin memberi diskon berlebihan atau menjual kepada pelanggan yang berisiko gagal bayar.","Jika pusat layanan hanya dinilai dari kecepatan, masalah pelanggan bisa diselesaikan secara dangkal.","Gunakan kombinasi ukuran hasil dan kualitas, tetapkan definisi yang jelas, serta pantau kemungkinan manipulasi angka.","Pastikan target realistis, dapat dipengaruhi oleh karyawan, dan tidak mendorong pelanggaran etika."])+P("Prinsipnya: orang cenderung memberi perhatian pada hal yang diukur dan diberi penghargaan. Karena itu, desain pengukuran dan insentif dapat membentuk perilaku organisasi.")),
C("9. Strategic control: memantau dan memperbaiki",P("<b>Strategic control</b> membantu manajemen memeriksa apakah pelaksanaan masih sesuai dengan strategi dan apakah asumsi strategi masih masuk akal. Kontrol bukan hanya mencari kesalahan; kontrol juga membantu organisasi belajar dan beradaptasi." )+T(["Langkah","Apa yang dilakukan"],[["Tetapkan sasaran","Tentukan tujuan, KPI, target, dan tenggat."],["Kumpulkan data","Pastikan sumber data, definisi, dan periode konsisten."],["Bandingkan","Bandingkan hasil aktual dengan target dan tren sebelumnya."],["Cari penyebab","Bedakan gejala dengan akar masalah; libatkan pihak yang memahami proses."],["Ambil tindakan","Perbaiki proses, alokasi sumber daya, pelatihan, atau asumsi strategi."],["Tinjau ulang","Periksa apakah tindakan memperbaiki hasil dan apakah strategi perlu disesuaikan."]])+P("Contoh: jika penjualan mencapai target tetapi arus kas memburuk, manajemen perlu memeriksa penagihan piutang, diskon, persediaan, dan syarat pembayaran—bukan langsung menyimpulkan strategi penjualan berhasil.")),
C("10. Contoh kasus terpadu",P("Sebuah perusahaan ritel ingin meningkatkan pembelian berulang melalui layanan yang lebih baik. Manajemen menetapkan anggaran untuk pelatihan staf dan sistem pengaduan pelanggan. Strategi kemudian diterjemahkan ke KPI dan dievaluasi setiap bulan." )+T(["Elemen","Penerapan"],[["Tujuan","Meningkatkan pembelian berulang dan menjaga margin."],["Alokasi sumber daya","Anggaran pelatihan, perbaikan aplikasi, dan dukungan pelanggan."],["KPI pelanggan","Tingkat retensi, kepuasan, dan keluhan yang selesai."],["KPI proses","Waktu respons dan tingkat keluhan yang diselesaikan pada kontak pertama."],["KPI keuangan","Pembelian berulang, margin, dan arus kas."],["Insentif","Gabungan kualitas layanan, kepuasan, dan hasil penjualan—bukan kecepatan saja."],["Tindakan korektif","Jika keluhan cepat ditutup tetapi pelanggan tetap tidak puas, tinjau mutu penyelesaian, bukan hanya durasi."]])+CALL("Inti kasus: ukuran kinerja harus mencerminkan tujuan strategi dan dibaca bersama-sama. Mencapai satu target tidak otomatis berarti strategi berhasil.")),
C("11. Kesalahan umum dalam pengendalian kinerja",UL(["Mengukur terlalu banyak hal sehingga fokus hilang.","Memilih KPI yang mudah dihitung tetapi tidak terkait dengan strategi.","Menetapkan target tanpa data dasar atau tanpa mempertimbangkan sumber daya.","Hanya mengukur hasil keuangan dan mengabaikan faktor yang membentuknya.","Memberi insentif pada satu angka sehingga kualitas, etika, atau risiko terabaikan.","Mengumpulkan laporan tetapi tidak mencari penyebab dan tidak mengambil tindakan.","Menganggap korelasi sebagai bukti bahwa satu program pasti menyebabkan hasil tertentu."])),
C("12. Ringkasan inti",UL(["Alokasi sumber daya harus mengikuti prioritas strategi, bukan sekadar kebiasaan anggaran.","Kebijakan dan prosedur perlu membantu konsistensi pelaksanaan.","KPI mengukur kemajuan; target menetapkan hasil yang ingin dicapai.","Gabungkan ukuran keuangan dan nonkeuangan agar gambaran kinerja lebih lengkap.","BSC memiliki perspektif keuangan, pelanggan, proses internal, serta pembelajaran dan pertumbuhan.","Insentif membentuk perilaku sehingga perlu dirancang agar tidak mendorong manipulasi atau tindakan tidak etis.","Strategic control membandingkan hasil, mencari penyebab, melakukan perbaikan, dan meninjau kembali strategi."]))
]};

CONTENT.s11={kicker:'Sesi 11 · Henry, Strategic Leadership',title:'Organisational Behaviour, Culture, and Strategic Leadership',desc:'Sesi ini membahas bagaimana perilaku individu dan kelompok, budaya organisasi, serta kepemimpinan memengaruhi pelaksanaan strategi. Fokus RPKPS: perilaku individu/kelompok, keselarasan nilai dan aturan, budaya, gaya kepemimpinan, kecerdasan emosional, inovasi, dan risiko kepemimpinan.',materi:[
C("1. Mengapa perilaku, budaya, dan kepemimpinan penting?",P("Strategi dijalankan oleh manusia, bukan hanya oleh dokumen, struktur, atau teknologi. Karena itu, hasil strategi dipengaruhi oleh cara orang bekerja, berkomunikasi, mengambil keputusan, dan merespons perubahan. Henry menjelaskan bahwa kepemimpinan membantu menyampaikan tujuan organisasi dan mendorong orang untuk berkontribusi pada tujuan tersebut.")+UL(["Perilaku individu memengaruhi cara seseorang menyelesaikan tugas dan mengambil keputusan.","Perilaku kelompok memengaruhi kerja sama, komunikasi, dan penyelesaian konflik.","Budaya organisasi membentuk kebiasaan dan perilaku yang dianggap wajar.","Kepemimpinan memberi arah, membangun dukungan, dan membantu organisasi menghadapi perubahan."])),
C("2. Perilaku individu dan kelompok",P("<b>Perilaku organisasi (organizational behaviour)</b> mempelajari bagaimana individu dan kelompok bertindak di tempat kerja. Memahami perilaku membantu manajer menjelaskan mengapa kebijakan yang sama bisa menghasilkan respons yang berbeda.")+T(["Faktor","Pengaruh pada pekerjaan","Contoh"],[["Motivasi","Menentukan kemauan dan usaha seseorang.","Karyawan yang memahami tujuan pekerjaannya cenderung lebih mudah melihat manfaat tugasnya."],["Persepsi dan sikap","Mempengaruhi cara seseorang menafsirkan keputusan.","Perubahan sistem dapat dianggap sebagai peluang belajar atau ancaman terhadap pekerjaan."],["Keahlian dan pengalaman","Mempengaruhi kemampuan dan rasa percaya diri.","Karyawan yang belum pernah memakai aplikasi baru mungkin membutuhkan pelatihan."],["Norma kelompok","Membentuk perilaku yang diterima tim.","Jika tim terbiasa berbagi informasi, masalah dapat diketahui lebih cepat."],["Komunikasi dan konflik","Mempengaruhi koordinasi dan kualitas keputusan.","Perbedaan pendapat dapat memperbaiki keputusan jika dibahas secara terbuka dan sopan."]])+P("Manajer sebaiknya tidak langsung menyimpulkan bahwa masalah kinerja disebabkan oleh sikap buruk. Periksa juga kejelasan tugas, beban kerja, keterampilan, alat, insentif, dan cara komunikasi.")),
C("3. Budaya organisasi dan keselarasan nilai",P("<b>Budaya organisasi (organizational culture)</b> adalah nilai, keyakinan, dan kebiasaan bersama yang memengaruhi cara orang bekerja. Budaya dapat terlihat dari hal-hal yang dihargai, perilaku yang ditoleransi, cara pemimpin mengambil keputusan, dan bagaimana kesalahan ditangani.")+T(["Unsur budaya","Contoh","Dampak strategis"],[["Nilai yang dinyatakan","Perusahaan menyatakan bahwa kualitas penting.","Nilai perlu didukung tindakan nyata, bukan hanya slogan."],["Kebiasaan sehari-hari","Tim selalu memeriksa kualitas sebelum produk dikirim.","Membantu menjaga mutu dan kepercayaan pelanggan."],["Sikap terhadap kesalahan","Kesalahan dilaporkan dan dianalisis tanpa menutupi fakta.","Mendukung pembelajaran dan perbaikan proses."],["Sikap terhadap ide baru","Karyawan boleh mengusulkan dan menguji ide secara terukur.","Membantu inovasi dan penyesuaian strategi."]])+P("Keselarasan nilai dan aturan berarti keputusan, sistem penghargaan, prosedur, dan perilaku pimpinan tidak bertentangan dengan nilai yang diumumkan. Jika perusahaan mengaku mengutamakan keselamatan tetapi memberi bonus hanya berdasarkan kecepatan produksi, karyawan dapat terdorong mengabaikan keselamatan.")),
C("4. Gaya kepemimpinan dan perbedaannya dengan manajemen",P("<b>Kepemimpinan (leadership)</b> terutama berkaitan dengan memberi arah, memengaruhi, dan membangun dukungan. <b>Manajemen (management)</b> lebih menekankan perencanaan, pengorganisasian, penganggaran, dan pengawasan. Keduanya saling dibutuhkan; pemimpin yang baik tetap perlu mengelola pelaksanaan secara teratur.")+T(["Gaya atau pendekatan","Ciri utama","Kapan dapat membantu","Risiko yang perlu dijaga"],[["Direktif","Pemimpin memberi instruksi dan batas yang jelas.","Situasi darurat, pekerjaan berisiko tinggi, atau tim belum berpengalaman.","Terlalu banyak kontrol dapat mengurangi inisiatif."],["Partisipatif","Karyawan dilibatkan dalam diskusi dan keputusan.","Masalah membutuhkan informasi dan keahlian dari banyak orang.","Diskusi bisa lambat jika keputusan harus segera diambil."],["Delegatif","Wewenang diberikan kepada orang yang mampu dan siap.","Tim berpengalaman dan tanggung jawab sudah jelas.","Delegasi tanpa arahan dan tindak lanjut dapat menimbulkan kebingungan."],["Transformasional","Pemimpin mengomunikasikan visi dan mendorong perubahan.","Organisasi perlu inovasi atau pembaruan besar.","Visi besar harus disertai rencana, sumber daya, dan kontrol yang memadai."]])+P("Tidak ada satu gaya yang selalu paling tepat. Pilihan perlu mempertimbangkan tujuan, tingkat risiko, kemampuan tim, budaya, dan situasi yang sedang dihadapi.")),
C("5. Kecerdasan emosional (emotional intelligence)",P("<b>Kecerdasan emosional</b> adalah kemampuan mengenali dan mengelola emosi diri serta memahami emosi orang lain. Dalam kepemimpinan, kemampuan ini membantu seseorang berkomunikasi dengan baik, menghadapi konflik, dan merespons tekanan tanpa langsung bertindak impulsif.")+UL(["Kesadaran diri: mengenali emosi, kekuatan, dan keterbatasan diri.","Pengelolaan diri: mengendalikan reaksi dan tetap mempertimbangkan fakta saat tertekan.","Kesadaran sosial: memahami sudut pandang dan kebutuhan orang lain.","Pengelolaan hubungan: mendengarkan, memberi umpan balik, menyelesaikan konflik, dan membangun kerja sama."])+CALL("Contoh: ketika tim gagal mencapai target, pemimpin yang mampu mengelola emosi tidak langsung menyalahkan anggota. Ia mencari penyebab, mendengarkan kendala, lalu menyepakati perbaikan dan tanggung jawab.")),
C("6. Organisasi pembelajar dan inovasi",P("<b>Organisasi pembelajar (learning organization)</b> adalah organisasi yang mendorong orang untuk belajar, berbagi pengetahuan, mengevaluasi pengalaman, dan memperbaiki cara kerja. Henry membahas peran pemimpin dalam membangun lingkungan yang memungkinkan orang mengembangkan kemampuan dan menanggapi peluang.")+UL(["Berbagi pengetahuan antartim, bukan menyimpan informasi hanya pada satu orang.","Melakukan evaluasi setelah proyek untuk mengetahui apa yang berhasil dan apa yang perlu diperbaiki.","Memberi ruang untuk menguji ide baru dalam skala terkendali.","Menganggap kesalahan yang dilaporkan dengan jujur sebagai sumber pembelajaran, sambil tetap meminta pertanggungjawaban atas kelalaian atau pelanggaran.","Menghubungkan pelatihan dan pembelajaran dengan kebutuhan strategi."])+P("Inovasi tidak berarti mencoba semua ide tanpa perhitungan. Ide perlu dinilai dari manfaat, biaya, risiko, kepatuhan, dan kesesuaiannya dengan strategi.")),
C("7. Kepemimpinan narsistik dan risiko kepemimpinan",P("Henry membahas kemungkinan manfaat dan bahaya pemimpin narsistik. Secara sederhana, pemimpin dengan kebutuhan kuat akan pengakuan atau keyakinan berlebihan pada dirinya dapat terlihat percaya diri dan berani mengambil keputusan, tetapi juga berisiko mengabaikan kritik atau pendapat orang lain.")+T(["Potensi manfaat","Risiko","Pengendalian yang membantu"],[["Percaya diri dan berani menyampaikan visi.","Terlalu yakin pada keputusan sendiri.","Minta analisis independen dan uji asumsi utama."],["Berani mendorong perubahan.","Mengabaikan masukan atau kritik.","Sediakan saluran pelaporan dan diskusi yang aman."],["Mampu menarik perhatian pada tujuan.","Mengutamakan citra pribadi daripada kepentingan organisasi.","Gunakan ukuran kinerja yang seimbang dan pengawasan tata kelola."],["Dapat bertindak cepat dalam situasi dinamis.","Mengambil risiko berlebihan atau membungkam perbedaan pendapat.","Tetapkan batas wewenang, manajemen risiko, dan proses persetujuan." ]])+P("Penilaian pemimpin sebaiknya berdasarkan perilaku dan dampaknya, bukan sekadar karisma atau kemampuan berbicara. Tata kelola, transparansi, dan ruang untuk berbeda pendapat membantu mengurangi risiko keputusan yang terlalu bergantung pada satu orang.")),
C("8. Budaya dan kepemimpinan lintas budaya",P("Latar budaya dapat memengaruhi cara orang menyampaikan pendapat, memandang wewenang, bekerja dalam tim, dan merespons konflik. Pemimpin perlu menghindari anggapan bahwa semua orang memiliki kebiasaan komunikasi yang sama.")+UL(["Jelaskan tujuan dan harapan kerja secara eksplisit.","Tanyakan bagaimana anggota tim memahami keputusan; jangan hanya mengandalkan dugaan.","Pilih cara memberi umpan balik yang jelas dan tetap menghormati orang lain.","Pastikan perbedaan budaya tidak dijadikan alasan untuk melakukan diskriminasi atau mengabaikan standar etika."])+P("Contoh: dalam tim lintas negara, sebagian anggota mungkin nyaman menyampaikan ketidaksetujuan secara langsung, sedangkan yang lain lebih memilih diskusi pribadi. Pemimpin dapat menyediakan lebih dari satu cara untuk menyampaikan masukan.")),
C("9. Kepemimpinan saat perubahan strategis",P("Ketika strategi berubah, karyawan mungkin khawatir tentang kemampuan, beban kerja, status, atau masa depan pekerjaan. Pemimpin perlu menjelaskan alasan perubahan dan membantu orang memahami apa yang akan berubah dalam pekerjaan mereka.")+UL(["Jelaskan alasan perubahan dengan data dan bahasa yang mudah dipahami.","Dengarkan kekhawatiran dan identifikasi kebutuhan pelatihan atau dukungan.","Libatkan orang yang terdampak dalam perencanaan pelaksanaan bila memungkinkan.","Pastikan sumber daya, tanggung jawab, dan jadwal realistis.","Pantau dampak perubahan, termasuk kualitas, beban kerja, etika, dan risiko yang muncul."])+CALL("Perubahan bukan hanya mengumumkan keputusan. Perubahan perlu diterjemahkan menjadi tindakan, didukung orang yang menjalankannya, dan dievaluasi untuk memastikan hasilnya sesuai tujuan.")),
C("10. Contoh kasus: perubahan sistem kerja",P("Sebuah perusahaan mengganti proses manual dengan sistem digital. Sebagian karyawan mendukung, tetapi sebagian lain khawatir akan kesulitan menggunakan sistem atau kehilangan peran.")+UL(["Perilaku individu: identifikasi keterampilan dan kekhawatiran karyawan tanpa memberi label malas atau menolak perubahan terlalu cepat.","Perilaku kelompok: bentuk ruang tanya jawab dan saluran berbagi solusi antarkaryawan.","Budaya: dorong pelaporan masalah dan pembelajaran, bukan menyembunyikan kesalahan.","Kepemimpinan: jelaskan alasan perubahan, dengarkan masukan, dan tetapkan prioritas yang jelas.","Kecerdasan emosional: tanggapi kekhawatiran secara tenang serta berikan umpan balik yang menghormati orang.","Risiko: pantau gangguan operasi, keamanan data, beban kerja, dan kemungkinan kesalahan selama masa transisi."])+P("Keberhasilan tidak cukup diukur dari sistem yang sudah aktif. Perusahaan juga perlu melihat apakah karyawan mampu menggunakannya, proses berjalan baik, dan risiko terkendali.")),
C("11. Kesalahan umum dalam kepemimpinan dan budaya",UL(["Menganggap semua masalah kinerja berasal dari sikap karyawan tanpa memeriksa proses dan sumber daya.","Mengumumkan nilai organisasi tetapi memberi penghargaan pada perilaku yang bertentangan dengan nilai tersebut.","Menganggap satu gaya kepemimpinan cocok untuk semua keadaan.","Mengabaikan masukan karena pemimpin merasa paling memahami masalah.","Mendorong inovasi tanpa menilai biaya, risiko, dan kepatuhan.","Menganggap diam berarti setuju, padahal anggota tim mungkin takut menyampaikan pendapat.","Mengumumkan perubahan tanpa komunikasi, pelatihan, dan dukungan yang memadai."])),
C("12. Ringkasan inti",UL(["Perilaku individu dan kelompok memengaruhi cara strategi dijalankan.","Budaya organisasi membentuk kebiasaan dan perilaku yang dianggap wajar.","Nilai, aturan, insentif, dan tindakan pimpinan perlu selaras.","Kepemimpinan memberi arah dan dukungan; manajemen membantu mengatur pelaksanaan.","Kecerdasan emosional membantu pemimpin mengelola diri, memahami orang lain, dan menyelesaikan konflik.","Organisasi pembelajar mendukung berbagi pengetahuan dan perbaikan berkelanjutan.","Pemimpin yang percaya diri juga membutuhkan kritik, tata kelola, dan pengawasan untuk mengurangi risiko.","Perubahan strategis perlu komunikasi, keterlibatan, sumber daya, dan evaluasi."]))
]};

CONTENT.s12={kicker:'Sesi 12 · Henry, Organizational Structures and Strategic Change',title:'Strategic Change and Organisational Transformation',desc:'Sesi ini membahas alasan organisasi perlu berubah, model perubahan termasuk model delapan langkah Kotter, resistensi, peran change agents, dukungan bagi karyawan, pembaruan strategi, dan risiko perubahan. Tujuan sesuai RPKPS: menyusun peta jalan perubahan strategis.',materi:[
C("1. Apa itu perubahan strategis?",P("<b>Perubahan strategis (strategic change)</b> adalah perubahan penting pada arah, cara kerja, kemampuan, struktur, atau budaya organisasi untuk merespons kondisi baru dan mencapai tujuan jangka panjang. Perubahan tidak selalu berarti mengganti semuanya; perubahan bisa dilakukan pada bagian tertentu atau menyentuh organisasi secara luas.")+T(["Jenis perubahan","Makna","Contoh"],[["Perubahan bertahap","Perbaikan kecil yang dilakukan secara berkelanjutan.","Memperbaiki proses layanan pelanggan sedikit demi sedikit."],["Perubahan besar","Perubahan luas pada cara organisasi beroperasi atau bersaing.","Mengganti proses manual dengan sistem digital yang terintegrasi."],["Pembaruan strategis (strategic renewal)","Meninjau dan memperbarui strategi agar tetap relevan.","Perusahaan toko fisik mengembangkan kanal penjualan daring."]])+P("Perubahan perlu dikaitkan dengan masalah atau peluang yang jelas. Mengubah sistem hanya karena sedang tren, tanpa tujuan dan analisis, dapat menambah biaya tanpa memperbaiki kinerja.")),
C("2. Pendorong perubahan (drivers of change)",P("Perubahan biasanya dipicu oleh faktor dari luar maupun dari dalam organisasi. Mengenali pendorongnya membantu organisasi menjelaskan mengapa perubahan diperlukan dan apa yang akan terjadi jika tidak bertindak.")+T(["Pendorong","Contoh","Pertanyaan yang perlu dijawab"],[["Teknologi","Otomatisasi, AI, sistem digital.","Kemampuan dan proses apa yang perlu diperbarui?"],["Pelanggan dan pasar","Perubahan preferensi, kanal pembelian, ekspektasi layanan.","Apa yang kini lebih dibutuhkan pelanggan?"],["Persaingan","Pesaing menawarkan harga, mutu, atau layanan baru.","Bagaimana perusahaan tetap relevan?"],["Regulasi dan risiko","Aturan baru, keamanan data, tuntutan kepatuhan.","Kontrol dan tanggung jawab apa yang harus diubah?"],["Kinerja internal","Biaya meningkat, proses lambat, mutu menurun.","Apa penyebab utama masalahnya?"],["Perubahan sumber daya","Kekurangan keterampilan, perubahan struktur, atau kapasitas.","Orang dan kemampuan apa yang harus dikembangkan?"]])+P("Pendorong perubahan sebaiknya didukung bukti, misalnya data pelanggan, biaya, tingkat kesalahan, perubahan aturan, atau analisis risiko.")),
C("3. Model perubahan Kotter: delapan langkah",P("John Kotter mengembangkan model delapan langkah yang membantu organisasi memimpin perubahan. Model ini bisa menjadi panduan praktis, tetapi pelaksanaannya perlu disesuaikan dengan ukuran organisasi, budaya, dan urgensi perubahan.")+T(["Langkah","Penjelasan sederhana","Contoh penerapan"],[["1. Bangun rasa urgensi","Jelaskan mengapa perubahan diperlukan sekarang.","Tunjukkan data keterlambatan layanan dan keluhan pelanggan."],["2. Bentuk koalisi penggerak","Libatkan orang berpengaruh dari bagian yang relevan.","Bentuk tim yang terdiri dari operasi, TI, keuangan, dan pengguna."],["3. Susun visi dan arah","Jelaskan keadaan yang ingin dicapai.","Menargetkan proses pesanan yang lebih cepat dan dapat dilacak."],["4. Komunikasikan visi","Ulangi pesan melalui cara yang mudah dipahami.","Sesi tanya jawab, pelatihan, dan pembaruan berkala."],["5. Berdayakan tindakan","Hilangkan hambatan dan sediakan kemampuan serta wewenang.","Berikan akses sistem dan pelatihan yang dibutuhkan."],["6. Ciptakan kemenangan jangka pendek","Tunjukkan hasil awal yang nyata.","Uji coba pada satu cabang dan laporkan hasilnya."],["7. Pertahankan momentum","Gunakan pembelajaran awal untuk memperluas perbaikan.","Perbaiki masalah uji coba sebelum penerapan lebih luas."],["8. Tanamkan perubahan","Jadikan cara baru bagian dari proses dan budaya kerja.","Perbarui SOP, pelatihan pegawai baru, dan ukuran kinerja."]])+CALL("Jangan hanya mengumumkan perubahan. Model ini menekankan urgensi, dukungan, penghilangan hambatan, hasil awal, dan penanaman cara kerja baru.")),
C("4. Resistensi terhadap perubahan",P("<b>Resistensi (resistance to change)</b> adalah penolakan atau keraguan terhadap perubahan. Resistensi tidak selalu berarti karyawan tidak mau bekerja sama; bisa jadi mereka melihat risiko atau masalah yang belum dipertimbangkan oleh manajemen.")+T(["Penyebab","Contoh","Respons yang dapat dilakukan"],[["Takut kehilangan pekerjaan atau status","Karyawan khawatir otomatisasi mengurangi perannya.","Jelaskan dampak yang diketahui dan rencana pengembangan keterampilan."],["Kurang memahami alasan","Karyawan hanya diberi tahu bahwa sistem akan diganti.","Jelaskan masalah yang ingin diselesaikan dan manfaat yang diharapkan."],["Tidak percaya pada pimpinan","Perubahan sebelumnya sering diumumkan tetapi tidak ditindaklanjuti.","Tepati komitmen, laporkan perkembangan, dan akui kendala."],["Keterampilan belum cukup","Pegawai belum terbiasa menggunakan aplikasi baru.","Sediakan pelatihan, panduan, dan pendampingan."],["Beban kerja meningkat","Pekerjaan lama dan baru harus dilakukan bersamaan.","Atur masa transisi, kapasitas, dan prioritas secara realistis."],["Perubahan mengganggu rutinitas","Cara kerja baru terasa tidak praktis.","Libatkan pengguna untuk menguji dan memperbaiki proses."]])+P("Cara mengatasi resistensi perlu disesuaikan dengan penyebabnya. Komunikasi saja tidak cukup jika masalah utamanya adalah pelatihan yang kurang, sistem yang buruk, atau beban kerja yang tidak realistis.")),
C("5. Change agents: siapa yang menggerakkan perubahan?",P("<b>Change agent</b> adalah orang atau kelompok yang membantu merencanakan, menggerakkan, atau mendukung perubahan. Mereka tidak harus selalu berasal dari manajemen puncak; pegawai yang dipercaya dan memahami proses juga dapat berperan penting.")+UL(["Sponsor atau pimpinan senior: memberi arah, dukungan, sumber daya, dan keputusan penting.","Manajer: menerjemahkan arah perubahan menjadi rencana kerja dan tanggung jawab.","Change champion atau agen perubahan: menjelaskan perubahan, mendengar umpan balik, dan membantu rekan kerja.","Tim proyek atau ahli: merancang proses, sistem, pelatihan, dan pengukuran hasil.","Karyawan pengguna: menguji solusi dan menyampaikan kendala nyata dalam pekerjaan."])+P("Agen perubahan perlu memiliki komunikasi yang baik, kredibilitas, pemahaman proses, kemampuan mendengarkan, dan akses untuk menyampaikan masalah kepada pengambil keputusan.")),
C("6. Stres dan dukungan selama perubahan",P("Perubahan dapat meningkatkan stres karena orang harus belajar hal baru, menghadapi ketidakpastian, atau menjalankan tugas tambahan. Organisasi perlu menyediakan dukungan agar perubahan dapat berlangsung tanpa mengabaikan kesehatan, keselamatan, dan kualitas kerja.")+UL(["Berikan informasi yang jelas tentang jadwal, dampak, dan hal yang masih belum pasti.","Sediakan pelatihan, panduan langkah demi langkah, dan bantuan ketika masalah muncul.","Atur beban kerja serta masa transisi; jangan menganggap semua orang bisa belajar dengan kecepatan sama.","Sediakan saluran umpan balik yang aman dan tindak lanjuti masalah yang dilaporkan.","Pantau lembur, kesalahan, absensi, keluhan, dan kualitas layanan sebagai tanda adanya beban yang berlebihan."])+P("Dukungan bukan berarti menghilangkan semua tuntutan. Tujuannya adalah memberi kondisi dan sumber daya yang masuk akal agar orang mampu memenuhi tuntutan perubahan.")),
C("7. Pembaruan strategis (strategic renewal)",P("<b>Strategic renewal</b> adalah proses meninjau dan memperbarui strategi, kemampuan, atau cara kerja agar organisasi tetap sesuai dengan lingkungan yang berubah. Pembaruan bisa dilakukan sebelum kinerja memburuk, bukan hanya setelah krisis terjadi.")+T(["Tahap","Pertanyaan utama","Hasil yang diharapkan"],[["Diagnosis","Apa yang berubah dan mengapa strategi lama perlu ditinjau?","Masalah, peluang, dan bukti yang jelas."],["Pilihan arah","Apa yang perlu dipertahankan, dihentikan, atau dikembangkan?","Prioritas strategis yang realistis."],["Kesiapan organisasi","Apakah orang, proses, teknologi, dan dana tersedia?","Daftar kesenjangan kemampuan dan sumber daya."],["Pelaksanaan","Siapa melakukan apa, kapan, dan dengan dukungan apa?","Peta jalan perubahan dengan pemilik tugas dan jadwal."],["Evaluasi dan penyesuaian","Apakah perubahan menghasilkan manfaat yang diharapkan?","Perbaikan berdasarkan hasil dan risiko yang ditemukan."]])+P("Pembaruan yang baik tidak sekadar mengikuti tren. Keputusan perlu mempertimbangkan pelanggan, kemampuan organisasi, biaya, risiko, dan tujuan jangka panjang.")),
C("8. Risiko perubahan dan pengendaliannya",P("Perubahan dapat gagal atau menimbulkan dampak yang tidak diinginkan jika perencanaan dan pengendaliannya lemah. Risiko harus diidentifikasi sejak awal dan ditinjau selama pelaksanaan.")+T(["Risiko","Dampak yang mungkin terjadi","Cara mengurangi risiko"],[["Tujuan tidak jelas","Tim bekerja dengan pemahaman yang berbeda.","Tetapkan hasil, ruang lingkup, pemilik tugas, dan ukuran keberhasilan."],["Keterlambatan dan biaya membengkak","Operasi terganggu dan anggaran terlampaui.","Gunakan tahapan, jadwal realistis, dan pemantauan biaya."],["Gangguan operasional","Layanan atau produksi menurun selama transisi.","Uji coba, rencana transisi, dan prosedur pemulihan."],["Keterampilan tidak memadai","Kesalahan meningkat dan sistem tidak digunakan dengan benar.","Pelatihan, pendampingan, dan pengujian kompetensi."],["Keamanan dan kepatuhan","Data bocor atau aturan tidak dipenuhi.","Penilaian risiko, kontrol akses, pengujian, dan pemantauan."],["Penolakan pengguna","Cara kerja baru tidak digunakan secara konsisten.","Libatkan pengguna, tanggapi umpan balik, dan ukur tingkat adopsi."],["Manfaat tidak tercapai","Perubahan selesai tetapi hasil bisnis tidak membaik.","Tetapkan baseline, KPI, target manfaat, dan evaluasi pascaimplementasi."]])+P("Risiko harus memiliki penanggung jawab, kemungkinan dan dampak yang dinilai, langkah mitigasi, serta rencana respons jika risiko benar-benar terjadi.")),
C("9. Membuat peta jalan perubahan strategis",P("RPKPS meminta mahasiswa mampu menyusun <b>strategic-change roadmap</b>, yaitu rencana bertahap yang menjelaskan tujuan, kegiatan, penanggung jawab, waktu, dukungan, dan ukuran keberhasilan perubahan.")+T(["Bagian roadmap","Isi yang perlu ditulis"],[["Alasan dan tujuan","Masalah atau peluang yang mendorong perubahan serta hasil yang dituju."],["Cakupan","Bagian proses, unit, sistem, atau orang yang terdampak."],["Tahapan dan jadwal","Diagnosis, desain, uji coba, penerapan, dan evaluasi."],["Pemilik dan pihak terkait","Sponsor, manajer, agen perubahan, tim proyek, dan pengguna."],["Sumber daya dan dukungan","Anggaran, waktu, teknologi, pelatihan, dan komunikasi."],["Risiko dan mitigasi","Risiko utama, pemilik risiko, tindakan pencegahan, dan rencana cadangan."],["Ukuran keberhasilan","Baseline, target, KPI adopsi, mutu, waktu, biaya, dan manfaat."],["Tinjauan dan penyesuaian","Jadwal mengevaluasi hasil serta cara mengubah rencana jika asumsi tidak terbukti."]])+P("Roadmap sebaiknya realistis dan dapat diperbarui. Perubahan besar sering memerlukan uji coba dan penyesuaian berdasarkan umpan balik, bukan sekadar mengikuti jadwal awal tanpa evaluasi.")),
C("10. Contoh kasus: digitalisasi proses layanan",P("Sebuah perusahaan jasa ingin mengganti pencatatan keluhan pelanggan yang tersebar di beberapa file dengan satu sistem terintegrasi. Keluhan sering terlambat ditangani dan manajemen sulit melihat status penyelesaiannya.")+UL(["Pendorong perubahan: data menunjukkan keluhan terlambat, informasi ganda, dan sulitnya memantau penanggung jawab.","Visi: setiap keluhan tercatat, memiliki pemilik, dan dapat dipantau sampai selesai.","Koalisi perubahan: perwakilan layanan pelanggan, operasi, TI, keamanan informasi, dan manajemen.","Uji coba: terapkan sistem pada satu unit, latih pengguna, dan ukur waktu penyelesaian serta kesalahan data.","Resistensi: dengarkan kekhawatiran tentang beban input, lalu sederhanakan formulir dan berikan pelatihan.","Risiko: gangguan layanan, akses data tidak tepat, dan pengguna kembali ke file lama; mitigasi melalui kontrol akses, dukungan teknis, serta prosedur transisi.","Penanaman perubahan: perbarui SOP, pelatihan pegawai baru, pelaporan KPI, dan evaluasi berkala."])+P("Ukuran keberhasilan tidak hanya apakah sistem sudah aktif, tetapi apakah keluhan lebih cepat selesai, data lebih akurat, pengguna mengadopsi sistem, dan risiko terkendali.")),
C("11. Kesalahan umum dalam perubahan strategis",UL(["Memulai perubahan tanpa menjelaskan masalah dan manfaat yang ingin dicapai.","Menganggap komunikasi satu kali sudah cukup untuk membuat semua orang memahami perubahan.","Mengabaikan karyawan yang akan memakai proses atau sistem baru setiap hari.","Tidak menyediakan waktu, pelatihan, atau dukungan selama transisi.","Mengukur keberhasilan hanya dari proyek selesai, bukan dari manfaat yang benar-benar tercapai.","Tidak menyiapkan mitigasi untuk risiko operasional, keamanan, kepatuhan, dan biaya.","Memaksa rencana awal meskipun hasil uji coba menunjukkan asumsi yang keliru."])),
C("12. Ringkasan inti",UL(["Perubahan strategis membantu organisasi menanggapi perubahan pasar, teknologi, regulasi, dan masalah internal.","Model Kotter memiliki delapan langkah dari membangun urgensi sampai menanamkan perubahan dalam budaya.","Resistensi dapat berasal dari ketidakpastian, kurangnya keterampilan, beban kerja, atau rendahnya kepercayaan.","Change agents membantu menghubungkan arah pimpinan dengan pengalaman orang yang terdampak.","Pelatihan, komunikasi, dan dukungan yang realistis membantu mengelola stres selama perubahan.","Strategic renewal meninjau dan memperbarui strategi serta kemampuan organisasi secara terarah.","Roadmap perubahan perlu mencakup tujuan, tahapan, pemilik tugas, sumber daya, risiko, KPI, dan evaluasi.","Keberhasilan dinilai dari manfaat dan adopsi nyata, bukan hanya selesainya proyek."]))
]};

const Q12=[
["Manakah contoh pendorong perubahan strategis dari lingkungan eksternal?",["Perubahan regulasi atau teknologi pasar", "Perubahan warna ruang rapat saja", "Jadwal makan siang pribadi", "Penambahan label pada map"],0,"Regulasi, teknologi, pelanggan, dan persaingan dapat memaksa organisasi meninjau strateginya."],
["Apa langkah awal yang ditekankan dalam model perubahan Kotter?",["Menanamkan perubahan ke budaya", "Membangun rasa urgensi", "Menghentikan komunikasi", "Mengukur hasil akhir saja"],1,"Kotter memulai dengan membangun urgensi agar orang memahami mengapa perubahan diperlukan."],
["Mengapa resistensi karyawan perlu dianalisis, bukan langsung dihukum?",["Resistensi dapat menunjukkan kekhawatiran, kurang keterampilan, atau hambatan nyata", "Resistensi selalu berarti sabotase", "Karyawan tidak terdampak oleh perubahan", "Hukuman selalu mempercepat adopsi"],0,"Mencari penyebab resistensi membantu organisasi memilih komunikasi, pelatihan, dukungan, atau perbaikan proses yang tepat."],
["Apa fungsi change agent?",["Menggantikan semua pemimpin", "Membantu menjelaskan perubahan, mendengar umpan balik, dan mengatasi hambatan penerapan", "Menghentikan evaluasi", "Menyembunyikan risiko dari karyawan"],1,"Change agent menjembatani tujuan perubahan dengan orang yang menjalankannya."],
["Apa indikator yang lebih kuat untuk menilai keberhasilan perubahan?",["Proyek selesai sesuai jadwal saja", "Manfaat tercapai, pengguna mengadopsi cara baru, dan risiko terkendali", "Jumlah rapat bertambah", "Dokumen rencana menjadi panjang"],1,"Keberhasilan perlu dilihat dari adopsi dan hasil nyata, bukan hanya penyelesaian aktivitas proyek." ]];const E12=[
["Apa perbedaan perubahan bertahap dan perubahan strategis berskala besar? Berikan contoh.","Perubahan bertahap berupa perbaikan kecil yang berkelanjutan, sedangkan perubahan berskala besar mengubah banyak proses atau arah organisasi. Contoh bertahap: memperbaiki formulir layanan; contoh besar: mengganti proses manual dengan sistem terintegrasi."],
["Sebutkan empat pendorong perubahan dan jelaskan bagaimana organisasi mengidentifikasinya.","Pendorong dapat berasal dari teknologi, pelanggan/pasar, persaingan, regulasi, kinerja internal, atau sumber daya. Organisasi menilainya melalui data pelanggan, biaya, keluhan, perubahan aturan, analisis pesaing, dan evaluasi kemampuan."],
["Jelaskan delapan langkah perubahan Kotter secara ringkas.","Bangun urgensi; bentuk koalisi penggerak; susun visi; komunikasikan visi; berdayakan tindakan dengan menghilangkan hambatan; ciptakan kemenangan jangka pendek; pertahankan momentum; dan tanamkan perubahan dalam budaya serta proses."],
["Mengapa resistensi terhadap perubahan tidak selalu berarti karyawan menolak bekerja sama?", "Resistensi dapat menunjukkan kekhawatiran yang nyata, seperti kurangnya keterampilan, ketidakjelasan alasan, beban kerja, atau risiko sistem. Manajemen perlu mencari penyebab dan memberi respons yang sesuai."],
["Apa peran change agent dalam perubahan strategis?", "Change agent membantu menjelaskan tujuan, mendengarkan umpan balik, mendukung penerapan, menghubungkan pengguna dengan pengambil keputusan, dan membantu mengidentifikasi hambatan."],
["Apa saja yang sebaiknya dimasukkan dalam strategic-change roadmap?", "Tujuan dan alasan, cakupan, tahapan dan jadwal, pemilik tugas, pihak terkait, sumber daya dan pelatihan, komunikasi, risiko dan mitigasi, KPI, serta jadwal evaluasi."],
["Sebuah perusahaan mengimplementasikan sistem baru, tetapi karyawan masih memakai file lama. Apa yang perlu diperiksa dan dilakukan?", "Periksa apakah sistem mudah digunakan, pelatihan cukup, proses baru lebih jelas, dan hambatan teknis telah diatasi. Libatkan pengguna, sediakan dukungan, tetapkan SOP dan tanggung jawab, serta ukur adopsi dan kualitas hasil."],
["Sebutkan tiga risiko perubahan strategis dan cara menguranginya.", "Gangguan operasi dapat dikurangi dengan uji coba dan rencana transisi; kekurangan keterampilan dengan pelatihan; pembengkakan biaya dengan tahapan dan pemantauan; risiko data dengan kontrol akses dan pengujian."],
["Bagaimana organisasi menilai apakah perubahan benar-benar berhasil?", "Bandingkan kondisi awal dengan target dan hasil aktual, gunakan KPI operasional dan manfaat bisnis, periksa tingkat adopsi pengguna, mutu, biaya, waktu, serta risiko, lalu lakukan perbaikan jika hasil belum tercapai."]];

const Q9=[
["Apa tujuan utama desain organisasi?",["Menambah sebanyak mungkin lapisan jabatan", "Membagi pekerjaan dan mengoordinasikan tugas agar strategi dapat dijalankan", "Menghilangkan semua prosedur", "Memusatkan seluruh pekerjaan pada satu orang"],1,"Struktur membagi pekerjaan, wewenang, dan koordinasi untuk mendukung pelaksanaan strategi."],
["Struktur mana yang mengelompokkan orang berdasarkan fungsi seperti pemasaran, keuangan, dan SDM?",["Divisional", "Matriks", "Fungsional", "Jaringan pemasok"],2,"Struktur fungsional mengelompokkan pekerjaan berdasarkan keahlian atau fungsi."],
["Apa keunggulan utama desentralisasi?",["Semua keputusan harus menunggu kantor pusat", "Unit lokal dapat merespons kondisi setempat dengan lebih cepat", "Tidak diperlukan akuntabilitas", "Semua kebijakan otomatis konsisten"],1,"Desentralisasi memberikan sebagian wewenang kepada unit agar respons bisa lebih cepat, meski koordinasi tetap diperlukan."],
["Apa risiko umum struktur matriks?",["Tidak ada spesialisasi", "Karyawan bisa menghadapi arahan atau prioritas yang bertentangan", "Tidak dapat digunakan untuk proyek", "Selalu menghilangkan koordinasi"],1,"Struktur matriks dapat meningkatkan koordinasi lintas fungsi, tetapi berisiko menimbulkan konflik wewenang."],
["Mengapa staffing penting saat strategi berubah?",["Agar jumlah pegawai selalu bertambah", "Agar organisasi memiliki orang dan keterampilan yang dibutuhkan untuk menjalankan strategi", "Agar pelatihan dapat dihapus", "Agar seluruh keputusan dipindahkan ke HR"],1,"Strategi baru membutuhkan keterampilan dan kapasitas yang sesuai; organisasi perlu merekrut, melatih, atau menata ulang penempatan." ]];const E9=[["Mengapa strategi dan struktur organisasi harus sesuai? Berikan contoh.","Struktur membagi pekerjaan, wewenang, dan koordinasi. Jika tidak sesuai dengan strategi, keputusan dan pelaksanaan dapat terhambat. Contohnya, perusahaan dengan banyak produk mungkin membutuhkan struktur divisional agar tanggung jawab tiap lini lebih jelas."],["Bandingkan struktur fungsional, divisional, dan matriks beserta satu kelemahannya masing-masing.","Fungsional mengelompokkan orang berdasarkan keahlian; kelemahannya koordinasi antarfungsi dapat lemah. Divisional membagi organisasi berdasarkan produk, wilayah, atau pelanggan; kelemahannya fungsi bisa terduplikasi. Matriks menggabungkan tanggung jawab fungsi dan proyek; kelemahannya dapat terjadi konflik prioritas atau arahan."],["Apa perbedaan sentralisasi dan desentralisasi? Kapan masing-masing bermanfaat?","Sentralisasi memusatkan keputusan di pimpinan pusat dan membantu konsistensi serta kontrol. Desentralisasi memberi wewenang ke unit atau cabang dan membantu respons cepat terhadap kondisi lokal. Pilihan bergantung pada kebutuhan konsistensi, risiko, dan kecepatan respons."],["Apa yang dimaksud staffing dan kapabilitas organisasi? Mengapa keduanya penting ketika strategi berubah?","Staffing memastikan orang dan keterampilan yang tepat tersedia. Kapabilitas adalah kemampuan organisasi menggabungkan orang, proses, pengetahuan, dan teknologi untuk melakukan pekerjaan secara konsisten. Strategi baru bisa gagal jika organisasi tidak memiliki orang atau kapabilitas yang dibutuhkan."],["Sebuah perusahaan ritel akan membuka kanal daring. Jelaskan perubahan struktur, wewenang, staffing, dan koordinasi yang perlu dipertimbangkan.","Perusahaan perlu menentukan penanggung jawab kanal daring dan hubungannya dengan toko, menetapkan keputusan yang harus dipusatkan seperti keamanan data, memberi ruang keputusan lokal yang sesuai, merekrut atau melatih staf digital, dan mengintegrasikan stok, pembayaran, gudang, pengiriman, serta layanan pelanggan."]];
const Q8=[
["Apa pertanyaan utama corporate strategy?",["Bagaimana satu produk dipromosikan", "Bisnis dan industri apa yang sebaiknya dimasuki serta bagaimana sumber daya dibagi", "Bagaimana mengatur jadwal karyawan harian", "Bagaimana menghitung biaya produksi satu unit"],1,"Corporate strategy menentukan cakupan bisnis perusahaan dan alokasi sumber daya antarbisnis."],
["Apa contoh related diversification?",["Produsen susu mengembangkan yoghurt dengan memakai kemampuan pengolahan dan distribusi yang sama", "Perusahaan tekstil membeli tambang batu bara tanpa hubungan kemampuan", "Restoran mengganti seragam pegawai", "Perusahaan menutup seluruh kegiatan pemasaran"],0,"Related diversification memanfaatkan hubungan nyata, misalnya teknologi, pelanggan, distribusi, atau kemampuan bersama."],
["Apa makna better-off test?",["Apakah perusahaan baru memiliki gedung lebih besar", "Apakah bisnis yang ada dan bisnis baru menjadi lebih kuat jika dimiliki bersama", "Apakah semua bisnis mempunyai nama yang sama", "Apakah perusahaan memiliki banyak karyawan"],1,"Better-off test menilai apakah kepemilikan bersama menciptakan nilai tambah bagi bisnis-bisnis tersebut."],
["Dalam BCG Matrix, bisnis dengan pangsa relatif tinggi dan pertumbuhan pasar rendah disebut…",["Star", "Question Mark", "Cash Cow", "Dog"],2,"Cash Cow biasanya menghasilkan arus kas pada pasar yang pertumbuhannya rendah."],
["Mengapa sinergi tidak boleh diasumsikan otomatis setelah akuisisi?",["Karena semua akuisisi pasti gagal", "Karena penggabungan bisa menambah biaya koordinasi dan integrasi", "Karena sinergi hanya berlaku pada perusahaan kecil", "Karena sinergi tidak berhubungan dengan sumber daya"],1,"Manfaat gabungan perlu dibandingkan dengan biaya integrasi, koordinasi, dan risiko konflik." ]];const E8=[["Jelaskan perbedaan corporate strategy dan business strategy.","Corporate strategy menentukan bisnis dan industri apa yang dimasuki perusahaan serta pembagian sumber daya antarbisnis. Business strategy menjelaskan cara satu unit bisnis bersaing di pasarnya."],["Bedakan related dan unrelated diversification. Mengapa diversifikasi terkait bisa lebih mudah menghasilkan sinergi?","Related diversification masuk ke bisnis yang memiliki hubungan seperti pelanggan, teknologi, distribusi, atau kemampuan. Unrelated diversification masuk ke bisnis yang hubungannya jauh. Diversifikasi terkait berpotensi berbagi sumber daya atau kemampuan, tetapi sinergi tetap harus dibuktikan."],["Jelaskan tiga kriteria untuk menilai keputusan diversifikasi.","Industry attractiveness: apakah industri menarik; cost of entry: apakah biaya masuk wajar; better-off test: apakah bisnis yang ada dan bisnis baru menjadi lebih kuat jika dimiliki bersama."],["Jelaskan empat kategori BCG Matrix dan keterbatasannya.","Star: pangsa relatif tinggi dan pasar tumbuh cepat; Cash Cow: pangsa tinggi dan pasar tumbuh lambat; Question Mark: pangsa rendah dan pasar tumbuh cepat; Dog: pangsa rendah dan pasar tumbuh lambat. Matriks ini alat bantu, bukan keputusan otomatis, karena tidak langsung menunjukkan seluruh profitabilitas dan sinergi."],["Apa itu corporate parenting dan restrukturisasi portofolio?","Corporate parenting menilai apakah perusahaan induk dapat menambah nilai pada bisnis yang dimiliki. Restrukturisasi mengubah susunan atau cara pengelolaan bisnis, misalnya investasi, turnaround, divestasi, atau penutupan."]];const Q10=[
["Apa yang dimaksud resource allocation?",["Membagi sumber daya seperti anggaran, tenaga kerja, waktu, dan teknologi sesuai prioritas", "Mencatat hanya biaya masa lalu", "Menghapus semua target", "Membagi laba secara sama tanpa melihat strategi"],0,"Alokasi sumber daya menghubungkan sumber daya terbatas dengan prioritas strategis."],
["Apa perbedaan KPI dan target?",["KPI adalah ukuran; target adalah nilai yang ingin dicapai", "KPI adalah anggaran; target adalah pegawai", "Keduanya selalu berarti hal yang sama", "Target hanya digunakan untuk indikator nonkeuangan"],0,"Contoh: KPI adalah waktu penyelesaian keluhan, sedangkan targetnya rata-rata maksimal 24 jam."],
["Perspektif Balanced Scorecard yang mencakup keterampilan dan kemampuan berinovasi adalah…",["Keuangan", "Pelanggan", "Proses internal", "Pembelajaran dan pertumbuhan"],3,"Perspektif pembelajaran dan pertumbuhan mencakup keterampilan, sistem, dan kemampuan organisasi untuk berkembang."],
["Mengapa indikator keuangan dan nonkeuangan sebaiknya dipakai bersama?",["Agar dashboard terlihat lebih penuh", "Karena indikator nonkeuangan membantu menjelaskan faktor yang membentuk hasil keuangan", "Karena indikator keuangan tidak pernah berguna", "Agar perusahaan tidak perlu mengevaluasi strategi"],1,"Indikator keuangan menunjukkan hasil, sedangkan indikator nonkeuangan dapat menunjukkan pendorong hasil tersebut."],
["Penjualan naik tetapi kas menurun. Apa yang sebaiknya diperiksa?",["Hanya jumlah pengikut media sosial", "Piutang, penagihan, persediaan, margin, dan syarat pembayaran", "Warna logo perusahaan", "Jumlah rapat tanpa melihat data"],1,"Penjualan tidak selalu langsung menjadi kas; piutang, stok, diskon, dan biaya dapat menjelaskan penurunan kas." ]];const E10=[
["Apa itu resource allocation dan bagaimana memastikan alokasi sumber daya mendukung strategi?","Resource allocation adalah pembagian anggaran, orang, waktu, dan teknologi ke prioritas. Hubungkan setiap pengeluaran dengan sasaran strategis, bandingkan manfaat dan risiko, lalu tinjau hasilnya secara berkala."],
["Jelaskan perbedaan KPI dan target dengan contoh.","KPI adalah ukuran yang dipantau, sedangkan target adalah nilai yang ingin dicapai. Contoh: KPI waktu penyelesaian keluhan; target rata-rata maksimal 24 jam."],
["Sebutkan empat perspektif Balanced Scorecard dan berikan contoh ukuran tiap perspektif.","Keuangan: margin atau arus kas. Pelanggan: kepuasan atau retensi. Proses internal: waktu siklus atau tingkat kesalahan. Pembelajaran dan pertumbuhan: keterampilan atau inovasi."],
["Mengapa perusahaan perlu menggabungkan indikator keuangan dan nonkeuangan?","Indikator keuangan menunjukkan hasil ekonomi, sedangkan indikator nonkeuangan membantu menjelaskan proses dan faktor yang membentuk hasil tersebut. Menggunakan keduanya memberi gambaran yang lebih lengkap."],
["Bagaimana insentif yang buruk dapat merusak pelaksanaan strategi?","Jika hanya menghargai satu angka, karyawan dapat mengejar angka itu dengan mengorbankan kualitas, margin, pelanggan, atau etika. Gunakan ukuran seimbang dan pantau dampak sampingnya."],
["Penjualan mencapai target, tetapi arus kas menurun. Apa yang perlu diperiksa manajemen?","Periksa penagihan piutang, syarat pembayaran, diskon, margin, persediaan, dan biaya. Penjualan yang tinggi belum tentu menghasilkan kas atau laba yang baik."],
["Jelaskan siklus strategic control.","Tetapkan tujuan dan target, kumpulkan data, bandingkan hasil aktual dengan target, cari akar penyebab selisih, ambil tindakan korektif, lalu tinjau hasil dan asumsi strategi."]];
const Q11=[
["Apa perbedaan utama kepemimpinan dan manajemen?",["Kepemimpinan memberi arah dan membangun pengaruh; manajemen mengatur perencanaan serta pelaksanaan", "Kepemimpinan hanya untuk perusahaan kecil", "Manajemen tidak membutuhkan perencanaan", "Keduanya tidak berhubungan dengan strategi"],0,"Keduanya saling melengkapi: arah dan dukungan perlu disertai pengorganisasian dan pengawasan."],
["Apa contoh ketidaksesuaian budaya dan insentif?",["Perusahaan menyatakan mengutamakan kualitas tetapi bonus hanya didasarkan pada jumlah unit", "Perusahaan melatih pegawai sesuai kebutuhan", "Manajer mendengarkan umpan balik", "Target kualitas diukur dan dihargai"],0,"Karyawan cenderung mengikuti insentif nyata; insentif yang salah dapat mendorong perilaku yang bertentangan dengan nilai perusahaan."],
["Manakah yang termasuk kecerdasan emosional?",["Mengabaikan emosi semua orang", "Mengenali dan mengelola emosi diri serta memahami orang lain", "Menghindari seluruh percakapan sulit", "Mengambil keputusan tanpa mendengar masukan"],1,"Kecerdasan emosional mencakup kesadaran diri, pengelolaan diri, kesadaran sosial, dan pengelolaan hubungan."],
["Apa manfaat organisasi pembelajar?",["Kesalahan tidak pernah dibahas", "Pengetahuan dibagikan dan pengalaman digunakan untuk memperbaiki cara kerja", "Semua keputusan hanya boleh dibuat pimpinan", "Karyawan tidak perlu mengembangkan keterampilan"],1,"Organisasi pembelajar mengembangkan kemampuan melalui berbagi pengetahuan, refleksi, dan perbaikan berkelanjutan."],
["Apa risiko pemimpin yang terlalu narsistik?",["Tidak pernah memiliki visi", "Dapat mengabaikan kritik dan mengambil risiko berlebihan", "Selalu membuat keputusan berdasarkan konsensus", "Tidak mampu berbicara di depan umum"],1,"Keyakinan dan visi dapat membantu, tetapi keyakinan berlebihan dapat melemahkan keterbukaan terhadap kritik dan pengawasan." ]];const E11=[
["Jelaskan bagaimana perilaku individu dan kelompok memengaruhi pelaksanaan strategi.","Motivasi, sikap, keterampilan, norma kelompok, komunikasi, dan konflik memengaruhi cara pekerjaan dilakukan. Manajer perlu memeriksa faktor manusia sekaligus kejelasan tugas, proses, alat, dan sumber daya."],
["Apa itu budaya organisasi dan mengapa harus selaras dengan aturan serta insentif?","Budaya adalah nilai dan kebiasaan bersama yang membentuk perilaku kerja. Jika nilai yang diumumkan bertentangan dengan aturan atau insentif, karyawan dapat mengikuti insentif yang nyata, bukan slogan perusahaan."],
["Bedakan kepemimpinan dan manajemen.","Kepemimpinan memberi arah, memengaruhi, dan membangun dukungan. Manajemen berfokus pada perencanaan, pengorganisasian, penganggaran, dan pengawasan. Keduanya dibutuhkan agar strategi dirumuskan dan dijalankan."],
["Apa itu kecerdasan emosional? Sebutkan unsur utamanya.","Kecerdasan emosional adalah kemampuan mengenali dan mengelola emosi diri serta memahami emosi orang lain. Unsurnya meliputi kesadaran diri, pengelolaan diri, kesadaran sosial, dan pengelolaan hubungan."],
["Apa manfaat organisasi pembelajar bagi inovasi dan pelaksanaan strategi?","Organisasi pembelajar mendorong berbagi pengetahuan, evaluasi pengalaman, pelatihan, dan perbaikan berkelanjutan. Hal ini membantu organisasi menyesuaikan diri, tetapi ide baru tetap perlu dinilai dari biaya, manfaat, dan risikonya."],
["Jelaskan potensi manfaat dan risiko pemimpin narsistik.","Kepercayaan diri dan keberanian menyampaikan visi dapat membantu perubahan, tetapi keyakinan berlebihan dapat membuat pemimpin mengabaikan kritik atau mengambil risiko berlebihan. Analisis independen, tata kelola, dan ruang untuk menyampaikan pendapat membantu mengurangi risiko."],
["Sebuah perusahaan mengganti sistem manual dengan sistem digital dan karyawan menolak. Apa yang sebaiknya dilakukan pemimpin?","Jelaskan alasan perubahan, dengarkan kekhawatiran, periksa kebutuhan keterampilan, sediakan pelatihan, libatkan karyawan dalam perbaikan, tetapkan tanggung jawab, dan pantau dampak serta risiko selama transisi."]];
const Q13=[
["Apa fungsi utama MIS dalam organisasi?",["Mengubah data menjadi informasi untuk membantu keputusan dan pengendalian", "Menggantikan seluruh keputusan manajer", "Menyimpan data tanpa tujuan", "Menjamin semua keputusan pasti benar"],0,"MIS menyediakan informasi yang relevan bagi perencanaan, pemantauan, dan pengambilan keputusan."],
["Analitik yang menjawab pertanyaan 'mengapa hal ini terjadi?' disebut…",["Deskriptif", "Diagnostik", "Prediktif", "Preskriptif"],1,"Analitik diagnostik menelusuri penyebab atau faktor yang terkait dengan hasil yang terjadi."],
["Apa tujuan IT governance?",["Memastikan TI selaras dengan tujuan bisnis dan risikonya dikelola", "Membeli teknologi sebanyak mungkin", "Menghapus pengendalian akses", "Membiarkan vendor menentukan semua strategi"],0,"IT governance mengatur arah, tanggung jawab, manfaat, risiko, dan penggunaan sumber daya TI."],
["Apa contoh risiko e-commerce yang perlu dikendalikan?",["Kebocoran data pelanggan dan gangguan pembayaran", "Pelanggan dapat melihat informasi produk", "Adanya pilihan metode pembayaran", "Produk memiliki deskripsi yang jelas"],0,"Keamanan data, penipuan, pembayaran, logistik, dan privasi merupakan risiko penting bisnis digital."],
["Apa perbedaan sederhana fintech dan cryptocurrency?",["Fintech adalah pemanfaatan teknologi dalam layanan keuangan; cryptocurrency adalah jenis aset digital tertentu", "Keduanya selalu berarti hal yang sama", "Fintech hanya berupa uang tunai", "Cryptocurrency selalu dijamin pemerintah"],0,"Fintech merupakan bidang layanan/teknologi keuangan yang luas, sedangkan cryptocurrency adalah salah satu bentuk aset digital dengan risiko dan regulasi tersendiri." ]];const E13=[
["Apa itu MIS dan bagaimana MIS membantu strategi?","MIS menggabungkan orang, proses, data, dan teknologi untuk menghasilkan informasi yang mendukung operasi dan keputusan manajemen. MIS membantu memantau kinerja, mengenali masalah, dan menilai pilihan berdasarkan informasi yang lebih terstruktur."],
["Bedakan data, informasi, dan insight dengan contoh.","Data adalah catatan mentah, seperti jumlah keluhan. Informasi adalah hasil pengolahan, misalnya keluhan naik 20% bulan ini. Insight adalah pemahaman yang mengarah pada tindakan, misalnya kenaikan terkait keterlambatan pengiriman sehingga proses distribusi perlu diperiksa."],
["Apa perbedaan data strategis, keuangan, dan operasional?","Data strategis membantu menilai arah jangka panjang, data keuangan menunjukkan pendapatan, biaya, laba, dan kas, sedangkan data operasional menunjukkan kinerja proses sehari-hari seperti waktu layanan, kesalahan, dan ketepatan pengiriman."],
["Jelaskan empat jenis data analytics.","Descriptive menjelaskan apa yang terjadi; diagnostic menelusuri mengapa terjadi; predictive memperkirakan apa yang mungkin terjadi; prescriptive membandingkan tindakan yang dapat dipilih."],
["Apa itu IT governance dan mengapa penting?","IT governance mengatur tanggung jawab dan pengawasan TI agar teknologi mendukung tujuan bisnis, sumber daya digunakan secara tepat, serta risiko seperti akses tidak sah, gangguan sistem, dan kualitas data dikelola."],
["Sebutkan risiko utama e-commerce dan cara menguranginya.","Risikonya antara lain kebocoran data, penipuan pembayaran, stok tidak akurat, keterlambatan pengiriman, gangguan sistem, dan biaya layanan tinggi. Mitigasi meliputi kontrol akses, validasi data, proses pembayaran aman, pemantauan logistik, dan rencana pemulihan."],
["Bedakan fintech dan cryptocurrency.","Fintech adalah bidang penggunaan teknologi untuk layanan keuangan. Cryptocurrency adalah jenis aset digital tertentu, sering menggunakan kriptografi dan jaringan terdistribusi. Cryptocurrency bukan sinonim fintech."],

function cbUpd(){if(!document.getElementById('cb-v'))return;let gap=0;
 cbR.forEach((_,i)=>{const s=cbS[i];if(s<2)gap++;[0,1,2].forEach(k=>document.getElementById('cbb'+i+k).classList.toggle('on',k===s));const b=document.getElementById('cbw'+i);b.style.width=CB_W[s]+'%';b.style.background=CB_C[s]});
 const v=document.getElementById('cb-v');
 if(!gap){v.style.borderLeftColor='#24704a';v.innerHTML='<b style="color:#24704a">Kapabilitas sudah memadai</b><p>Semua kapabilitas yang dibutuhkan sudah dimiliki, sehingga strategi lebih siap dijalankan.</p>'}
 else{v.style.borderLeftColor='#8a5a14';v.innerHTML='<b style="color:#8a5a14">'+gap+' dari '+cbR.length+' kapabilitas masih perlu diperkuat</b><p>Manajemen perlu menilai apa yang sudah dimiliki, apa yang masih kurang, dan bagaimana kekurangan itu ditutup, misalnya melalui pelatihan, perekrutan, teknologi, atau kemitraan.</p>'}}

function CBVIS(rows){cbR=rows;cbS=rows.map(()=>1);

let exR=[],exD=[];
function exUpd(){const b=document.getElementById('ex-b');if(!b)return;const n=exD.filter(x=>x).length;
 exR.forEach((_,i)=>document.getElementById('exi'+i).classList.toggle('done',!!exD[i]));

 else{const nx=exD.findIndex(x=>!x);v.style.borderLeftColor='#8a5a14';v.innerHTML='<b style="color:#8a5a14">'+n+' dari '+exR.length+' langkah siap</b><p>Strategi yang dirumuskan dengan baik tetap bisa gagal jika pelaksanaannya buruk. Langkah berikutnya: <b>'+exR[nx][0]+'</b>.</p>'}}
