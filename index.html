<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Management Hub</title>
<style>
:root{
  --bg:#A3566B; --bg2:#8C4559; --bg3:#7A394D;
  --line:#D4688A; --line-soft:rgba(255,255,255,0.28); --line-faint:rgba(255,255,255,0.08);
  --paper:#FBF0F3; --paper2:#F2DCE3; --ink:#2D1822;
  --white:#FFFFFF; --muted:#FBE9EF; --muted2:#F6DCE4;
  --gold:#C98A3A; --gold-soft:rgba(201,138,58,0.18);
  --warn:#E08A6B; --good:#6FCF97; --maroon:#8E2B3C;
  --sans:'IBM Plex Sans',-apple-system,sans-serif;
  --disp:'Space Grotesk',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);}
body{
  background-image:
    linear-gradient(var(--line-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,.disp{font-family:var(--disp);}
a{color:var(--line);}
.app{display:flex;min-height:100vh;}
.navtoggle{
  position:fixed;top:16px;left:16px;z-index:60;width:38px;height:38px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:0;flex-direction:column;
}
.navtoggle span{display:block;width:16px;height:2px;background:var(--gold);margin:2px 0;transition:transform .2s,opacity .2s;}
.navtoggle.open span:nth-child(1){transform:translateY(4px) rotate(45deg);}
.navtoggle.open span:nth-child(2){opacity:0;}
.navtoggle.open span:nth-child(3){transform:translateY(-4px) rotate(-45deg);}
.sidebar{
  width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--line-soft);
  padding:22px 16px 22px 64px;position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:margin-left .22s ease, transform .22s ease;
}
.sidebar.collapsed{margin-left:-290px;}
.backdrop{display:none;position:fixed;inset:0;background:rgba(45,12,24,.55);z-index:40;}
.backdrop.show{display:block;}
@media(max-width:800px){
  .sidebar{position:fixed;z-index:50;left:0;top:0;margin-left:0 !important;transform:translateX(-100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .main{padding-left:64px;}
}
.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
.brand h1{font-size:20px;margin:4px 0 2px;color:var(--white);}
.brand .sub{font-size:12px;color:var(--muted);line-height:1.5;}
.navgroup-label{font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.1em;margin:16px 8px 6px;text-transform:uppercase;}
.navitem{
  display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
  margin-bottom:2px;border:1px solid transparent;
}
.navitem:hover{background:var(--bg3);}
.navitem.active{background:var(--bg3);border-color:var(--line-soft);}
.navitem .num{font-family:var(--mono);font-size:11px;color:var(--muted2);width:20px;flex:none;padding-top:1px;}
.navitem .lbl{font-family:var(--sans);font-size:13px;line-height:1.35;color:var(--white);text-transform:none;letter-spacing:0;margin:0;}
.navitem.locked .lbl{color:var(--muted);}
.navitem.locked .num{color:var(--muted2);}
.navitem .tag{font-family:var(--mono);font-size:9px;color:var(--muted2);display:block;margin-top:2px;}
.navitem.ready .tag{color:var(--good);}

.main{flex:1;min-width:0;padding:34px 40px 80px;max-width:980px;}
.topic-head{margin-bottom:6px;}
.topic-head .kicker{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.topic-head h1{font-size:30px;margin:6px 0 8px;color:var(--white);}
.topic-head p{color:var(--muted);font-size:14.5px;max-width:70ch;line-height:1.6;}

.tabs{display:flex;gap:6px;margin:22px 0 22px;border-bottom:1px solid var(--line-soft);}
.tab{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;color:var(--muted);
  padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;
}
.tab.active{color:var(--gold);border-color:var(--gold);}
.tab:hover{color:var(--white);}

.pane{display:none;}
.pane.active{display:block;}

.card{
  background:var(--paper);color:var(--ink);border-radius:10px;padding:22px 24px;margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.card h2{font-size:18px;margin:0 0 10px;color:var(--ink);}
.card h3{font-size:14.5px;margin:16px 0 6px;color:var(--ink);}
.card p{font-size:14px;line-height:1.7;margin:0 0 10px;color:#3A2430;}
.card ul,.card ol{font-size:14px;line-height:1.75;color:#3A2430;padding-left:20px;}
.callout{background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:13.5px;margin:12px 0;color:#463618;}
.pu{display:grid;gap:8px;margin:10px 0;}
.pu-item{border-left:3px solid var(--gold);background:#FAEEF2;border-radius:4px;padding:9px 13px;}
.pu-item b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px;}
.pu-item p{margin:0;font-size:13.5px;line-height:1.65;color:#3A2430;}
.pu-item ul{margin:3px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;}
.analogy{border-left:3px solid var(--maroon);background:#faeceb;padding:10px 14px;border-radius:4px;font-size:13.5px;margin:10px 0;color:#5a1f28;}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
th,td{border:1px solid #E3C3CE;padding:6px 9px;text-align:left;}
th{background:var(--paper2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}.main{padding:24px 18px 60px;}.sidebar{width:230px;}}

.qcard{background:var(--paper);color:var(--ink);border-radius:10px;padding:20px 22px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.qcard .qnum{font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;}
.qcard .qtext{font-size:14.5px;margin:6px 0 12px;color:var(--ink);line-height:1.6;}
.opt{
  display:block;width:100%;text-align:left;background:var(--paper2);border:1px solid #E3C3CE;border-radius:7px;
  padding:10px 12px;margin-bottom:7px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:var(--sans);
}
.opt:hover{border-color:var(--gold);}
.opt.correct{background:rgba(111,207,151,.35);border-color:var(--good);}
.opt.wrong{background:rgba(224,138,107,.35);border-color:var(--warn);}
.opt:disabled{cursor:default;}
.explain{display:none;background:#fff9ea;border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;font-size:13px;margin-top:8px;color:#463618;}
.explain.show{display:block;}
.quizbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.score{font-family:var(--mono);font-size:13px;color:var(--gold);}
.btn{
  font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--gold);color:#241a06;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;border:1px solid var(--line-soft);color:var(--white);}
.comingsoon{
  border:1px dashed var(--line-soft);border-radius:10px;padding:34px 24px;text-align:center;color:var(--muted);
}
.comingsoon .big{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.footer-note{font-size:11.5px;color:var(--muted2);margin-top:30px;font-family:var(--mono);}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.chip{
  font-family:var(--mono);font-size:12px;background:var(--paper2);border:1px solid #E3C3CE;border-radius:20px;
  padding:6px 13px;cursor:pointer;color:#3A2430;
}
.chip.picked{background:var(--gold);border-color:var(--gold);color:#241a06;}
.quote{border-left:3px solid var(--line);background:#FAECF1;padding:10px 14px;border-radius:4px;font-size:13.5px;margin:10px 0;color:#3A2430;font-style:italic;}

.kuis-note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;font-size:13.5px;line-height:1.55;margin:4px 0 16px;color:#F3E3C6;}
.kuis-note b{color:var(--gold);}
.card{overflow-x:auto;}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap;flex:none;}
@media(max-width:800px){
  .tab{padding:9px 11px;font-size:11.5px;}
  .card{padding:18px 16px;}
  .main{padding-top:70px !important;}
  .tabs{gap:2px;}
  .card table{font-size:12px;}
  .card th,.card td{padding:5px 6px;overflow-wrap:anywhere;}
  .card th:first-child,.card td:first-child{overflow-wrap:normal;word-break:normal;min-width:70px;}
  .card th{font-size:10px;}
}
.badge{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--gold-soft);color:#7a5418;border:1px solid var(--gold);border-radius:20px;padding:2px 8px;vertical-align:middle;margin-left:6px;font-weight:500;}
.tw{overflow-x:auto;}
.formula{font-family:var(--mono);font-size:12.5px;background:#F7E6EC;border:1px solid #E6C6D1;border-radius:6px;padding:9px 13px;margin:9px 0;color:#3A2430;line-height:1.7;}
table.calc td:not(:first-child),table.calc th:not(:first-child){text-align:right;}
table tr.tot td{font-weight:700;background:#F2DAE3;}
.ex .exdata{background:#F8E7ED;border-left:3px solid var(--line);border-radius:4px;padding:10px 14px;margin:8px 0 14px;font-size:13.5px;line-height:1.65;color:#3A2430;}
.ex .exdata p{margin:0 0 6px;} .ex .exdata p:last-child{margin:0;}
.ex .lbl,.result .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9A5468;margin-bottom:4px;}
.st{display:flex;gap:12px;margin:0 0 12px;}
.st .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#241a06;font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.st .sb{flex:1;min-width:0;font-size:13.5px;line-height:1.65;color:#3A2430;}
.st .sb b{display:block;color:var(--ink);margin-bottom:2px;}
.st .sb p{margin:0 0 4px;}
.result{background:#e6f4ea;border:1px solid #6FCF97;border-left:4px solid #3c9d68;border-radius:6px;padding:10px 14px;margin-top:6px;font-size:13.5px;line-height:1.65;color:#1d3a2a;}
.result p{margin:0 0 4px;} .result .lbl{color:#2f7a52;}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;border-radius:20px;padding:1px 9px;}
.pill.ok{background:#d6f0de;color:#1d5a37;} .pill.no{background:#f8dcd2;color:#8a3318;}
.prbox{border:1px dashed var(--line-soft);border-radius:10px;padding:34px 24px;text-align:center;color:var(--muted);}
.prbox .big{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}

/* Komponen baca: definisi & perbandingan */
.def{background:#FDF5F7;border:1px solid #EBCFD8;border-radius:10px;padding:14px 16px;margin:12px 0}
.def .dt{font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.def .dt::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.def>p{margin:0 0 4px;font-size:14px;line-height:1.65}
.eg{background:#F8E7ED;border-left:3px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13.5px;line-height:1.6;color:#3A2430;margin-top:8px}
.eg>span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A5468;margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags>span{font-family:var(--mono);font-size:11.5px;background:var(--paper2);border:1px solid #E3C3CE;border-radius:20px;padding:3px 10px;color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vl,.vr{border-radius:8px;padding:10px 12px;background:#fff;border:1px solid #E6C6D1}
.vl{border-top:4px solid var(--line)}
.vr{border-top:4px solid var(--gold)}
.vh{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.vl .vh{color:#9A4560}
.vr .vh{color:#9a6420}
.vsb{align-self:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted2)}
.vs p{font-size:13.5px;line-height:1.6;margin:0}
.def>.callout{margin:10px 0 0}
@media(max-width:640px){.vs{grid-template-columns:1fr;gap:6px}.vsb{justify-self:center}.def{padding:12px}}

.pu{gap:12px}
.pu>.def{margin:0}
.def .dt .nb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#241a06;font-family:var(--mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.def.nm .dt::before{display:none}
.def.exm{background:#F8E7ED;border-color:#EBC9D5;border-left:3px solid var(--line)}
.def.exm .dt{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9A4560}
.def.exm .dt::before{display:none}
.vs ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}
.vs .vl>p+ul,.vs .vr>p+ul{margin-top:4px}
.tags.flow>span:not(:last-child)::after{content:'→';margin-left:8px;color:var(--gold);font-weight:600}
.def>p+p{margin-top:6px}

/* Latihan PR: tampilan soal & jawaban */
.pq{background:var(--paper);color:var(--ink);border-radius:14px;margin-bottom:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pq-h{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#7A394D;color:#fff;flex-wrap:wrap}
.pq-emo{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:26px}
.pq-ht{flex:1;min-width:180px}
.pq-n{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:#f3c77e;font-weight:600}
.pq-t{font-family:var(--disp);font-size:18px;font-weight:600;margin-top:2px;color:#fff}
.pq-chip{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);color:#FDEFF3;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 10px}
.pq-why{padding:9px 20px;background:var(--gold-soft);border-bottom:1px solid #e3d3a8;font-size:13px;color:#5a4115}
.pq-why b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.pq-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.pq-soal{margin:16px 18px 6px;background:#F8E7ED;border:1px solid #EBC9D5;border-left:5px solid var(--line);border-radius:10px;padding:14px 16px}
.pq-soal .pq-lbl{color:#9A4560}
.pq-soal p{font-size:14px}
.pq-ans{padding:10px 18px 4px}
.pq-ans .pq-lbl{color:#9a6420;margin:8px 0}
.pq-step{display:flex;gap:12px;margin-bottom:10px;background:#FDF5F7;border:1px solid #EBCFD8;border-radius:10px;padding:12px 14px}
.pq-step .no{flex:none;width:26px;height:26px;border-radius:50%;background:#7A394D;color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pq-step .bd{flex:1;min-width:0;font-size:14px;line-height:1.65}
.pq-step .bd>b:first-child{display:block;margin-bottom:5px;color:var(--ink);font-size:14.5px}
.pq-step .bd p{margin:4px 0}
.pq-step .bd ul{margin:4px 0;padding-left:18px}
.pq-final{margin:6px 18px 16px;background:#eef6f1;border:1px solid #b9d9c5;border-left:5px solid #3e8e63;border-radius:10px;padding:13px 16px;font-size:14.5px;line-height:1.6;color:#17402a}
.pq-final .pq-lbl{color:#1f7a47;margin-bottom:4px}
.pq-note{margin:0 18px 16px;font-size:12.5px;color:#6b5a30;background:#fff7e0;border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;line-height:1.55}
.pq-note b{color:#8a5a14}
.pq .tw{margin:8px 0}
.pq .formula{margin:6px 0}
.pr-intro{background:#8C4559;border:1px solid var(--line-soft);border-radius:12px;padding:14px 18px;margin-bottom:18px;color:var(--white);font-size:13.5px;line-height:1.6}
.pr-intro b{color:#f3c77e}

/* aksen terang di atas latar pink */
.brand .kicker,.navgroup-label{color:#FFE3A8}
.navtoggle span{background:#FFE3A8}
.topic-head .kicker,.comingsoon .big,.prbox .big,.kuis-note b{color:#FFE3A8}
.tab.active{color:#FFE3A8;border-color:#FFE3A8}
.navitem.ready .tag{color:#D4F7E1}
.vsb{color:#8C4559}
html,body{overflow-x:hidden}.card td,.card th{overflow-wrap:normal;word-break:normal}.tw{-webkit-overflow-scrolling:touch}.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;text-align:center;line-height:1.3}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 5px 2px}.fr>span:last-child{padding:2px 5px 0}.formula{overflow-x:auto}
</style>
</head>
<body>
<button class="navtoggle" id="navtoggle" onclick="toggleNav()" aria-label="Buka/tutup navigasi"><span></span><span></span><span></span></button>
<div class="backdrop" id="backdrop" onclick="closeNavMobile()"></div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">PPAk FEB UGM</div>
      <h1>SML Hub</h1>
      <div class="sub">Strategic Management and Leadership (AKU6210): ringkasan, latihan, dan esai per sesi sesuai RPKPS.</div>
    </div>
    <div id="nav"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<script>
const CONTENT = {};
const T=(h,rows,cls='')=>`<div class="tw"><table class="${cls}"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>{const tot=String(r[0]).startsWith('!');const rr=tot?[String(r[0]).slice(1),...r.slice(1)]:r;return `<tr class="${tot?'tot':''}">${rr.map(x=>`<td>${x}</td>`).join('')}</tr>`}).join('')}</table></div>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const P=t=>`<p>${t}</p>`;
const SP=d=>{if(d.length<220||/<br|<ul|<ol/.test(d))return `<p>${d}</p>`;return d.split(/(?<=[.!?])\s+(?=[A-Z<"(])/).map(s=>`<p>${s}</p>`).join('')};
const PUI=(t,d)=>{
 if(/^Contoh\b/.test(t))return `<div class="def exm"><div class="dt">${t}</div><p>${d}</p></div>`;
 let n=null,m=t.match(/^(?:Step\s+)?(\d+)\s*[.:]\s*(.+)$/);if(m){n=m[1];t=m[2]}
 let eg='';const x=d.match(/^([\s\S]*?)\s*Contoh(?: [^:<]{0,20})?:\s*([\s\S]+)$/);
 if(x){d=x[1];eg=x[2]}
 return `<div class="def${n?' nm':''}"><div class="dt">${n?`<span class="nb">${n}</span>`:''}${t}</div>${d?SP(d):''}${eg?`<div class="eg"><span>Contoh</span>${eg}</div>`:''}</div>`};
const PU=a=>`<div class="pu">${a.map(x=>typeof x=='string'?x:PUI(x[0],x[1])).join('')}</div>`;
const C=(t,b,tag)=>`<div class="card"><h2>${t}${tag?` <span class="badge">${tag}</span>`:''}</h2>${b}</div>`;
const DEF=(t,d,eg,tags)=>`<div class="def"><div class="dt">${t}</div><p>${d}</p>${tags?`<div class="tags">${tags.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${eg?`<div class="eg"><span>Contoh</span>${eg}</div>`:''}</div>`;
const VSC=(x,c)=>`<div class="${c}"><div class="vh">${x[0]}</div>${x[1]?`<p>${x[1]}</p>`:''}${x[3]?`<ul>${x[3].map(i=>`<li>${i}</li>`).join('')}</ul>`:''}${x[2]?`<div class="eg"><span>Contoh</span>${x[2]}</div>`:''}</div>`;
const VS=(t,a,b,note)=>`<div class="def"><div class="dt">${t}</div><div class="vs">${VSC(a,'vl')}<div class="vsb">vs</div>${VSC(b,'vr')}</div>${note?`<div class="callout">${note}</div>`:''}</div>`;
const CALL=t=>`<div class="callout">${t}</div>`;
const AN=t=>`<div class="analogy">${t}</div>`;
const FORM=t=>`<div class="formula">${t}</div>`;
const tg=(a)=>a;
const ps=(x,y)=>`<span class="pill ${x?'ok':'no'}">${y}</span>`;
const CK='✓';
let qi=0,sc=0;
let picked=[];
function quizHtml(){picked=[];sc=0;return `<div class="quizbar"><span class="score" id="sc">Skor: 0 / ${QS.length}</span><div style="display:flex;gap:8px"><button class="btn secondary" onclick="refreshQuiz()">Ulangi</button><button class="btn" onclick="shuffleQuiz()">Acak soal</button></div></div>`+QS.map((q,i)=>`<div class="qcard" id="qc${i}"><div class="qnum">Soal ${i+1}</div><div class="qtext">${q[0]}</div>${q[1].map((t,j)=>`<button class="opt" onclick="pick(${i},${j})">${t}</button>`).join('')}<div class="explain" id="ex${i}">${q[3]}</div></div>`).join('')}
function pick(i,j){const q=QS[i];if(picked[i]!==undefined)return;picked[i]=j;const bs=document.querySelectorAll('#qc'+i+' .opt');bs.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct')});if(j===q[2])sc++;else bs[j].classList.add('wrong');document.getElementById('ex'+i).classList.add('show');document.getElementById('sc').textContent='Skor: '+sc+' / '+QS.length;}
function refreshQuiz(){document.querySelector('.pane').innerHTML=quizHtml();}
function shuffleQuiz(){QS=QS.slice();for(let k=QS.length-1;k>0;k--){const m=Math.floor(Math.random()*(k+1));[QS[k],QS[m]]=[QS[m],QS[k]];}refreshQuiz();}
let QS=[],ES=[];
function esHtml(){return ES.map((e,i)=>`<details class="card"><summary><b>Esai ${i+1}.</b> ${e[0]}</summary><div class="callout">${e[1]}</div></details>`).join('')}

CONTENT.s1={kicker:'Sesi 1 · Henry Ch. 1',title:'Strategy, Business Forms, and Strategic Direction',desc:'Konsep strategy, proses strategic management, vision–mission–values, theory of the business, business model, tiga level strategi, dan dua cara pandang pembuatan strategi. Perbedaan strategic management dan operational management (Henry bagian 1.2) juga dibahas. Bahasan business forms, etika, governance, dan risk (IAI Module Bab I–II) menyusul setelah modulnya tersedia.',
materi:[C("Apa itu strategy?",P("Strategy berasal dari dunia militer. Keputusan harus rasional (menimbang untung dan biaya) dan diarahkan ke satu tujuan yang jelas. Di bisnis, tujuan strategy adalah meraih <b>competitive advantage</b> atas pesaing.")+DEF("Strategy menurut Porter","Strategy adalah soal <b>menjadi berbeda</b>: perusahaan memilih kumpulan aktivitas yang berbeda dari pesaing. Aktivitas itulah dasar competitive advantage. Perusahaan hanya bisa mengungguli pesaing kalau nilai yang diberikannya sulit ditiru.")+UL(["<b>Differentiation</b>: produk lebih dihargai pelanggan, jadi boleh memasang premium price.", "<b>Cost advantage</b>: kualitas sama dengan pesaing, tetapi harga lebih rendah karena aktivitas dijalankan lebih efisien."])),
C("Strategic management: analysis, formulation, implementation",T(["Tahap", "Isi"],[["Analysis", "Menilai seberapa siap organisasi memanfaatkan opportunities dan menghadapi threats. Mencakup macro-environment dan industry (Ch. 2–3)."], ["Formulation", "Mencari strategic fit antara organisasi dan lingkungan. Biasanya muncul lebih dari satu pilihan strategi, lalu manajer memilih. Analisis perlu dilengkapi creative insight (Mintzberg, Ohmae)."], ["Implementation", "Strategi harus dikomunikasikan dan dikoordinasikan. Struktur organisasi perlu fleksibel, dan pemimpin membangun budaya yang berani mencoba ide baru."]])+CALL("Ketiga tahap ini <b>saling bergantung</b> (co-dependent), bukan urutan kaku. Saat merumuskan strategi, organisasi harus sekaligus memikirkan cara menjalankannya.")),
C("Vision, mission, dan values",T(["Elemen", "Artinya"],[["Vision", "Kondisi masa depan yang diinginkan. Biasanya tidak berubah seiring waktu. Harus realistis dan pemimpinnya harus authentic, kalau tidak karyawan akan menolaknya."], ["Mission", "Alasan organisasi ada, atau jawaban atas pertanyaan 'bisnis apa yang kita jalani?' (Drucker). Harus menarik bagi banyak stakeholder."], ["Core values", "Prinsip yang tidak dikorbankan demi keuntungan jangka pendek (Collins dan Porras). Tidak ikut berubah saat persaingan berubah."]])+P("<b>Stakeholders</b> adalah individu atau kelompok yang bisa memengaruhi atau dipengaruhi pencapaian tujuan organisasi. Campbell membedakan <i>mission</i> (konsep intelektual untuk memandu kebijakan) dari <i>sense of mission</i> (komitmen emosional karyawan karena nilai organisasi cocok dengan nilai pribadi).")+CALL("Kritik Rumelt: <b>template style strategy</b>. Banyak organisasi hanya mengisi visi 'terbaik' atau 'terdepan' dan nilai yang tidak kontroversial (contoh Enron), tanpa menganalisis tantangan nyata.")),
C("Theory of the business (Drucker)",P("Setiap organisasi punya asumsi tentang <b>market, pelanggan, pesaing, serta kekuatan dan kelemahan dirinya</b>. Asumsi ini menentukan keputusan manajer dan apa yang dianggap hasil yang berarti. Drucker menyebutnya <i>theory of the business</i>.")+UL(["Masalah muncul saat asumsi tidak lagi cocok dengan kenyataan.", "Contoh: IBM mengira masa depan komputer ada di mainframe, padahal personal computer sudah mulai muncul.", "Berlaku untuk organisasi swasta, publik, maupun nirlaba."])),
C("Business model dan bedanya dengan strategy",P("Menurut Magretta, business model adalah <b>cerita yang menjelaskan bagaimana organisasi bekerja</b>: siapa pelanggannya, apa yang mereka hargai, dan bagaimana organisasi menghasilkan uang dengan biaya yang wajar.")+T(["", "Business model", "Business strategy"],[["Menjelaskan", "Bagaimana aktivitas bisnis berjalan bersama (value chain)", "Bagaimana bersaing lebih baik dari pesaing"], ["Fokus", "Cara organisasi beroperasi dan menghasilkan uang", "Posisi yang berbeda dan sulit ditiru"]])+CALL("Business model harus melengkapi strategi bersaing yang jelas. Model perlu diinovasi bila siklus produk makin pendek, pesaing datang dari arah tak terduga, atau pelanggan makin menerima tawaran pesaing.")),
C("Tiga level strategi",T(["Level", "Fokus", "Contoh"],[["Corporate strategy", "Industri mana yang dimasuki; merger dan akuisisi; alokasi sumber daya antar strategic business unit (SBU). Biasanya urusan manajemen puncak.", "Unilever mengakuisisi Dollar Shave Club untuk masuk pasar pisau cukur. Intel pindah dari memory chip ke microprocessor."], ["Business strategy", "Bagaimana bersaing di satu industri atau market (competitive strategy). Manajer SBU biasanya punya otonomi besar. Dibahas di Ch. 3 dan 6.", "Strategi bersaing satu SBU terhadap pesaingnya."], ["Functional strategy", "Keputusan per fungsi (R&D, marketing, finance) untuk mendukung business strategy. Henry memasukkannya ke business strategy.", "Keputusan R&D untuk mendukung diferensiasi produk."]])+P("<b>SBU</b> adalah bagian organisasi yang fokus pada market tertentu untuk produk atau jasanya. Henry menilai istilah 'operational strategy' kurang tepat; lebih cocok disebut operational management.")),
C("Perkembangan pendekatan strategi",T(["Dekade", "Fokus", "Tokoh atau ide"],[["1960-an", "Corporate planning: rencana jangka panjang berbasis budget (sekitar 5 tahun), cocok untuk pasar yang stabil", "Sistem budgetary control"], ["1970-an", "Diversification untuk menambah market share", "Ansoff: growth vector matrix"], ["1980-an", "Analisis competitive forces di industri; 'stick to the knitting'; strategi bisa emergent", "Porter; Peters dan Waterman; Mintzberg"], ["1990-an", "Resource-based view (RBV): sumber daya dan core competences; downsizing dan outsourcing", "Grant, Kay, Prahalad dan Hamel"], ["Kemudian", "Hypercompetition: perusahaan harus terus berinovasi", "D'Aveni"]])+CALL("<b>Porter vs RBV.</b> Porter: profit ditentukan struktur industri dan posisi perusahaan. RBV: profit ditentukan sumber daya dan kapabilitas. Amit dan Schoemaker melihat RBV sebagai pelengkap analisis industri.")),
C("Dua cara pandang: rationalist vs learning school",T(["", "Rationalist (design) school", "Learning school"],[["Tokoh", "Andrews, Ansoff", "Lindblom, Cyert dan March, Mintzberg"], ["Ide pokok", "Cocokkan strengths dan weaknesses dengan opportunities dan threats (SWOT), buat beberapa strategi, pilih yang terbaik.", "Strategi muncul lewat belajar, bertahap, dan adaptif."], ["Pandangan lain", "Manajemen puncak memilih strategi dari hasil analisis.", "Lindblom: 'muddling through' (branch method: maju dalam langkah kecil dari kondisi sekarang). Cyert dan March: organisasi adalah koalisi dengan kepentingan berbeda."]])+DEF("Intended, realized, unrealized, emergent (Mintzberg dan Waters)","<b>Intended</b>: strategi yang dipilih dengan sengaja. <b>Realized</b>: strategi yang benar-benar dijalankan. <b>Unrealized</b>: intended yang tidak dijalankan karena kondisi berubah. <b>Emergent</b>: strategi yang muncul dari pengalaman dan pembelajaran manajer, lalu menjadi realized.")+CALL("Mintzberg mengakui bahwa strategi yang viable punya unsur <b>deliberate</b> dan <b>emergent</b>. Contoh: kaum rationalist melihat dominasi Honda di pasar motor AS sebagai strategi yang disengaja, sedangkan Mintzberg melihatnya sebagai strategi emergent.")),
C("Kerangka strategic management (Figure 1.3)",UL(["<b>Values</b> menentukan <b>goals</b>. Goals menentukan <b>resources and capabilities</b> yang dibutuhkan, serta <b>structure and processes</b>.", "<b>Strategy</b> adalah penghubung (lynchpin) antara organisasi (strengths dan weaknesses) dan lingkungan (opportunities dan threats).", "Lingkungan terdiri dari general environment dan competitive environment.", "<b>Stakeholders</b> ada di dalam dan di luar organisasi, dan hubungannya dengan strategy berjalan dua arah.", "Panah dua arah memberi feedback: intended strategy bisa tidak jalan bila kondisi pasar berubah."])),
C("Kasus singkat: Intel dan memory chip",UL(["Intel besar lewat memory chip. Tahun 1978–1988, pangsa pasar perusahaan Jepang naik dari 30% menjadi 60% dengan chip murah berkualitas tinggi.", "Intel tetap yakin masa depannya di memory chip dan berharap bisa menarik premium price lewat chip yang lebih baik.", "Sumber daya dan kapabilitas masih terpusat di memory chip, padahal microprocessor untuk personal computer mulai tumbuh.", "Pelajaran: <i>theory of the business</i> yang lama tidak lagi cocok. Menurut Miller (Icarus paradox), kapabilitas yang membuat sukses juga bisa menjadi sebab kegagalan."]),"Kasus Henry"),
C("Strategic management vs operational management",P("Menurut Henry, bila strategi dipahami sebagai hubungan antara organisasi dan lingkungannya, strategi bisa dipisahkan dari urusan <b>operational management</b> seperti motivasi karyawan, akuntansi, dan inventory control. Itu tidak berarti operasional tidak memengaruhi strategi, tetapi aspek-aspek itu sendiri bukan strategi.")+T(["", "Strategic management", "Operational management"],[["Inti", "Mengerjakan dengan baik apa yang tidak bisa atau tidak mudah dikerjakan pesaing", "Mengerjakan aktivitas yang serupa dengan lebih baik daripada pesaing"], ["Mudah ditiru?", "Sulit ditiru; jarang didasarkan pada apa yang sudah dilakukan pesaing", "Mudah ditiru; pesaing bisa menyalin best practice industri"], ["Alat atau contoh", "Memakai teknik analisis untuk memahami dan memengaruhi posisi di pasar", "Total quality management, benchmarking, outsourcing, business process re-engineering"], ["Fokus", "Hubungan organisasi dengan lingkungan, pelanggan, pemasok, dan pesaing", "Pencarian efisiensi: memakai input lebih efektif, termasuk mengembangkan produk lebih cepat daripada pesaing"]])+CALL("<b>Penjelasan Henry:</b> banyak perusahaan dalam satu industri punya SDM yang baik, akuntansi yang efektif, dan teknologi yang sesuai, tetapi itu bukan strategi. Keberhasilan satu perusahaan di bidang itu tidak merugikan yang lain, dan yang lain bisa menirunya.")+P("Kesuksesan BMW dan Honda berasal dari kemampuan mengenali distinctive capabilities masing-masing dan bersaing di market yang memanfaatkannya. Mereka tidak membangun di atas best practice pesaing, dan ketika mencoba menyalin pesaing mereka gagal. Strategi yang efektif bersifat adaptif dan oportunistik, bukan kabur dan tanpa fokus."))].join('')};
CONTENT.s2={kicker:'Sesi 2 · Henry Ch. 2–3',title:'Macro-environment dan Industry Analysis',desc:'Scanning, monitoring, forecasting, scenario planning, PEST/PESTLE, pengantar SWOT, Porter\'s Five Forces, value net, industry life cycle, strategic groups, hypercompetition, dan disruptive innovation.',
materi:[C("Macro-environment vs competitive environment",T(["", "Isi", "Dampak"],[["Macro-environment (general environment)", "Faktor political, economic, social, technological", "Perubahannya berdampak melampaui satu perusahaan atau satu industri"], ["Competitive environment", "Industri dan market tempat organisasi bersaing (Ch. 3)", "Perubahannya paling langsung dan cepat memengaruhi organisasi"]])+P("Meski dampaknya tidak sedekat industri, macro-environment tetap harus dipantau karena sering memberi <b>weak signals</b> (sinyal lemah) tentang perubahan yang akan menyentuh competitive environment.")),
C("Scanning, monitoring, forecasting",T(["Aktivitas", "Artinya"],[["Scanning", "Memindai lingkungan secara luas untuk menemukan weak signals ('kuas lebar')"], ["Monitoring", "Melacak sinyal itu sampai berkembang menjadi pola yang jelas ('kuas halus')"], ["Forecasting", "Membuat prakiraan tren sebelum menjadi ancaman besar, supaya strategi bisa disiapkan"]])+DEF("Tiga jenis ketidakpastian (van der Heijden)","<b>Risks</b>: kejadian serupa di masa lalu memungkinkan probabilitas dihitung. <b>Structural uncertainties</b>: kejadian cukup unik sehingga probabilitas tidak bisa dihitung. <b>Unknowables</b>: kejadian yang bahkan tidak bisa dibayangkan.")+CALL("Risks bisa ditangani manajer biasa, unknowables hanya bisa direspons setelah terjadi. <b>Structural uncertainties</b> adalah wilayah yang cocok untuk scenario planning.")),
C("Scenario planning",P("Schoemaker: <i>metode yang disiplin untuk membayangkan masa depan yang mungkin</i>. Porter: <i>pandangan masa depan yang konsisten secara internal</i>. Shell memakainya sejak 1970-an. Hasilnya berupa cerita tentang beberapa alternatif masa depan, bukan satu prediksi.")+T(["Langkah", "Isi"],[["1. Define the scope", "Tentukan time frame dan cakupan analisis (produk, market, wilayah)"], ["2. Identify major stakeholders", "Siapa yang memengaruhi dan terpengaruh, serta kepentingan dan kekuasaannya"], ["3. Identify basic trends", "Faktor PEST dan industri yang paling berdampak, dinilai positif, negatif, atau tidak pasti"], ["4. Identify key uncertainties", "Kejadian tidak pasti yang paling memengaruhi; batasi jumlahnya agar sederhana"], ["5. Construct initial scenario themes", "Kumpulkan elemen positif dalam satu skenario dan elemen negatif di skenario lain"], ["6. Check consistency and plausibility", "Pastikan tren cocok dengan time frame dan tidak ada hasil yang mustahil bersamaan (mis. full employment dan nol inflasi)"], ["7. Develop learning scenarios", "Beri nama agar mudah diingat; dipakai untuk belajar, belum untuk memutuskan"], ["8. Identify research needs", "Riset tambahan untuk ketidakpastian dan tren yang belum dipahami"], ["9. Develop quantitative models", "Setelah riset, buat model kuantitatif"]])),
C("PEST / PESTLE analysis",T(["Faktor", "Contoh isi"],[["Political", "Kebijakan pemerintah, stabilitas pemerintahan, pajak, regulasi (aspek hukum masuk di sini)"], ["Economic", "Suku bunga, disposable income, pengangguran, inflasi, GDP, kurs"], ["Social", "Demografi (mis. populasi menua) dan budaya"], ["Technological", "Rate of obsolescence (kecepatan teknologi baru menggantikan yang lama); inovasi menciptakan industri baru dan mengubah cara bersaing"]])+P("PESTLE menambah <b>Legal</b> dan <b>Environmental</b>. Henry memasukkan legal ke political dan environmental ke social, jadi yang penting bukan jumlah hurufnya, tetapi cara memakainya.")+CALL("<b>Keterbatasan:</b> PEST bukan 'shopping list'. Tiap faktor harus ditarik implikasinya bagi industri. Perubahan yang cepat dan sulit diprediksi juga membatasi manfaatnya. Porter menilai industri adalah arena paling penting, tetapi macro-environment tetap perlu dipantau.")+CALL("RPKPS Sesi 2 memakai istilah <b>PESTEL</b> (legal dan regulatory). Saat mengerjakan tugas, bahas legal dan environmental sebagai faktor terpisah.")),
C("Pengantar SWOT",T(["", "Dari mana", "Dikendalikan?"],[["Strengths dan Weaknesses", "Lingkungan internal (sumber daya dan kapabilitas)", "Ya, perusahaan bisa mengendalikan"], ["Opportunities dan Threats", "Lingkungan eksternal (scenario planning dan PEST membantu menemukannya)", "Kendali terbatas"]])+P("SWOT dipakai untuk menilai apakah strategi sekarang masih relevan dengan perubahan kondisi industri. Di level macro-environment, SWOT lebih sulit dipakai karena kejadiannya tidak bisa diprediksi. Henry melihat macro-environment dan industry analysis sebagai satu kontinum.")),
C("Porter's Five Forces",P("Dianalisis dari sudut pandang <b>incumbent</b> (perusahaan yang sudah ada di industri), paling pas di level SBU. <b>Industry</b> = kelompok organisasi yang membuat produk atau jasa serupa.")+T(["Force", "Makin kuat bila…"],[["Threat of new entrants", "Barriers to entry rendah. Barriers utama: economies of scale, capital requirement, product differentiation, access to distribution channels, cost advantages independent of size. Juga bila pesaing lama tidak akan melakukan retaliation, atau profit industri jauh di atas cost of capital."], ["Bargaining power of buyers", "Pembeli terkonsentrasi dan membeli dalam volume besar (mis. Wal-Mart), atau produknya standar sehingga pembeli mudah pindah."], ["Bargaining power of suppliers", "Mirror image dari buyers: supplier terkonsentrasi, sedikit substitusi, produk differentiated dan switching cost tinggi, atau ada ancaman forward integration."], ["Threat of substitutes", "Price-performance ratio substitusi menarik. Substitusi menjadi <b>batas atas harga</b> (ceiling) yang bisa dikenakan industri."], ["Rivalry among competitors", "Pesaing banyak atau seimbang kekuatannya, pertumbuhan industri lambat, dan fixed costs tinggi (mendorong perang harga, mis. airline)."]])),
C("Keterbatasan Five Forces dan Value Net",UL(["<b>Asumsi zero-sum:</b> satu pemain menang karena pemain lain kalah. Padahal supplier, bahkan pesaing, bisa menambah nilai bersama (contoh Toyota dan Honda dengan pemasoknya).", "<b>Analisis statis:</b> mengasumsikan pasar relatif stabil dan kurang menjelaskan interaksi dan langkah pesaing."])+DEF("Value net (Brandenburger dan Nalebuff)","Memakai <b>game theory</b>. Peta pemain: customers, suppliers, competitors, ditambah <b>complementors</b> sebagai kekuatan keenam. Bisnis bisa menjadi permainan <b>win–win</b>, dan aturan mainnya bisa diubah.")),
C("Industry life cycle",T(["Tahap", "Ciri utama"],[["Introduction", "Penjualan tumbuh lambat, biaya tinggi karena produksi terbatas, R&D besar, premium price, first-mover advantage, profit negatif."], ["Growth", "Penjualan naik cepat, economies of scale, profit naik sehingga entrant baru masuk. Perusahaan berebut brand dan mengejar repeat purchase."], ["Maturity", "Pertumbuhan melambat, pasar jenuh, kompetisi biaya dan efisiensi, rivalry makin intens (apalagi bila ada exit barriers). Produk bisa diremajakan lewat inovasi atau pasar baru."], ["Decline", "Penjualan dan profit turun, loyalitas pindah ke teknologi baru, persaingan harga, perusahaan keluar atau melakukan konsolidasi."]])+CALL("Industry life cycle adalah versi sisi supply dari product life cycle. Panjang tiap tahap berbeda antar industri, dan strategic group yang berbeda bisa berada di tahap berbeda.")),
C("Strategic groups dan mobility barriers",P("Industry diidentifikasi dari market yang dilayani: apakah input dan teknologi produknya mirip, dan apakah pelanggannya banyak yang sama. <b>Strategic group</b> adalah perusahaan dalam satu industri yang bersaing dengan posisi strategis yang serupa. Posisinya digambarkan di <b>strategic map</b> (contoh Henry: harga vs product range di industri mobil).")+CALL("<b>Mobility barriers</b> adalah faktor yang menghambat perpindahan perusahaan dari satu posisi strategis (group) ke group lain, pada dasarnya batasan untuk mereplikasi atau meniru. Bedakan dari <i>barriers to entry</i> yang menghambat masuk ke industri.")),
C("Hypercompetition dan disruptive innovation",T(["", "Inti", "Contoh"],[["Hypercompetition (D'Aveni)", "Persaingan dengan gerakan yang intens dan cepat; pesaing harus cepat membangun keunggulan dan menggerus keunggulan rival.", "Apple yang terus meluncurkan produk baru dan mengakuisisi calon ancaman sejak dini."], ["Disruptive innovation (Christensen)", "Perusahaan kecil bisa menantang incumbent. Incumbent sibuk melayani pelanggan high-end yang paling menguntungkan dan mengabaikan segmen yang kurang untung. Entrant masuk di segmen itu dengan fungsi yang sesuai dan harga lebih rendah, lalu naik ke upmarket.", "Streaming video menggeser penyewaan DVD."]]))].join('')};
CONTENT.s3={kicker:'Sesi 3 · Henry Ch. 4–5',title:'Value Creation, Resources, Capabilities, and Competitiveness',desc:'Differential firm performance, value chain dan linkages, SWOT dan TOWS, performance (shareholder vs stakeholder), balanced scorecard, benchmarking, resource-based view, VRIO, make-or-buy, knowledge-based view, dan dynamic capabilities.',
materi:[C("Mengapa kinerja perusahaan berbeda?",P("<b>Differential firm performance</b>: perusahaan dengan sumber daya mirip di industri yang sama bisa punya tingkat profit berbeda. Analisis industri saja dianggap kurang bisa menjawabnya.")+T(["", "Positioning school (Porter)", "Resource-based view / Rumelt"],[["Arah", "<i>Outside-in</i>: mulai dari struktur industri", "<i>Inside-out</i>: mulai dari lingkungan internal"], ["Penentu kinerja", "Daya tarik dan profitabilitas industri (Five Forces); perusahaan memilih posisi di industri", "Faktor yang melekat pada perusahaan: sumber daya dan kapabilitas"], ["Akibat", "Pilihan strategi untuk bersaing terbatas jumlahnya", "Kapabilitas internal menentukan pilihan strategi, bahkan bisa menciptakan market baru (mis. Apple, Toyota hybrid)"]])),
C("Value chain analysis (Porter)",P("Value chain analysis menilai aktivitas-aktivitas yang membentuk sebuah produk atau jasa, untuk melihat <b>seberapa besar nilai yang ditambahkan</b> tiap aktivitas. Dibuat Porter untuk menilai sumber daya internal, dan paling pas dianalisis di level SBU.")+UL(["<b>Margin</b> = total revenue (harga × kuantitas) dikurangi total cost. Makin besar selisihnya, makin besar nilai yang ditambahkan.", "Organisasi juga bisa menambah nilai lewat kerja sama dengan supplier, customer, dan distributor. Ini disebut <b>value chain system</b>: value chain supplier (upstream value) dan value chain pihak lain berinteraksi dengan value chain organisasi.", "Setiap karyawan terlibat dalam suatu aktivitas, jadi strategi harus dikomunikasikan agar semua paham kaitannya dengan aktivitas lain."])),
C("Primary dan support activities",T(["Jenis", "Aktivitas", "Isi singkat"],[["Primary (langsung membuat dan menjual produk)", "Inbound logistics", "Menerima, menyimpan, dan mendistribusikan input"], ["", "Operations", "Mengubah input menjadi produk atau jasa"], ["", "Outbound logistics", "Menyimpan dan mendistribusikan produk jadi ke pelanggan"], ["", "Marketing and sales", "Membuat pelanggan tahu dan mau membeli"], ["", "Service", "Dukungan setelah penjualan, misalnya instalasi, pelatihan, dan perbaikan, untuk menjaga atau menambah nilai produk"], ["Support (memastikan primary berjalan efisien dan efektif)", "Procurement", "Pembelian input"], ["", "Technology development", "Pengembangan teknologi dan R&D"], ["", "Human resource management", "Perekrutan, pelatihan, dan pengelolaan SDM"], ["", "Firm infrastructure", "Mendukung seluruh value chain (mis. manajemen umum, keuangan)"]])+CALL("Tiga support pertama bisa dikaitkan dengan primary activity tertentu, sedangkan <b>firm infrastructure</b> mendukung seluruh value chain. Tiap kategori punya tiga jenis aktivitas yang memengaruhi competitive advantage: <b>direct</b> (menciptakan nilai bagi pembeli), <b>indirect</b> (memungkinkan aktivitas direct, mis. perawatan), dan <b>quality assurance</b>.")),
C("Linkages dalam value chain",P("<b>Linkages</b> adalah hubungan antara cara satu aktivitas dijalankan dan biaya atau kinerja aktivitas lain. Value chain bukan rangkaian aktivitas yang berdiri sendiri, melainkan <b>sistem aktivitas yang saling bergantung</b>.")+UL(["Porter: linkages bisa memberi competitive advantage lewat <b>optimization</b> dan <b>coordination</b>.", "Contoh: Toyota Production System (JIT) mengatur seluruh aspek produksi demi efisiensi.", "Linkages ke luar: produsen mobil Jepang mengatur value chain pemasok agar komponen datang tepat waktu (JIT); Wal-Mart mengelola hubungan dengan pemasok sambil memanfaatkan daya beli besarnya.", "Kemampuan mengelola linkages dalam value chain system bisa menjadi competence dan competitive advantage."])),
C("SWOT dan TOWS",P("SWOT dilakukan setelah audit lingkungan eksternal dan internal selesai. Pemahaman value chain membantu menunjukkan di mana strengths dan weaknesses berada. SWOT menilai <b>strategic fit</b> antara kapabilitas organisasi dan kebutuhan lingkungan.")+T(["Strategi TOWS", "Artinya"],[["SO", "Pakai strengths untuk memanfaatkan opportunities"], ["WO", "Atasi weaknesses agar bisa memanfaatkan opportunities"], ["ST", "Pakai strengths untuk mengatasi threats"], ["WT", "Minimalkan weaknesses agar terhindar dari threats"]])+CALL("SWOT adalah alat <b>audit dan analisis</b>, dipakai di awal. TOWS dipakai sesudahnya untuk <b>merumuskan strategi</b> dengan menggabungkan faktor internal dan eksternal.")+UL(["Daftar sering panjang dan semua dianggap sama bobotnya, padahal dampak tiap threat berbeda (mis. disruptive innovation).", "Strengths dan weaknesses tidak selalu bisa langsung diterjemahkan menjadi opportunities dan threats.", "Ambigu: satu faktor bisa menjadi strength sekaligus weakness (mis. toko di banyak lokasi: mudah dijangkau, tetapi fixed cost tinggi), atau opportunity sekaligus threat.", "SWOT bukan tujuan akhir; ia tidak memberi keputusan strategis."])),
C("Performance: shareholder value vs stakeholders",T(["", "Shareholder value", "Stakeholder"],[["Tokoh", "Milton Friedman", "Freeman"], ["Pandangan", "Tanggung jawab sosial organisasi hanya satu: menghasilkan laba sebesar mungkin bagi pemegang saham", "Organisasi melayani semua pihak yang memengaruhi atau dipengaruhi pencapaian tujuannya (customers, suppliers, employees, government, community, shareholders)"]])+P("Kriteria kinerja yang berbeda bisa menghasilkan kesimpulan yang bertentangan, sehingga alokasi sumber daya bisa tidak optimal. Karena itu pertanyaan dasarnya: untuk apa bisnis ada?")),
C("Balanced scorecard dan benchmarking",P("<b>Balanced scorecard</b> (Kaplan dan Norton) mengukur kinerja lebih luas dari ukuran keuangan. Alasannya: rasio keuangan hanya memberi gambaran masa lalu, dan strategi sering tidak diterjemahkan menjadi ukuran yang dipahami karyawan. BSC bukan alat merumuskan strategi, tetapi alat memastikan strategi berjalan.")+UL(["Empat perspektif dalam Henry: <b>customer, internal, financial, dan future</b> (inovasi dan pembelajaran).", "Ukuran keuangan tetap penting; BSC melengkapinya, bukan menggantikannya."])+P("<b>Benchmarking</b> membandingkan praktik organisasi dengan organisasi lain (tidak terbatas pada pesaing sejenis) untuk meniru atau memperbaiki praktik yang paling efisien. Xerox dikenal mengembangkannya; di Jepang dikenal praktik <i>Shukko</i>.")),
C("Resource-based view: resources dan capabilities",P("RBV melihat organisasi sebagai kumpulan resources dan capabilities yang bisa disusun ulang untuk meraih <b>sustainable competitive advantage</b>. Pendekatannya <i>inside-out</i>, berbeda dari Five Forces yang <i>outside-in</i>.")+T(["Konsep", "Artinya"],[["Resources", "Input untuk kegiatan organisasi. Berwujud (tangible): physical, financial, human. Tidak berwujud (intangible): mis. brand, paten, pengetahuan. Resources saja tidak bernilai sebelum dipakai."], ["Capabilities", "Kemampuan sekelompok resources bekerja sama untuk melakukan suatu tugas (Grant). Resources adalah sumber capabilities."], ["Threshold capability", "Dibutuhkan hanya untuk bisa bersaing di industri; semua pesaing memilikinya"], ["Distinctive capability", "Kapabilitas yang membedakan dan menjadi dasar keunggulan atas pesaing"]])),
C("VRIO framework (Barney)",T(["Huruf", "Pertanyaan", "Kalau ya"],[["V (Value)", "Apakah capability memungkinkan memanfaatkan opportunity atau menetralkan threat?", "Syarat dasar untuk bisa jadi keunggulan"], ["R (Rarity)", "Apakah hanya dimiliki sedikit pesaing?", "Kalau dimiliki banyak pesaing, tidak bisa jadi sustainable advantage"], ["I (Imitability)", "Apakah mahal bagi pihak lain untuk memperoleh atau meniru?", "Valuable dan rare saja hanya memberi keunggulan sementara"], ["O (Organization)", "Apakah organisasi sudah tertata untuk memanfaatkannya (control systems, prosedur, kebijakan)?", "Syarat yang diperlukan tetapi belum cukup tanpa organisasi yang mendukung"]])+CALL("Hanya capability yang <b>valuable, rare, costly to imitate, dan didukung organisasi</b> yang menghasilkan sustainable competitive advantage. Contoh imitasi: perusahaan dot.com 1990-an mendapat keunggulan sementara, lalu ditiru.")),
C("Make-or-buy dan core competence",UL(["Aktivitas yang dikerjakan organisasi dengan sangat baik adalah <b>core competence</b>.", "Aktivitas non-core bisa di-outsource ke pihak lain yang mampu menyediakan dengan biaya lebih rendah.", "Keputusan ini terkait erat dengan value chain dan seberapa jauh organisasi ingin <b>vertically integrated</b>.", "Contoh: British Airways menilai penyediaan makanan di pesawat bernilai tambah kecil dan lebih murah dibuat pasar."])),
C("Kritik RBV dan pengembangannya",UL(["<b>Kritik RBV:</b> kurang menjelaskan bagaimana resources dan capabilities berkembang dan berubah dari waktu ke waktu, serta bagaimana capabilities baru dibangun. Miller memperkenalkan <i>asymmetries</i>: cara-cara sulit ditiru yang membedakan perusahaan dari pesaingnya.", "<b>Knowledge-based view</b> (Nonaka, Grant): sumber utama sustainable competitive advantage adalah pengetahuan dan kemampuan menciptakan serta memakainya.", "<b>Dynamic capabilities</b> (Teece, Pisano, Shuen): kemampuan perusahaan mengintegrasikan, membangun, dan mengkonfigurasi ulang kompetensi internal dan eksternal untuk menghadapi lingkungan yang cepat berubah. Dibuat untuk mengatasi keterbatasan RBV."]))].join('')};

["Sebuah perusahaan menolak kontrak besar yang menguntungkan karena kontrak itu mengharuskan mengorbankan keselamatan pelanggan. Prinsip yang dipegang perusahaan ini paling tepat disebut…",["Vision","Goals jangka pendek","Core values","Template strategy"],2,"Core values (Collins dan Porras) adalah prinsip yang tidak dikorbankan demi keuntungan jangka pendek dan tidak ikut berubah saat persaingan berubah."],
["Karyawan merasa nilai pribadi mereka sejalan dengan nilai organisasi sehingga muncul komitmen emosional. Menurut Campbell, ini disebut…",["Mission statement","Theory of the business","Strategic fit","Sense of mission"],3,"Campbell membedakan mission (konsep intelektual untuk memandu kebijakan) dari sense of mission (komitmen emosional karena nilai organisasi cocok dengan nilai pribadi)."],
["Manajer menyusun strategi dengan maju dalam langkah-langkah kecil dari kondisi sekarang, bukan lewat rencana besar yang menyeluruh. Pendekatan ini dikaitkan dengan…",["Lindblom: muddling through","Andrews: pencocokan SWOT","Ansoff: growth vector","Porter: generic strategies"],0,"Lindblom (learning school) menyebutnya muddling through atau branch method: maju dalam langkah kecil dari kondisi sekarang."],

["Kaum rationalist melihat dominasi Honda di pasar motor AS sebagai strategi yang disengaja, sedangkan Mintzberg melihatnya sebagai…",["Strategi unrealized","Strategi emergent","Corporate strategy","Strategi cost leadership"],1,"Mintzberg melihat keberhasilan Honda sebagai emergent strategy yang muncul dari pembelajaran. Strategi yang viable biasanya punya unsur deliberate dan emergent."],
["Pada 1990-an banyak perusahaan melakukan downsizing dan outsourcing sambil memusatkan diri pada core competences. Pendekatan yang berkembang pada masa itu adalah…",["Corporate planning berbasis budget","Diversification ala Ansoff","Resource-based view","Analisis competitive forces"],2,"1990-an: RBV (Grant, Kay, Prahalad dan Hamel). Competitive forces dominan di 1980-an, diversification di 1970-an, corporate planning di 1960-an."],
["Mana yang termasuk alat operational management menurut Henry?",["Scenario planning dan PEST","Five Forces dan value net","Diversification dan merger","Total quality management, benchmarking, outsourcing, dan business process re-engineering"],3,"Operational management adalah pencarian efisiensi dengan alat seperti TQM, benchmarking, outsourcing, dan BPR. Tiga pilihan lain adalah alat analisis strategi atau cara tumbuh."],
["Sebuah perusahaan memperbaiki akuntansi, SDM, dan teknologinya sampai setara praktik terbaik industri. Mengapa Henry menilai hal itu bukan strategi?",["Karena akuntansi dan SDM tidak berpengaruh pada kinerja","Karena strategi hanya berkaitan dengan keuangan","Karena praktik terbaik bisa ditiru pesaing, dan keberhasilan satu perusahaan tidak merugikan yang lain","Karena strategi tidak boleh bersifat oportunistik"],2,"Strategi berdasar apa yang tidak bisa atau tidak mudah dilakukan pesaing. Best practice industri bisa disalin, jadi itu operational management."]];
const E1=[["Bedakan strategy, strategic management, dan business model.", "<b>Strategy</b>: pilihan aktivitas yang berbeda untuk meraih competitive advantage. <b>Strategic management</b>: prosesnya (analysis, formulation, implementation) yang saling bergantung. <b>Business model</b>: cerita tentang bagaimana organisasi bekerja dan menghasilkan uang; harus melengkapi strategi bersaing."],
["Jelaskan tiga level strategi dan beri contoh.", "Corporate (industri mana yang dimasuki, M&A, alokasi sumber daya antar SBU; contoh Unilever dan Dollar Shave Club). Business (cara bersaing di satu industri; manajer SBU otonom). Functional (keputusan per fungsi seperti R&D, marketing, finance untuk mendukung business strategy)."],
["Bandingkan rationalist school dan learning school. Bagaimana keduanya menjelaskan keberhasilan Honda?", "Rationalist: analisis lalu memilih strategi terbaik (SWOT). Learning: strategi muncul bertahap lewat pembelajaran. Rationalist melihat Honda sebagai strategi yang disengaja, Mintzberg melihatnya sebagai emergent strategy. Strategi yang viable biasanya punya unsur keduanya."],
["Mengapa theory of the business bisa membuat perusahaan besar gagal? Jelaskan dengan Intel.", "Asumsi tentang market, pelanggan, pesaing, dan kapabilitas bisa tidak cocok lagi dengan kenyataan. Intel tetap yakin pada memory chip walau pesaing Jepang menguasai pasar (30% menjadi 60%), karena sumber daya dan keyakinan terpusat di sana. Itu Icarus paradox."],
["Gambarkan kerangka strategic management Henry dan hubungan antar elemennya.", "Values menentukan goals. Goals menentukan resources and capabilities serta structure and processes. Strategy menghubungkan organisasi (strengths dan weaknesses) dengan lingkungan (opportunities dan threats). Stakeholders berhubungan dua arah dengan strategy, dan ada feedback bila intended strategy berubah."]];

["Menurut Christensen, perusahaan kecil menembus incumbent dengan cara…", ["Menyasar segmen yang diabaikan incumbent dengan fungsi sesuai dan harga lebih rendah, lalu naik ke upmarket", "Menunggu regulasi", "Meniru produk incumbent", "Menyerang segmen high-end"], 0, "Incumbent sibuk mengejar pelanggan paling menguntungkan di high-end."],
["Menyapu lingkungan secara luas untuk menemukan weak signals, sebelum tahu mana yang penting, adalah aktivitas…",["Scanning","Monitoring","Forecasting","Benchmarking"],0,"Scanning adalah kuas lebar untuk menemukan weak signals. Monitoring melacak sinyal sampai menjadi pola, dan forecasting membuat prakiraan tren."],
["Tim strategi membuat prakiraan arah sebuah tren agar strategi bisa disiapkan sebelum tren itu menjadi ancaman besar. Aktivitas ini disebut…",["Scanning","Monitoring","Benchmarking","Forecasting"],3,"Forecasting adalah membuat prakiraan tren sebelum menjadi ancaman besar, sehingga organisasi sempat menyiapkan strategi."],
["Penyewaan DVD kehilangan pelanggan ke streaming. Penjualan dan profit turun, persaingan harga ketat, sebagian pemain keluar atau berkonsolidasi. Tahap industry life cycle yang paling sesuai adalah…",["Introduction","Growth","Maturity","Decline"],3,"Pada decline penjualan dan profit turun, loyalitas pindah ke teknologi baru, terjadi persaingan harga, dan perusahaan keluar atau berkonsolidasi."],
["Beberapa produsen mobil di industri yang sama berada di harga tinggi dengan product range sempit, sedangkan yang lain di harga rendah dengan range luas. Kelompok-kelompok ini digambarkan di strategic map sebagai…",["Complementors","Strategic groups","Substitutes","Value net"],1,"Strategic group adalah perusahaan dalam satu industri yang bersaing dengan posisi strategis serupa, dan posisinya digambarkan di strategic map."],

const E2=[["Bedakan scanning, monitoring, dan forecasting. Mengapa weak signals penting?", "Scanning: pemindaian luas untuk menemukan weak signals. Monitoring: melacak sinyal sampai jadi pola. Forecasting: prakiraan tren. Weak signals sering menjadi tanda awal perubahan di competitive environment dan disrupsi."],
["Kapan scenario planning dipakai dan bagaimana langkahnya?", "Dipakai untuk structural uncertainties (kejadian unik tanpa data probabilitas). Langkahnya: scope, stakeholders, basic trends, key uncertainties, scenario themes, cek konsistensi, learning scenarios, research needs, model kuantitatif."],
["Jelaskan PEST dan keterbatasannya.", "PEST: political, economic, social, technological (PESTLE menambah legal dan environmental). Keterbatasan: bukan 'shopping list', implikasi tiap faktor harus ditarik ke industri, dan perubahan cepat sulit diprediksi."],
["Analisislah industri dengan Five Forces. Apa keterbatasannya dan bagaimana value net melengkapinya?", "Lima forces: threat of new entrants, buyers, suppliers, substitutes, rivalry. Keterbatasan: asumsi zero-sum dan statis. Value net menambah complementors sebagai kekuatan keenam dan melihat peluang win–win."],
["Jelaskan industry life cycle dan hubungannya dengan rivalry.", "Introduction, growth, maturity, decline. Rivalry menguat di maturity karena pasar jenuh dan pangsa hanya bisa diambil dari pesaing; di decline persaingan harga dan konsolidasi."],
["Bedakan hypercompetition dan disruptive innovation.", "Hypercompetition (D'Aveni): gerakan kompetitif cepat dan intens antar pesaing. Disruptive innovation (Christensen): entrant kecil menyasar segmen yang diabaikan incumbent dengan harga lebih rendah, lalu naik ke upmarket."]];
CONTENT.s4={kicker:'Sesi 4 · Henry Ch. 6',title:'Business Strategy dan Functional Planning',desc:'Peran business strategy, generic strategies Porter (cost leadership, differentiation, focus, stuck in the middle), experience curve dan economies of scale, hybrid strategy, blue ocean strategy (value innovation, strategy canvas, ERRC), dan posisi functional strategy.',
materi:[C("Business strategy: menjawab 'bagaimana kita bersaing?'",P("<b>Business strategy</b> (competitive strategy) adalah strategi di level <b>satu unit bisnis</b>, yaitu strategic business unit (SBU): bagian organisasi yang fokus pada market tertentu untuk produk dan jasanya. Tujuannya selalu sama: meraih <b>sustainable competitive advantage</b>.")+T(["", "Corporate strategy", "Business strategy"],[["Pertanyaan pokok", "Bisnis atau market mana yang ingin kita masuki? (Ch. 7)", "Bagaimana kita bersaing di market yang sudah dipilih?"], ["Dipegang oleh", "Parent company dan manajemen puncak", "Manajer SBU, yang biasanya punya otonomi cukup besar karena paham market, pelanggan, dan pesaing lokal"], ["Batasan", "Menentukan arah keseluruhan", "Tidak boleh lepas dari corporate strategy; manajer SBU harus menunjukkan kontribusinya"]])+DEF("Market vs industry","<b>Market</b> ditentukan oleh kondisi <b>demand</b> (pelanggan dan calon pelanggan). <b>Industry</b> ditentukan oleh kondisi <b>supply</b> (misalnya teknologi atau saluran distribusi yang sama). Dengan memilih market yang dilayani, organisasi otomatis menentukan industri tempatnya bersaing.","Kulkas dan mesin cuci memakai teknologi dan saluran distribusi yang mirip, jadi ada industri peralatan rumah tangga. Tetapi marketnya berbeda: penyimpanan makanan dingin vs layanan mencuci pakaian.")),
C("Tiga generic strategies (Porter)",P("Competitive advantage berarti melakukan aktivitas yang berbeda, atau aktivitas yang sama dengan cara berbeda, sehingga menghasilkan <b>nilai yang diakui pelanggan lebih unggul dari pesaing</b>. Ada dua jalan: (1) <b>harga lebih rendah</b> tanpa mengorbankan kualitas, atau (2) <b>produk berdiferensiasi</b> yang dinilai lebih bernilai sehingga bisa dijual dengan premium price. Selain itu, organisasi memilih <b>scope</b>: melayani banyak segmen (broad) atau satu niche. Strategi ini disebut generic karena berlaku untuk berbagai jenis organisasi dan industri.")+T(["Strategi", "Inti", "Contoh dalam Henry"],[["Overall cost leadership", "Menjadi produsen berbiaya terendah di industri dengan tetap memenuhi standar industri, target broad market", "Ryanair (no-frills), Toyota"], ["Differentiation", "Produk atau jasa dipersepsikan unik atau superior, pelanggan mau bayar premium, target broad market", "Apple (desain inovatif)"], ["Focus", "Melayani satu segmen atau niche (kelompok pelanggan, wilayah, atau lini produk) dengan lebih efisien", "Burberry, Aldi, Jaguar F-Pace"]])+T(["Scope \\ Sumber keunggulan", "Biaya rendah", "Differentiation"],[["Industry-wide (broad)", "Overall cost leadership", "Differentiation"], ["Segment only (narrow)", "Cost focus", "Differentiation focus"]])+CALL("Apa pun scope-nya, organisasi tetap harus bersandar pada <b>biaya rendah atau differentiation</b>. Tiap strategi butuh resources, capabilities, dan pengaturan organisasi yang berbeda. Karena itu Porter memperingatkan agar tidak mengejar ketiganya sekaligus.")),
C("Overall cost leadership",P("Organisasi mengejar biaya terendah di industri dan menyasar pasar luas. Porter menyebut tindakan yang diperlukan:")+UL(["Membangun fasilitas berskala efisien secara agresif","Mengejar penurunan biaya dari pengalaman (experience)","Mengendalikan biaya dan overhead dengan ketat","Menghindari akun pelanggan marginal","Meminimalkan biaya di R&D, service, sales force, dan iklan"])+P("Yang dikendalikan bukan satu aktivitas saja, melainkan <b>seluruh aktivitas value chain</b> (lihat Sesi 3) dan koordinasi antar aktivitasnya. Strategi ini biasanya berarti pangsa pasar tinggi dan produk standar dengan komponen yang sama, sehingga tercapai economies of scale.")+DEF("Virtuous circle","Margin yang lebih tinggi dari posisi biaya rendah memungkinkan reinvestasi di pabrik dan peralatan, yang menurunkan biaya lagi, yang menaikkan margin lagi.","Toyota memakai lean manufacturing di seluruh value chain. Menurut Henry, pendapatan tahunannya lebih besar daripada gabungan tiga produsen mobil terbesar AS, dan laba per mobilnya lebih dari empat kali General Motors. Mobil baru berbagi platform dengan model yang sudah ada untuk menekan biaya.")),
C("Experience curve dan economies of scale",DEF("Experience curve (Boston Consulting Group, 1968)","Hubungan antara biaya produksi dan <b>akumulasi pengalaman</b>. Setiap kali output berlipat dua, biaya per unit turun sekitar <b>20–30%</b> (persentase pastinya berbeda antar industri).","Produk berbiaya £10 per unit pada 100 unit. Ketika output menjadi 200 unit, biaya turun ke sekitar £7–£8 per unit.")+P("Pemimpin pasar punya pengalaman paling banyak, sehingga selisih biayanya dengan pesaing makin lebar. Implikasinya: tumbuhlah untuk menambah pengalaman, dan tetapkan harga berdasarkan <b>antisipasi penurunan biaya</b> untuk menekan pesaing dan menambah pangsa. Kemampuan belajar ini terkait dynamic capability (Ch. 5). Dalam praktik laju penurunan biaya cenderung mengecil seiring waktu, dan bila pengalaman kumulatif kurang penting di suatu industri, faktor lain bisa lebih menentukan.")+T(["Kondisi", "Artinya", "Penyebab atau catatan"],[["Economies of scale", "Volume naik, biaya rata-rata jangka panjang (LRATC) turun", "Perusahaan besar bisa membeli peralatan khusus berkapasitas besar; khas industri berbiaya tetap tinggi (pesawat, pabrik bir)"], ["Constant returns to scale", "Output naik proporsional dengan biaya; LRATC datar", "Berada di antara economies dan diseconomies"], ["Diseconomies of scale", "Output naik, biaya naik lebih dari proporsional; LRATC naik", "Manajemen kewalahan mengelola kompleksitas dan koordinasi; spesialisasi berlebihan menurunkan motivasi pekerja dan kualitas"]])),
C("Keunggulan dan risiko cost leadership",T(["", "Isi"],[["Keunggulan", "Tetap untung di tengah persaingan sengit: saat pesaing berbiaya lebih tinggi saling menggerus profit, cost leader masih punya margin"], ["Terhadap buyers", "Pembeli hanya bisa menekan harga sampai level pesaing paling efisien berikutnya, cost leader masih positif"], ["Terhadap suppliers", "Menjadi lindung nilai (hedge) saat harga input naik, misalnya bahan bakar bagi Ryanair"], ["Terhadap entrants dan substitutes", "Harga rendah menjadi barrier to entry; rasio harga-kinerja unggul melawan substitusi (Ryanair vs ferry dan Eurotunnel)"], ["Risiko", "Biaya update peralatan modal terus-menerus; mudah ditiru; perubahan teknologi menggugurkan investasi lama; selera pelanggan bergeser ke produk berdiferensiasi dan kurang sensitif harga"]])+CALL("Porter merangkum risiko semua generic strategy menjadi dua: <b>gagal mencapai atau mempertahankan strategi</b>, atau <b>nilai keunggulannya terkikis</b> seiring evolusi industri.")),
C("Differentiation strategy",P("Organisasi bersaing lewat produk atau jasa yang diakui pelanggan sebagai unik, dan perbedaannya cukup bernilai sehingga pelanggan mau membayar premium. <b>Biaya membuat diferensiasi harus lebih kecil daripada harga premium yang dikenakan.</b> Meski tidak fokus pada biaya, struktur biaya tetap perlu diketahui.")+T(["Dasar diferensiasi", "Contoh dalam Henry"],[["Desain produk atau brand image", "BMW, Apple, Dyson"], ["Kustomisasi sesuai kebutuhan pelanggan", "Apple"], ["Teknologi mutakhir", "Dyson, Intel, Amazon"], ["Kemampuan marketing", "Procter & Gamble, Amazon, Apple"], ["Reliability", "Toyota, BMW"], ["Customer service", "John Lewis, Amazon"]])+P("Biasanya perusahaan memakai lebih dari satu dimensi sekaligus, dan dapat menunjuk aktivitas value chain mana yang membedakannya dari pesaing. Semakin sulit ditiru dasar diferensiasinya, semakin besar peluang keunggulan yang berkelanjutan.")+T(["", "Isi"],[["Keunggulan", "Brand loyalty melindungi dari perang harga (rivalry); entrant harus mengatasi loyalitas dan keunikan produk; buyers kurang kuat karena tidak ada alternatif sebanding; margin tinggi membantu menghadapi tekanan biaya supplier; loyalitas pelanggan melindungi dari substitutes"], ["Risiko", "Harga premium terlalu jauh di atas pesaing sehingga pelanggan merasa tidak sepadan; kebutuhan pembeli terhadap produk berdiferensiasi menurun (internet menurunkan biaya mencari dan membandingkan produk); pesaing mempersempit atribut diferensiasi sehingga muncul substitusi yang layak"]])),
C("Focus strategy: cost focus dan differentiation focus",P("Berbeda dari dua strategi lain yang menyasar seluruh industri, <b>focus strategy</b> melayani satu atau beberapa segmen saja. Dengan fokus, organisasi bisa lebih tepat memenuhi kebutuhan segmen daripada pesaing yang melayani seluruh industri. Keunggulan didapat lewat biaya rendah <b>atau</b> diferensiasi di segmen itu.")+T(["", "Cost focus", "Differentiation focus"],[["Inti", "Menjadi cost leader hanya di satu segmen", "Menawarkan produk unik yang sangat dihargai di satu segmen"], ["Logika", "Pesaing besar punya keunggulan skala tetapi sulit efisien di produksi kecil atau pesanan khusus yang tidak bisa distandarkan", "Kebutuhan khusus segmen lebih baik dipenuhi niche player; membangun brand loyalty dan mempersulit entrant"], ["Contoh Henry", "Aldi: toko kecil (sekitar 15.000 sq ft), sekitar 700 produk dengan 95% store brand (vs lebih dari 25.000 produk di supermarket biasa), barang disimpan di pallet agar restock cepat. Kualitas tidak dikorbankan.", "Jaguar F-Pace: SUV mewah berperforma tinggi untuk pelanggan muda yang aktif; Burberry di fashion kelas atas"]])+CALL("<b>Risiko focus:</b> segmen tidak tahan lama (selera berubah dan niche player sulit menyesuaikan); pesaing broad-based menganggap segmen itu menarik lalu out-focus sang focuser; perbedaan antara segmen dan pasar utama menyempit.")),
C("Stuck in the middle, hybrid strategy, dan kritik generic strategies",P("<b>Stuck in the middle</b> (Porter): organisasi yang mencoba lebih dari satu generic strategy. Ia tidak punya pangsa dan investasi untuk jadi cost leader, tidak punya diferensiasi industri-wide, dan tidak punya kemampuan fokus di segmen tertentu. Menurut Porter, setiap generic strategy saling tidak konsisten sehingga organisasi harus membuat pilihan tegas. Namun, bukti empirisnya tidak sejelas itu.")+VS("Stuck in the middle vs hybrid strategy",["Stuck in the middle","Gagal karena tidak unggul di biaya maupun diferensiasi.",null,["<b>Sainsbury's:</b> menjual makanan lebih mahal tetapi dengan slogan harga murah; tidak cukup terdiferensiasi untuk premium dan tidak cukup murah untuk bersaing harga, lalu kehilangan kepemimpinan dari Tesco.","<b>Marks & Spencer:</b> pakaian tidak lagi dianggap bernilai istimewa; lini produk usang, identitas hilang, tujuan tidak koheren."]],["Hybrid strategy","Menggabungkan biaya rendah dan diferensiasi secara sengaja; sering saling melengkapi karena cost leader punya dana untuk investasi diferensiasi.",null,["<b>IKEA:</b> produksi berbiaya rendah dengan produk terdiferensiasi.","<b>Toyota:</b> cost leader sekaligus dikenal reliable, sehingga punya brand loyalty.","Studi Pertusa-Ortega dan kolega atas 164 perusahaan Spanyol: hybrid banyak dipakai dan cenderung berkinerja lebih baik daripada satu generic strategy saja."]],"Hasil empiris campuran: sebagian bukti mendukung bahaya stuck in the middle, sebagian mendukung hybrid. Henry menyebut buktinya ambigu.")+UL(["<b>Kritik lain:</b> Porter dianggap statis dan sulit menghadapi lanskap kompetitif yang dinamis.","<b>John Kay:</b> tiap organisasi punya capabilities berbeda sehingga mencari resep generik pasti gagal; nilai resep itu hilang begitu dikenali dan dipakai semua orang."])+CALL("<b>Era digital dan AI (soal latihan UTS):</b> keduanya tetap relevan, tinggal disesuaikan. Generic strategies = memilih cara bersaing. Blue ocean = menciptakan pasar baru. Digital dan AI = alat untuk menjalankan keduanya. Ini rangkuman penerapan, bukan dari Henry.")),
C("Blue ocean strategy (Kim dan Mauborgne)",P("Kim dan Mauborgne menyarankan perusahaan menciptakan dan merebut <b>blue ocean</b>, yaitu ruang pasar yang belum diperebutkan. Mereka membagi dunia bisnis menjadi red ocean dan blue ocean.")+T(["", "Red ocean", "Blue ocean"],[["Arti", "Semua industri yang ada sekarang (known market space); batas industri jelas dan diterima pesaing", "Industri yang belum ada sekarang (unknown market space); posisi strategis yang belum ditempati pesaing"], ["Tujuan", "Mengungguli pesaing dan merebut pangsa dari permintaan yang sudah ada", "Menciptakan permintaan baru dan pertumbuhan yang sangat menguntungkan"], ["Akibat", "Makin banyak yang bersaing untuk permintaan terbatas, laba dan pertumbuhan turun, produk menjadi komoditas (blood-red ocean)", "Persaingan menjadi tidak relevan"]])+P("Blue ocean bisa dibuat di luar batas industri yang ada (contoh: eBay untuk lelang online), tetapi <b>kebanyakan dibuat di dalam red ocean</b> dengan memperluas batas industri yang ada. Red ocean tetap penting, tetapi bila penawaran melebihi permintaan, memperebutkan pangsa pasar yang menyusut tidak mengarah ke pertumbuhan berkelanjutan.")+P("Studi Kim dan Mauborgne atas 108 peluncuran bisnis:")+T(["", "Porsi peluncuran", "Porsi total revenue", "Porsi total laba"],[["Perbaikan inkremental di red ocean", "86%", "62%", "39%"], ["Menciptakan blue ocean", "14%", "38%", "61%"]],"calc")+DEF("Unit analisis: strategic move","Kim dan Mauborgne menyimpulkan bahwa perusahaan maupun industri bukan unit analisis terbaik untuk memahami pertumbuhan yang menguntungkan. Yang dianalisis adalah <b>strategic move</b>, yaitu rangkaian tindakan dan keputusan manajerial untuk membuat penawaran yang menciptakan pasar baru dan menaikkan permintaan secara substansial.","Foster dan Kaplan: sukses perusahaan seperti Hewlett-Packard ternyata berasal dari kinerja seluruh sektor industri (rising tide lifts all boats), bukan dari perusahaannya sendiri.")+DEF("Value innovation","Terjadi saat organisasi bergeser dari mengalahkan pesaing ke membuat persaingan tidak relevan, dengan penekanan yang sama pada <b>value</b> dan <b>innovation</b>. Value tanpa inovasi hanya memberi perbaikan inkremental. Inovasi tanpa value cenderung didorong teknologi dan melampaui kesediaan pelanggan membayar. Value innovation tercapai bila inovasi diselaraskan dengan <b>utility, price, dan cost</b>. Konsep ini bertentangan dengan pandangan Porter bahwa organisasi memilih differentiation atau low cost: perusahaan blue ocean bisa menempuh keduanya sekaligus, karena batas pasar dan struktur industri tidak dianggap tetap.","Cirque du Soleil (berdiri 1984) melihat ke seberang batas pasar sirkus dan teater, serta memahami noncustomers (mis. penonton teater dan balet) sehingga bisa menaikkan nilai bagi pembeli sambil menurunkan biaya.")+P("Kim dan Mauborgne membagi <b>noncustomers</b> menjadi tiga: pembeli yang hanya minimal membeli penawaran industri, pembeli yang menolak memakainya, dan pembeli yang tidak pernah menganggap penawaran itu sebagai pilihan.")+CALL("<b>Strategy canvas dan value curve.</b> Sumbu horizontal strategy canvas memuat faktor yang menjadi dasar persaingan dan investasi industri. Sumbu vertikal menunjukkan nilai yang ditawarkan ke pembeli untuk tiap faktor. Garis hasil plot disebut <b>value curve</b>. Benchmarking terhadap pesaing hanya memperbaiki penjualan secara inkremental dan tidak membuka ruang pasar baru. Fokus strategi perlu bergeser dari pesaing saat ini ke alternatif dan noncustomers.")+DEF("Four Actions Framework dan ERRC grid","Empat pertanyaan untuk membentuk value curve baru. Hasilnya diisi ke <b>eliminate-raise-reduce-create (ERRC) grid</b>.",null,null)+T(["Tindakan", "Pertanyaan", "Contoh Cirque du Soleil"],[["Eliminate", "Faktor mana yang dianggap wajar oleh industri tetapi sebaiknya dieliminasi?", "Pertunjukan hewan, bintang sirkus, dan banyak arena (tiga ring)"], ["Reduce", "Faktor mana yang sebaiknya dikurangi jauh di bawah standar industri?", "Humor slapstick dan unsur menegangkan"], ["Raise", "Faktor mana yang sebaiknya dinaikkan jauh di atas standar industri?", "Kenyamanan venue (satu tenda yang lebih mewah)"], ["Create", "Faktor mana yang sebaiknya diciptakan karena belum pernah ditawarkan industri?", "Banyak produksi dengan alur cerita dan musik orisinal, serta tarian dari balet"]])+P("Eliminate dan reduce menurunkan struktur biaya. Raise dan create menaikkan nilai bagi pembeli dan menciptakan permintaan baru. Manfaat ERRC grid: mudah dipahami manajer sehingga mendorong keterlibatan, dan memaksa perusahaan menilai faktor persaingan industri sehingga asumsi yang tidak disadari menjadi eksplisit.")+CALL("Strategi blue ocean yang dilihat lewat value curve harus punya tiga ciri: <b>focus</b> (tidak menghamburkan sumber daya bersaing di semua faktor), <b>divergence</b> (value curve berbeda dari pemain lain karena tidak lagi membenchmark pesaing), dan <b>compelling tagline</b> (pesan yang jelas bagi konsumen).")+P("<b>Blue ocean idea (BOI) index</b> adalah urutan uji untuk merumuskan strategi blue ocean:")+'<div class="tags flow"><span>Buyer utility</span><span>Price</span><span>Target cost</span><span>Hambatan adopsi</span></div>'+P("Tahap pertama bertanya apakah penawaran memberi pembeli utilitas luar biasa (termasuk bagi tiga tingkat noncustomers). Tahap kedua menanyakan apakah harga bisa menarik mayoritas pembeli. Tahap ketiga menanyakan apakah laba yang wajar bisa dicapai pada harga itu (contoh: Tata Nano mencapai target cost lewat penyederhanaan operasi dan inovasi biaya manufaktur). Tahap terakhir memastikan tidak ada hambatan adopsi, karena manajer terbiasa bersaing di red ocean sehingga perubahan ini bisa ditolak.")+CALL("Ringkasan Kim dan Mauborgne: fokus blue ocean strategy bukan membatasi output dengan harga lebih tinggi, melainkan <b>menciptakan permintaan agregat baru lewat lompatan nilai pada harga yang terjangkau</b>."),"Henry 6.4"),
C("Functional strategy: posisi dalam kerangka Henry",P("Henry hanya membahas singkat (Ch. 1, bagian 1.4.3). <b>Functional (operational) strategy</b> adalah keputusan menurut lini fungsi seperti <b>R&D, marketing, dan finance</b> yang mendukung business strategy. Henry menilai istilah 'operational strategy' kurang tepat (sebenarnya operational management), sehingga ia memasukkannya ke dalam pembahasan business strategy.")+CALL("<b>Catatan sumber:</b> RPKPS Sesi 4 juga mencantumkan subtopik marketing/STP/branding/pricing, HR, R&D, operations, dan purchasing yang bersumber dari <b>Modul IAI Bab V dan Bab XI</b>. Modul itu belum ada di berkas yang diunggah, jadi rincian per fungsi belum dimasukkan ke hub ini agar tidak menebak isinya. Tabel di bawah hanya pemetaan bantu dari logika Henry Ch. 6 (bukan kutipan Henry atau IAI).")+T(["Fungsi", "Bila business strategy = cost leadership", "Bila business strategy = differentiation"],[["Marketing", "Fokus pada produk standar dan volume besar; hindari akun marginal; pengeluaran iklan ditekan", "Membangun brand image, kustomisasi, dan kemampuan marketing sebagai dasar premium price"], ["R&D", "Biaya R&D diminimalkan; investasi diarahkan ke proses yang menekan biaya", "Teknologi dan inovasi produk sebagai sumber keunikan"], ["Operations", "Fasilitas berskala efisien, lean, kejar kurva pengalaman", "Menjaga reliability dan kualitas yang menopang diferensiasi"], ["Purchasing / HR / Finance", "Pengendalian biaya dan overhead ketat di seluruh value chain", "Mendukung layanan, talenta, dan investasi pada aktivitas pembeda"]])+P("Intinya: keputusan fungsional harus <b>selaras</b> dengan generic strategy yang dipilih, dan seluruh aktivitas value chain perlu terkoordinasi."))].join('')};
