const Q4=[["Sebuah toko menjual produk kualitas menengah dengan slogan harga murah, tetapi struktur biayanya sama dengan pesaing dan produknya tidak dipersepsikan istimewa. Diagnosis menurut Porter?", ["Differentiation focus", "Stuck in the middle", "Blue ocean", "Cost focus"], 1, "Tidak punya pangsa dan investasi untuk menjadi cost leader, dan tidak punya keunikan untuk premium price. Mirip kasus Sainsbury's dalam Henry."], ["Biaya produksi per unit Rp100.000 pada volume 1.000 unit. Bila industri mengikuti experience curve dengan penurunan 20% setiap output berlipat dua, perkiraan biaya per unit pada 4.000 unit adalah…", ["Rp40.000", "Rp64.000", "Rp60.000", "Rp80.000"], 1, "1.000 ke 2.000 ke 4.000 = dua kali penggandaan: 100.000 x 0,8 x 0,8 = Rp64.000. Henry menyebut penurunan 20–30% per penggandaan, tergantung industri."], ["Pabrik menggandakan output, tetapi biaya total naik 2,6 kali. Istilah dan penyebab yang paling sesuai dengan Henry adalah…", ["Diseconomies of scale; manajemen kewalahan mengelola kompleksitas dan koordinasi, dan spesialisasi berlebihan menurunkan motivasi", "Experience curve; pembelajaran menurunkan biaya", "Constant returns to scale; biaya naik proporsional", "Economies of scale; pembelian peralatan khusus"], 0, "Output naik tetapi biaya naik lebih dari proporsional: LRATC mulai naik."], ["Merek elektronik premium menjual 40% di atas pesaing. Kini situs perbandingan memudahkan pembeli membandingkan spesifikasi, dan pesaing menyamai fitur utamanya. Risiko differentiation yang paling terwujud adalah…", ["Pembeli menilai premium tidak sepadan dan atribut pembeda menyempit sehingga loyalitas turun", "Pemasok menaikkan harga input", "Segmen niche menghilang", "Biaya produksi tidak terkendali"], 0, "Henry: internet menurunkan search costs, dan pesaing yang mempersempit atribut diferensiasi menghadirkan substitusi yang layak."], ["Jaringan diskon kecil dengan sekitar 700 produk (mayoritas store brand) dan barang disimpan di pallet merebut pangsa supermarket besar. Mengapa supermarket tradisional sulit menirunya?", ["Karena regulasi melarang", "Karena mereka tidak punya pelanggan", "Karena produk store brand selalu lebih mahal", "Karena butuh capabilities dan struktur biaya yang berbeda dari model broad dengan puluhan ribu produk"], 3, "Contoh cost focus Aldi: strategi mengandalkan capabilities berbeda (strategy bergantung pada resources dan capabilities, bukan sekadar niat meniru)."], ["Perusahaan mebel menekan biaya lewat desain flat-pack dan sekaligus dikenal desain khasnya. Penilaian yang paling tepat menurut Henry adalah…", ["Focus strategy murni", "Pasti stuck in the middle karena Porter melarang kombinasi", "Hybrid strategy; Porter memperingatkan risiko stuck in the middle, tetapi bukti empiris (mis. 164 perusahaan Spanyol) menunjukkan hybrid bisa berkinerja lebih baik", "Blue ocean; tidak ada pesaing"], 2, "IKEA dan Toyota adalah contoh hybrid; Henry menyebut bukti empiris tentang stuck in the middle ambigu."], ["John Kay mengkritik generic strategies. Argumen intinya adalah…", ["Cost leadership selalu gagal", "Biaya penerapannya terlalu tinggi", "Karena capabilities tiap organisasi berbeda dan resep umum yang dikenali dipakai semua orang, nilainya hilang", "Porter salah mengidentifikasi lima forces"], 2, "Dalam kata-kata Henry: resep seperti itu tidak bisa ada karena nilainya rusak oleh fakta bahwa resep itu dikenali."], ["Saat perang harga di industri, cost leader tetap untung sementara pesaing berbiaya lebih tinggi rugi. Mekanisme yang benar adalah…", ["Pembeli hanya dapat menekan harga sampai level pesaing paling efisien berikutnya, sehingga cost leader masih memiliki margin", "Cost leader selalu menaikkan harga paling akhir", "Cost leader tidak terkena substitutes", "Pemerintah memberi subsidi"], 0, "Biaya terendah membuat cost leader masih positif setelah pesaing menggerus profit lewat rivalry."], ["Perusahaan memilih differentiation berbasis reliability dan layanan, tetapi divisi pembelian memilih pemasok termurah berkualitas rendah dan anggaran R&D dipangkas. Masalah utamanya adalah…", ["Perusahaan terlalu banyak berinvestasi di marketing", "Corporate parent menghambat", "Industri terlalu kecil", "Functional strategies tidak selaras dengan business strategy yang dipilih"], 3, "Henry: functional strategy mendukung business strategy; keputusan fungsional harus konsisten dengan generic strategy."], ["Manajer SBU mengusulkan strategi harga rendah, padahal corporate strategy menempatkan grup sebagai pemain premium. Menurut Henry…", ["SBU harus menghentikan semua penjualan", "Corporate strategy hanya berlaku untuk perusahaan induk", "Manajer SBU punya otonomi, tetapi harus menunjukkan bahwa business strategy-nya berkontribusi pada corporate strategy", "SBU bebas sepenuhnya karena punya otonomi"], 2, "Otonomi muncul dari pengetahuan market lokal, namun tidak boleh lepas dari arah korporat."],
["Kulkas dan mesin cuci memakai teknologi dan saluran distribusi yang mirip, tetapi melayani kebutuhan pelanggan yang berbeda. Menurut Henry, ini menunjukkan bahwa…",["Keduanya satu market sekaligus satu industri","Industri ditentukan sisi supply dan market ditentukan sisi demand, sehingga satu industri bisa melayani beberapa market","Market ditentukan oleh kesamaan teknologi","Industri ditentukan oleh jumlah pesaing"],1,"Market ditentukan kondisi demand (pelanggan), industry ditentukan kondisi supply (teknologi atau saluran distribusi yang sama)."],
["Margin tinggi dari posisi biaya rendah direinvestasikan di pabrik dan peralatan, yang menurunkan biaya lagi dan menaikkan margin lagi. Siklus ini disebut…",["Virtuous circle","Vicious circle","Experience curve","Stuck in the middle"],0,"Virtuous circle adalah ciri cost leadership: margin tinggi, reinvestasi, biaya turun, margin naik lagi."],
["Tindakan yang sesuai untuk mengejar overall cost leadership menurut Porter adalah…",["Menambah belanja iklan besar-besaran","Menambah variasi kustomisasi per pelanggan","Menaikkan belanja R&D untuk produk eksklusif","Menghindari akun pelanggan marginal dan menekan overhead"],3,"Porter: bangun fasilitas berskala efisien, kejar penurunan biaya dari pengalaman, kendalikan biaya dan overhead, hindari akun marginal, minimalkan biaya R&D, service, sales force, dan iklan."],
["Biaya fitur eksklusif yang ditambahkan sebesar Rp30 per unit, sedangkan harga premium yang bisa dikenakan hanya Rp20 per unit. Menurut Henry, strategi diferensiasi ini…",["Layak karena produknya menjadi unik","Layak asal pelanggan loyal","Tidak layak karena biaya diferensiasi lebih besar dari premium yang dikenakan","Tidak relevan karena strategi ini fokus pada biaya"],2,"Henry: biaya membuat diferensiasi harus lebih kecil daripada harga premium yang dikenakan."],
["Pesaing broad-based menilai segmen niche menarik, lalu melayaninya lebih baik daripada perusahaan yang fokus di sana. Risiko focus strategy yang terwujud adalah…",["Focuser di-out-focus oleh pesaing broad-based","Segmen niche menghilang","Biaya update peralatan modal","Pembeli menilai premium tidak sepadan"],0,"Risiko focus: segmen tidak tahan lama, pesaing broad-based meng-out-focus focuser, dan perbedaan antara segmen dan pasar utama menyempit."],
["Output naik 50% dan biaya total juga naik 50% sehingga LRATC datar. Kondisi ini disebut…",["Economies of scale","Constant returns to scale","Diseconomies of scale","Experience curve"],1,"Constant returns to scale berada di antara economies dan diseconomies of scale: output naik proporsional dengan biaya."],
["Sebuah label fashion hanya melayani pelanggan kelas atas dengan produk yang dipersepsikan unik dan dihargai premium. Generic strategy-nya adalah…",["Cost focus","Differentiation focus","Overall cost leadership","Stuck in the middle"],1,"Segmen sempit dengan sumber keunggulan diferensiasi adalah differentiation focus (contoh Henry: Burberry, Jaguar F-Pace)."],
["Porter merangkum risiko semua generic strategy menjadi dua, yaitu…",["Gagal mencapai atau mempertahankan strategi, atau nilai keunggulannya terkikis seiring evolusi industri","Biaya modal tinggi dan pesaing terlalu sedikit","Regulasi ketat dan teknologi stagnan","Pemasok terlalu kuat dan pembeli terlalu lemah"],0,"Dua risiko umum: gagal mencapai atau mempertahankan strategi, dan nilai keunggulan terkikis seiring evolusi industri."],
["Cirque du Soleil menghapus pertunjukan hewan, bintang sirkus, dan arena tiga ring yang dianggap wajar oleh industri. Dalam Four Actions Framework, tindakan ini menjawab pertanyaan…",["Faktor mana yang harus diciptakan yang belum pernah ditawarkan industri?","Faktor mana yang harus dinaikkan jauh di atas standar industri?","Faktor mana yang dianggap wajar oleh industri tetapi harus dieliminasi?","Faktor mana yang harus dikurangi jauh di bawah standar industri?"],2,"Itu tindakan eliminate. Reduce: slapstick dan unsur menegangkan. Raise: venue yang lebih nyaman. Create: banyak produksi dengan cerita dan musik orisinal."],
["Menurut Kim dan Mauborgne, strategi blue ocean yang dilihat lewat value curve harus memiliki ciri berikut, KECUALI…",["Focus","Divergence dari value curve pemain lain","Compelling tagline","Benchmarking ketat terhadap pesaing terdekat"],3,"Tiga ciri: focus, divergence, dan compelling tagline. Benchmarking terhadap pesaing justru hanya memberi perbaikan inkremental dan tidak membuka ruang pasar baru."],
["Urutan pertanyaan dalam blue ocean idea (BOI) index adalah…",["Utilitas pembeli, harga, target cost, lalu hambatan adopsi","Target cost, harga, utilitas pembeli, hambatan adopsi","Harga, utilitas pembeli, hambatan adopsi, target cost","Hambatan adopsi, utilitas pembeli, harga, target cost"],0,"BOI index dimulai dari buyer utility, lalu price, target cost, dan terakhir memastikan tidak ada hambatan adopsi."],
["Menurut Kim dan Mauborgne, unit analisis terbaik untuk memahami pertumbuhan yang menguntungkan adalah…",["Perusahaan","Industri","Strategic move","Strategic group"],2,"Perusahaan maupun industri bukan unit analisis terbaik. Yang dianalisis adalah strategic move, yaitu tindakan dan keputusan untuk membuat penawaran yang menciptakan pasar baru."],
["Dalam studi 108 peluncuran bisnis oleh Kim dan Mauborgne, peluncuran yang menciptakan blue ocean (14% dari peluncuran) menghasilkan…",["62% dari total revenue dan 39% dari total laba","38% dari total revenue dan 61% dari total laba","14% dari total revenue dan 14% dari total laba","86% dari total revenue dan 61% dari total laba"],1,"Perbaikan inkremental di red ocean (86% peluncuran) menghasilkan 62% revenue dan 39% laba. Blue ocean (14%) menghasilkan 38% revenue dan 61% laba."]];
const E4=[["Jelaskan tiga generic strategies Porter dan bedakan cost focus dari differentiation focus. Beri contoh.","Overall cost leadership (biaya terendah, broad market; Ryanair, Toyota), differentiation (produk unik dengan premium price, broad market; Apple), focus (satu segmen). Cost focus = cost leader hanya di satu segmen (Aldi). Differentiation focus = produk unik untuk satu segmen (Jaguar F-Pace, Burberry)."],["Jelaskan bagaimana cost leadership dan differentiation masing-masing melindungi organisasi dari lima competitive forces. Apa risikonya?","Cost leadership: tetap untung saat pesaing saling menggerus profit, pembeli hanya bisa menekan harga sampai level pesaing berikutnya, hedge terhadap harga input, harga rendah sebagai barrier to entry, rasio harga-kinerja unggul melawan substitutes. Differentiation: brand loyalty melindungi dari rivalry dan substitutes, entrant harus mengatasi loyalitas, buyers kurang kuat, margin tinggi menghadapi supplier. Risiko cost leadership: biaya update peralatan, mudah ditiru, perubahan teknologi, selera bergeser. Risiko differentiation: harga premium terlalu tinggi, kebutuhan menurun, atribut dipersempit pesaing."],["Jelaskan experience curve dan economies of scale. Bagaimana keduanya mendukung cost leadership, dan kapan muncul diseconomies of scale?","Experience curve: tiap output berlipat dua, biaya per unit turun sekitar 20–30% (contoh £10 menjadi £7–£8). Economies of scale: volume naik, LRATC turun, khas industri berbiaya tetap tinggi. Cost leader dengan pangsa besar punya pengalaman dan skala terbesar sehingga biayanya makin jauh di bawah pesaing. Diseconomies of scale muncul saat organisasi terlalu besar: koordinasi sulit, motivasi dan kualitas turun, LRATC naik."],["Apa yang dimaksud stuck in the middle? Apakah bukti empiris mendukung pandangan Porter? Gunakan IKEA, Toyota, Sainsbury's, dan M&S.","Porter: mencoba lebih dari satu generic strategy membuat perusahaan tidak unggul di mana pun. Bukti campuran: IKEA dan Toyota menggabungkan biaya rendah dan diferensiasi dengan sukses (hybrid), studi 164 perusahaan Spanyol mengaitkan hybrid dengan kinerja lebih tinggi. Sainsbury's dan M&S menunjukkan risiko stuck in the middle (tidak cukup murah, tidak cukup terdiferensiasi). Henry menyebut buktinya ambigu."],
["Jelaskan perbedaan red ocean dan blue ocean, konsep value innovation, dan alat ERRC. Bagaimana value innovation berbeda dari asumsi Porter?","Red ocean: industri yang ada, batas jelas, bersaing merebut pangsa dari permintaan terbatas sehingga laba dan pertumbuhan turun. Blue ocean: ruang pasar yang belum diperebutkan, menciptakan permintaan baru; kebanyakan dibuat di dalam red ocean dengan memperluas batas industri. Value innovation: menyelaraskan innovation dengan utility, price, dan cost, sehingga differentiation dan low cost dicapai sekaligus, berbeda dari pilihan salah satu menurut Porter. Four Actions Framework dan ERRC grid: eliminate, reduce, raise, create (contoh Cirque du Soleil). Ciri strategi: focus, divergence, compelling tagline. Studi 108 peluncuran: 14% blue ocean menghasilkan 38% revenue dan 61% laba."]];

CONTENT.s5={kicker:'Sesi 5 · Henry Ch. 7',title:'Strategic Growth dan Competitive Position',desc:'Ansoff growth vector, strategi ofensif dan defensif, timing first mover dan late mover, integrasi horizontal dan vertikal, outsourcing, mergers and acquisitions, internal development, serta joint venture dan strategic alliance. Sumber: Henry Ch. 7 dan slide dosen.',
materi:[C("Growth strategies: matriks Ansoff",P("Organisasi bisa tumbuh lewat strategi berbeda sesuai tingkat risiko yang sanggup ditanggung, capabilities, dan keahlian manajemennya. Ansoff (growth vector matrix) membedakan empat arah berdasarkan produk (present atau new) dan market (present atau new).")+T(["Market \\ Produk", "Produk sekarang", "Produk baru"],[["Market sekarang", "Market penetration", "Product development"], ["Market baru", "Market development", "Diversification"]])+T(["Strategi", "Isi", "Risiko dan catatan"],[["Market penetration", "Menambah pangsa di market yang ada dengan produk yang ada: menarik pelanggan baru dan menaikkan pemakaian pelanggan lama; biasanya lewat perbaikan kualitas, layanan, dan promosi", "Relatif rendah karena memakai resources dan capabilities yang ada. Mudah saat pasar tumbuh; di pasar mature berarti merebut pangsa pesaing sehingga memancing pembalasan. Bila permintaan tidak cukup, putuskan bertahan atau keluar dari industri"], ["Product development", "Mengembangkan produk baru untuk market yang ada", "Perlu kemampuan inovasi, terutama saat siklus hidup produk makin pendek. Mahal dan lebih berisiko gagal karena pelanggan belum tentu menerima. Lebih berhasil bila produk menciptakan kebutuhan baru (contoh Apple: iPod, iTunes, iPhone)"], ["Market development", "Masuk market baru dengan produk yang ada: segmen baru, wilayah baru, atau kegunaan baru; produk biasanya sedikit disesuaikan", "Risiko naik karena pengalaman di market baru belum lengkap. Contoh: Wal-Mart, Carrefour, dan Tesco masuk wilayah baru dengan sedikit perubahan penawaran"], ["Diversification", "Produk baru untuk market baru", "Risiko tertinggi, tetapi perlu bila produk dan market sekarang tidak menawarkan peluang tumbuh. Risiko bisa ditekan dengan diversifikasi ke bisnis terkait. Pembahasan lengkap di Sesi 8"]])),
C("Strategic offensive: prinsip dan opsi serangan (slide dosen)",P("Menurut slide dosen (berbasis Thompson dkk., <i>Crafting and Executing Strategy</i>), kadang opsi strategi terbaik adalah <b>merebut inisiatif dan menyerang</b> untuk memperbaiki posisi pasar. Henry tidak memberi kerangka khusus untuk ini.")+UL(["<b>Prinsip serangan:</b> fokus membangun competitive advantage lalu mengubahnya menjadi keunggulan berkelanjutan; menerapkan sumber daya di titik yang paling sulit dipertahankan rival; memakai unsur kejutan; bertindak cepat, tegas, dan menekan.","<b>Dasar serangan:</b> hindari menantang pesaing langsung di titik terkuatnya; pakai aset strategis terkuat untuk menyerang kelemahannya; hasil bisa tidak instan bila rival kuat; siap menghadapi counter-response."])+T(["No", "Opsi serangan utama"],[["1", "Menawarkan produk sama baik atau lebih baik dengan harga lebih rendah"], ["2", "Leapfrog pesaing dengan menjadi yang pertama meluncurkan produk generasi berikutnya"], ["3", "Inovasi produk berkelanjutan untuk menarik pangsa dari rival yang kurang inovatif"], ["4", "Disruptive product innovation untuk menciptakan market baru"], ["5", "Mengadopsi dan memperbaiki ide bagus perusahaan lain"], ["6", "Hit-and-run atau guerrilla marketing untuk merebut pangsa dari rival yang lengah"], ["7", "Preemptive strike: mengamankan sumber daya industri yang terbatas atau menangkap peluang langka"]])+T(["Target terbaik serangan ofensif"],[["Market leaders yang berada dalam posisi kompetitif rentan"], ["Runner-up firms dengan kelemahan di area yang menjadi kekuatan penyerang"], ["Perusahaan yang kesulitan dan hampir bangkrut"], ["Perusahaan lokal dan regional kecil dengan kemampuan terbatas"]])+DEF("Blue-ocean strategy: serangan jenis khusus","Dunia bisnis dibagi menjadi pasar yang ada (dengan batas dan aturan, tempat rival bersaing) dan <b>blue ocean</b>: ruang pasar yang belum terbentuk, tanpa rival, dengan potensi pertumbuhan dan laba besar bagi perusahaan yang mampu menciptakan permintaan baru.","Kasus dalam slide: Gilt Groupe (flash sale AS). Pembahasan konsep lengkap ada di Sesi 4 (Henry 6.4).")),
C("Strategi defensif: melindungi posisi pasar (slide dosen)",CALL("<b>Prinsip dari slide:</b> strategi defensif yang baik membantu melindungi competitive advantage, tetapi jarang menjadi dasar untuk menciptakannya.")+T(["Tujuan strategi defensif", "Isi"],[["1", "Menurunkan risiko diserang"], ["2", "Melemahkan dampak serangan yang tetap terjadi"], ["3", "Memengaruhi penantang agar mengarahkan serangan ke rival lain"]])+P("<b>Menutup jalur yang terbuka bagi penantang:</b>")+UL(["Siapkan teknologi cadangan untuk jaga-jaga kalau pesaing menyerang dengan teknologi baru","Menambah fitur dan model untuk menutup celah dan niche kosong","Mempertahankan economy-pricing untuk menggagalkan serangan harga rendah","Mencegah pembeli mencoba merek pesaing","Umumkan produk atau harga baru lebih awal supaya pembeli menunda pindah ke pesaing","Mempertanyakan kualitas dan keselamatan produk pesaing","Memberi diskon atau syarat lebih baik kepada perantara yang menjual lini produk perusahaan secara eksklusif"])+P("<b>Signaling bahwa pembalasan kemungkinan terjadi</b> (efektif bila ditindaklanjuti): mengumumkan komitmen mempertahankan pangsa, berkomitmen menyamai harga atau syarat pesaing, menyimpan war chest berupa kas dan surat berharga, dan memberi respons kuat pada langkah rival yang lebih lemah.")+CALL("<b>Syarat penting:</b> signaling hanya efektif bila disertai komitmen yang kredibel untuk menindaklanjuti. Ancaman tanpa tindak lanjut tidak dipercaya.")),
C("Innovation dan timing: first mover, fast follower, late mover",DEF("Competitive advantage bisa datang dari kapan, bukan hanya apa","Tahu <b>kapan</b> bergerak sama pentingnya dengan tahu <b>langkah apa</b>. Bergerak pertama tidak menjamin sukses, dan risiko menjadi yang paling awal harus ditimbang cermat (slide dosen).","Henry: VHS (Matsushita) menjadi standar industri meski kalah teknologi dari Betamax (Sony). Siklus hidup produk yang makin pendek (contoh consumer electronics) membuat product development terus-menerus perlu, sekaligus mengikis keunggulan first mover dan memperpendek waktu balik modal.")+T(["Kondisi yang memberi first-mover advantages", "Kondisi yang memberi late-mover advantages (atau first-mover disadvantages)"],[["Pionir membangun reputasi dan loyalitas merek kuat", "Pionir lebih mahal daripada meniru dan hanya memberi pengalaman atau learning-curve benefit yang kecil"], ["Pelanggan first mover menghadapi switching costs besar", "Produk inovator masih primitif dan belum memenuhi harapan pembeli"], ["Perlindungan hak kekayaan menghambat peniruan cepat", "Pasar berevolusi cepat sehingga fast follower bisa melompati first mover dengan versi berikutnya"], ["Keunggulan awal memungkinkan turun lebih dulu di learning curve", "Ketidakpastian pasar menyulitkan penilaian apa yang akhirnya berhasil"], ["First mover dapat menetapkan standar teknis industri", "Loyalitas pelanggan rendah dan keahlian first mover mudah ditiru atau dilampaui"]])+P("<b>Pertanyaan penentu apakah menjadi first mover:</b> apakah lepas landas pasar bergantung pada produk pelengkap yang belum ada? Perlukah infrastruktur baru? Perlukah pembeli belajar perilaku baru? Apakah switching costs tinggi? Adakah pesaing berpengaruh yang bisa menggagalkan first mover?")+CALL("Henry hanya membahas first-mover advantage. Fast follower dan late mover berasal dari slide dosen. Kasus Amazon di slide hanya berupa pertanyaan diskusi.")),
C("Tipologi strategi inovasi (Freeman)",P("Freeman membagi perusahaan menurut sikapnya terhadap inovasi produk dan teknologi. Ada enam tipe:")+T(["Tipe","Ciri utama"],[["Offensive","Jadi yang pertama meluncurkan produk baru; andalkan R&D sendiri dan paten"],["Defensive","Tidak mau jadi yang pertama, tapi tidak mau tertinggal; ikut cepat dan menyempurnakan produk pionir, tetap punya R&D sendiri"],["Imitative","Mengikuti jauh di belakang pemimpin; meniru atau melisensi, bersaing lewat biaya rendah atau keunggulan lain, bukan lewat R&D"],["Dependent","Subordinat pada perusahaan yang lebih kuat (induk atau pelanggan besar); mengubah produk hanya atas permintaan mereka"],["Traditional","Produk nyaris tidak berubah karena pasar tidak menuntut perubahan; hampir tanpa inovasi"],["Opportunist","Tidak bertumpu pada R&D; mencari celah atau niche yang muncul dari perubahan pasar"]])+CALL("<b>Catatan:</b> tambahan di luar buku Henry dan catatan dosen (untuk soal UTS Samsung vs Apple). Defensive = ikut cepat sambil menyempurnakan produk pionir, tetap punya R&D. Imitative = ikut jauh di belakang, andalkan biaya murah. Cocokkan dengan catatan dosen.")),
C("Scope dan integrasi: horizontal dan vertikal",DEF("Scope of the firm","Rentang aktivitas yang dikerjakan sendiri, lebar penawaran produk dan jasa, luas kehadiran geografis, dan bauran bisnis. <b>Horizontal scope</b> = rentang segmen produk dan jasa dalam focal market. <b>Vertical scope</b> = sejauh mana aktivitas internal mencakup tahap-tahap rantai nilai industri, dari bahan baku sampai layanan akhir.","Related diversification (Henry): masuk industri yang terkait dengan value chain agar tercipta synergy (2 + 2 = 5). Honda memakai capability mesin untuk motor, mesin pemotong rumput, dan mesin tempel.")+T(["Jenis", "Arti", "Alasan dan contoh"],[["Backward integration", "Ke hulu menuju input", "Menekan kekuatan pemasok dan biaya input, menjamin pasokan, melindungi know-how. Contoh Henry: Morrisons menanam sayur sendiri dan memiliki rumah potong hewan"], ["Forward integration", "Ke hilir menuju konsumen akhir", "Efisiensi saluran, daya tawar, akses pengguna akhir, memperkuat merek dan diferensiasi. Contoh: mengakuisisi transportasi, gudang, atau gerai ritel"], ["Horizontal integration", "Mengambil alih pesaing atau produk komplementer di tahap yang sama", "Economies of scale lebih cepat daripada pertumbuhan organik. Contoh Henry: HSBC membeli Midland Bank; easyJet mengambil alih Go!"]])+T(["Jenis vertical integration (slide)", "Arti"],[["Full integration", "Berpartisipasi di semua tahap rantai aktivitas vertikal"], ["Partial integration", "Hanya membangun posisi di tahap tertentu"], ["Tapered integration", "Campuran aktivitas dikerjakan sendiri dan di-outsource pada suatu tahap"]])+P("<b>Kerugian vertical integration:</b> risiko bisnis naik karena modal besar; lambat menerima teknologi atau metode yang lebih efisien; kurang fleksibel menghadapi pergeseran selera; volume internal mungkin tidak mencapai economies of scale; masalah penyesuaian kapasitas; butuh resources dan capabilities baru. Henry menambahkan: organisasi makin bergantung pada satu pasar dan lambat merespons perubahan.")+P("<b>Empat pertanyaan menimbang (slide):</b> (1) apakah integrasi meningkatkan kinerja aktivitas yang kritis bagi strategi? (2) apa dampaknya pada biaya investasi, fleksibilitas, dan waktu respons? (3) berapa biaya administrasi mengoordinasikan lebih banyak tahap? (4) seberapa sulit memperoleh keterampilan untuk tahap baru?")),
C("Transaction-cost analysis dan outsourcing",P("Setiap transaksi punya <b>transaction costs</b>: biaya search, negosiasi dan kontrak, monitoring, dan enforcement.")+DEF("Aturan keputusan (Oliver Williamson)","Produksi internal bila transaction cost internal lebih rendah daripada membeli di pasar. Bila biaya administrasi transaksi internal lebih besar daripada transaction cost di pasar (organisasi terlalu besar dan birokratis), <b>outsource</b> ke spesialis. Bila transaction cost jauh lebih besar daripada biaya administrasi, pilih <b>vertical integration</b>.")+T(["Outsource aktivitas bila (slide dosen)", "Risiko besar outsourcing"],[["Bisa dikerjakan lebih baik atau lebih murah oleh spesialis luar", "<b>Hollowing out:</b> resources dan capabilities yang dibutuhkan untuk menguasai nasib sendiri terkikis"], ["Tidak krusial bagi competitive advantage berkelanjutan", "Kehilangan kontrol langsung saat memantau dan mengoordinasikan pihak luar lewat kontrak arm's-length"], ["Meningkatkan fleksibilitas dan mempercepat time to market", "Pihak luar kurang insentif membuat investasi khusus untuk rantai nilai perusahaan"], ["Mengurangi risiko akibat teknologi baru atau perubahan selera", ""], ["Memungkinkan fokus pada bisnis inti", ""]])+DEF("Pelajaran dari kasus di Henry: tren re-bundling","Selama sekitar tiga puluh tahun banyak perusahaan fokus pada bisnis inti dan meng-outsource sisanya. Kini sebagian berbalik ke integrasi: untuk kesederhanaan bagi pelanggan (Apple, Nest), karena perusahaan di batas teknologi lebih efisien mengerjakan sendiri (gigafactory Tesla), karena pilihan pasar makin banyak (Netflix dan Amazon membuat tayangan sendiri), dan karena kecepatan (Zara).","Boeing meng-outsource sekitar 70% produksi 787 Dreamliner ke ratusan pemasok; suku cadang terlambat dan tidak pas, tenggat meleset, lalu produksi ditarik kembali ke dalam perusahaan.")+CALL("<b>Prinsip dari slide:</b> jangan meng-outsource aktivitas yang mengikis resources dan capabilities yang dibutuhkan untuk menguasai nasib sendiri.")),
C("Mergers and acquisitions (M&A)",T(["Istilah", "Arti"],[["Merger", "Dua organisasi bergabung dan berbagi sumber daya secara sukarela; pemegang saham keduanya menjadi pemegang saham organisasi baru"], ["Acquisition", "Satu organisasi mengakuisisi (menyerap) organisasi lain, sering lebih kecil; dibayar dengan saham dan tunai, atau tunai saja"], ["Hostile takeover", "Akuisisi yang ditolak dan diperebutkan; dewan target biasanya berargumen penawaran terlalu murah"]])+T(["", "Isi"],[["Alasan dan manfaat", "Masuk market baru dengan cepat atau memperoleh capabilities yang tidak dimiliki. Manfaat: kecepatan, pangsa pasar, masuk pasar, akses cepat ke capabilities"], ["Tujuan M&A horizontal (slide)", "Operasi gabungan lebih hemat biaya; cakupan geografis lebih luas; masuk kategori produk baru; akses cepat ke teknologi atau capabilities; memimpin konvergensi industri. Manfaat: efisiensi, diferensiasi, kurangi rivalry, daya tawar lebih besar, fleksibilitas"], ["Kerugian dan penyebab gagal", "Membayar premium (risiko keuangan naik); budaya sulit menyatu; penghematan biaya lebih kecil dari perkiraan; keunggulan capabilities terwujud lebih lambat atau tidak pernah; karyawan kunci pergi; kesalahan manajer saat integrasi"]])+DEF("Tiga kriteria Porter untuk akuisisi yang menambah shareholder value","<b>Attractiveness:</b> industri target mampu memberi return di atas rata-rata. <b>Cost of entry:</b> harga akuisisi dan biaya integrasi tidak boleh terlalu mahal (sering terjadi saat premium tinggi). <b>Better-off:</b> akuisisi harus memberi competitive advantage bagi induk atau yang diakuisisi.","John Kay: synergy hanya muncul bila distinctive capabilities atau strategic assets dimanfaatkan lebih efektif; akuisisi capabilities yang sudah dimanfaatkan efektif tidak menambah nilai.")+T(["Contoh dalam Henry", "Pelajaran"],[["Kraft membeli Cadbury (£11,6 miliar); Buffett menyebutnya deal buruk", "Biaya reorganisasi dan fee bisa menggerus nilai tambah"], ["Microsoft membeli bisnis handset Nokia ($7,2 miliar, 2013); memburuk pada 2015", "Membeli pasar lebih cepat daripada membangun, tetapi hasil tidak terjamin"], ["Sainsbury's membeli Home Retail Group (Argos dan Homebase, £1,4 miliar, 2016) demi layanan antar dan keahlian digital", "Ada rasionalitas bisnis, tetapi logikanya dipertanyakan sebagian analis"], ["RBS, Fortis, dan Santander membeli sebagian ABN Amro (€71 miliar, tiga kali nilai buku)", "Kurang due diligence berakibat aset beracun"], ["Daimler-Benz dan Chrysler: biaya $36 miliar; Chrysler dijual ke Cerberus 2007", "Synergy dilebih-lebihkan (diakui Zetsche)"]])),
C("Internal development (organic growth)",P("Organisasi tumbuh dengan <b>sumber daya sendiri</b> dan membangun capabilities yang dibutuhkan untuk bersaing di masa depan. Banyak organisasi mulai dengan pertumbuhan organik, lalu mempertimbangkan M&A saat industri mature. Dalam praktik keduanya sering dijalankan bersamaan.")+T(["Manfaat", "Kelemahan"],[["(i) Risiko keuangan lebih rendah", "(i) Butuh waktu membangun capabilities strategis yang diperlukan"], ["(ii) Tumbuh dengan laju yang bisa dikendalikan", "(ii) Siklus produk makin pendek, sehingga bisa kehilangan peluang pasar"], ["(iii) Pembelajaran di dalam perusahaan tetap menjadi milik sendiri", "(iii) Bila ada barriers to entry, M&A mungkin diperlukan untuk masuk industri"], ["(iv) Tidak perlu mengelola perbedaan budaya", ""]])+DEF("Contoh: Aldi dan Lidl di Inggris","Pertumbuhan organik lewat pembukaan toko sendiri. Pada Mei 2017 Aldi memegang sekitar 7% dan Lidl 5% pasar grosir Inggris; gabungan pangsa mereka naik lebih dari 80% sejak musim panas 2013.")),
C("Joint venture dan strategic alliance",VS("Joint venture vs strategic alliance",["Joint venture","Dua organisasi membentuk <b>perusahaan terpisah yang independen</b>, dimiliki dan dikendalikan bersama (Henry: saham setara), berbagi pendapatan dan biaya.",null,["Menggabungkan resources dan capabilities untuk mengembangkan teknologi baru","Mengakses market baru","Dipakai bila kepemilikan aset asing dibatasi: mitra lokal memberi akses input atau pasar"]],["Strategic alliance","Dua organisasi atau lebih berbagi sebagian resources dan capabilities lewat perjanjian formal <b>tanpa membentuk organisasi terpisah</b>.",null,["Mendapat pengetahuan yang tidak dimiliki atau mahal bila dikembangkan sendiri","Mengurangi competitive rivalry"]],"Contoh: konsorsium Airbus (Inggris, Prancis, Jerman, Italia) mengembangkan A380 dengan risiko jauh lebih kecil; tiap negara menyumbang capabilities khasnya.")+P("<b>Sebuah aliansi bersifat strategis (slide) bila</b> membantu: mencapai tujuan bisnis penting; membangun atau memperkuat core competence; menutup kekurangan resource; bertahan dari ancaman atau menurunkan risiko; menambah daya tawar atas pemasok atau pembeli; membuka peluang pasar baru; atau mempercepat teknologi dan inovasi produk.")+T(["Manfaat aliansi", "Isi"],[["Dibanding integrasi vertikal, outsourcing, dan M&A", "Meminimalkan masalah ketiganya; lebih fleksibel bila kebutuhan resource atau tujuan berubah; cocok saat teknologi berkembang sangat cepat; berguna untuk ekspansi internasional dan diversifikasi"], ["Tiga keunggulan utama", "(1) Biaya investasi dan risiko lebih rendah lewat resource pooling dan risk sharing; (2) bentuk organisasi lebih fleksibel dan adaptif; (3) lebih cepat dijalankan"], ["Dibanding outsourcing", "Kontrol lebih besar atas aktivitas mitra dan komitmen lebih besar untuk investasi khusus hubungan, dibanding transaksi arm's-length"]])+CALL("Henry (Hamel dkk.): aliansi bisa menguatkan kedua pihak terhadap rival luar, tetapi bisa melemahkan salah satu terhadap mitranya; aliansi adalah persaingan dalam bentuk lain, dengan tujuan akhir <b>belajar dari mitra</b>.")),
C("Aliansi: risiko, ketahanan, dan cara membuatnya berhasil (slide dosen)",T(["", "Isi"],[["Kerugian dan risiko", "Benturan budaya dan masalah integrasi; keuntungan tidak muncul karena optimisme berlebihan soal synergy atau ketidakcocokan resources mitra; ketergantungan pada mitra untuk keahlian penting; perlindungan teknologi proprietary dan rahasia dagang dari mitra yang juga rival"], ["Faktor ketahanan aliansi", "Bermitra dengan pihak yang tidak bersaing langsung; membangun hubungan permanen yang saling percaya; terus berkolaborasi demi kepentingan bersama"], ["Faktor menangkap manfaat", "Memilih mitra yang baik; peka terhadap perbedaan budaya; menyadari aliansi harus menguntungkan kedua pihak; memastikan komitmen ditepati; menyusun proses keputusan agar tindakan cepat; menyesuaikan perjanjian seiring waktu"]])+P("<b>Cara membuat aliansi berhasil:</b> membuat sistem pengelolaan aliansi; membangun kepercayaan; menyiapkan pengaman dari oportunisme mitra; berkomitmen dan memastikan mitra melakukan hal yang sama; menjadikan pembelajaran bagian rutin manajemen.")+CALL("Henry: JV dan alliance cenderung gagal bila tujuan mitra tidak jelas atau tidak disepakati, atau bila hubungan tidak dilandasi kepercayaan; perbedaan manajerial harus diselesaikan sebelum kerja sama dimulai. Slide: aliansi terbaik sangat selektif, dan perusahaan dengan banyak aliansi perlu mengelolanya seperti portofolio.")),
C("Membandingkan cara mewujudkan pertumbuhan",T(["Cara", "Kecepatan dan kontrol", "Risiko utama", "Kapan masuk akal"],[["Internal development", "Lambat; laju bisa dikendalikan; pembelajaran milik sendiri", "Kehilangan peluang saat siklus produk pendek; capabilities lama dibangun", "Risiko keuangan ingin rendah dan tidak ada barriers to entry berat"], ["Merger dan acquisition", "Cepat; kontrol penuh setelah integrasi", "Premium mahal, sulit menyatukan budaya, synergy dilebih-lebihkan", "Perlu pangsa, akses pasar, atau capabilities dengan cepat"], ["Joint venture", "Kontrol dibagi; entitas terpisah", "Tujuan tidak sejalan, kurang kepercayaan", "Akses pasar atau teknologi dengan risiko dibagi; pembatasan kepemilikan asing"], ["Strategic alliance", "Kontrol terbagi; tidak ada entitas baru", "Tujuan tidak jelas, mitra bisa menjadi pesaing", "Belajar dan mengakses pengetahuan komplementer"], ["Outsourcing", "Cepat dan fleksibel; kontrol bergantung kontrak", "Kualitas dan ketepatan pemasok (contoh Boeing 787), hollowing out", "Aktivitas tidak krusial dan transaction cost pasar lebih kecil dari biaya administrasi internal"]])+P("Tabel ini ringkasan pembanding dari poin-poin Henry dan slide di atas, bukan tabel dari buku."))].join('')};
const Q5=[["Di pasar mature, sebuah maskapai menurunkan harga dan menambah promosi untuk merebut pangsa dengan layanan dan rute yang sama. Risiko paling khas menurut logika Henry adalah…", ["Hilangnya capabilities inti", "Pembalasan pesaing, karena pangsa hanya bisa direbut dari mereka", "Kurangnya pengetahuan market", "Kegagalan produk baru"], 1, "Market penetration relatif rendah risiko, tetapi di pasar mature berarti mengambil pangsa pesaing sehingga memancing retaliation."], ["Pabrikan sepatu membeli penyamakan kulit pemasoknya (harga fluktuatif, kualitas tak stabil). Dua tahun kemudian biaya administrasi mengelola unit itu lebih besar daripada transaction cost membeli di pasar. Langkah paling sesuai dengan Williamson?", ["Meng-outsource kembali ke spesialis dengan kontrak yang menjamin kualitas dan harga", "Tetap mempertahankan karena integrasi selalu lebih murah", "Mengakuisisi pesaing", "Menambah forward integration"], 0, "Awalnya backward integration. Bila biaya administrasi internal melebihi transaction cost pasar, outsourcing lebih efisien."], ["A mengakuisisi B dengan premium besar. Capabilities B sudah dimanfaatkan optimal oleh B sendiri, dan tidak ada tautan dengan value chain A. Penilaian paling tepat?", ["Sulit menciptakan nilai: cost of entry tinggi, tidak ada better-off, dan menurut Kay capabilities yang sudah dimanfaatkan efektif tidak menambah nilai", "Sudah memenuhi tiga kriteria Porter", "Pasti menciptakan synergy 2 + 2 = 5", "Risikonya rendah karena integrasi budaya mudah"], 0, "Kriteria Porter: attractiveness, cost of entry, better-off. Kay: synergy hanya bila capabilities dimanfaatkan lebih efektif."], ["Perusahaan ingin masuk pasar luar negeri, tetapi kurang informasi pasar setempat dan kepemilikan asing dibatasi. Pilihan yang paling logis?", ["Outsourcing seluruh operasi", "Joint venture atau aliansi dengan mitra lokal yang mapan", "Hostile takeover", "Internal development penuh tanpa mitra"], 1, "Kolaborasi memberi akses pasar dan informasi, serta menjadi jalan saat kepemilikan asing dibatasi (contoh JV di Tiongkok dan India)."], ["Dua perusahaan membentuk aliansi dengan capabilities komplementer. A menyebarkan pengetahuan dari mitra ke seluruh organisasinya, B tidak. Menurut Hamel dkk., kemungkinan konsekuensinya adalah…", ["Keduanya sama-sama diuntungkan secara merata", "Aliansi otomatis berubah menjadi merger", "A bisa menjadi lebih kuat daripada B, sebab aliansi adalah persaingan dalam bentuk lain dengan tujuan akhir belajar dari mitra", "Tidak ada dampak"], 2, "Hamel dkk.: aliansi bisa menguatkan keduanya terhadap rival luar, tetapi bisa melemahkan salah satu terhadap mitra."], ["Produsen elektronik menjadi pelopor produk baru di industri dengan siklus hidup produk yang makin pendek. Implikasi menurut Henry adalah…", ["Standar terbaik pasti menang", "Keunggulan cepat terkikis dan waktu mengembalikan belanja modal makin singkat sehingga risiko pelopor naik", "Siklus pendek menurunkan risiko investasi", "First-mover advantage otomatis permanen"], 1, "Contoh VHS dan Betamax menunjukkan standar tidak selalu dimenangkan teknologi terbaik."], ["Industri dengan barriers to entry tinggi dan siklus produk pendek. Perusahaan baru ingin masuk. Cara tumbuh yang paling logis menurut Henry?", ["Menunggu siklus produk melambat", "Market penetration", "M&A (atau kolaborasi) untuk masuk lebih cepat dan menembus barriers", "Internal development murni karena paling murah"], 2, "Internal development lambat dan bisa kehilangan peluang; bila ada barriers to entry, M&A mungkin diperlukan."], ["Boeing meng-outsource sekitar 70% produksi 787 ke ratusan pemasok dan mengalami keterlambatan. Pelajaran terbaik untuk keputusan outsourcing adalah…", ["Outsourcing berlebihan pada produk kompleks bisa menimbulkan masalah koordinasi dan kualitas sehingga transaction cost nyata lebih besar dari perkiraan", "Outsourcing semua aktivitas non-core selalu efisien", "Integrasi vertikal selalu lebih buruk", "Kontrak menghilangkan semua risiko"], 0, "Henry mencatat tren re-bundling: kesederhanaan, teknologi di batas, dan kecepatan bisa membuat pengerjaan internal lebih efisien."], ["Sebuah grup ritel menggabungkan diri dengan pesaing di kota yang sama untuk skala lebih cepat, dan sekaligus membeli perusahaan logistik untuk mengontrol distribusi ke pelanggan. Klasifikasinya adalah…", ["Joint venture dan strategic alliance", "Market development dan outsourcing", "Horizontal integration dan forward vertical integration", "Backward integration dan unrelated diversification"], 2, "Pesaing di tahap yang sama = horizontal. Logistik menuju konsumen = forward vertical integration."], ["Manajemen ingin segera menandatangani joint venture karena ada peluang pasar, padahal tujuan kedua mitra belum disepakati dan gaya manajemen sangat berbeda. Langkah paling tepat menurut Henry?", ["Selesaikan perbedaan manajerial dan sepakati tujuan sebelum membentuk joint venture", "Tandatangani dahulu dan selesaikan perbedaan setelahnya", "Beralih ke hostile takeover", "Ubah menjadi outsourcing penuh"], 0, "JV dan alliance cenderung gagal bila tujuan tidak jelas atau hubungan tidak dilandasi kepercayaan."], ["Apple meluncurkan produk baru (iPod, iTunes, iPhone) yang menciptakan kebutuhan baru bagi pelanggan yang sudah ada. Dalam matriks Ansoff ini termasuk…", ["Market penetration", "Product development", "Market development", "Diversification"], 1, "Produk baru untuk market yang sudah ada adalah product development. Mahal dan berisiko gagal, tetapi lebih berhasil bila menciptakan kebutuhan baru."], ["Peritel besar membuka cabang di wilayah baru dengan penawaran yang hampir sama. Dalam matriks Ansoff ini termasuk…", ["Market penetration", "Product development", "Diversification", "Market development"], 3, "Produk yang ada untuk market baru adalah market development (contoh Wal-Mart, Carrefour, dan Tesco masuk wilayah baru)."], ["Cara menekan risiko diversification menurut Henry adalah…", ["Menunggu pasar saat ini jenuh", "Meng-outsource seluruh produksi", "Diversifikasi ke bisnis terkait", "Masuk ke bisnis yang sama sekali tidak terkait"], 2, "Diversification berisiko paling tinggi, tetapi risikonya bisa ditekan dengan diversifikasi ke bisnis terkait yang masih punya tautan dengan value chain."], ["Synergy dalam related diversification sering digambarkan sebagai 2 + 2 = 5. Maknanya adalah…", ["Biaya akuisisi selalu lebih kecil dari nilai target", "Total output gabungan lebih besar daripada jumlah output terpisah", "Dua perusahaan selalu menjadi satu entitas", "Laba naik hanya bila pesaing berkurang"], 1, "Synergy: output gabungan lebih besar daripada jumlah output masing-masing. Contoh: Honda memanfaatkan capability mesin untuk motor, pemotong rumput, dan outboard engines."], ["Biaya yang timbul untuk memastikan pihak lain memenuhi kewajiban dalam kontrak termasuk…", ["Biaya monitoring", "Search costs", "Biaya enforcement", "Biaya negosiasi dan kontrak"], 0, "Empat transaction costs: search costs, negosiasi dan kontrak, monitoring (memastikan kewajiban dipenuhi), dan enforcement (penegakan lewat pengadilan)."], ["Akuisisi ditolak dewan target dengan alasan penawaran terlalu murah, tetapi pembeli tetap mengejarnya. Ini disebut…", ["Merger", "Joint venture", "Strategic alliance", "Hostile takeover"], 3, "Hostile takeover adalah akuisisi yang ditolak dan diperebutkan, berbeda dari merger yang sukarela bagi kedua pihak."], ["Manfaat internal development (organic growth) dibanding M&A adalah…", ["Cepat memasuki pasar baru", "Perbedaan budaya tidak perlu dikelola dan pembelajaran tetap menjadi milik sendiri", "Otomatis menembus barriers to entry", "Selalu memberi pangsa pasar lebih besar"], 1, "Manfaat internal development: risiko keuangan lebih rendah, laju terkendali, pembelajaran tetap di dalam, dan tidak perlu mengelola perbedaan budaya."], ["Produsen makanan membeli rantai gerai ritel untuk mengendalikan di mana, kapan, dan berapa harga produknya dijual. Ini adalah…", ["Backward vertical integration", "Horizontal integration", "Forward vertical integration", "Market penetration"], 2, "Bergerak ke hilir menuju konsumen akhir adalah forward vertical integration, untuk mengendalikan saluran distribusi."], ["Penantang kecil memilih menyerang pemimpin pasar langsung di segmen paling kuatnya dengan perang harga. Menurut prinsip serangan strategis dalam slide dosen, pendekatan ini…", ["Tepat, karena menyerang titik terkuat membuktikan keunggulan", "Kurang tepat: serangan terbaik memakai aset terkuat penyerang untuk menyerang titik terlemah rival, bukan menantang di titik terkuatnya", "Tidak relevan, karena rival tidak pernah membalas", "Tepat selama harga turun lebih dulu"], 1, "Prinsip slide: hindari menantang pesaing di titik terkuatnya, dan siap menghadapi counter-response."], ["Sebuah perusahaan mengumumkan akan menyamai harga pesaing dan menyimpan kas besar, tetapi saat pesaing kecil memotong harga ia tidak bereaksi apa-apa. Penilaian terhadap signaling-nya?", ["Efektif, karena kas besar menggantikan respons", "Tidak relevan terhadap strategi defensif", "Efektif, karena pengumuman publik sudah cukup", "Tidak efektif: signaling defensif hanya bekerja bila disertai komitmen kredibel untuk menindaklanjuti"], 3, "Slide: signaling perlu diikuti respons kuat pada langkah rival yang lebih lemah agar citra pembela tangguh terbentuk."], ["Startup meluncurkan layanan baru paling awal, tetapi teknologinya masih primitif, loyalitas pelanggan rendah, mudah ditiru, dan pasar berubah cepat. Kemungkinan yang paling masuk akal?", ["First-mover advantage akan permanen", "Pasar tidak akan berkembang", "Switching costs otomatis melindungi startup", "Fast follower atau late mover bisa melompatinya dengan versi berikutnya yang lebih menarik (late-mover advantage)"], 3, "Kondisi late-mover advantage dalam slide: produk pionir primitif, evolusi pasar cepat, loyalitas rendah, mudah ditiru."], ["Produsen elektronik membeli pemasok komponen utamanya. Kapasitas pabrik komponen tidak cocok dengan kebutuhan perakitan, dan selera pembeli bergeser ke komponen yang tidak dibuat internal. Risiko vertical integration yang paling terwujud?", ["Kebutuhan resources baru hilang", "Skala ekonomi otomatis tercapai", "Risiko bisnis dan investasi besar, masalah penyesuaian kapasitas, dan kurang fleksibel menghadapi pergeseran selera", "Daya tawar atas pemasok naik"], 2, "Kerugian vertical integration dalam slide: risiko modal besar, capacity matching problems, dan kurang fleksibel."], ["Perusahaan merek sepatu meng-outsource desain produk intinya (sumber keunggulan bersaingnya) ke vendor yang lebih murah. Penilaian menurut slide dosen?", ["Tidak berdampak pada kontrol", "Tepat, karena selalu lebih murah", "Berisiko: outsourcing aktivitas yang krusial bagi competitive advantage bisa mengikis capabilities (hollowing out)", "Tepat, karena kontrak menjamin segalanya"], 2, "Outsource sebaiknya aktivitas yang tidak krusial bagi keunggulan berkelanjutan."], ["Perusahaan membutuhkan mitra yang bersedia membuat investasi khusus pada rantai nilainya dan menginginkan kontrol lebih besar atas aktivitas mitra dibanding kontrak arm's-length. Pilihan yang paling sesuai?", ["Strategic alliance", "Outsourcing biasa tanpa hubungan khusus", "Tidak melakukan apa-apa", "Hostile takeover"], 0, "Slide: dibanding outsourcing, aliansi memberi kontrol lebih besar dan komitmen untuk relationship-specific investments."]];
const E5=[["Jelaskan keempat strategi dalam matriks Ansoff. Strategi mana yang paling berisiko dan mengapa?", "Market penetration (produk lama, market lama), market development (produk lama, market baru), product development (produk baru, market lama), diversification (produk baru, market baru). Diversification paling berisiko karena ketiga elemen (produk dan market) baru; risikonya dapat ditekan dengan diversifikasi ke bisnis terkait. Tiga strategi lain memakai resources dan capabilities yang ada sehingga risikonya lebih rendah, meski product development mahal dan market development butuh pengetahuan market baru."], ["Bedakan vertical integration (backward dan forward) dan horizontal integration. Apa risikonya dan kaitannya dengan transaction-cost analysis dan outsourcing?", "Backward: ke hulu menuju input (Morrisons). Forward: ke hilir menuju konsumen (transport, gudang, ritel). Horizontal: mengambil alih pesaing atau produk komplementer di tahap yang sama (HSBC-Midland). Risiko vertical: ketergantungan pada satu pasar, lambat merespons perubahan. Transaction-cost analysis (Williamson): produksi internal bila transaction cost internal lebih rendah dari pasar; bila biaya administrasi internal lebih besar, outsource; bila transaction cost pasar jauh lebih besar dari biaya administrasi, integrasi vertikal. Kasus Boeing 787 menunjukkan risiko outsourcing berlebihan."], ["Bandingkan M&A dan internal development sebagai cara mewujudkan pertumbuhan. Sebutkan manfaat, kelemahan, dan kriteria Porter untuk akuisisi.", "M&A: cepat, pangsa pasar, masuk pasar, akses capabilities; kelemahan: premium mahal, budaya sulit disatukan. Internal development: risiko keuangan rendah, laju terkendali, pembelajaran tetap di perusahaan, tanpa konflik budaya; kelemahan: lambat, bisa kehilangan peluang, barriers to entry. Porter: attractiveness, cost of entry, better-off. Kay: synergy hanya bila distinctive capabilities dimanfaatkan lebih efektif. Contoh: Kraft-Cadbury, Daimler-Chrysler, RBS-ABN Amro; Aldi dan Lidl untuk organic growth."], ["Bedakan joint venture dan strategic alliance. Kapan keduanya cenderung gagal, dan apa tujuan akhir aliansi menurut Hamel dkk.?", "Joint venture: perusahaan terpisah yang independen dengan kepemilikan saham setara. Alliance: berbagi resources dan capabilities tanpa entitas baru. Manfaat: kombinasi capabilities, akses market, pengetahuan, mengurangi rivalry. Gagal bila tujuan tidak jelas dan tidak disepakati atau kurang kepercayaan. Hamel dkk.: aliansi adalah persaingan dalam bentuk lain; tujuan akhirnya belajar dari mitra. Contoh: Airbus."], ["Jelaskan opsi serangan ofensif utama dan siapa target terbaiknya. Apa tujuan strategi defensif, dan mengapa signaling harus disertai komitmen kredibel?", "Opsi serangan: harga lebih rendah untuk produk setara, leapfrog dengan produk generasi berikutnya, inovasi produk berkelanjutan, disruptive innovation, mengadopsi dan memperbaiki ide pihak lain, hit-and-run atau guerrilla marketing, preemptive strike. Target terbaik: market leader yang rentan, runner-up dengan kelemahan di area kekuatan penyerang, perusahaan hampir bangkrut, perusahaan lokal dan regional kecil. Prinsip: serang titik terlemah rival dengan aset terkuat, jangan menantang di titik terkuatnya. Defensif: menurunkan risiko diserang, melemahkan dampak serangan, mengalihkan penantang ke rival lain; caranya menutup jalur penantang dan signaling. Signaling hanya efektif bila diikuti tindakan nyata (mengumumkan komitmen pangsa, menyamai harga, war chest, respons kuat pada rival lemah); defensif jarang menciptakan keunggulan."], ["Kapan menjadi first mover menguntungkan, dan kapan late mover atau fast follower lebih baik? Sebutkan pertanyaan yang perlu diajukan sebelum memutuskan.", "First-mover advantages: reputasi dan loyalitas merek, switching costs pelanggan, perlindungan hak kekayaan, turun lebih dulu di learning curve, penetapan standar teknis. Late-mover advantages: pionir lebih mahal daripada meniru, produk pionir primitif, evolusi pasar cepat sehingga bisa dilompati, ketidakpastian pasar, loyalitas rendah dan mudah ditiru. Pertanyaan penentu: apakah butuh produk pelengkap yang belum ada, infrastruktur baru, pembeli perlu belajar perilaku baru, switching costs tinggi, adakah pesaing berpengaruh yang bisa menggagalkan. Keunggulan bisa datang dari kapan bergerak, bukan hanya apa yang dilakukan."], ["Bandingkan vertical integration (full, partial, tapered), outsourcing, dan strategic alliance sebagai cara mengatur scope. Kapan masing-masing masuk akal dan apa risikonya?", "Vertical integration: backward (menekan kekuatan pemasok, biaya input, menjamin pasokan, melindungi know-how) dan forward (efisiensi saluran, daya tawar, akses pengguna akhir, merek); risiko: modal besar, lambat adopsi teknologi, kurang fleksibel, masalah kapasitas, butuh capabilities baru. Full = semua tahap, partial = tahap terpilih, tapered = campuran internal dan outsource. Outsourcing: untuk aktivitas yang tidak krusial dan lebih baik dikerjakan spesialis; risiko hollowing out, kehilangan kontrol, kurang insentif investasi khusus. Alliance: pooling resources dan berbagi risiko, fleksibel dan cepat; kontrol dan komitmen lebih besar daripada outsourcing; risiko benturan budaya, gain tak terwujud, ketergantungan, perlindungan teknologi."]];
CONTENT.s6={kicker:'Sesi 6 · Henry Ch. 8',title:'International Strategy dan Global Business',desc:'Perdebatan globalization vs localization, alasan perusahaan ekspansi ke luar negeri, kerangka Ghoshal, empat tipe international strategy, model Uppsala, entry mode strategies, Porter\'s diamond, serta mitos dan tantangan globalisasi.',
materi:[C("Globalization vs localization",P("<b>Globalization</b> adalah keterkaitan antarpasar lintas batas negara (ekonomi, keuangan, sosial, politik), sehingga kejadian di satu negara berdampak ke negara lain. <b>Localization</b> berarti perbedaan nasional itu penting, jadi produk, distribusi, dan promosi harus disesuaikan.")+VS("Dua kubu dalam debat",["Levitt (pro-globalization)","Teknologi membuat konsumen di mana-mana menginginkan produk standar. Perbedaan nasional hilang, dan hanya perusahaan yang sadar ini yang bisa menikmati skala ekonomi besar.",'Coca-Cola dan Pepsi',["Multidomestic corporation akan tamat","Global corporation menjual produk sama ke semua negara dengan cara sama","Bersaing lewat harga dan kualitas"]],["Douglas dan Wind (pro-localization)","Kesamaan perilaku konsumen hanya ada di sedikit segmen target. Memadukan produk dan pemasaran dengan pasar lokal bisa menghasilkan laba lebih besar.",'Findus (Nestlé) menjual fish fingers ke Inggris dan coq au vin ke Prancis',["Harga rendah mudah ditiru, jadi bukan keunggulan yang bertahan","Teknologi membuat efisiensi skala tercapai di volume yang lebih kecil","Manajer lokal bisa kehilangan motivasi bila semuanya distandarkan","Tarif dan pembatasan impor menghambat globalisasi"]],"Pendukung lokalisasi lain: <b>Ghemawat</b> (perbedaan geografis justru makin penting, strategi regional bisa menaikkan kinerja) dan <b>Hofstede</b> (tidak ada bukti budaya antargenerasi di berbagai negara makin sama).")+P("Debat ini praktis, bukan sekadar teori: kalau dunia makin global, pilihan strateginya beda dengan kalau dunia makin lokal. Henry juga mengingatkan bahwa globalisasi punya dampak ke kehidupan orang biasa. Dari sudut utilitarian mungkin ada manfaat besar, tetapi sering menutupi tragedi lokal.")),
C("Alasan perusahaan ekspansi internasional",T(["Kelompok","Faktor","Penjelasan"],[["Organisasional", "Persepsi tim manajemen", "Pasar domestik jenuh (Nokia dari Finlandia); biaya tetap besar seperti R&D farmasi, jadi perlu skala lebih besar; economies of scope (P&G dan Unilever mengoordinasi pemasaran dunia); pengetahuan dan pengalaman manajer soal pasar luar negeri; persepsi risiko; keuntungan lokasi untuk value chain"], ["Organisasional", "Firm-specific", "Ukuran perusahaan (yang besar lebih sering go international) dan daya tarik internasional produk, misalnya software, Coca-Cola, Starbucks, Armani"], ["Lingkungan (eksogen)", "Unsolicited proposals", "Pemerintah asing, distributor, atau pelanggan datang menawarkan"], ["Lingkungan (eksogen)", "Bandwagon effect", "Ikut pesaing yang sudah go international supaya tidak tertinggal"], ["Lingkungan (eksogen)", "Daya tarik host country", "Ukuran pasar dan sikap pemerintah yang ramah terhadap foreign direct investment (China dan India: pendapatan per kapita naik, tenaga kerja terampil, manufaktur murah, populasi gabungan lebih dari sepertiga dunia)"]])),
C("Kerangka Ghoshal untuk multinational enterprise (MNE)",P("MNE adalah organisasi yang punya kegiatan produktif di dua negara atau lebih. Ghoshal menyebut tiga tujuan strategis dan tiga sumber keunggulan. Perusahaan perlu bertindak supaya ketiga tujuan tercapai, dan tujuan itu bisa saling bertukar-untung (trade-off).")+T(["Tujuan strategis", "National differences", "Scale economies", "Scope economies"],[["Efisiensi operasi saat ini", "Memanfaatkan beda factor costs (upah, biaya modal)", "Memperbesar skala tiap aktivitas", "Berbagi investasi dan biaya antarproduk, pasar, bisnis"], ["Mengelola risiko", "Mengelola risiko akibat perubahan pasar atau kebijakan yang mengubah keunggulan komparatif negara", "Menyeimbangkan skala dengan fleksibilitas strategis dan operasional", "Diversifikasi portofolio risiko dan side-bets"], ["Inovasi, pembelajaran, adaptasi", "Belajar dari perbedaan proses dan sistem organisasi antarmasyarakat", "Manfaat pengalaman: biaya turun dan inovasi", "Pembelajaran bersama antarkomponen organisasi"]])+UL(["<b>Efisiensi</b> = rasio nilai output terhadap biaya semua input. Diferensiasi menaikkan nilai output (harga premium), faktor biaya rendah menurunkan biaya input.","<b>Risiko</b> ada empat jenis: makroekonomi (misalnya konflik militer), politik (keputusan pemerintah), kompetitif (reaksi pesaing), dan sumber daya (tidak punya atau tidak bisa memperoleh resources, misalnya teknologi).","<b>Pembelajaran</b> muncul bila ada sebagai tujuan organisasi yang didukung manajemen senior lewat sistem dan proses, dan meresap di budaya."])+P("Contoh sumber keunggulan: biaya insinyur software di India jauh lebih murah daripada di AS, Inggris, atau Eropa (national differences); klaster pemasok seperti Silicon Valley atau Wuhan (rumah Foxconn, pemasok Apple dan Xiaomi, terganggu COVID-19 pada 2020 sehingga banyak perusahaan menimbang on-shoring); experience curve dan minimum efficient scale (scale); platform mobil bersama (scope).")),
C("Empat tipe international strategy",P("Pertanyaan intinya: seberapa jauh produk distandarkan untuk memanfaatkan efisiensi, dan seberapa jauh disesuaikan dengan selera lokal yang menambah biaya.")+T(["", "Multidomestic", "Global", "International", "Transnational"],[["Ide dasar", "Produk disesuaikan dengan tiap pasar nasional; tiap pasar dianggap unik dan independen", "Produk standar untuk semua pasar internasional", "Mengeksploitasi core competencies di pasar asing; adaptasi hanya di pinggiran", "Sekaligus efisiensi global, responsif secara nasional, dan memanfaatkan inovasi dan pembelajaran worldwide"], ["Konfigurasi aset dan capabilities", "Terdesentralisasi, mandiri per negara", "Terpusat dan berskala global", "Sumber core competencies terpusat, sisanya terdesentralisasi", "Selektif: sebagian terpusat (di dalam atau luar negeri asal), sebagian tersebar dan terspesialisasi"], ["Peran operasi luar negeri", "Menangkap peluang lokal", "Menjalankan strategi induk", "Menyesuaikan dan memanfaatkan kompetensi induk", "Jaringan terintegrasi dengan aliran komponen, produk, sumber daya, orang, dan informasi"], ["Pengetahuan", "Dikembangkan dan disimpan di tiap unit", "Dikembangkan dan disimpan di pusat", "Dikembangkan di pusat, lalu dialihkan ke unit luar negeri", "Dipakai lintas negara"], ["Kekuatan", "Responsif pada permintaan lokal", "Biaya rendah lewat skala dan koordinasi", "Transfer pengetahuan ke negara yang kurang berkembang", "Menggabungkan ketiganya"], ["Kelemahan", "Variasi menaikkan biaya; pembelajaran lintas negara terhambat; inovasi lokal bisa sekadar melindungi wilayah manajer", "Terlalu menganggap selera sudah sama; tidak ada slack bagi anak usaha; tidak bisa belajar dari luar negeri asal", "Kurang efisien dari global dan kurang responsif dari multidomestic; aktivitas terpusat rentan kurs; kontrol kualitas jauh; manajer lokal kehilangan motivasi", "Butuh struktur korporat berbeda untuk mengelola interaksi yang rumit"], ["Contoh di Henry", "Walmart di Jerman: tidak pernah laba meski penjualan 2,5 miliar dolar per tahun; 'greeters' tidak populer; aturan hubungan atasan-bawahan ditolak karyawan; posisi termurah sudah diambil Aldi", "Huawei, Tata, Apple, Boeing; Walmart keluar dari Korea Selatan", "Apple: desain dan pengembangan di AS, manufaktur di China; produksi terganggu pandemi", "R&D di negara asal; pabrik padat karya di Meksiko; akses teknologi tertentu di AS"]])+CALL("<b>Administrative heritage</b> (Bartlett dan Ghoshal) adalah konfigurasi aset, gaya manajemen, dan nilai organisasi, yang dipengaruhi kepemimpinan, budaya negara asal, dan sejarah organisasi. Heritage membatasi seberapa cepat perusahaan bisa berubah menuju bentuk transnational.")),
C("Model Uppsala",P("Johanson dan Vahlne: internasionalisasi terjadi bertahap lewat keputusan inkremental. Makin banyak pengetahuan dan pengalaman, makin besar komitmen ke pasar luar negeri.")+UL(["Awalnya ekspor dulu, baru mendirikan anak usaha di luar negeri.","Masuk dulu ke negara tetangga, lalu ke pasar yang makin jauh.","<b>Psychic distance</b>: beda bahasa, budaya, sistem hukum dan politik yang menghambat aliran informasi. Negara dengan psychic distance rendah dipilih lebih dulu karena risikonya terasa lebih kecil.","Dua faktor utama: <b>market knowledge</b> (pengetahuan umum dan struktur pasar asing) dan <b>market commitment</b> (sumber daya yang dikomitmenkan). Faktor yang memengaruhi: <b>current activities</b> (tingkat komitmen di pasar itu, sumber pengalaman) dan <b>commitment decisions</b> (kesulitan menemukan peluang baru dengan pengetahuan yang ada)."])+T(["Kritik", "Isinya"],[["Rasional, bukan belajar bertahap", "Benito dan Gripsrud: internasionalisasi adalah hasil keputusan rasional"], ["Ukuran peluang pasar", "Yang mendorong adalah peluang ekonomi (ukuran pasar asing)"], ["Usang", "Sulit menjelaskan internasionalisasi beberapa dekade terakhir; psychic distance menurun saat dunia makin terintegrasi"], ["Jaringan", "Perusahaan bisa mendapat pengetahuan lewat pemasok atau mitra. Johanson dan Vahlne mengakui peran business networks"]])+P("Model ini masih relevan untuk perusahaan dari emerging markets yang cenderung mengikuti prinsip psychic distance.")),
C("Entry mode strategies",P("Brouthers: pemilihan entry mode ditentukan dua pertanyaan, yaitu (1) seberapa besar komitmen sumber daya yang bersedia diberikan, dan (2) seberapa besar kontrol atas operasi internasional yang dibutuhkan. Keduanya tergantung pada <b>persepsi risiko internasional</b>. Miller membagi risiko menjadi tiga: <b>general environment</b> (misalnya risiko politik, memengaruhi semua industri di negara itu), <b>industry</b> (ketidakpastian pasar input seperti tenaga kerja atau bahan), dan <b>firm-specific</b> (misalnya perselisihan karyawan, ditambah tanggung jawab bekerja di budaya berbeda). Bila hanya satu jenis risiko yang dipertimbangkan, entry mode bisa salah pilih.")+T(["Entry mode", "Isi", "Kelebihan", "Kelemahan"],[["Exporting", "Membuat barang atau jasa di negara asal, menjualnya ke negara lain", "Risiko dan komitmen rendah; mendapat pengalaman internasional; skala ekonomi dari penjualan lebih besar", "Kontrol rendah; bergantung pada distributor lokal yang mungkin kurang berkomitmen"], ["Licensing", "Memberi hak pakai patent, trademark, atau IP dengan imbalan fee", "Modal kecil; akses pasar cepat", "Perlu licensee yang tepat; licensee bisa meniru dan menjadi pesaing"], ["International franchising", "Bentuk licensing: franchisor mengalihkan paket produk, sistem, dan layanan dengan imbalan fee (McDonald's, Benetton, Pizza Hut)", "Franchisee membawa pengetahuan lokal dan entrepreneurship; host country lebih menerima karena ada kepemilikan dan lapangan kerja lokal", "Gagal bila kurang percaya; franchisee bisa free ride; satu outlet buruk merusak reputasi seluruh jaringan"], ["Joint venture dan strategic alliance", "JV: perusahaan terpisah, saham setara. Alliance: berbagi sebagian resources tanpa entitas baru", "Risiko dibagi; gabung resources dan capabilities; akses pasar; tujuan akhir alliance adalah belajar dari mitra", "Perlu tujuan jelas dan kepercayaan; beda manajerial; campur tangan negara (Danone dan HSBC di China). Contoh JV: Hydro Volt (Northvolt dan Norsk Hydro) untuk daur ulang baterai"], ["Wholly owned subsidiary (FDI)", "Kontrol penuh: greenfield (membangun baru) atau akuisisi atau merger dengan perusahaan yang ada di luar negeri", "Kontrol penuh dan potensi imbal hasil terbesar; didukung host government (pembiayaan, bantuan regulasi) demi lapangan kerja; cocok bila punya resources unik (Toyota, Nissan; juga Tesla, Nestlé, P&G)", "Komitmen sumber daya dan risiko terbesar; tidak ada yang berbagi biaya; sulit bila tidak punya manajer yang paham pasar lokal"]])+CALL("Hubungan risiko dan kontrol: makin besar kontrol yang diinginkan, makin besar risiko. Exporting = risiko dan kontrol rendah; wholly owned subsidiary = kontrol penuh dan risiko besar. Bila persepsi risiko tinggi, perusahaan bisa membagi risiko lewat JV atau franchise.")),
C("Porter's diamond of national advantage",P("Pertanyaan Porter: mengapa suatu negara unggul di industri tertentu? Jawabannya, daya saing negara datang dari kemampuan industrinya berinovasi dan meningkatkan kualitas (upgrade), yang dipicu pesaing domestik yang kuat, pemasok yang agresif, dan pelanggan lokal yang menuntut. Perusahaan yang ditempa di lingkungan ini lebih siap bersaing di luar negeri. Keunggulan yang bertahan lama datang dari inovasi dan upgrade yang terus-menerus, karena pesaing akhirnya meniru.")+T(["Atribut", "Isi", "Contoh dari Henry"],[["Factor conditions", "Pemanfaatan faktor produksi yang spesifik bagi industri (tenaga kerja terampil, kemampuan teknologi). Faktor penting kini diciptakan, bukan sekadar warisan alam", "Silicon Valley: Xerox PARC, dekat Stanford, Hewlett dan Packard"], ["Demand conditions", "Konsumen domestik yang canggih dan menuntut mendorong inovasi dan memberi petunjuk tren global", "AC kecil dan senyap berkompresor rotary yang hemat energi di Jepang"], ["Related and supporting industries", "Pemasok domestik yang kompetitif dan dekat memberi input hemat dan mendorong inovasi bersama", "Klaster pemasok kulit dan sepatu di Italia"], ["Firm strategy, structure, and rivalry", "Struktur manajemen yang sesuai dinamika industri, dan rivalitas domestik yang kuat (faktor terpenting)", "Struktur ketat Jerman untuk industri presisi seperti optik"]])+P("Dua variabel eksternal: <b>chance</b> (kejadian tak terduga, misalnya penemuan baru, perang, gejolak pasar keuangan, harga minyak) dan <b>government</b> (memengaruhi keempat atribut lewat subsidi, pendidikan, regulasi pasar modal, standar produk, pembelian pemerintah, pajak, regulasi persaingan).")+T(["Kritik", "Isinya"],[["Rugman dan D'Cruz", "Diamond tunggal cocok untuk MNE dari triad (AS, Jepang, Uni Eropa), tetapi kurang efektif untuk ekonomi kecil dan terbuka seperti Kanada dan Selandia Baru"], ["Rugman dan Verbeke", "Pembedaan home base dan host nation kurang pas bagi dunia nyata; negara kecil bisa bergantung pada negara besar"], ["Double diamond", "Manajer MNE Kanada perlu menganalisis diamond Kanada dan AS. Nestlé: sekitar 95% penjualan di luar Swiss (Hodgetts), sehingga diamond Swiss kurang relevan"]])+P("Danny Miller (The Icarus Paradox) mengingatkan bahwa organisasi yang sukses sulit melihat kebutuhan berubah, dan akhirnya terlampaui.")),
C("Mitos global strategy dan tantangan globalisasi",P("Rangan menyebut tujuh mitos soal perusahaan yang ingin go global:")+T(["Mitos", "Kenyataan menurut Rangan"],[["1. Perusahaan yang punya uang bisa go global", "Yang berhasil punya intangible assets berharga (IKEA: value proposition; Coca-Cola: merek). Ekspor yang tumbuh menandakan nilai lebih baik daripada pesaing lokal"], ["2. Internasionalisasi jasa itu berbeda", "Sama saja: perlu intangible assets yang bisa direplikasi di luar negeri"], ["3. Jarak dan batas negara tidak penting lagi", "Biaya transportasi kecil tapi tetap positif dan naik dengan jarak; budaya membentuk institusi dan nilai. HSBC menyebut diri 'the world's local bank'"], ["4. Negara berkembang adalah tempat aksinya", "Ekonomi Barat masih mendominasi perdagangan dunia (Henry mencatat poin ini kurang kuat karena China kini ekonomi terbesar kedua)"], ["5. Produksi di tempat upah paling murah", "Upah hanya sebagian dari total delivered cost; tarif dan bea bisa menaikkan biaya, dan produktivitas rendah menaikkan biaya per unit"], ["6. Globalisasi akan bertahan", "Pengangguran berkepanjangan bisa memicu pemerintah bertindak sepihak membalik globalisasi; korporasi perlu berperan sosial"], ["7. Pemerintah tidak penting lagi", "Ekonomi global butuh aturan, dan aturan dibuat pemerintah; MNE perlu bekerja sama dengan pemerintah"]])+UL(["<b>Rugman dan Verbeke:</b> 500 MNE terbesar menguasai sekitar 90% FDI dan 50% perdagangan dunia, tetapi kebanyakan bukan perusahaan global. Mereka adalah <b>regional multinationals</b> dengan penjualan terbesar di home leg of the triad (Amerika Utara, Uni Eropa, Asia). Jadi yang disebut globalisasi mungkin lebih tepat regionalisasi.","<b>Palmisano (IBM):</b> MNE tradisional berevolusi menjadi <b>globally integrated enterprise</b>: fokus pada <i>bagaimana</i> membuat dan mengantar, bukan <i>apa</i>. Aktivitas value chain (procurement, riset, penjualan) diintegrasikan global, dan dipilih dikerjakan di mana dan in-house atau outsource. Tantangannya: pasokan keterampilan tinggi, pembajakan IP vs kolaborasi, menjaga kepercayaan, dan pasar modal yang berorientasi jangka pendek.","<b>Strategy in Focus 8.2 (Globalization in Retreat):</b> penjualan luar negeri KFC dan McDonald's naik 400% antara 1990 dan 2005, tetapi kemudian laba luar negeri turun dan keduanya melepas bisnis China. Perusahaan multinasional hanya 2% lapangan kerja dunia tetapi mengorkestrasi rantai pasok lebih dari 50% perdagangan dunia."]))].join('')};
const Q6=[["Seorang manajer yakin teknologi telah membuat selera konsumen di seluruh dunia seragam, sehingga satu produk standar dengan harga rendah bisa dijual ke mana-mana. Pandangan ini paling dekat dengan…", ["Douglas dan Wind", "Levitt", "Hofstede", "Ghemawat"], 1, "Levitt berpendapat teknologi mendorong konvergensi dan berakhirnya multidomestic corporation. Douglas dan Wind, Hofstede, dan Ghemawat menekankan perbedaan nasional yang masih penting."],
["Findus (Nestlé) memasarkan fish fingers ke konsumen Inggris dan coq au vin ke konsumen Prancis. Contoh ini dipakai Henry untuk menunjukkan bahwa…", ["Skala ekonomi global adalah satu-satunya hal yang penting", "Harga rendah adalah keunggulan kompetitif yang berkelanjutan", "Perbedaan nasional masih penting sehingga produk perlu disesuaikan", "Teknologi telah menyamakan seluruh pasar"], 2, "Douglas dan Wind memakai contoh ini: kesamaan perilaku konsumen hanya ada di segmen terbatas dan perbedaan antarnegara masih besar."],
["Beberapa pesaing sudah membuka operasi di luar negeri, lalu Perusahaan A ikut melakukannya supaya tidak ketinggalan peluang. Faktor pendorong ekspansi ini adalah…", ["Unsolicited proposal", "Locational advantage", "Economies of scope", "Bandwagon effect"], 3, "Bandwagon effect adalah faktor lingkungan: organisasi mengikuti pesaing yang sudah go international."],
["Tiga tujuan strategis perusahaan multinasional menurut Ghoshal adalah…", ["Efisiensi, pengelolaan risiko, serta inovasi, pembelajaran, dan adaptasi", "Pertumbuhan, laba, dan pangsa pasar", "Skala, cakupan, dan perbedaan nasional", "Standardisasi, lokalisasi, dan integrasi"], 0, "Skala, cakupan, dan perbedaan nasional adalah tiga sumber keunggulan, bukan tujuan strategis."],
["Biaya mempekerjakan insinyur software di India jauh lebih murah daripada di AS atau Inggris. Dalam kerangka Ghoshal, ini adalah sumber keunggulan berupa…", ["Economies of scope", "Economies of scale", "National differences", "Learning capabilities"], 2, "Perbedaan factor costs antarnegara (locational advantages) termasuk national differences."],
["Pada strategi international, pengetahuan dan core competencies menurut Henry (Table 8.2)…", ["Dikembangkan dan disimpan di tiap unit lokal", "Disimpan di pusat dan tidak dibagikan", "Dikembangkan di pusat lalu dialihkan ke unit luar negeri", "Dikembangkan sepenuhnya oleh mitra lokal"], 2, "Pada strategi international, pengetahuan dikembangkan di pusat dan ditransfer ke operasi luar negeri yang kurang berkembang."],
["Perusahaan yang berusaha sekaligus mencapai efisiensi global, responsif terhadap kebutuhan nasional, dan memanfaatkan inovasi serta pembelajaran di seluruh dunia mengikuti strategi…", ["Transnational", "Global", "Multidomestic", "International"], 0, "Itu definisi transnational strategy (Bartlett dan Ghoshal). Strateginya selektif: sebagian dipusatkan, sebagian disebar, dan dikelola lewat jaringan terintegrasi."],
["Menurut model Uppsala, perusahaan yang baru mulai internasionalisasi cenderung…", ["Memilih pasar dengan psychic distance paling tinggi lebih dulu", "Langsung mendirikan wholly owned subsidiary di banyak negara", "Membentuk joint venture dengan pesaing global", "Mengekspor ke negara berpsychic distance rendah sebelum mendirikan anak usaha"], 3, "Uppsala: ekspansi bertahap. Ekspor lebih dulu, negara tetangga lebih dulu, dan komitmen naik seiring pengetahuan pasar."],
["Sebuah perusahaan memberi hak pakai merek dan paten kepada mitra asing dengan imbalan fee, sehingga bisa masuk pasar baru dengan cepat dan modal kecil. Risiko utama yang disebut Henry adalah…", ["Biaya modal sangat besar", "Tidak ada akses ke pasar tuan rumah", "Licensee bisa meniru dan kelak menjadi pesaing", "Kontrol penuh atas operasi tetapi risiko politik tinggi"], 2, "Kelebihan licensing: modal kecil dan akses cepat. Kelemahannya: licensee yang tepat dibutuhkan dan bisa meniru produk."],
["Yang BUKAN salah satu dari empat atribut diamond Porter di negara asal adalah…", ["Factor conditions", "Peran pemerintah", "Related and supporting industries", "Firm strategy, structure, and rivalry"], 1, "Pemerintah dan chance adalah dua variabel eksternal yang memengaruhi keempat atribut, bukan atribut inti."],
["Menurut Porter, faktor yang paling penting untuk menciptakan keunggulan kompetitif dan kesuksesan internasional adalah…", ["Upah tenaga kerja yang murah", "Kelimpahan sumber daya alam", "Subsidi pemerintah", "Adanya pesaing domestik yang kuat"], 3, "Rivalitas domestik yang kuat memaksa perusahaan terus berinovasi dan menekan biaya, sehingga siap bersaing di luar negeri."],
["Rugman dan D'Cruz mengusulkan double diamond karena…", ["Diamond tunggal sudah cukup untuk semua negara", "Diamond hanya cocok untuk negara berkembang", "Negara kecil seperti Kanada sebaiknya juga memakai diamond negara besar (AS) sebagai home market", "Porter menolak peran pemerintah dalam keunggulan nasional"], 2, "Ekonomi kecil terlalu kecil menjadi basis keunggulan sendiri, jadi manajer perlu menganalisis diamond negara asal dan diamond mitra dagang besar."],
["Menurut Rangan, mitos 'produksi di tempat upah paling murah' keliru karena…", ["Biaya tenaga kerja hanya sebagian dari total delivered cost, dan tarif atau produktivitas rendah bisa menaikkan biaya per unit", "Upah murah selalu membuat kualitas turun", "Tenaga kerja murah dilarang oleh hukum internasional", "Biaya transportasi sudah menjadi nol"], 0, "Rangan: upah rendah tidak otomatis berarti biaya total rendah."],
["Rugman dan Verbeke menyimpulkan bahwa sebagian besar dari 500 MNE terbesar sebenarnya…", ["Perusahaan global murni dengan penjualan merata di seluruh dunia", "Perusahaan domestik yang hanya mengekspor", "Perusahaan yang hanya memakai strategi licensing", "Regional multinationals dengan penjualan terbesar di wilayah asalnya dalam triad"], 3, "Kebanyakan MNE punya sebagian besar penjualan di home leg of the triad, sehingga yang terjadi lebih mirip regionalisasi daripada globalisasi."],
["Perbedaan bahasa, budaya, serta sistem hukum dan politik yang menghambat aliran informasi antarnegara disebut…",["Psychic distance","Administrative heritage","Bandwagon effect","Mobility barrier"],0,"Psychic distance (model Uppsala): negara dengan psychic distance rendah dipilih lebih dulu karena risikonya terasa lebih kecil."],
["Perusahaan tidak bisa memperoleh teknologi penting untuk bersaing di luar negeri. Dalam kerangka risiko Ghoshal ini adalah risiko…",["Makroekonomi","Politik","Kompetitif","Sumber daya"],3,"Empat risiko: makroekonomi, politik, kompetitif, dan sumber daya (tidak punya atau tidak bisa memperoleh resources seperti teknologi)."],
["Konsumen domestik yang canggih dan menuntut mendorong inovasi, misalnya AC senyap dan hemat energi di Jepang. Atribut diamond Porter ini adalah…",["Factor conditions","Demand conditions","Related and supporting industries","Firm strategy, structure, and rivalry"],1,"Demand conditions: konsumen domestik yang menuntut mendorong inovasi dan memberi petunjuk tren global."],
["Kelemahan international franchising yang dicatat Henry adalah…",["Franchisor kehilangan seluruh kontrol hukum","Tidak ada pengetahuan lokal","Satu outlet yang buruk dapat merusak reputasi seluruh jaringan","Modal yang dibutuhkan sangat besar"],2,"Kelemahan franchising: bisa gagal bila kurang percaya, franchisee bisa free ride, dan satu outlet buruk merusak reputasi jaringan."],
["Konfigurasi aset, gaya manajemen, dan nilai organisasi yang dibentuk kepemimpinan, budaya negara asal, dan sejarah disebut…",["Administrative heritage","Psychic distance","Bandwagon effect","Strategic fit"],0,"Administrative heritage (Bartlett dan Ghoshal) membatasi seberapa cepat perusahaan bisa berubah menuju bentuk transnational."],
["Distributor asing menghubungi sebuah perusahaan dan menawarkan menjual produknya di negaranya. Faktor pendorong ekspansi ini adalah…",["Bandwagon effect","Economies of scope","Unsolicited proposal","Persepsi risiko manajer"],2,"Unsolicited proposals adalah faktor lingkungan: pemerintah asing, distributor, atau pelanggan datang menawarkan."],
["Menurut Palmisano, globally integrated enterprise lebih berfokus pada…",["Apa yang dibuat, bukan bagaimana membuatnya","Hanya satu negara asal","Penutupan rantai pasok dalam negeri","Bagaimana membuat dan mengantar produk, dengan mengintegrasikan aktivitas value chain secara global"],3,"Palmisano (IBM): fokus pada bagaimana membuat dan mengantar, bukan apa. Aktivitas value chain diintegrasikan global dan bisa dikerjakan in-house atau di-outsource."],
["Salah satu kritik terhadap model Uppsala adalah…",["Terlalu mengabaikan pentingnya market knowledge","Perusahaan bisa mendapat pengetahuan lewat pemasok atau mitra (business networks)","Model hanya berlaku untuk perusahaan jasa","Psychic distance justru makin besar saat dunia terintegrasi"],1,"Kritik lain: internasionalisasi adalah keputusan rasional, didorong peluang ekonomi, dan model sulit menjelaskan dekade terakhir. Johanson dan Vahlne mengakui peran business networks."]];
const E6=[["Jelaskan debat globalization vs localization (Levitt vs Douglas dan Wind, ditambah Ghemawat dan Hofstede). Apa dampaknya terhadap pilihan strategi internasional?", "Levitt: teknologi membuat selera konsumen seragam, sehingga perusahaan global yang menjual produk standar menikmati skala ekonomi dan multidomestic corporation akan tamat (contoh Coca-Cola dan Pepsi). Douglas dan Wind: kesamaan hanya ada di sedikit segmen, harga rendah mudah ditiru, teknologi memungkinkan efisiensi pada skala kecil, dan standardisasi bisa mengurangi motivasi manajer lokal; contoh Findus. Ghemawat: perbedaan geografis makin penting dan strategi regional membantu. Hofstede: tidak ada bukti budaya negara-negara menyatu. Dampaknya: kalau dunia makin global, strategi condong ke standardisasi (global); kalau makin lokal, condong ke penyesuaian (multidomestic); pilihan di antaranya adalah international dan transnational."],
