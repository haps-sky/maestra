["Konfigurasi aset, gaya manajemen, dan nilai organisasi yang dibentuk kepemimpinan, budaya negara asal, dan sejarah disebut…",["Administrative heritage","Psychic distance","Bandwagon effect","Strategic fit"],0,"Administrative heritage (Bartlett dan Ghoshal) membatasi seberapa cepat perusahaan bisa berubah menuju bentuk transnational."],
["Distributor asing menghubungi sebuah perusahaan dan menawarkan menjual produknya di negaranya. Faktor pendorong ekspansi ini adalah…",["Bandwagon effect","Economies of scope","Unsolicited proposal","Persepsi risiko manajer"],2,"Unsolicited proposals adalah faktor lingkungan: pemerintah asing, distributor, atau pelanggan datang menawarkan."],
["Menurut Palmisano, globally integrated enterprise lebih berfokus pada…",["Apa yang dibuat, bukan bagaimana membuatnya","Hanya satu negara asal","Penutupan rantai pasok dalam negeri","Bagaimana membuat dan mengantar produk"],3,"Palmisano (IBM): fokus pada bagaimana membuat dan mengantar, bukan apa. Aktivitas value chain diintegrasikan global dan bisa dikerjakan in-house atau di-outsource."],
["Salah satu kritik terhadap model Uppsala adalah…",["Terlalu mengabaikan pentingnya market knowledge","Pengetahuan bisa didapat lewat mitra (business networks)","Model hanya berlaku untuk perusahaan jasa","Psychic distance justru makin besar saat dunia terintegrasi"],1,"Kritik lain: internasionalisasi adalah keputusan rasional, didorong peluang ekonomi, dan model sulit menjelaskan dekade terakhir. Johanson dan Vahlne mengakui peran business networks."],["Inditex memiliki desain, pemotongan kain, dan logistik terintegrasi secara global, tetapi assortment tiap toko disesuaikan pasar lokal dan manajer lokal berwenang menyesuaikan keputusan. Tipe international strategy yang paling tepat adalah…", ["Global", "Multidomestic", "Transnational", "International"], 2, "Transnational memadukan efisiensi sistem global dengan responsiveness pada pasar lokal."],
["Mana yang paling menunjukkan unsur local responsiveness pada Inditex?", ["Desain, pemotongan kain, dan logistik dipusatkan di Arteixo", "Assortment toko disesuaikan pasar lokal", "Lebih dari 95% koleksi Zara dijual secara internasional", "Jaringan logistik menghubungkan pabrik dengan pusat distribusi"], 1, "Tiga pilihan lain adalah elemen sistem dan skala global."],
["Menurut kasus, mengapa pesaing sulit menyamai kinerja Zara?", ["Zara hanya menjual produk termurah di pasar", "Zara menutup semua pabrik partner dan memproduksi di satu negara berbiaya rendah", "Zara menjual produk yang sama persis di semua negara", "Desain, produksi, dan distribusi saling terhubung sebagai satu sistem"], 3, "Keunggulannya adalah sistem yang saling terhubung, bukan satu komponen."]];
const E6=[["Jelaskan debat globalization vs localization (Levitt vs Douglas dan Wind, ditambah Ghemawat dan Hofstede). Apa dampaknya terhadap pilihan strategi internasional?", "Levitt: teknologi membuat selera konsumen seragam, sehingga perusahaan global yang menjual produk standar menikmati skala ekonomi dan multidomestic corporation akan tamat (contoh Coca-Cola dan Pepsi). Douglas dan Wind: kesamaan hanya ada di sedikit segmen, harga rendah mudah ditiru, teknologi memungkinkan efisiensi pada skala kecil, dan standardisasi bisa mengurangi motivasi manajer lokal; contoh Findus. Ghemawat: perbedaan geografis makin penting dan strategi regional membantu. Hofstede: tidak ada bukti budaya negara-negara menyatu. Dampaknya: kalau dunia makin global, strategi condong ke standardisasi (global); kalau makin lokal, condong ke penyesuaian (multidomestic); pilihan di antaranya adalah international dan transnational."],
["Bandingkan empat tipe international strategy (multidomestic, global, international, transnational) dari sisi konfigurasi aset, peran operasi luar negeri, dan pengetahuan. Apa kelemahan masing-masing, dan apa itu administrative heritage?", "Multidomestic: aset terdesentralisasi, operasi luar negeri menangkap peluang lokal, pengetahuan disimpan di tiap unit; kelemahan biaya variasi dan pembelajaran terhambat (Walmart di Jerman). Global: aset terpusat dan berskala global, anak usaha menjalankan strategi induk, pengetahuan di pusat; kelemahan menganggap selera sudah sama dan tidak ada slack (Walmart keluar dari Korea Selatan). International: kompetensi inti di pusat dan dialihkan ke luar negeri; kurang efisien dari global dan kurang responsif dari multidomestic; rentan kurs, kontrol jauh, manajer lokal kurang termotivasi (Apple). Transnational: sekaligus efisien, responsif, dan memanfaatkan pembelajaran lewat jaringan terintegrasi dengan pemusatan selektif. Administrative heritage: konfigurasi aset, gaya manajemen, dan nilai organisasi yang dibentuk kepemimpinan, budaya negara asal, dan sejarah; ia membatasi kemampuan perusahaan berubah."],
["Sebuah perusahaan makanan ingin masuk ke pasar baru dengan tingkat risiko negara yang dinilai tinggi. Pilih dan justifikasi entry mode yang cocok dengan memakai kerangka risiko dan kontrol, serta sebutkan kelemahannya.", "Pertimbangan Brouthers: seberapa besar komitmen sumber daya dan kontrol yang diperlukan, yang bergantung pada persepsi risiko (Miller: risiko general environment, industry, dan firm-specific). Bila risiko tinggi, perusahaan cenderung membatasi komitmen, misalnya mulai dengan exporting atau membagi risiko lewat joint venture atau franchise. Exporting: risiko dan komitmen rendah tetapi kontrol rendah dan bergantung pada distributor. Franchising: pengetahuan lokal dan penerimaan host country, tetapi risiko free ride dan reputasi rusak. JV: risiko dibagi dan akses pasar, tetapi butuh tujuan jelas, kepercayaan, dan rentan campur tangan negara (Danone dan HSBC di China). Wholly owned subsidiary memberi kontrol penuh tetapi risiko terbesar sehingga kurang cocok untuk risiko tinggi."],
["Jelaskan Porter's diamond of national advantage dan kritik terhadapnya. Mengapa Rugman mengusulkan double diamond?", "Diamond: factor conditions, demand conditions, related and supporting industries, serta firm strategy, structure, and rivalry, ditambah dua variabel eksternal (chance dan government). Kekuatan utama datang dari rivalitas domestik yang kuat dan konsumen yang menuntut, yang mendorong inovasi dan upgrade sehingga perusahaan siap bersaing di luar negeri. Kritik: Rugman dan D'Cruz menilai diamond tunggal cocok untuk MNE dari triad (AS, Jepang, Uni Eropa) tetapi kurang untuk ekonomi kecil dan terbuka seperti Kanada atau Selandia Baru; Rugman dan Verbeke menilai pembedaan home dan host base mengabaikan realitas. Double diamond: manajer MNE dari negara kecil menganalisis diamond negaranya dan diamond negara besar mitra dagangnya (Kanada dan AS). Contoh: sekitar 95% penjualan Nestlé di luar Swiss."]];

CONTENT.s8={kicker:'Sesi 8 · Henry, Corporate Strategy',title:'Corporate Strategy, Diversification, and Portfolio Management',desc:'Sesi ini membahas keputusan perusahaan tentang bisnis apa yang akan dimasuki, bagaimana bisnis-bisnis tersebut saling mendukung, cara menilai portofolio bisnis, serta pilihan restrukturisasi. Materi mengikuti cakupan RPKPS dan pokok bahasan corporate strategy dalam buku Anthony Henry; nomor bab dapat berbeda menurut edisi.',materi:[
C("1. Apa itu corporate strategy?",P("<b>Corporate strategy (strategi korporat)</b> adalah keputusan tentang bisnis dan industri mana yang akan dimasuki perusahaan, bisnis mana yang akan dipertahankan, dan bagaimana kantor pusat membagi sumber daya di antara bisnis-bisnis tersebut. Ini berbeda dari <i>business strategy</i>, yang berfokus pada cara satu unit bisnis bersaing di pasarnya." )+T(["Pertanyaan utama","Contoh keputusan"],[["Corporate strategy","Apakah grup perusahaan sebaiknya memiliki bisnis makanan, ritel, dan logistik?"],["Business strategy","Bagaimana bisnis makanan bersaing: lewat harga murah, kualitas, atau segmen khusus?"]])+CALL("Inti menurut Henry: perusahaan induk seharusnya memberi nilai tambah kepada bisnis-bisnis yang dimilikinya. Jika kantor pusat tidak membuat bisnis lebih baik, struktur grup yang besar belum tentu menguntungkan.")),
C("2. Diversification: memperluas jenis bisnis",P("<b>Diversification (diversifikasi)</b> berarti perusahaan masuk ke bisnis baru, bukan hanya menjual lebih banyak produk yang sama di pasar yang sama. Diversifikasi bisa membuka sumber pendapatan baru, tetapi juga menambah kebutuhan modal, pengetahuan, dan kemampuan mengelola bisnis." )+T(["Jenis","Penjelasan sederhana","Contoh ilustratif"],[["Related diversification","Masuk ke bisnis yang masih berhubungan dengan bisnis lama melalui pelanggan, teknologi, merek, distribusi, atau kemampuan yang sama.","Produsen susu mengembangkan yoghurt karena memiliki bahan baku, teknologi pengolahan, dan saluran distribusi yang serupa."],["Unrelated / conglomerate diversification","Masuk ke bisnis yang hubungannya dengan bisnis lama sedikit atau tidak jelas.","Grup yang memiliki bisnis asuransi sekaligus bisnis pertambangan."]])+P("Diversifikasi terkait berpeluang berbagi kemampuan atau sumber daya. Namun, hubungan itu harus nyata; dua bisnis yang tampak mirip belum tentu benar-benar bisa bekerja lebih efisien bersama.")),
C("3. Synergy: nilai tambah dari gabungan bisnis",P("<b>Synergy (sinergi)</b> terjadi ketika dua bisnis yang dikelola bersama menghasilkan nilai lebih besar daripada jika keduanya berjalan sendiri-sendiri. Sering digambarkan sebagai <b>2 + 2 = 5</b>." )+UL(["Berbagi sumber daya: dua merek memakai gudang atau sistem teknologi yang sama.","Berbagi kemampuan: pengalaman pemasaran satu bisnis membantu bisnis lain.","Menggabungkan aktivitas: pembelian dalam jumlah besar dapat memperkuat daya tawar kepada pemasok."])+P("Sinergi tidak muncul otomatis hanya karena dua perusahaan digabungkan. Manajemen harus menunjukkan sumber nilai tambah yang konkret dan membandingkannya dengan biaya koordinasi, integrasi sistem, serta kemungkinan konflik budaya.")),
C("4. Cara menilai keputusan diversifikasi",P("Sebelum masuk ke bisnis baru, perusahaan perlu menjawab tiga pertanyaan penting yang dikenal dalam pembahasan strategi korporat Porter:" )+T(["Kriteria","Pertanyaan sederhana","Risiko jika diabaikan"],[["Industry attractiveness","Apakah industri tujuan cukup menarik dan berpeluang menghasilkan keuntungan?","Perusahaan masuk ke industri yang sulit menghasilkan laba."],["Cost of entry","Apakah biaya untuk masuk—misalnya harga akuisisi, investasi, dan biaya membangun kemampuan—masuk akal?","Perusahaan membayar terlalu mahal sehingga potensi keuntungan habis untuk biaya masuk."],["Better-off test","Apakah bisnis baru dan bisnis yang sudah ada akan menjadi lebih kuat karena berada dalam satu grup?","Bisnis hanya bertambah banyak, tetapi tidak ada nilai tambah dari kepemilikan bersama."]])+CALL("Contoh: membeli perusahaan kopi tidak otomatis menguntungkan bagi grup ritel. Akuisisi lebih masuk akal jika akses lokasi, pelanggan, sistem distribusi, atau kemampuan operasional grup benar-benar membuat bisnis kopi lebih bernilai.")),
C("5. Portfolio management dan BCG Matrix",P("<b>Portfolio management</b> adalah cara menilai kumpulan bisnis dalam satu perusahaan atau grup untuk menentukan bisnis mana yang perlu didanai, dipertahankan, dikembangkan, atau dilepas. Salah satu alat pengantar yang umum adalah <b>BCG Matrix</b>." )+T(["Kategori BCG","Ciri utama","Arah keputusan umum"],[["Star","Pangsa pasar relatif tinggi di pasar yang tumbuh cepat.","Investasi untuk menjaga posisi dan pertumbuhan."],["Cash Cow","Pangsa pasar relatif tinggi di pasar yang tumbuh lambat.","Jaga efisiensi dan gunakan arus kas untuk mendukung bisnis lain."],["Question Mark","Pangsa pasar relatif rendah di pasar yang tumbuh cepat.","Pilih secara selektif: tambah investasi jika berpeluang menang atau pertimbangkan keluar."],["Dog","Pangsa pasar relatif rendah di pasar yang tumbuh lambat.","Pertimbangkan mempertahankan untuk alasan strategis, memperbaiki, menjual, atau menutup."]])+P("BCG menggunakan dua ukuran: <b>pertumbuhan pasar</b> dan <b>pangsa pasar relatif</b>. Matriks ini membantu diskusi, bukan memberi keputusan otomatis. Bisnis yang dikategorikan <i>Dog</i>, misalnya, masih mungkin dipertahankan jika mendukung produk lain atau melayani pelanggan penting." )+CALL("Jangan menyamakan pertumbuhan pasar dengan profitabilitas. Pasar yang tumbuh cepat bisa tetap tidak menarik jika persaingannya ketat, kebutuhan investasinya sangat besar, atau margin labanya rendah.")),
C("6. Melihat portofolio dari sudut perusahaan induk",P("Henry juga membahas pendekatan <b>corporate parenting</b>: perusahaan induk sebaiknya memilih bisnis yang benar-benar dapat dibantu oleh kemampuan khasnya. Pertanyaannya bukan hanya apakah bisnis itu menarik, tetapi apakah grup ini adalah pemilik yang tepat." )+UL(["Apakah kantor pusat punya pengetahuan, sistem, merek, jaringan, atau kemampuan yang relevan untuk membantu bisnis tersebut?","Apakah manfaat dari bantuan kantor pusat lebih besar daripada biaya birokrasi dan koordinasi?","Apakah bisnis tersebut sesuai dengan kemampuan inti perusahaan induk, atau justru menyita perhatian dari bisnis yang lebih cocok?"])+P("Konsep <b>heartland</b> mengacu pada bisnis yang paling cocok dengan kemampuan perusahaan induk dan paling berpeluang mendapat nilai tambah darinya. Bisnis yang jauh dari kemampuan induk lebih berisiko tidak memperoleh manfaat dari kepemilikan grup.")),
C("7. Restrukturisasi portofolio",P("<b>Restructuring (restrukturisasi)</b> berarti mengubah susunan bisnis atau cara bisnis dikelola agar kinerja grup menjadi lebih baik. Restrukturisasi bukan selalu berarti memotong biaya; tujuannya adalah memperbaiki kecocokan strategi dan penciptaan nilai." )+T(["Pilihan","Makna","Kapan dapat dipertimbangkan"],[["Investasi / ekspansi","Menambah dana, kapasitas, atau kemampuan pada bisnis tertentu.","Bisnis punya prospek baik dan grup mampu menambah nilainya."],["Turnaround","Memperbaiki bisnis yang kinerjanya menurun.","Masalah masih bisa diperbaiki melalui perubahan operasi, biaya, atau arah pasar."],["Divestasi","Menjual atau melepas unit bisnis.","Bisnis tidak lagi sesuai strategi, tidak menghasilkan nilai tambah, atau lebih bernilai di tangan pemilik lain."],["Penutupan","Menghentikan bisnis.","Prospek pemulihan rendah dan manfaat mempertahankan bisnis tidak menutup biayanya."]])+P("Restrukturisasi harus memperhitungkan dampak terhadap karyawan, pelanggan, pemasok, pemegang saham, dan pemangku kepentingan lain. Keputusan juga perlu melihat biaya keluar, kewajiban kontrak, serta dampak terhadap bisnis yang masih dipertahankan.")),
C("8. Cara perusahaan tumbuh: bukan hanya diversifikasi",P("Strategi korporat juga memilih cara untuk memperoleh atau membangun bisnis. Pilihannya antara lain membangun kemampuan dari dalam, membeli perusahaan, atau bekerja sama dengan pihak lain." )+T(["Cara","Kelebihan","Hal yang perlu diwaspadai"],[["Internal development","Kemampuan dibangun sendiri dan perubahan bisa dikendalikan bertahap.","Memerlukan waktu dan belum tentu mampu mengejar peluang cepat."],["Merger & acquisition (M&A)","Dapat memberi akses cepat ke pelanggan, aset, teknologi, atau pasar.","Harga akuisisi bisa terlalu mahal; integrasi sistem, proses, dan budaya bisa sulit."],["Joint venture / strategic alliance","Dapat berbagi risiko, sumber daya, dan pengetahuan dengan mitra.","Tujuan yang tidak selaras, kurangnya kepercayaan, dan konflik kendali dapat menghambat hasil."]])+P("M&A, joint venture, dan alliance adalah cara menjalankan strategi, bukan jaminan bahwa strategi tersebut akan berhasil. Manfaat dan risikonya perlu dibandingkan dengan pilihan membangun kemampuan sendiri.")),
C("9. Contoh penerapan kasus: Aldi",P("Aldi dikenal sebagai peritel diskon yang menekankan harga kompetitif dan operasi yang sederhana. Contoh ini digunakan untuk menerapkan konsep strategi korporat dan keunggulan bersaing. Ini adalah ilustrasi penerapan teori, bukan ringkasan dari kasus kelas tertentu." )+T(["Konsep","Penerapan pada Aldi","Analisis strategis"],[["Cost leadership","Menjaga harga tetap kompetitif melalui pilihan produk yang relatif terfokus, proses toko yang sederhana, dan perhatian pada biaya operasional.","Strategi harga rendah hanya berkelanjutan jika struktur biaya juga terkendali. Jika biaya naik tanpa perbaikan produktivitas, keunggulan harga dapat melemah."],["Activity fit / sistem aktivitas","Pilihan produk, tata letak toko, pengadaan, dan operasional dirancang agar saling mendukung tujuan efisiensi.","Keunggulan bukan berasal dari satu praktik saja, melainkan dari kesesuaian berbagai aktivitas. Meniru satu praktik tanpa meniru sistem pendukungnya belum tentu menghasilkan efisiensi yang sama."],["Competitive advantage","Harga yang menarik memberi alasan bagi pelanggan yang sensitif terhadap harga untuk berbelanja di Aldi.","Perusahaan tetap perlu menjaga kualitas yang dapat diterima, ketersediaan barang, dan pengalaman berbelanja agar pelanggan tidak hanya membandingkan harga."],["Corporate strategy dan pertumbuhan","Pembukaan toko atau ekspansi ke wilayah baru merupakan keputusan pertumbuhan yang harus mempertimbangkan permintaan, lokasi, rantai pasok, dan kemampuan operasional.","Ekspansi sebaiknya dilakukan ketika model operasi dapat diterapkan secara konsisten dan manfaat pertumbuhan melebihi biaya masuk serta risiko lokal."],["Portfolio management","Pilihan produk yang terfokus membantu Aldi mengelola ruang toko, persediaan, dan proses pengadaan.","Pemilihan produk perlu menyeimbangkan efisiensi dengan kebutuhan pelanggan. Terlalu banyak produk dapat meningkatkan kompleksitas; terlalu sedikit dapat membuat kebutuhan pelanggan tidak terpenuhi."]])+P("<b>Hubungan dengan teori corporate strategy:</b> contoh Aldi terutama menunjukkan bagaimana strategi bersaing dan sistem aktivitas dapat saling menguatkan. Ini bukan otomatis contoh diversifikasi ke banyak industri atau penggunaan BCG Matrix; konsep diversifikasi dan portofolio harus digunakan hanya jika ada bukti bahwa perusahaan mengelola bisnis-bisnis berbeda yang relevan untuk dibandingkan.")+P("<b>Pertanyaan analisis:</b> Jika Aldi ingin memperluas jumlah produk atau masuk ke segmen baru, apa dampaknya terhadap biaya, kompleksitas operasional, dan identitas harga rendahnya? Bukti apa yang perlu dikumpulkan sebelum mengambil keputusan?" )+CALL("Pelajaran utama: strategi harga rendah bukan sekadar memasang harga murah. Strategi tersebut memerlukan pilihan yang konsisten tentang produk, proses, pengadaan, biaya, dan cara perusahaan tumbuh.")),
C("10. Ringkasan inti",UL(["Corporate strategy menentukan bisnis apa yang dimiliki perusahaan dan bagaimana sumber daya dibagi antarbisnis.","Diversifikasi terkait memiliki hubungan yang dapat dimanfaatkan; diversifikasi tidak terkait masuk ke bisnis yang hubungannya lebih jauh.","Sinergi harus dibuktikan melalui manfaat nyata, bukan diasumsikan muncul otomatis.","Sebelum masuk ke bisnis baru, periksa daya tarik industri, biaya masuk, dan apakah bisnis menjadi lebih kuat karena berada dalam grup.","BCG Matrix membantu mengelompokkan bisnis berdasarkan pertumbuhan pasar dan pangsa pasar relatif, tetapi bukan satu-satunya dasar keputusan.","Corporate parenting menilai apakah perusahaan induk benar-benar mampu memberi nilai tambah.","Restrukturisasi dapat berupa investasi, perbaikan, divestasi, atau penutupan; pilihannya harus mempertimbangkan nilai jangka panjang dan pemangku kepentingan."]))
]};

const Q7=[["Aktivitas primer (<i>primary activity</i>) apa yang berfokus pada peningkatan atau pemeliharaan nilai produk melalui kegiatan seperti instalasi, pelatihan, dan perbaikan?", ["Human resource management", "Marketing and sales", "Outbound logistics", "Service", "Operations"], 3, "Jawaban: Service."], ["Apa tujuan utama strategi <i>blue ocean</i> dibandingkan dengan strategi bersaing tradisional?", ["Menciptakan ruang pasar baru yang belum diperebutkan dan membuat persaingan menjadi tidak relevan melalui inovasi nilai", "Mengungguli pesaing di pasar yang sudah ada dengan meningkatkan kualitas produk secara signifikan dan mengenakan harga premium", "Mempertahankan pangsa pasar perusahaan saat ini dari lima kekuatan persaingan dengan mencapai kepemimpinan biaya secara menyeluruh", "Memaksimalkan nilai pemegang saham dengan melepas seluruh unit bisnis yang tidak menunjukkan pertumbuhan tinggi", "Menyasar secara agresif pelanggan paling menguntungkan milik pesaing dengan memanfaatkan berbagai keunggulan jangka pendek"], 0, "Jawaban: Menciptakan ruang pasar baru melalui inovasi nilai."], ["Apakah analisis SWOT dapat digunakan untuk analisis lingkungan internal dalam konteks manajemen stratejik?", ["Ya, sebagian; komponen strengths dan weaknesses mencerminkan kondisi internal, tetapi SWOT lebih berperan merangkum hasil analisis internal dan eksternal", "Tidak, karena SWOT hanya menganalisis peluang dan ancaman dari lingkungan eksternal", "Ya, SWOT merupakan alat utama analisis internal karena seluruh komponennya menilai kondisi di dalam perusahaan", "Ya, SWOT dapat menggantikan analisis VRIO dan rantai nilai karena mencakup seluruh sumber daya perusahaan", "Tidak, karena analisis lingkungan internal hanya dapat dilakukan dengan analisis rantai nilai"], 0, "Jawaban: Strengths dan weaknesses mencerminkan kondisi internal, sedangkan opportunities dan threats mencerminkan kondisi eksternal."], ["Bagaimana lingkungan makro memengaruhi lingkungan kompetitif?", ["Perubahan lingkungan makro berdampak seragam pada semua perusahaan dalam industri sehingga tidak mengubah posisi bersaing relatif", "Lingkungan makro hanya berpengaruh terhadap perusahaan multinasional yang beroperasi di lebih dari satu negara", "Perubahan faktor makro dapat mengubah kekuatan persaingan dalam industri, seperti hambatan masuk, ancaman substitusi, dan daya tawar", "Lingkungan kompetitif suatu industri menentukan kondisi politik, ekonomi, dan sosial di tingkat nasional", "Lingkungan makro dan lingkungan kompetitif bersifat independen sehingga analisis PESTEL dan Five Forces tidak perlu dikaitkan"], 2, "Jawaban: Perubahan faktor makro dapat mengubah kekuatan persaingan dalam industri."], ["Bagaimana strategi diferensiasi yang berhasil secara spesifik berfungsi sebagai pertahanan terhadap daya tawar pembeli dalam suatu industri?", ["Menciptakan loyalitas merek dan penawaran yang unik sehingga pembeli tidak memiliki alternatif yang sebanding", "Mendorong pembeli beralih ke produk substitusi generik dengan menstandarkan fitur fungsional produk", "Memungkinkan perusahaan menurunkan harga hingga setara dengan produsen berbiaya terendah setiap kali pembeli menuntut konsesi", "Meningkatkan hambatan masuk sehingga jumlah pendatang baru dalam industri berkurang", "Mendorong pembeli melakukan integrasi ke hulu untuk mengamankan pasokan produk yang terdiferensiasi"], 0, "Jawaban: Menciptakan loyalitas merek dan penawaran yang unik."], ["Berdasarkan kerangka VRIO, perbedaan antara <i>sustained competitive advantage</i> dan <i>temporary competitive advantage</i> terletak pada...", ["Sustained competitive advantage berasal dari sumber daya yang bernilai dan langka, sedangkan temporary competitive advantage berasal dari sumber daya yang bernilai tetapi tidak langka", "Sustained competitive advantage dapat dicapai tanpa sumber daya yang bernilai asalkan sumber daya tersebut langka dan sulit ditiru", "Sustained competitive advantage hanya membutuhkan dukungan organisasi yang kuat, sedangkan temporary competitive advantage tidak memerlukan dukungan organisasi", "Sustained competitive advantage bertahan lebih dari lima tahun, sedangkan temporary competitive advantage bertahan kurang dari lima tahun", "Sustained competitive advantage berasal dari sumber daya yang bernilai, langka, sulit ditiru, dan didukung organisasi, sedangkan temporary competitive advantage berasal dari sumber daya yang bernilai dan langka tetapi mudah ditiru"], 4, "Jawaban: Sumber daya yang bernilai, langka, sulit ditiru, dan didukung organisasi menghasilkan keunggulan berkelanjutan."], ["Dalam kondisi apa daya tawar pembeli dalam suatu industri umumnya meningkat?", ["Pembeli tersebar dalam jumlah banyak dan masing-masing membeli dalam volume kecil", "Jumlah pemasok bahan baku utama bagi industri sangat terbatas", "Pembeli terkonsentrasi dan membeli dalam volume besar relatif terhadap total penjualan industri", "Produk yang ditawarkan industri sangat terdiferensiasi dan sulit dibandingkan", "Pembeli harus menanggung biaya yang besar untuk beralih ke pemasok lain"], 2, "Jawaban: Pembeli terkonsentrasi dan membeli dalam volume besar."], ["Dalam kondisi manakah sebuah perusahaan paling mungkin memperoleh keunggulan sebagai pendatang akhir (<i>late-mover advantage</i>)?", ["Ketika terdapat efek jaringan yang kuat sehingga nilai produk meningkat seiring bertambahnya jumlah pengguna", "Ketika kurva pembelajaran sangat curam dan sulit ditiru", "Ketika biaya menjadi pionir teknologi baru sangat tinggi dan pasar berkembang dengan cepat", "Ketika loyalitas merek perusahaan pionir begitu kuat sehingga pelanggan enggan beralih ke versi yang lebih baru", "Ketika terdapat hak kekayaan intelektual yang kuat yang melindungi inovasi awal"], 2, "Jawaban: Biaya menjadi pionir tinggi dan pasar berkembang dengan cepat."], ["Manajemen puncak perusahaan XYZ menggunakan model Five Forces Porter untuk menganalisis lingkungan kompetitifnya. hal utama yang dinilai melalui kerangka tersebut adalah...", ["Daya tarik industri berdasarkan intensitas kekuatan persaingan yang memengaruhi potensi profitabilitas", "Efisiensi setiap aktivitas yang menciptakan nilai dalam perusahaan", "Strategi dan posisi pasar setiap pesaing utama secara individual", "Pengaruh faktor politik, ekonomi, sosial, dan teknologi terhadap perusahaan", "Kekuatan dan kelemahan sumber daya serta kapabilitas internal perusahaan"], 0, "Jawaban: Daya tarik industri berdasarkan kekuatan persaingan dan potensi profitabilitas."], ["Pada tahun 2019, Samsung meluncurkan Galaxy Fold sebagai salah satu ponsel lipat pertama di pasar global, meskipun generasi awalnya menghadapi masalah daya tahan layar dan harga yang sangat tinggi. Samsung terus menyempurnakan produknya setiap tahun dan membangun kategori pasar ponsel lipat. Apple memilih menunggu sekitar tujuh tahun, lalu pada September 2026 meluncurkan iPhone Duo dengan klaim lipatan layar yang minimal, engsel yang lebih tahan lama, dan harga premium mulai US$1.999. berdasarkan tipologi strategi inovasi Freeman, strategi yang diadopsi kedua perusahaan paling tepat digambarkan sebagai...", ["Samsung menerapkan strategi defensif, sedangkan Apple menerapkan strategi ofensif karena Apple menghadirkan teknologi yang lebih unggul", "Samsung dan Apple sama-sama menerapkan strategi ofensif karena keduanya meluncurkan produk yang baru di lini produk masing-masing", "Samsung menerapkan strategi ofensif, sedangkan Apple menerapkan strategi defensif karena Apple masuk setelah pasar terbukti dengan produk yang disempurnakan", "Samsung menerapkan strategi ofensif, sedangkan Apple menerapkan strategi dependen karena panel layar lipatnya dipasok oleh Samsung Display", "Samsung menerapkan strategi ofensif, sedangkan Apple menerapkan strategi imitatif karena Apple meniru kategori produk yang sudah ada"], 4, "Jawaban: Samsung menerapkan strategi ofensif, sedangkan Apple menerapkan strategi imitatif."], ["Perbedaan utama antara manajemen stratejik dan manajemen operasional adalah...", ["Manajemen stratejik hanya memperhatikan lingkungan eksternal, sedangkan manajemen operasional hanya memperhatikan lingkungan internal", "Manajemen stratejik bersifat rutin dan terstruktur, sedangkan manajemen operasional menghadapi situasi yang kompleks dan tidak pasti", "Manajemen stratejik menentukan arah jangka panjang dan posisi organisasi secara keseluruhan, sedangkan manajemen operasional mengelola efisiensi aktivitas sehari-hari", "Manajemen stratejik relevan untuk perusahaan besar, sedangkan manajemen operasional relevan untuk usaha kecil dan menengah", "Manajemen stratejik hanya dilakukan oleh dewan komisaris, sedangkan manajemen operasional dilakukan oleh manajer di semua level"], 2, "Jawaban: Manajemen stratejik menentukan arah jangka panjang, sedangkan manajemen operasional mengelola kegiatan sehari-hari."], ["Sebuah organisasi mencari mode masuk pasar internasional yang memberikan tingkat kendali tinggi dan kemampuan untuk menguasai seluruh nilai yang diciptakan, meskipun organisasi tersebut harus menanggung seluruh risiko dan biaya yang terkait. mode masuk apa yang sebaiknya dipilih?", ["Usaha patungan (<i>joint venture</i>)", "Perjanjian lisensi (<i>licensing agreement</i>)", "Anak perusahaan yang dimiliki sepenuhnya (<i>wholly owned subsidiary</i>)", "Ekspor (<i>exporting</i>)", "Waralaba (<i>franchising</i>)"], 2, "Jawaban: Wholly owned subsidiary."], ["Sebuah perusahaan manufaktur mempertimbangkan untuk mengalihdayakan (<i>outsourcing</i>) departemen layanan pelanggannya. berdasarkan <i>resource-based view</i> dan analisis rantai nilai, dalam kondisi apa perusahaan paling tepat mempertahankan aktivitas ini secara internal?", ["Jika perusahaan telah mengeluarkan investasi besar untuk sistem dan pelatihan staf layanan pelanggan di masa lalu", "Jika sumber daya berwujud yang digunakan di departemen tersebut mengalami penyusutan secara lambat", "Jika aktivitas tersebut merupakan <i>threshold capability</i> yang diperlukan untuk dapat bersaing secara dasar dalam industri", "Jika aktivitas tersebut merupakan kompetensi inti (<i>core competence</i>) yang memberikan keunggulan bersaing berkelanjutan", "Jika departemen tersebut terutama bergantung pada pengetahuan eksplisit yang terdokumentasi dalam manual"], 3, "Jawaban: Aktivitas tersebut merupakan kompetensi inti yang memberikan keunggulan bersaing berkelanjutan."], ["Sebuah perusahaan minuman di Indonesia menganalisis rencana pemerintah menerbitkan regulasi cukai minuman berpemanis dalam kemasan. dilihat dari sumbernya, faktor ini termasuk komponen PEST yang mana?", ["Political, karena faktor ini bersumber dari kebijakan dan regulasi pemerintah", "Economic, karena cukai akan menaikkan harga jual produk", "Social, karena regulasi ini didorong oleh kekhawatiran terhadap kesehatan masyarakat", "Semua komponen PEST secara setara, sehingga tidak dapat diklasifikasikan", "Technological, karena perusahaan perlu mengembangkan formula rendah gula"], 0, "Jawaban: Political, karena faktor ini bersumber dari kebijakan dan regulasi pemerintah."], ["Strategi internasional manakah yang dicirikan oleh tekanan tinggi untuk responsif terhadap pasar lokal dan tekanan rendah untuk integrasi global?", ["Strategi multidomestik (<i>multidomestic strategy</i>)", "Strategi dominasi (<i>dominating strategy</i>)", "Strategi transnasional (<i>transnational strategy</i>)", "Strategi internasional (<i>international strategy</i>)", "Strategi global (<i>global strategy</i>)"], 0, "Jawaban: Strategi multidomestik."], ["Dengan perkembangan teknologi digital dan kecerdasan artifisial (AI), bagaimana relevansi strategi generik Porter (1980) dan <i>blue ocean strategy</i> Kim & Mauborgne (2005)?", ["Keduanya tidak lagi relevan karena AI membuat semua keunggulan kompetitif cepat hilang", "Hanya strategi generik Porter yang masih relevan, karena <i>blue ocean</i> tidak bisa diwujudkan dengan teknologi digital", "Hanya <i>blue ocean</i> yang masih relevan, karena AI menghapus perbedaan harga dan diferensiasi", "Keduanya masih relevan tetapi perlu disesuaikan: strategi generik membantu memilih cara bersaing (harga lebih murah, produk unik, atau fokus pasar tertentu), <i>blue ocean</i> membantu menciptakan pasar dan peluang baru, dan teknologi digital serta AI membantu menjalankan keduanya lebih efektif", "Keduanya tetap relevan tanpa perlu penyesuaian karena kerangka tersebut tidak dipengaruhi teknologi"], 3, "Jawaban: Keduanya masih relevan, tetapi perlu disesuaikan dengan perkembangan teknologi."]];
