["Mengapa maskapai lain sulit meniru Ryanair walaupun strategi low-cost tampak sederhana?", ["Karena aktivitasnya saling mendukung, bukan satu langkah", "Karena Ryanair memiliki hak eksklusif atas Boeing 737", "Karena hanya Ryanair yang boleh memakai bandara sekunder", "Karena maskapai lain tidak ingin menurunkan harga tiket"], 0, "Cost leadership Ryanair adalah satu sistem aktivitas. Meniru satu bagian tidak memberi hasil yang sama."]];
const E4=[["Jelaskan tiga generic strategies Porter dan bedakan cost focus dari differentiation focus. Beri contoh.","Overall cost leadership (biaya terendah, broad market; Ryanair, Toyota), differentiation (produk unik dengan premium price, broad market; Apple), focus (satu segmen). Cost focus = cost leader hanya di satu segmen (Aldi). Differentiation focus = produk unik untuk satu segmen (Jaguar F-Pace, Burberry)."],["Jelaskan bagaimana cost leadership dan differentiation masing-masing melindungi organisasi dari lima competitive forces. Apa risikonya?","Cost leadership: tetap untung saat pesaing saling menggerus profit, pembeli hanya bisa menekan harga sampai level pesaing berikutnya, hedge terhadap harga input, harga rendah sebagai barrier to entry, rasio harga-kinerja unggul melawan substitutes. Differentiation: brand loyalty melindungi dari rivalry dan substitutes, entrant harus mengatasi loyalitas, buyers kurang kuat, margin tinggi menghadapi supplier. Risiko cost leadership: biaya update peralatan, mudah ditiru, perubahan teknologi, selera bergeser. Risiko differentiation: harga premium terlalu tinggi, kebutuhan menurun, atribut dipersempit pesaing."],["Jelaskan experience curve dan economies of scale. Bagaimana keduanya mendukung cost leadership, dan kapan muncul diseconomies of scale?","Experience curve: tiap output berlipat dua, biaya per unit turun sekitar 20–30% (contoh £10 menjadi £7–£8). Economies of scale: volume naik, LRATC turun, khas industri berbiaya tetap tinggi. Cost leader dengan pangsa besar punya pengalaman dan skala terbesar sehingga biayanya makin jauh di bawah pesaing. Diseconomies of scale muncul saat organisasi terlalu besar: koordinasi sulit, motivasi dan kualitas turun, LRATC naik."],["Apa yang dimaksud stuck in the middle? Apakah bukti empiris mendukung pandangan Porter? Gunakan IKEA, Toyota, Sainsbury's, dan M&S.","Porter: mencoba lebih dari satu generic strategy membuat perusahaan tidak unggul di mana pun. Bukti campuran: IKEA dan Toyota menggabungkan biaya rendah dan diferensiasi dengan sukses (hybrid), studi 164 perusahaan Spanyol mengaitkan hybrid dengan kinerja lebih tinggi. Sainsbury's dan M&S menunjukkan risiko stuck in the middle (tidak cukup murah, tidak cukup terdiferensiasi). Henry menyebut buktinya ambigu."],
["Jelaskan perbedaan red ocean dan blue ocean, konsep value innovation, dan alat ERRC. Bagaimana value innovation berbeda dari asumsi Porter?","Red ocean: industri yang ada, batas jelas, bersaing merebut pangsa dari permintaan terbatas sehingga laba dan pertumbuhan turun. Blue ocean: ruang pasar yang belum diperebutkan, menciptakan permintaan baru; kebanyakan dibuat di dalam red ocean dengan memperluas batas industri. Value innovation: menyelaraskan innovation dengan utility, price, dan cost, sehingga differentiation dan low cost dicapai sekaligus, berbeda dari pilihan salah satu menurut Porter. Four Actions Framework dan ERRC grid: eliminate, reduce, raise, create (contoh Cirque du Soleil). Ciri strategi: focus, divergence, compelling tagline. Studi 108 peluncuran: 14% blue ocean menghasilkan 38% revenue dan 61% laba."]];

CONTENT.s5={kicker:'Sesi 5 · Henry Ch. 7',title:'Strategic Growth dan Competitive Position',desc:'Ansoff growth vector, strategi ofensif dan defensif, timing first mover dan late mover, integrasi horizontal dan vertikal, outsourcing, mergers and acquisitions, internal development, serta joint venture dan strategic alliance. Sumber: Henry Ch. 7 dan slide dosen.',
materi:[
C("Growth strategies: matriks Ansoff",P("Organisasi bisa tumbuh lewat strategi berbeda sesuai tingkat risiko yang sanggup ditanggung, capabilities, dan keahlian manajemennya. Ansoff (growth vector matrix) membedakan empat arah berdasarkan produk (present atau new) dan market (present atau new).")+T(["Strategi", "Produk", "Market", "Isi dan contoh", "Risiko dan catatan"], [["Market penetration", "Sekarang", "Sekarang", "Menambah pangsa di pasar yang ada dengan produk yang ada: menarik pelanggan baru dan menaikkan pemakaian pelanggan lama.<br>Contoh sederhana: kedai kopi menambah promo agar pelanggan sekitar membeli lebih sering.", "Risiko relatif rendah karena memakai resources dan capabilities yang ada. Di pasar mature berarti merebut pangsa pesaing sehingga memancing retaliation."], ["Product development", "Baru", "Sekarang", "Mengembangkan produk baru untuk pasar yang ada (contoh Henry: Apple dengan iPod, iTunes, iPhone).<br>Contoh sederhana: kedai kopi menambah menu makanan untuk pelanggan yang sama.", "Mahal dan bisa gagal karena pelanggan belum tentu menerima. Perlu kemampuan inovasi saat siklus hidup produk makin pendek."], ["Market development", "Sekarang", "Baru", "Masuk pasar baru dengan produk yang ada: segmen, wilayah, atau kegunaan baru (contoh Henry: Wal-Mart, Carrefour, Tesco).<br>Contoh sederhana: kedai kopi membuka cabang di kota lain.", "Risiko naik karena pengalaman di pasar baru belum lengkap."], ["Diversification", "Baru", "Baru", "Produk baru untuk pasar baru.<br>Contoh sederhana: kedai kopi membuka bisnis katering untuk perusahaan.", "Risiko tertinggi, tetapi perlu bila produk dan pasar sekarang tidak menawarkan peluang tumbuh. Bisa ditekan lewat bisnis terkait. Lengkap di Sesi 8."]])),
C("Strategi ofensif dan defensif (slide dosen)",P("Menurut slide dosen (berbasis Thompson dkk., <i>Crafting and Executing Strategy</i>), kadang opsi strategi terbaik adalah <b>merebut inisiatif dan menyerang</b> untuk memperbaiki posisi pasar, dan di waktu lain yang terbaik adalah <b>bertahan</b> melindungi posisi. Henry tidak memberi kerangka khusus untuk ini.")+T(["", "Strategi ofensif", "Strategi defensif"], [["Tujuan", "Merebut inisiatif dan menyerang untuk memperbaiki posisi pasar", "Melindungi competitive advantage: (1) menurunkan risiko diserang, (2) melemahkan dampak serangan yang tetap terjadi, (3) memengaruhi penantang agar mengarahkan serangan ke rival lain"], ["Prinsip", "Fokus membangun competitive advantage lalu mengubahnya menjadi keunggulan berkelanjutan. Terapkan sumber daya di titik yang paling sulit dipertahankan rival, pakai unsur kejutan, dan bertindak cepat, tegas, dan menekan. Hindari menantang pesaing langsung di titik terkuatnya, pakai aset strategis terkuat untuk menyerang kelemahannya, sadari hasilnya bisa tidak instan, dan siap menghadapi counter-response.", "Strategi defensif yang baik membantu melindungi competitive advantage, tetapi jarang menjadi dasar untuk menciptakannya."], ["Jenis atau cara", "Tujuh opsi serangan: (1) produk yang sama baik atau lebih baik dengan harga lebih rendah, (2) leapfrog dengan meluncurkan produk generasi berikutnya lebih dulu, (3) inovasi produk berkelanjutan untuk menarik pangsa dari rival yang kurang inovatif, (4) disruptive product innovation untuk menciptakan pasar baru, (5) mengadopsi dan memperbaiki ide bagus perusahaan lain, (6) hit-and-run atau guerrilla marketing untuk merebut pangsa dari rival yang lengah, (7) preemptive strike: mengamankan sumber daya industri yang terbatas atau menangkap peluang langka.", "<b>Menutup jalur yang terbuka bagi penantang:</b> siapkan teknologi cadangan, tambah fitur dan model untuk menutup celah dan niche kosong, pertahankan economy-pricing untuk menggagalkan serangan harga rendah, cegah pembeli mencoba merek pesaing, umumkan produk atau harga baru lebih awal agar pembeli menunda pindah, pertanyakan kualitas dan keselamatan produk pesaing, dan beri diskon atau syarat lebih baik kepada perantara yang menjual lini produk perusahaan secara eksklusif.<br><b>Signaling bahwa pembalasan kemungkinan terjadi:</b> mengumumkan komitmen mempertahankan pangsa, berkomitmen menyamai harga atau syarat pesaing, menyimpan war chest berupa kas dan surat berharga, dan memberi respons kuat pada langkah rival yang lebih lemah."], ["Kapan digunakan", "Target terbaik: market leader yang berada dalam posisi kompetitif rentan, runner-up dengan kelemahan di area yang menjadi kekuatan penyerang, perusahaan yang kesulitan dan hampir bangkrut, serta perusahaan lokal dan regional kecil dengan kemampuan terbatas.", "Saat posisi pasar perlu dilindungi dari serangan. Syarat penting: signaling hanya efektif bila disertai komitmen yang kredibel untuk menindaklanjuti. Ancaman tanpa tindak lanjut tidak dipercaya."]])+DEF("Blue-ocean strategy: serangan jenis khusus","Dunia bisnis dibagi menjadi pasar yang ada (dengan batas dan aturan, tempat rival bersaing) dan <b>blue ocean</b>: ruang pasar yang belum terbentuk, tanpa rival, dengan potensi pertumbuhan dan laba besar bagi perusahaan yang mampu menciptakan permintaan baru.","Kasus dalam slide: Gilt Groupe (flash sale AS). Pembahasan konsep lengkap ada di Sesi 4 (Henry 6.4).")),
C("Innovation dan timing: first mover, fast follower, late mover",T(["Tipe", "Artinya"], [["First mover", "Yang pertama meluncurkan produk atau masuk pasar"], ["Fast follower", "Yang segera menyusul dengan versi yang lebih baik"], ["Late mover", "Yang masuk setelah pasar terbukti"]])+DEF("Competitive advantage bisa datang dari kapan, bukan hanya apa","Tahu <b>kapan</b> bergerak sama pentingnya dengan tahu <b>langkah apa</b>. Bergerak pertama tidak menjamin sukses, dan risiko menjadi yang paling awal harus ditimbang cermat (slide dosen).","Henry: VHS (Matsushita) menjadi standar industri meski kalah teknologi dari Betamax (Sony). Siklus hidup produk yang makin pendek (contoh consumer electronics) membuat product development terus-menerus perlu, sekaligus mengikis keunggulan first mover dan memperpendek waktu balik modal.")+T(["Kondisi yang memberi first-mover advantages", "Kondisi yang memberi late-mover advantages (atau first-mover disadvantages)"],[["Pionir membangun reputasi dan loyalitas merek yang kuat", "Pionir lebih mahal daripada meniru dan hanya memberi pengalaman atau learning-curve benefit yang kecil"], ["Pelanggan first mover menghadapi switching costs besar", "Produk inovator masih primitif dan belum memenuhi harapan pembeli"], ["Perlindungan hak kekayaan menghambat peniruan cepat", "Pasar berevolusi cepat sehingga fast follower bisa melompati first mover dengan versi berikutnya"], ["Keunggulan awal memungkinkan turun lebih dulu di learning curve", "Ketidakpastian pasar menyulitkan penilaian apa yang akhirnya berhasil"], ["First mover dapat menetapkan standar teknis industri", "Loyalitas pelanggan rendah dan keahlian first mover mudah ditiru atau dilampaui"]])+P("<b>Pertanyaan penentu apakah menjadi first mover:</b> apakah lepas landas pasar bergantung pada produk pelengkap yang belum ada? Perlukah infrastruktur baru? Perlukah pembeli belajar perilaku baru? Apakah switching costs tinggi? Adakah pesaing berpengaruh yang bisa menggagalkan first mover?")+CALL("Henry hanya membahas first-mover advantage. Fast follower dan late mover berasal dari slide dosen. Kasus Amazon di slide hanya berupa pertanyaan diskusi.")),
C("Tipologi strategi inovasi (Freeman)",P("Freeman membagi perusahaan menurut sikapnya terhadap inovasi produk dan teknologi. Ada enam tipe:")+T(["Tipe", "Ciri utama", "Beda dari tipe terdekat"], [["Offensive", "Jadi yang pertama meluncurkan produk baru, dengan andalan R&D sendiri dan paten", "Beda dari defensive: ia yang pertama meluncurkan, bukan ikut"], ["Defensive", "Tidak mau jadi yang pertama, tetapi tidak mau tertinggal. Ikut cepat dan menyempurnakan produk pionir, dan tetap punya R&D sendiri", "Beda dari imitative: masih punya R&D sendiri dan menyempurnakan produk pionir, bukan sekadar meniru"], ["Imitative", "Mengikuti jauh di belakang pemimpin dengan meniru atau melisensi. Bersaing lewat biaya rendah atau keunggulan lain, bukan lewat R&D", "Beda dari defensive: ikut jauh di belakang dan bersaing lewat biaya, bukan R&D"], ["Dependent", "Subordinat pada perusahaan yang lebih kuat (induk atau pelanggan besar). Mengubah produk hanya atas permintaan mereka", "Beda dari imitative: produk berubah hanya atas permintaan perusahaan yang lebih kuat"], ["Traditional", "Produknya nyaris tidak berubah karena pasar tidak menuntut perubahan, sehingga hampir tanpa inovasi", "Beda dari tipe lain: pasar memang tidak menuntut perubahan"], ["Opportunist", "Tidak bertumpu pada R&D. Mencari celah atau niche yang muncul dari perubahan pasar", "Beda dari tipe lain: tidak bertumpu pada R&D, mencari celah dari perubahan pasar"]])+CALL("<b>Catatan:</b> tambahan di luar buku Henry dan catatan dosen (untuk soal UTS Samsung vs Apple). Defensive = ikut cepat sambil menyempurnakan produk pionir, tetap punya R&D. Imitative = ikut jauh di belakang, andalkan biaya murah. Cocokkan dengan catatan dosen.")),
C("Scope dan integrasi: horizontal dan vertikal",DEF("Scope of the firm","Scope adalah rentang aktivitas yang dikerjakan sendiri, lebar penawaran produk dan jasa, luas kehadiran geografis, dan bauran bisnis. <b>Horizontal scope</b> adalah rentang segmen produk dan jasa dalam focal market. <b>Vertical scope</b> adalah sejauh mana aktivitas internal mencakup tahap-tahap rantai nilai industri, dari bahan baku sampai layanan akhir.","Related diversification (Henry): masuk industri yang terkait dengan value chain agar tercipta synergy (2 + 2 = 5). Honda memakai capability mesin untuk motor, mesin pemotong rumput, dan mesin tempel.")+T(["Jenis", "Arti", "Alasan dan contoh"],[["Backward integration", "Ke hulu menuju input", "Menekan kekuatan pemasok dan biaya input, menjamin pasokan, dan melindungi know-how. Contoh Henry: Morrisons menanam sayur sendiri dan memiliki rumah potong hewan"], ["Forward integration", "Ke hilir menuju konsumen akhir", "Efisiensi saluran, daya tawar, akses ke pengguna akhir, dan memperkuat merek serta diferensiasi. Contoh: mengakuisisi transportasi, gudang, atau gerai ritel"], ["Horizontal integration", "Mengambil alih pesaing atau produk komplementer di tahap yang sama", "Economies of scale lebih cepat daripada pertumbuhan organik. Contoh Henry: HSBC membeli Midland Bank, easyJet mengambil alih Go!"]])+T(["Jenis vertical integration (slide)", "Arti"],[["Full integration", "Berpartisipasi di semua tahap rantai aktivitas vertikal"], ["Partial integration", "Hanya membangun posisi di tahap tertentu"], ["Tapered integration", "Campuran aktivitas dikerjakan sendiri dan di-outsource pada suatu tahap.<br>Contoh sederhana: restoran menanam sebagian sayurnya sendiri dan membeli sisanya dari pemasok."]])+P("<b>Empat pertanyaan menimbang (slide):</b> (1) apakah integrasi meningkatkan kinerja aktivitas yang kritis bagi strategi? (2) apa dampaknya pada biaya investasi, fleksibilitas, dan waktu respons? (3) berapa biaya administrasi mengoordinasikan lebih banyak tahap? (4) seberapa sulit memperoleh keterampilan untuk tahap baru?")),
C("Transaction-cost analysis dan outsourcing",P("Setiap transaksi punya <b>transaction costs</b>: biaya search (mencari pihak lain), negosiasi dan kontrak, monitoring (memastikan kewajiban dipenuhi), dan enforcement (menegakkan bila ada yang ingkar).")+DEF("Contoh sederhana transaction costs","Membeli bahan dari pemasok baru berarti mencari pemasoknya, menawar dan membuat kontrak, mengecek apakah pengirimannya sesuai, dan menagih ganti rugi bila pemasok ingkar. Semua itu biaya di luar harga bahannya.")+DEF("Aturan keputusan (Oliver Williamson)","Produksi internal bila transaction cost internal lebih rendah daripada membeli di pasar. Bila biaya administrasi transaksi internal lebih besar daripada transaction cost di pasar (organisasi terlalu besar dan birokratis), <b>outsource</b> ke spesialis. Bila transaction cost jauh lebih besar daripada biaya administrasi, pilih <b>vertical integration</b>.")+T(["Outsource aktivitas bila (slide dosen)", "Risiko besar outsourcing"],[["Bisa dikerjakan lebih baik atau lebih murah oleh spesialis luar", "<b>Hollowing out:</b> resources dan capabilities yang dibutuhkan untuk menguasai nasib sendiri terkikis, sehingga perusahaan makin 'kosong' karena kemampuan intinya diserahkan ke pihak lain"], ["Tidak krusial bagi competitive advantage berkelanjutan", "Kehilangan kontrol langsung saat memantau dan mengoordinasikan pihak luar lewat kontrak arm's-length"], ["Meningkatkan fleksibilitas dan mempercepat time to market", "Pihak luar kurang insentif membuat investasi khusus untuk rantai nilai perusahaan"], ["Mengurangi risiko akibat teknologi baru atau perubahan selera", ""], ["Memungkinkan fokus pada bisnis inti", ""]])+DEF("Pelajaran dari kasus di Henry: tren re-bundling","Selama sekitar tiga puluh tahun banyak perusahaan fokus pada bisnis inti dan meng-outsource sisanya. Kini sebagian berbalik ke integrasi: untuk kesederhanaan bagi pelanggan (Apple, Nest), karena perusahaan di batas teknologi lebih efisien mengerjakan sendiri (gigafactory Tesla), karena pilihan pasar makin banyak (Netflix dan Amazon membuat tayangan sendiri), dan karena kecepatan (Zara).","Boeing meng-outsource sekitar 70% produksi 787 Dreamliner ke ratusan pemasok. Suku cadang terlambat dan tidak pas, tenggat meleset, lalu produksi ditarik kembali ke dalam perusahaan.")+CALL("<b>Prinsip dari slide:</b> jangan meng-outsource aktivitas yang mengikis resources dan capabilities yang dibutuhkan untuk menguasai nasib sendiri.")),
C("Mergers and acquisitions (M&A)",T(["Istilah", "Arti"],[["Merger", "Dua organisasi bergabung dan berbagi sumber daya secara sukarela. Pemegang saham keduanya menjadi pemegang saham organisasi baru"], ["Acquisition", "Satu organisasi mengakuisisi (menyerap) organisasi lain, sering yang lebih kecil. Dibayar dengan saham dan tunai, atau tunai saja"], ["Hostile takeover", "Akuisisi yang ditolak dan diperebutkan. Dewan target biasanya berargumen bahwa penawarannya terlalu murah"]])+T(["", "Isi"],[["Alasan dan manfaat", "Masuk pasar baru dengan cepat atau memperoleh capabilities yang tidak dimiliki. Manfaatnya: kecepatan, pangsa pasar, masuk pasar, dan akses cepat ke capabilities"], ["Tujuan M&A horizontal (slide)", "Operasi gabungan lebih hemat biaya, cakupan geografis lebih luas, masuk kategori produk baru, akses cepat ke teknologi atau capabilities, dan memimpin konvergensi industri. Manfaatnya: efisiensi, diferensiasi, mengurangi rivalry, daya tawar lebih besar, dan fleksibilitas"], ["Kerugian dan penyebab gagal", "Membayar premium (risiko keuangan naik), budaya sulit menyatu, penghematan biaya lebih kecil dari perkiraan, keunggulan capabilities terwujud lebih lambat atau tidak pernah, karyawan kunci pergi, dan kesalahan manajer saat integrasi"]])+DEF("Tiga kriteria Porter untuk akuisisi yang menambah shareholder value","<b>Attractiveness:</b> industri target mampu memberi return di atas rata-rata. <b>Cost of entry:</b> harga akuisisi dan biaya integrasi tidak boleh terlalu mahal (sering terjadi saat premium tinggi). <b>Better-off:</b> akuisisi harus memberi competitive advantage bagi induk atau yang diakuisisi.","John Kay: synergy hanya muncul bila distinctive capabilities atau strategic assets dimanfaatkan lebih efektif. Akuisisi capabilities yang sudah dimanfaatkan efektif tidak menambah nilai.")+T(["Contoh dalam Henry", "Pelajaran"],[["Kraft membeli Cadbury (£11,6 miliar). Buffett menyebutnya deal buruk", "Biaya reorganisasi dan fee bisa menggerus nilai tambah"], ["Microsoft membeli bisnis handset Nokia ($7,2 miliar, 2013). Kinerjanya memburuk pada 2015", "Membeli pasar lebih cepat daripada membangun, tetapi hasil tidak terjamin"], ["Sainsbury's membeli Home Retail Group (Argos dan Homebase, £1,4 miliar, 2016) demi layanan antar dan keahlian digital", "Ada rasionalitas bisnis, tetapi logikanya dipertanyakan sebagian analis"], ["RBS, Fortis, dan Santander membeli sebagian ABN Amro (€71 miliar, tiga kali nilai buku)", "Kurang due diligence berakibat aset beracun"], ["Daimler-Benz dan Chrysler: biaya $36 miliar. Chrysler dijual ke Cerberus pada 2007", "Synergy dilebih-lebihkan (diakui Zetsche)"]])),
C("Internal development (organic growth)",P("Organisasi tumbuh dengan <b>sumber daya sendiri</b> dan membangun capabilities yang dibutuhkan untuk bersaing di masa depan. Banyak organisasi mulai dengan pertumbuhan organik, lalu mempertimbangkan M&A saat industri mature. Dalam praktik, keduanya sering dijalankan bersamaan.")+T(["Manfaat", "Kelemahan"],[["(i) Risiko keuangan lebih rendah", "(i) Butuh waktu membangun capabilities strategis yang diperlukan"], ["(ii) Tumbuh dengan laju yang bisa dikendalikan", "(ii) Siklus produk makin pendek, sehingga bisa kehilangan peluang pasar"], ["(iii) Pembelajaran di dalam perusahaan tetap menjadi milik sendiri", "(iii) Bila ada barriers to entry, M&A mungkin diperlukan untuk masuk industri"], ["(iv) Tidak perlu mengelola perbedaan budaya", ""]])+DEF("Contoh: Aldi dan Lidl di Inggris","Pertumbuhan organik lewat pembukaan toko sendiri. Pada Mei 2017 Aldi memegang sekitar 7% dan Lidl 5% pasar grosir Inggris. Gabungan pangsa mereka naik lebih dari 80% sejak musim panas 2013.")),
C("Joint venture dan strategic alliance",VS("Joint venture vs strategic alliance",["Joint venture","Dua organisasi membentuk <b>perusahaan terpisah yang independen</b>, dimiliki dan dikendalikan bersama (Henry: saham setara), serta berbagi pendapatan dan biaya.",null,["Menggabungkan resources dan capabilities untuk mengembangkan teknologi baru","Mengakses pasar baru","Dipakai bila kepemilikan aset asing dibatasi: mitra lokal memberi akses input atau pasar"]],["Strategic alliance","Dua organisasi atau lebih berbagi sebagian resources dan capabilities lewat perjanjian formal <b>tanpa membentuk organisasi terpisah</b>.",null,["Mendapat pengetahuan yang tidak dimiliki atau mahal bila dikembangkan sendiri","Mengurangi competitive rivalry"]],"Contoh: konsorsium Airbus (Inggris, Prancis, Jerman, Italia) mengembangkan A380 dengan risiko jauh lebih kecil, dan tiap negara menyumbang capabilities khasnya.")+P("<b>Sebuah aliansi bersifat strategis (slide) bila</b> membantu: mencapai tujuan bisnis penting, membangun atau memperkuat core competence, menutup kekurangan resource, bertahan dari ancaman atau menurunkan risiko, menambah daya tawar atas pemasok atau pembeli, membuka peluang pasar baru, atau mempercepat teknologi dan inovasi produk.")+T(["Manfaat aliansi", "Isi"],[["Dibanding integrasi vertikal, outsourcing, dan M&A", "Meminimalkan masalah ketiganya. Lebih fleksibel bila kebutuhan resource atau tujuan berubah, cocok saat teknologi berkembang sangat cepat, dan berguna untuk ekspansi internasional dan diversifikasi"], ["Tiga keunggulan utama", "(1) Biaya investasi dan risiko lebih rendah lewat resource pooling dan risk sharing, (2) bentuk organisasi lebih fleksibel dan adaptif, (3) lebih cepat dijalankan"], ["Dibanding outsourcing", "Kontrol lebih besar atas aktivitas mitra dan komitmen lebih besar untuk investasi khusus hubungan, dibanding transaksi arm's-length"]])+CALL("Henry (Hamel dkk.): aliansi bisa menguatkan kedua pihak terhadap rival luar, tetapi bisa melemahkan salah satu terhadap mitranya. Aliansi adalah persaingan dalam bentuk lain, dengan tujuan akhir <b>belajar dari mitra</b>.")+"<h3>Risiko, ketahanan, dan cara berhasil (slide dosen)</h3>"+T(["", "Isi"], [["Risiko", "Benturan budaya dan masalah integrasi. Keuntungan tidak muncul karena optimisme berlebihan soal synergy atau resources mitra yang tidak cocok. Ketergantungan pada mitra untuk keahlian penting. Perlindungan teknologi proprietary dan rahasia dagang dari mitra yang juga rival."], ["Ketahanan aliansi", "Bermitra dengan pihak yang tidak bersaing langsung, membangun hubungan permanen yang saling percaya, dan terus berkolaborasi demi kepentingan bersama."], ["Cara membuatnya berhasil", "Pilih mitra yang baik dan peka terhadap perbedaan budaya. Pastikan aliansi menguntungkan kedua pihak dan komitmen ditepati. Susun proses keputusan agar tindakan cepat, dan sesuaikan perjanjian seiring waktu. Bangun sistem pengelolaan aliansi, kepercayaan, dan pengaman dari oportunisme mitra, serta jadikan pembelajaran bagian rutin manajemen."], ["Kapan cenderung gagal (Henry)", "Bila tujuan mitra tidak jelas atau tidak disepakati, atau hubungan tidak dilandasi kepercayaan. Perbedaan manajerial harus diselesaikan sebelum kerja sama dimulai. Menurut slide, aliansi terbaik sangat selektif, dan perusahaan dengan banyak aliansi perlu mengelolanya seperti portofolio."]])),
C("Membandingkan cara mewujudkan pertumbuhan",T(["Cara", "Tujuan", "Kelebihan", "Risiko", "Kapan digunakan"], [["Horizontal integration", "Mengambil alih pesaing atau produk komplementer di tahap yang sama", "Economies of scale lebih cepat daripada pertumbuhan organik", "Sama seperti M&A: premium mahal, budaya sulit menyatu", "Perlu skala dan pangsa dengan cepat"], ["Vertical integration (backward dan forward)", "Menguasai tahap hulu menuju input (backward) atau hilir menuju konsumen akhir (forward)", "Menekan kekuatan pemasok dan biaya input, menjamin pasokan, melindungi know-how (backward). Efisiensi saluran, daya tawar, akses pengguna akhir, dan merek (forward)", "Modal besar, lambat menerima teknologi atau metode yang lebih efisien, kurang fleksibel menghadapi pergeseran selera, masalah penyesuaian kapasitas, butuh resources dan capabilities baru. Organisasi makin bergantung pada satu pasar dan lambat merespons perubahan", "Transaction cost pasar jauh lebih besar daripada biaya administrasi internal"], ["Outsourcing", "Fokus pada bisnis inti dan menyerahkan aktivitas non-core ke spesialis", "Lebih baik atau lebih murah, fleksibel, mempercepat time to market", "Hollowing out, kehilangan kontrol, pihak luar kurang insentif berinvestasi khusus (contoh Boeing 787)", "Aktivitas tidak krusial bagi keunggulan, dan biaya administrasi internal lebih besar daripada transaction cost pasar"], ["Merger dan acquisition", "Masuk pasar baru atau memperoleh capabilities dengan cepat", "Cepat dan memberi pangsa pasar, akses pasar, dan capabilities", "Premium mahal, budaya sulit menyatu, synergy dilebih-lebihkan, karyawan kunci pergi", "Perlu pangsa, akses pasar, atau capabilities dengan cepat, atau ada barriers to entry berat"], ["Internal development", "Tumbuh dengan sumber daya sendiri dan membangun capabilities masa depan", "Risiko keuangan lebih rendah, laju terkendali, pembelajaran milik sendiri, tanpa konflik budaya", "Lambat dan bisa kehilangan peluang saat siklus produk pendek", "Risiko keuangan ingin rendah dan tidak ada barriers to entry berat"], ["Joint venture", "Menggabungkan resources dan capabilities lewat perusahaan terpisah yang dimiliki bersama", "Risiko dan biaya dibagi, akses pasar atau teknologi, jalan saat kepemilikan asing dibatasi", "Tujuan tidak jelas atau tidak sejalan, kurang kepercayaan, perbedaan manajerial", "Akses pasar atau teknologi dengan risiko dibagi, atau ada pembatasan kepemilikan asing"], ["Strategic alliance", "Berbagi sebagian resources dan capabilities lewat perjanjian formal tanpa organisasi baru", "Biaya dan risiko lebih rendah, fleksibel, cepat, kontrol lebih besar daripada outsourcing", "Benturan budaya, ketergantungan pada mitra, perlindungan teknologi, mitra bisa menjadi pesaing", "Belajar dan mengakses pengetahuan komplementer, atau teknologi berkembang sangat cepat"]])+P("Tabel ini ringkasan pembanding dari poin-poin Henry dan slide di atas, bukan tabel dari buku.")),
C("Kasus tugas: timing dan respons incumbent","<h3>Fakta kasus dan analisis</h3>"+T(["Pelaku", "Fakta kasus", "Analisis: pelajaran timing"],[["Dollar Shave Club", "Berdiri 2012. Pada 2015 menguasai sekitar 54% online shaving market", "Sebagai first mover di subscription razor online, DSC memperoleh pangsa dan basis pelanggan lebih dulu"], ["Gillette", "Sudah punya ide subscription, tetapi baru meluncurkan Gillette Shave Club pada September 2015 (sekitar 21% pangsa)", "Punya ide belum cukup. Incumbent besar bergerak lebih lambat daripada perusahaan kecil"], ["Unilever", "Mengakuisisi DSC seharga $1 miliar", "Pertumbuhan eksternal (akuisisi) untuk mendapatkan presence dan capabilities langsung ke konsumen tanpa membangun dari nol"], ["Netflix", "Streaming (2007), banyak perangkat (2010), konten sendiri (sekitar 2013)", "Inovasi ofensif yang berlapis dan terus-menerus"]])+"<h3>Kesimpulan</h3>"+CALL("Bandingkan dengan Samsung (first mover foldable) dan Apple (menunggu teknologi matang). Di sini timing yang cepat menguntungkan DSC, tetapi keunggulannya tetap bisa ditiru incumbent yang bereaksi."),"Kasus tugas dosen")
].join('')};
const Q5=[["Di pasar mature, sebuah maskapai menurunkan harga dan menambah promosi untuk merebut pangsa dengan layanan dan rute yang sama. Risiko paling khas menurut logika Henry adalah…", ["Hilangnya capabilities inti", "Pembalasan pesaing (retaliation)", "Kurangnya pengetahuan market", "Kegagalan produk baru"], 1, "Market penetration relatif rendah risiko, tetapi di pasar mature berarti mengambil pangsa pesaing sehingga memancing retaliation."], ["Pabrikan sepatu membeli penyamakan kulit pemasoknya (harga fluktuatif, kualitas tak stabil). Dua tahun kemudian biaya administrasi mengelola unit itu lebih besar daripada transaction cost membeli di pasar. Langkah paling sesuai dengan Williamson?", ["Meng-outsource ke spesialis dengan kontrak kualitas dan harga", "Tetap mempertahankan karena integrasi selalu lebih murah", "Mengakuisisi pesaing", "Menambah forward integration"], 0, "Awalnya backward integration. Bila biaya administrasi internal melebihi transaction cost pasar, outsourcing lebih efisien."], ["A mengakuisisi B dengan premium besar. Capabilities B sudah dimanfaatkan optimal oleh B sendiri, dan tidak ada tautan dengan value chain A. Penilaian paling tepat?", ["Sulit menciptakan nilai (cost of entry tinggi)", "Sudah memenuhi tiga kriteria Porter", "Pasti menciptakan synergy 2 + 2 = 5", "Risikonya rendah karena integrasi budaya mudah"], 0, "Kriteria Porter: attractiveness, cost of entry, better-off. Kay: synergy hanya bila capabilities dimanfaatkan lebih efektif."], ["Perusahaan ingin masuk pasar luar negeri, tetapi kurang informasi pasar setempat dan kepemilikan asing dibatasi. Pilihan yang paling logis?", ["Outsourcing seluruh operasi ke pihak ketiga", "Joint venture atau aliansi dengan mitra lokal yang mapan", "Hostile takeover terhadap pesaing lokal", "Internal development penuh tanpa mitra"], 1, "Kolaborasi memberi akses pasar dan informasi, serta menjadi jalan saat kepemilikan asing dibatasi (contoh JV di Tiongkok dan India)."], ["Dua perusahaan membentuk aliansi dengan capabilities komplementer. A menyebarkan pengetahuan dari mitra ke seluruh organisasinya, B tidak. Menurut Hamel dkk., kemungkinan konsekuensinya adalah…", ["Keduanya sama-sama diuntungkan secara merata", "Aliansi otomatis berubah menjadi merger", "A bisa lebih kuat dari B lewat belajar", "Tidak ada dampak"], 2, "Hamel dkk.: aliansi bisa menguatkan keduanya terhadap rival luar, tetapi bisa melemahkan salah satu terhadap mitra."], ["Produsen elektronik menjadi pelopor produk baru di industri dengan siklus hidup produk yang makin pendek. Implikasi menurut Henry adalah…", ["Standar terbaik pasti menang", "Keunggulan cepat terkikis, risiko pelopor naik", "Siklus pendek menurunkan risiko investasi", "First-mover advantage otomatis permanen"], 1, "Contoh VHS dan Betamax menunjukkan standar tidak selalu dimenangkan teknologi terbaik."], ["Industri dengan barriers to entry tinggi dan siklus produk pendek. Perusahaan baru ingin masuk. Cara tumbuh yang paling logis menurut Henry?", ["Menunggu siklus produk melambat", "Market penetration di pasar yang sudah ada", "M&A atau kolaborasi agar masuk lebih cepat", "Internal development murni karena paling murah"], 2, "Internal development lambat dan bisa kehilangan peluang; bila ada barriers to entry, M&A mungkin diperlukan."], ["Boeing meng-outsource sekitar 70% produksi 787 ke ratusan pemasok dan mengalami keterlambatan. Pelajaran terbaik untuk keputusan outsourcing adalah…", ["Outsourcing berlebihan menaikkan biaya koordinasi", "Outsourcing semua aktivitas non-core selalu efisien", "Integrasi vertikal selalu lebih buruk", "Kontrak menghilangkan semua risiko"], 0, "Henry mencatat tren re-bundling: kesederhanaan, teknologi di batas, dan kecepatan bisa membuat pengerjaan internal lebih efisien."], ["Sebuah grup ritel menggabungkan diri dengan pesaing di kota yang sama untuk skala lebih cepat, dan sekaligus membeli perusahaan logistik untuk mengontrol distribusi ke pelanggan. Klasifikasinya adalah…", ["Joint venture dan strategic alliance", "Market development dan outsourcing", "Horizontal integration dan forward vertical integration", "Backward integration dan unrelated diversification"], 2, "Pesaing di tahap yang sama = horizontal. Logistik menuju konsumen = forward vertical integration."], ["Manajemen ingin segera menandatangani joint venture karena ada peluang pasar, padahal tujuan kedua mitra belum disepakati dan gaya manajemen sangat berbeda. Langkah paling tepat menurut Henry?", ["Selesaikan perbedaan manajerial dan sepakati tujuan lebih dulu", "Tandatangani dahulu dan selesaikan perbedaan setelahnya", "Beralih ke hostile takeover", "Ubah menjadi outsourcing penuh"], 0, "JV dan alliance cenderung gagal bila tujuan tidak jelas atau hubungan tidak dilandasi kepercayaan."], ["Apple meluncurkan produk baru (iPod, iTunes, iPhone) yang menciptakan kebutuhan baru bagi pelanggan yang sudah ada. Dalam matriks Ansoff ini termasuk…", ["Market penetration", "Product development", "Market development", "Diversification"], 1, "Produk baru untuk market yang sudah ada adalah product development. Mahal dan berisiko gagal, tetapi lebih berhasil bila menciptakan kebutuhan baru."], ["Peritel besar membuka cabang di wilayah baru dengan penawaran yang hampir sama. Dalam matriks Ansoff ini termasuk…", ["Market penetration", "Product development", "Diversification", "Market development"], 3, "Produk yang ada untuk market baru adalah market development (contoh Wal-Mart, Carrefour, dan Tesco masuk wilayah baru)."], ["Cara menekan risiko diversification menurut Henry adalah…", ["Menunggu pasar saat ini jenuh", "Meng-outsource seluruh produksi", "Diversifikasi ke bisnis terkait", "Masuk ke bisnis yang sama sekali tidak terkait"], 2, "Diversification berisiko paling tinggi, tetapi risikonya bisa ditekan dengan diversifikasi ke bisnis terkait yang masih punya tautan dengan value chain."], ["Synergy dalam related diversification sering digambarkan sebagai 2 + 2 = 5. Maknanya adalah…", ["Biaya akuisisi selalu lebih kecil dari nilai target", "Total output gabungan lebih besar daripada jumlah output terpisah", "Dua perusahaan selalu menjadi satu entitas", "Laba naik hanya bila pesaing berkurang"], 1, "Synergy: output gabungan lebih besar daripada jumlah output masing-masing. Contoh: Honda memanfaatkan capability mesin untuk motor, pemotong rumput, dan outboard engines."], ["Biaya yang timbul untuk memastikan pihak lain memenuhi kewajiban dalam kontrak termasuk…", ["Biaya monitoring", "Search costs", "Biaya enforcement", "Biaya negosiasi dan kontrak"], 0, "Empat transaction costs: search costs, negosiasi dan kontrak, monitoring (memastikan kewajiban dipenuhi), dan enforcement (penegakan lewat pengadilan)."], ["Akuisisi ditolak dewan target dengan alasan penawaran terlalu murah, tetapi pembeli tetap mengejarnya. Ini disebut…", ["Merger", "Joint venture", "Strategic alliance", "Hostile takeover"], 3, "Hostile takeover adalah akuisisi yang ditolak dan diperebutkan, berbeda dari merger yang sukarela bagi kedua pihak."], ["Manfaat internal development (organic growth) dibanding M&A adalah…", ["Cepat memasuki pasar baru", "Tidak perlu memadukan budaya mitra", "Otomatis menembus barriers to entry", "Selalu memberi pangsa pasar lebih besar"], 1, "Manfaat internal development: risiko keuangan lebih rendah, laju terkendali, pembelajaran tetap di dalam, dan tidak perlu mengelola perbedaan budaya."], ["Produsen makanan membeli rantai gerai ritel untuk mengendalikan di mana, kapan, dan berapa harga produknya dijual. Ini adalah…", ["Backward vertical integration", "Horizontal integration", "Forward vertical integration", "Market penetration"], 2, "Bergerak ke hilir menuju konsumen akhir adalah forward vertical integration, untuk mengendalikan saluran distribusi."], ["Penantang kecil memilih menyerang pemimpin pasar langsung di segmen paling kuatnya dengan perang harga. Menurut prinsip serangan strategis dalam slide dosen, pendekatan ini…", ["Tepat, karena menyerang titik terkuat membuktikan keunggulan", "Kurang tepat: serang titik lemah rival dengan aset terkuat", "Tidak relevan, karena rival tidak pernah membalas", "Tepat selama harga turun lebih dulu"], 1, "Prinsip slide: hindari menantang pesaing di titik terkuatnya, dan siap menghadapi counter-response."], ["Sebuah perusahaan mengumumkan akan menyamai harga pesaing dan menyimpan kas besar, tetapi saat pesaing kecil memotong harga ia tidak bereaksi apa-apa. Penilaian terhadap signaling-nya?", ["Efektif, karena kas besar menggantikan respons", "Tidak relevan terhadap strategi defensif", "Efektif, karena pengumuman publik sudah cukup", "Tidak efektif tanpa komitmen kredibel"], 3, "Slide: signaling perlu diikuti respons kuat pada langkah rival yang lebih lemah agar citra pembela tangguh terbentuk."], ["Startup meluncurkan layanan baru paling awal, tetapi teknologinya masih primitif, loyalitas pelanggan rendah, mudah ditiru, dan pasar berubah cepat. Kemungkinan yang paling masuk akal?", ["First-mover advantage akan permanen", "Pasar tidak akan berkembang", "Switching costs otomatis melindungi startup", "Fast follower bisa melampauinya"], 3, "Kondisi late-mover advantage dalam slide: produk pionir primitif, evolusi pasar cepat, loyalitas rendah, mudah ditiru."], ["Produsen elektronik membeli pemasok komponen utamanya. Kapasitas pabrik komponen tidak cocok dengan kebutuhan perakitan, dan selera pembeli bergeser ke komponen yang tidak dibuat internal. Risiko vertical integration yang paling terwujud?", ["Kebutuhan resources baru hilang", "Skala ekonomi otomatis tercapai", "Investasi besar, kurang fleksibel", "Daya tawar atas pemasok naik"], 2, "Kerugian vertical integration dalam slide: risiko modal besar, capacity matching problems, dan kurang fleksibel."], ["Perusahaan merek sepatu meng-outsource desain produk intinya (sumber keunggulan bersaingnya) ke vendor yang lebih murah. Penilaian menurut slide dosen?", ["Tidak berdampak pada kontrol", "Tepat, karena selalu lebih murah", "Berisiko: capabilities bisa terkikis", "Tepat, karena kontrak menjamin segalanya"], 2, "Outsource sebaiknya aktivitas yang tidak krusial bagi keunggulan berkelanjutan."], ["Perusahaan membutuhkan mitra yang bersedia membuat investasi khusus pada rantai nilainya dan menginginkan kontrol lebih besar atas aktivitas mitra dibanding kontrak arm's-length. Pilihan yang paling sesuai?", ["Strategic alliance", "Outsourcing biasa tanpa hubungan khusus", "Tidak melakukan apa-apa", "Hostile takeover"], 0, "Slide: dibanding outsourcing, aliansi memberi kontrol lebih besar dan komitmen untuk relationship-specific investments."],["Gillette punya ide subscription tetapi baru meluncurkan Gillette Shave Club pada September 2015, sedangkan DSC berdiri 2012. Dari sisi timing, kesimpulan yang paling tepat adalah…", ["Gillette adalah first mover dan DSC adalah late mover", "DSC jadi first mover, incumbent lebih lambat", "Keduanya masuk bersamaan sehingga timing tidak berpengaruh", "Timing tidak relevan karena Gillette lebih besar"], 1, "DSC lebih dulu di subscription razor online dan menguasai sekitar 54% pangsa online pada 2015, dibanding Gillette Shave Club sekitar 21%."],
["Unilever mengakuisisi DSC seharga $1 miliar. Dalam konteks cara mewujudkan pertumbuhan, langkah ini adalah…", ["Internal development untuk membangun capabilities dari nol", "Strategic alliance tanpa pertukaran kepemilikan", "Joint venture dengan Gillette", "Akuisisi untuk memperoleh capabilities langsung"], 3, "Akuisisi memberi Unilever kemampuan terhubung langsung dengan konsumen lewat subscription yang kurang dimilikinya di pasar razor."]];
const E5=[["Jelaskan keempat strategi dalam matriks Ansoff. Strategi mana yang paling berisiko dan mengapa?", "Market penetration (produk lama, market lama), market development (produk lama, market baru), product development (produk baru, market lama), diversification (produk baru, market baru). Diversification paling berisiko karena ketiga elemen (produk dan market) baru; risikonya dapat ditekan dengan diversifikasi ke bisnis terkait. Tiga strategi lain memakai resources dan capabilities yang ada sehingga risikonya lebih rendah, meski product development mahal dan market development butuh pengetahuan market baru."], ["Bedakan vertical integration (backward dan forward) dan horizontal integration. Apa risikonya dan kaitannya dengan transaction-cost analysis dan outsourcing?", "Backward: ke hulu menuju input (Morrisons). Forward: ke hilir menuju konsumen (transport, gudang, ritel). Horizontal: mengambil alih pesaing atau produk komplementer di tahap yang sama (HSBC-Midland). Risiko vertical: ketergantungan pada satu pasar, lambat merespons perubahan. Transaction-cost analysis (Williamson): produksi internal bila transaction cost internal lebih rendah dari pasar; bila biaya administrasi internal lebih besar, outsource; bila transaction cost pasar jauh lebih besar dari biaya administrasi, integrasi vertikal. Kasus Boeing 787 menunjukkan risiko outsourcing berlebihan."], ["Bandingkan M&A dan internal development sebagai cara mewujudkan pertumbuhan. Sebutkan manfaat, kelemahan, dan kriteria Porter untuk akuisisi.", "M&A: cepat, pangsa pasar, masuk pasar, akses capabilities; kelemahan: premium mahal, budaya sulit disatukan. Internal development: risiko keuangan rendah, laju terkendali, pembelajaran tetap di perusahaan, tanpa konflik budaya; kelemahan: lambat, bisa kehilangan peluang, barriers to entry. Porter: attractiveness, cost of entry, better-off. Kay: synergy hanya bila distinctive capabilities dimanfaatkan lebih efektif. Contoh: Kraft-Cadbury, Daimler-Chrysler, RBS-ABN Amro; Aldi dan Lidl untuk organic growth."], ["Bedakan joint venture dan strategic alliance. Kapan keduanya cenderung gagal, dan apa tujuan akhir aliansi menurut Hamel dkk.?", "Joint venture: perusahaan terpisah yang independen dengan kepemilikan saham setara. Alliance: berbagi resources dan capabilities tanpa entitas baru. Manfaat: kombinasi capabilities, akses market, pengetahuan, mengurangi rivalry. Gagal bila tujuan tidak jelas dan tidak disepakati atau kurang kepercayaan. Hamel dkk.: aliansi adalah persaingan dalam bentuk lain; tujuan akhirnya belajar dari mitra. Contoh: Airbus."], ["Jelaskan opsi serangan ofensif utama dan siapa target terbaiknya. Apa tujuan strategi defensif, dan mengapa signaling harus disertai komitmen kredibel?", "Opsi serangan: harga lebih rendah untuk produk setara, leapfrog dengan produk generasi berikutnya, inovasi produk berkelanjutan, disruptive innovation, mengadopsi dan memperbaiki ide pihak lain, hit-and-run atau guerrilla marketing, preemptive strike. Target terbaik: market leader yang rentan, runner-up dengan kelemahan di area kekuatan penyerang, perusahaan hampir bangkrut, perusahaan lokal dan regional kecil. Prinsip: serang titik terlemah rival dengan aset terkuat, jangan menantang di titik terkuatnya. Defensif: menurunkan risiko diserang, melemahkan dampak serangan, mengalihkan penantang ke rival lain; caranya menutup jalur penantang dan signaling. Signaling hanya efektif bila diikuti tindakan nyata (mengumumkan komitmen pangsa, menyamai harga, war chest, respons kuat pada rival lemah); defensif jarang menciptakan keunggulan."], ["Kapan menjadi first mover menguntungkan, dan kapan late mover atau fast follower lebih baik? Sebutkan pertanyaan yang perlu diajukan sebelum memutuskan.", "First-mover advantages: reputasi dan loyalitas merek, switching costs pelanggan, perlindungan hak kekayaan, turun lebih dulu di learning curve, penetapan standar teknis. Late-mover advantages: pionir lebih mahal daripada meniru, produk pionir primitif, evolusi pasar cepat sehingga bisa dilompati, ketidakpastian pasar, loyalitas rendah dan mudah ditiru. Pertanyaan penentu: apakah butuh produk pelengkap yang belum ada, infrastruktur baru, pembeli perlu belajar perilaku baru, switching costs tinggi, adakah pesaing berpengaruh yang bisa menggagalkan. Keunggulan bisa datang dari kapan bergerak, bukan hanya apa yang dilakukan."], ["Bandingkan vertical integration (full, partial, tapered), outsourcing, dan strategic alliance sebagai cara mengatur scope. Kapan masing-masing masuk akal dan apa risikonya?", "Vertical integration: backward (menekan kekuatan pemasok, biaya input, menjamin pasokan, melindungi know-how) dan forward (efisiensi saluran, daya tawar, akses pengguna akhir, merek); risiko: modal besar, lambat adopsi teknologi, kurang fleksibel, masalah kapasitas, butuh capabilities baru. Full = semua tahap, partial = tahap terpilih, tapered = campuran internal dan outsource. Outsourcing: untuk aktivitas yang tidak krusial dan lebih baik dikerjakan spesialis; risiko hollowing out, kehilangan kontrol, kurang insentif investasi khusus. Alliance: pooling resources dan berbagi risiko, fleksibel dan cepat; kontrol dan komitmen lebih besar daripada outsourcing; risiko benturan budaya, gain tak terwujud, ketergantungan, perlindungan teknologi."]];
CONTENT.s6={kicker:'Sesi 6 · Henry Ch. 8',title:'International Strategy dan Global Business',desc:'Perdebatan globalization vs localization, alasan perusahaan ekspansi ke luar negeri, kerangka Ghoshal, empat tipe international strategy, model Uppsala, entry mode strategies, Porter\'s diamond, serta mitos dan tantangan globalisasi.',
materi:[
C("Globalization vs localization",
P("<b>Globalization</b> artinya pasar di berbagai negara saling terhubung (ekonomi, keuangan, sosial, politik), sehingga kejadian di satu negara bisa berdampak ke negara lain. <b>Localization</b> artinya perbedaan antarnegara tetap penting, jadi produk, distribusi, dan promosi perlu disesuaikan dengan tiap negara.")

+T(["Tokoh","Posisi","Gagasan inti","Contoh"],[["Levitt","Pro-globalization","Teknologi membuat konsumen di mana-mana menginginkan produk standar, sehingga perbedaan antarnegara hilang. Hanya perusahaan yang sadar ini yang bisa menikmati skala ekonomi besar (biaya per unit turun karena produksinya sangat banyak). Multidomestic corporation akan tamat; global corporation menjual produk yang sama ke semua negara dengan cara yang sama dan bersaing lewat harga dan kualitas.","Coca-Cola dan Pepsi"],["Douglas dan Wind","Pro-localization","Selera konsumen yang sama hanya ada di sedikit segmen target, sehingga produk dan pemasaran yang disesuaikan bisa menghasilkan laba lebih besar. Harga rendah mudah ditiru, teknologi membuat produksi jumlah kecil tetap efisien, standardisasi bisa menurunkan motivasi manajer lokal, dan tarif serta pembatasan impor menghambat globalisasi.","Findus (Nestlé): fish fingers di Inggris, coq au vin di Prancis"],["Ghemawat","Pro-localization","Perbedaan geografis justru makin penting, dan strategi per kawasan bisa menaikkan kinerja.","-"],["Hofstede","Pro-localization","Tidak ada bukti bahwa budaya antargenerasi di berbagai negara makin sama.","-"]])
+P("Debat ini praktis, bukan sekadar teori: kalau dunia makin global, pilihan strateginya berbeda dengan kalau dunia makin lokal. Henry juga mengingatkan bahwa globalisasi berdampak ke kehidupan orang biasa. Dari sudut pandang utilitarian (menilai dari total manfaat bagi banyak orang) mungkin ada manfaat besar, tetapi sering menutupi tragedi lokal.")),

C("Alasan perusahaan ekspansi internasional",
P("Alasannya dibagi dua: dorongan dari <b>dalam perusahaan</b> (organisasional) dan dorongan dari <b>luar perusahaan</b> (lingkungan atau eksogen).")
+T(["Kelompok","Faktor","Penjelasan"],[
["Organisasional","Persepsi tim manajemen","Pasar domestik sudah jenuh (contoh Nokia dari Finlandia). Biaya tetap besar, seperti R&D farmasi, sehingga perlu skala yang lebih besar. <b>Economies of scope</b>: menghemat dengan berbagi biaya antarproduk atau pasar (P&G dan Unilever mengoordinasi pemasaran dunia). Manajer punya pengetahuan dan pengalaman soal pasar luar negeri. Persepsi risiko. Keuntungan lokasi untuk value chain."],
["Organisasional","Firm-specific","Ukuran perusahaan (yang besar lebih sering go international) dan daya tarik internasional produknya, misalnya software, Coca-Cola, Starbucks, Armani."],
["Lingkungan (eksogen)","Unsolicited proposals","Tawaran yang datang tanpa diminta, dari pemerintah asing, distributor, atau pelanggan."],
["Lingkungan (eksogen)","Bandwagon effect","Ikut-ikutan pesaing yang sudah go international supaya tidak tertinggal."],
["Lingkungan (eksogen)","Daya tarik host country","Ukuran pasar dan sikap pemerintah yang ramah terhadap <b>foreign direct investment</b> (FDI, yaitu investasi langsung perusahaan di negara lain, misalnya membangun pabrik). Contoh China dan India: pendapatan per kapita naik, tenaga kerja terampil, manufaktur murah, dan populasi gabungan lebih dari sepertiga dunia."]
])
),

C("Kerangka Ghoshal untuk multinational enterprise (MNE)",
P("<b>MNE</b> adalah organisasi yang punya kegiatan produktif di dua negara atau lebih. Ghoshal menyebut tiga tujuan strategis dan tiga sumber keunggulan. Perusahaan perlu bertindak supaya ketiga tujuan tercapai, dan tujuan itu bisa saling bertukar-untung (trade-off).")
+AN("Cara membaca tabel: <b>baris</b> adalah apa yang ingin dicapai (tujuan strategis), <b>kolom</b> adalah dari mana keunggulan itu didapat. Tiap sel menjawab: 'untuk tujuan ini, bagaimana sumber keunggulan itu dimanfaatkan?'")
+T(["Tujuan strategis","National differences","Scale economies","Scope economies"],[
["Efisiensi operasi saat ini","Memanfaatkan beda factor costs antarnegara (upah, biaya modal)","Memperbesar skala tiap aktivitas","Berbagi investasi dan biaya antarproduk, pasar, dan bisnis"],
["Mengelola risiko","Mengelola risiko akibat perubahan pasar atau kebijakan yang mengubah keunggulan komparatif negara","Menyeimbangkan skala dengan fleksibilitas strategis dan operasional","Menyebar risiko lewat diversifikasi portofolio dan side-bets (taruhan kecil di beberapa tempat)"],
["Inovasi, pembelajaran, adaptasi","Belajar dari perbedaan proses dan sistem organisasi antarmasyarakat","Manfaat pengalaman: biaya turun dan inovasi","Pembelajaran bersama antarkomponen organisasi"]
])
+UL([
"<b>Efisiensi</b> adalah rasio nilai output terhadap biaya semua input. Diferensiasi menaikkan nilai output (harga premium), sedangkan faktor biaya rendah menurunkan biaya input.",
"<b>Risiko</b> ada empat jenis: makroekonomi (misalnya konflik militer), politik (keputusan pemerintah), kompetitif (reaksi pesaing), dan sumber daya (tidak punya atau tidak bisa memperoleh resources, misalnya teknologi).",
"<b>Pembelajaran</b> muncul bila menjadi tujuan organisasi yang didukung manajemen senior lewat sistem dan proses, dan meresap di budaya."])
+DEF("Contoh tiap sumber keunggulan","<b>National differences:</b> biaya insinyur software di India jauh lebih murah daripada di AS, Inggris, atau Eropa. <b>Scale economies:</b> experience curve dan minimum efficient scale (skala produksi terkecil yang sudah membuat biaya per unit serendah mungkin). <b>Scope economies:</b> platform mobil bersama yang dipakai banyak model.","Klaster pemasok (kumpulan perusahaan pemasok yang berdekatan) seperti Silicon Valley atau Wuhan, rumah Foxconn, pemasok Apple dan Xiaomi. Wuhan terganggu COVID-19 pada 2020, sehingga banyak perusahaan menimbang on-shoring (memindahkan produksi kembali ke negara asal).")),

C("Empat tipe international strategy",
P("Pertanyaan intinya: seberapa jauh produk distandarkan untuk memanfaatkan efisiensi, dan seberapa jauh produk disesuaikan dengan selera lokal yang menambah biaya.")
+DEF("Contoh sederhana (restoran cepat saji)","<b>Multidomestic:</b> menu tiap negara dibuat berbeda total. <b>Global:</b> menu sama persis di semua negara. <b>International:</b> menu inti dari pusat, hanya sedikit disesuaikan di tiap negara. <b>Transnational:</b> bumbu dan bahan dibuat efisien secara global, tetapi menu tiap negara disesuaikan, dan resep yang sukses di satu negara dipakai negara lain.","Contoh ini kubuat sendiri untuk memudahkan, bukan dari Henry.")
+T(["Tekanan integrasi global (baris) dan respons pasar lokal (kolom)","Respons lokal tinggi","Respons lokal rendah"],[["Integrasi global tinggi","Transnational","Global"],["Integrasi global rendah","Multidomestic","International"]])+CALL("Pemetaan dua sumbu ini berasal dari kerangka umum Bartlett dan Ghoshal. Henry membedakan keempat tipe lewat tabel di bawah, jadi cocokkan dengan catatan dosen.")+T(["","Multidomestic","Global","International","Transnational"],[
["Ide dasar","Produk disesuaikan dengan tiap pasar nasional. Tiap pasar dianggap unik dan independen.","Produk standar untuk semua pasar internasional.","Mengeksploitasi core competencies di pasar asing. Adaptasi hanya di pinggiran.","Sekaligus efisien secara global, responsif secara nasional, dan memanfaatkan inovasi dan pembelajaran di seluruh dunia."],
["Letak aset dan kemampuan (konfigurasi)","Terdesentralisasi, mandiri per negara.","Terpusat dan berskala global.","Sumber core competencies terpusat, sisanya terdesentralisasi.","Selektif: sebagian terpusat (di dalam atau luar negeri asal), sebagian tersebar dan terspesialisasi."],
["Peran operasi luar negeri","Menangkap peluang lokal.","Menjalankan strategi induk.","Menyesuaikan dan memanfaatkan kompetensi induk.","Jaringan terintegrasi dengan aliran komponen, produk, sumber daya, orang, dan informasi."],
["Pengetahuan","Dikembangkan dan disimpan di tiap unit.","Dikembangkan dan disimpan di pusat.","Dikembangkan di pusat, lalu dialihkan ke unit luar negeri.","Dipakai lintas negara."],
["Kekuatan","Responsif pada permintaan lokal.","Biaya rendah lewat skala dan koordinasi.","Transfer pengetahuan ke negara yang kurang berkembang.","Menggabungkan ketiganya."],
["Kelemahan","Variasi menaikkan biaya. Pembelajaran lintas negara terhambat. Inovasi lokal bisa sekadar melindungi wilayah manajer.","Terlalu menganggap selera sudah sama. Tidak ada slack (kelonggaran) bagi anak usaha. Tidak bisa belajar dari luar negeri asal.","Kurang efisien dari global dan kurang responsif dari multidomestic. Aktivitas terpusat rentan kurs. Kontrol kualitas jauh. Manajer lokal kehilangan motivasi.","Butuh struktur korporat berbeda untuk mengelola interaksi yang rumit."],
["Contoh di Henry","Walmart di Jerman: tidak pernah laba meski penjualan 2,5 miliar dolar per tahun. 'Greeters' tidak populer, aturan hubungan atasan-bawahan ditolak karyawan, dan posisi termurah sudah diambil Aldi.","Huawei, Tata, Apple, Boeing. Walmart keluar dari Korea Selatan.","Apple: desain dan pengembangan di AS, manufaktur di China. Produksi terganggu pandemi.","R&D di negara asal, pabrik padat karya di Meksiko, akses teknologi tertentu di AS."]
])
+CALL("<b>Administrative heritage</b> (Bartlett dan Ghoshal) adalah warisan cara kerja perusahaan: konfigurasi aset, gaya manajemen, dan nilai organisasi, yang dipengaruhi kepemimpinan, budaya negara asal, dan sejarah organisasi. Heritage membatasi seberapa cepat perusahaan bisa berubah menuju bentuk transnational.")),

C("Model Uppsala",
P("Johanson dan Vahlne: internasionalisasi terjadi <b>bertahap</b> lewat keputusan sedikit demi sedikit (inkremental). Makin banyak pengetahuan dan pengalaman, makin besar komitmen ke pasar luar negeri.")
+DEF("Contoh sederhana","Sebuah produsen camilan awalnya mengekspor ke negara tetangga yang budayanya mirip. Setelah paham pasarnya, baru berani membuka kantor penjualan di sana, lalu pelan-pelan menjangkau negara yang lebih jauh.","Contoh ini kubuat sendiri, bukan dari Henry.")
+UL([
"Awalnya ekspor dulu, baru mendirikan anak usaha di luar negeri.",
"Masuk dulu ke negara tetangga, lalu ke pasar yang makin jauh.",
"<b>Psychic distance</b> adalah jarak yang dirasakan akibat beda bahasa, budaya, sistem hukum, dan politik, yang menghambat aliran informasi. Negara dengan psychic distance rendah dipilih lebih dulu karena risikonya terasa lebih kecil.",
"Dua faktor utama: <b>market knowledge</b> (pengetahuan umum dan struktur pasar asing) dan <b>market commitment</b> (sumber daya yang dikomitmenkan). Faktor yang memengaruhi: <b>current activities</b> (tingkat komitmen di pasar itu, yang menjadi sumber pengalaman) dan <b>commitment decisions</b> (kesulitan menemukan peluang baru dengan pengetahuan yang ada)."])
+T(["Kritik","Isinya"],[
["Rasional, bukan belajar bertahap","Benito dan Gripsrud: internasionalisasi adalah hasil keputusan rasional."],
["Ukuran peluang pasar","Yang mendorong adalah peluang ekonomi (ukuran pasar asing)."],
["Usang","Sulit menjelaskan internasionalisasi beberapa dekade terakhir. Psychic distance menurun saat dunia makin terintegrasi."],
["Jaringan","Perusahaan bisa mendapat pengetahuan lewat pemasok atau mitra. Johanson dan Vahlne mengakui peran business networks."]
])
+P("Model ini masih relevan untuk perusahaan dari emerging markets yang cenderung mengikuti prinsip psychic distance.")),

C("Entry mode strategies",
P("<b>Entry mode</b> adalah cara perusahaan masuk ke pasar luar negeri. Menurut Brouthers, pilihannya ditentukan dua pertanyaan: (1) seberapa besar komitmen sumber daya yang bersedia diberikan, dan (2) seberapa besar kontrol atas operasi internasional yang dibutuhkan. Keduanya bergantung pada <b>persepsi risiko internasional</b>.")
+P("Miller membagi risiko menjadi tiga: <b>general environment</b> (misalnya risiko politik, memengaruhi semua industri di negara itu), <b>industry</b> (ketidakpastian pasar input seperti tenaga kerja atau bahan), dan <b>firm-specific</b> (misalnya perselisihan karyawan, ditambah tanggung jawab bekerja di budaya berbeda). Bila hanya satu jenis risiko yang dipertimbangkan, entry mode bisa salah pilih.")
+T(["Entry mode","Kontrol","Risiko","Biaya dan komitmen"],[["Exporting","Rendah","Rendah","Rendah"],["Licensing dan franchising","Sedang","Sedang: licensee bisa menjadi pesaing, dan satu outlet buruk merusak reputasi jaringan","Modal kecil, tetapi perlu licensee atau franchisee yang tepat"],["Joint venture dan strategic alliance","Dibagi dengan mitra","Dibagi dengan mitra","Dibagi dengan mitra"],["Wholly owned subsidiary (FDI)","Penuh","Terbesar","Terbesar, tidak ada yang berbagi biaya"]])+P("Tabel ringkas ini membandingkan keempat pilihan. Penilaian sedang pada licensing dan franchising adalah inferensi untuk latihan, bukan pernyataan Henry. Rinciannya ada di tabel berikut.")+T(["Entry mode","Isi","Kelebihan","Kelemahan"],[
["Exporting","Membuat barang atau jasa di negara asal, lalu menjualnya ke negara lain.","Risiko dan komitmen rendah. Mendapat pengalaman internasional. Skala ekonomi dari penjualan yang lebih besar.","Kontrol rendah. Bergantung pada distributor lokal yang mungkin kurang berkomitmen."],
["Licensing","Memberi hak pakai patent, trademark, atau IP (kekayaan intelektual) dengan imbalan fee.","Modal kecil. Akses pasar cepat.","Perlu licensee yang tepat. Licensee bisa meniru dan menjadi pesaing."],
["International franchising","Bentuk licensing: franchisor mengalihkan paket produk, sistem, dan layanan dengan imbalan fee (McDonald's, Benetton, Pizza Hut).","Franchisee membawa pengetahuan lokal dan entrepreneurship. Host country lebih menerima karena ada kepemilikan dan lapangan kerja lokal.","Gagal bila kurang percaya. Franchisee bisa free ride (ikut menikmati nama besar tanpa menjaga kualitas). Satu outlet buruk merusak reputasi seluruh jaringan."],
["Joint venture dan strategic alliance","JV: perusahaan terpisah dengan saham setara. Alliance: berbagi sebagian resources tanpa membentuk entitas baru.","Risiko dibagi. Menggabungkan resources dan capabilities. Akses pasar. Tujuan akhir alliance adalah belajar dari mitra.","Perlu tujuan jelas dan kepercayaan. Beda manajerial. Campur tangan negara (Danone dan HSBC di China). Contoh JV: Hydro Volt (Northvolt dan Norsk Hydro) untuk daur ulang baterai."],
["Wholly owned subsidiary (FDI)","Kontrol penuh. Bisa lewat <b>greenfield</b> (membangun dari nol) atau lewat akuisisi atau merger dengan perusahaan yang sudah ada di luar negeri.","Kontrol penuh dan potensi imbal hasil terbesar. Didukung host government (pembiayaan, bantuan regulasi) demi lapangan kerja. Cocok bila punya resources unik (Toyota, Nissan; juga Tesla, Nestlé, P&G).","Komitmen sumber daya dan risiko terbesar. Tidak ada yang berbagi biaya. Sulit bila tidak punya manajer yang paham pasar lokal."]
])
+CALL("Hubungan risiko dan kontrol: makin besar kontrol yang diinginkan, makin besar risiko. Exporting berarti risiko dan kontrol rendah, sedangkan wholly owned subsidiary berarti kontrol penuh dan risiko besar. Bila persepsi risiko tinggi, perusahaan bisa membagi risiko lewat JV atau franchise.")
+DEF("Contoh sederhana (urutan dari kontrol kecil ke besar)","Sebuah merek sepatu bisa mulai dengan mengekspor lewat distributor (risiko kecil, kontrol kecil), lalu melisensikan mereknya ke pabrik lokal, lalu membentuk JV dengan mitra lokal, dan terakhir membangun pabrik sendiri (kontrol penuh, risiko besar).","Contoh ini kubuat sendiri, bukan dari Henry.")),

C("Porter's diamond of national advantage",
P("Pertanyaan Porter: mengapa suatu negara unggul di industri tertentu? Jawabannya, daya saing negara datang dari kemampuan industrinya untuk berinovasi dan meningkatkan kualitas (upgrade). Pemicunya adalah pesaing domestik yang kuat, pemasok yang agresif, dan pelanggan lokal yang menuntut. Perusahaan yang ditempa di lingkungan ini lebih siap bersaing di luar negeri.")
+CALL("Keunggulan yang bertahan lama datang dari inovasi dan upgrade yang terus-menerus, karena pesaing akhirnya meniru.")
+T(["Atribut","Isi","Contoh dari Henry"],[
["Factor conditions","Pemanfaatan faktor produksi yang spesifik bagi industri (tenaga kerja terampil, kemampuan teknologi). Faktor penting kini diciptakan, bukan sekadar warisan alam.","Silicon Valley: Xerox PARC, dekat Stanford, Hewlett dan Packard"],
["Demand conditions","Konsumen domestik yang canggih dan menuntut mendorong inovasi dan memberi petunjuk tren global.","AC kecil dan senyap berkompresor rotary yang hemat energi di Jepang"],
["Related and supporting industries","Pemasok domestik yang kompetitif dan dekat memberi input hemat dan mendorong inovasi bersama.","Klaster pemasok kulit dan sepatu di Italia"],
["Firm strategy, structure, and rivalry","Struktur manajemen yang sesuai dinamika industri, dan rivalitas domestik yang kuat (faktor terpenting).","Struktur ketat Jerman untuk industri presisi seperti optik"]
])
+P("Dua variabel eksternal: <b>chance</b> (kejadian tak terduga, misalnya penemuan baru, perang, gejolak pasar keuangan, harga minyak) dan <b>government</b> (memengaruhi keempat atribut lewat subsidi, pendidikan, regulasi pasar modal, standar produk, pembelian pemerintah, pajak, regulasi persaingan).")
+T(["Kritik","Isinya"],[
["Rugman dan D'Cruz","Diamond tunggal cocok untuk MNE dari triad (AS, Jepang, Uni Eropa), tetapi kurang efektif untuk ekonomi kecil dan terbuka seperti Kanada dan Selandia Baru."],
["Rugman dan Verbeke","Pembedaan home base dan host nation kurang pas bagi dunia nyata. Negara kecil bisa bergantung pada negara besar."],
["Double diamond","Analisis diamond negara sendiri dan negara besar mitra dagangnya (Kanada dan AS). Nestlé: sekitar 95% penjualan di luar Swiss (Hodgetts), jadi diamond Swiss kurang relevan."]

),

C("Mitos global strategy dan tantangan globalisasi",
P("Rangan menyebut tujuh mitos soal perusahaan yang ingin go global. <b>Intangible assets</b> adalah aset tak berwujud, seperti merek, reputasi, dan value proposition.")
+T(["Mitos","Kenyataan menurut Rangan"],[
["1. Perusahaan yang punya uang bisa go global","Yang berhasil punya intangible assets berharga (IKEA: value proposition; Coca-Cola: merek). Ekspor yang tumbuh menandakan nilai yang lebih baik daripada pesaing lokal."],
["2. Internasionalisasi jasa itu berbeda","Sama saja: perlu intangible assets yang bisa direplikasi di luar negeri."],
["3. Jarak dan batas negara tidak penting lagi","Biaya transportasi kecil tetapi tetap positif dan naik dengan jarak. Budaya membentuk institusi dan nilai. HSBC menyebut diri 'the world's local bank'."],
["4. Negara berkembang adalah tempat aksinya","Ekonomi Barat masih mendominasi perdagangan dunia (Henry mencatat poin ini kurang kuat karena China kini ekonomi terbesar kedua)."],
["5. Produksi di tempat upah paling murah","Upah hanya sebagian dari total delivered cost. Tarif dan bea bisa menaikkan biaya, dan produktivitas rendah menaikkan biaya per unit."],
["6. Globalisasi akan bertahan","Pengangguran berkepanjangan bisa memicu pemerintah bertindak sepihak membalik globalisasi. Korporasi perlu berperan sosial."],
["7. Pemerintah tidak penting lagi","Ekonomi global butuh aturan, dan aturan dibuat pemerintah. MNE perlu bekerja sama dengan pemerintah."]
])
+UL([
"<b>Rugman dan Verbeke:</b> 500 MNE terbesar menguasai sekitar 90% FDI dan 50% perdagangan dunia, tetapi kebanyakan bukan perusahaan global. Mereka adalah <b>regional multinationals</b>, yaitu perusahaan yang penjualan terbesarnya ada di kawasan asalnya dalam triad (tiga kawasan besar: Amerika Utara, Uni Eropa, Asia). Jadi yang disebut globalisasi mungkin lebih tepat disebut regionalisasi.",
"<b>Palmisano (IBM):</b> MNE tradisional berevolusi menjadi <b>globally integrated enterprise</b>, yaitu perusahaan yang fokus pada <i>bagaimana</i> membuat dan mengantar, bukan <i>apa</i>. Aktivitas value chain (procurement, riset, penjualan) diintegrasikan secara global, lalu dipilih dikerjakan di mana, dan dikerjakan sendiri (in-house) atau di-outsource. Tantangannya: pasokan keterampilan tinggi, pembajakan IP vs kolaborasi, menjaga kepercayaan, dan pasar modal yang berorientasi jangka pendek.",
"<b>Strategy in Focus 8.2 (Globalization in Retreat):</b> penjualan luar negeri KFC dan McDonald's naik 400% antara 1990 dan 2005, tetapi kemudian laba luar negeri turun dan keduanya melepas bisnis China. Perusahaan multinasional hanya 2% lapangan kerja dunia, tetapi mengorkestrasi rantai pasok lebih dari 50% perdagangan dunia."])),

C("Kasus tugas: Inditex (Zara), international strategy dan mengapa sulit disamai","<h3>Fakta kasus</h3>"+UL(["Inditex didirikan oleh Amancio Ortega. Zara pertama dibuka di La Coruña (1975).", "Pada 2016 Inditex beroperasi di sekitar 93 negara dengan hampir 7.300 toko. Lebih dari 95% koleksi Zara dijual secara internasional.", "Desain, pemotongan kain, dan logistik dipertahankan internal di Arteixo. Menjahit oleh pabrik partner sekitar.", "Lebih dari separuh produk dirancang dan diproduksi kurang dari sebulan sebelum sampai ke toko, mengikuti tren.", "Tiap toko mendapat assortment (pilihan produk) yang disesuaikan pasar lokal, dikirim dua kali seminggu.", "Brand manager memantau data penjualan tiap negara dan memakai algoritma yang dikembangkan bersama MIT. Manajer lokal tetap berwenang menyesuaikan keputusan, dan ada komunikasi antara designer, country manager, dan toko lokal."])+"<h3>Pertanyaan 1: tipe international strategy apa yang dipakai?</h3>"+T(["", "Elemen global (efisiensi)", "Elemen lokal (responsiveness)"], [["Desain dan produksi", "Desain, pemotongan kain, dan logistik dipertahankan internal di Arteixo", "Produk dirancang dan diproduksi kurang dari sebulan, mengikuti tren"], ["Distribusi", "Jaringan logistik menghubungkan pabrik dan pusat distribusi ke berbagai toko", "Assortment tiap toko disesuaikan pasar lokal, dikirim dua kali seminggu"], ["Keputusan", "Brand manager memantau data penjualan tiap negara dengan algoritma bersama MIT", "Manajer lokal berwenang menyesuaikan keputusan, dan ada komunikasi designer, country manager, dan toko lokal"]])+"<h3>Pertanyaan 2: mengapa Zara sulit disamai?</h3>"+T(["Faktor", "Analisis"], [["Sistem yang saling terhubung", "Desain, produksi, teknologi, supply chain, distribusi, dan respons pada konsumen bekerja sebagai satu sistem. Meniru satu bagian tidak memberi hasil yang sama."], ["Kecepatan", "Produk baru sampai ke toko dalam waktu kurang dari sebulan, sulit dicapai model yang memproduksi di negara berbiaya rendah dengan waktu tempuh lebih lama."], ["Informasi dari toko", "Masukan tentang apa yang disukai konsumen mengalir kembali ke designer dan country manager, sehingga keputusan bisa cepat menyesuaikan selera pasar."], ["Kemampuan internal", "Desain, pemotongan kain, dan logistik tidak diserahkan ke pihak luar, sehingga sulit dibeli atau disalin pesaing."]])+"<h3>Kesimpulan</h3>"+CALL("Klasifikasi yang paling kuat: <b>transnational</b>, karena Inditex memperoleh efisiensi dari sistem global sekaligus responsif pada kebutuhan lokal. Bila ditanya alasannya, jangan hanya menyebut label; tunjukkan unsur global dan lokal seperti di tabel. Zara sulit disamai karena keunggulannya adalah satu sistem aktivitas yang saling terhubung, bukan satu langkah yang bisa disalin. Tantangannya: makin luas pasar internasional, makin rumit mengelola supply chain, distribusi, produksi, dan perbedaan preferensi konsumen."),"Kasus tugas dosen")
].join('')};

["Perusahaan yang berusaha sekaligus mencapai efisiensi global, responsif terhadap kebutuhan nasional, dan memanfaatkan inovasi serta pembelajaran di seluruh dunia mengikuti strategi…", ["Transnational", "Global", "Multidomestic", "International"], 0, "Itu definisi transnational strategy (Bartlett dan Ghoshal). Strateginya selektif: sebagian dipusatkan, sebagian disebar, dan dikelola lewat jaringan terintegrasi."],

["Salah satu kritik terhadap model Uppsala adalah…",["Terlalu mengabaikan pentingnya market knowledge","Pengetahuan bisa didapat lewat mitra (business networks)","Model hanya berlaku untuk perusahaan jasa","Psychic distance justru makin besar saat dunia terintegrasi"],1,"Kritik lain: internasionalisasi adalah keputusan rasional, didorong peluang ekonomi, dan model sulit menjelaskan dekade terakhir. Johanson dan Vahlne mengakui peran business networks."],["Inditex memiliki desain, pemotongan kain, dan logistik terintegrasi secara global, tetapi assortment tiap toko disesuaikan pasar lokal dan manajer lokal berwenang menyesuaikan keputusan. Tipe international strategy yang paling tepat adalah…", ["Global", "Multidomestic", "Transnational", "International"], 2, "Transnational memadukan efisiensi sistem global dengan responsiveness pada pasar lokal."],

const E6=[["Jelaskan debat globalization vs localization (Levitt vs Douglas dan Wind, ditambah Ghemawat dan Hofstede). Apa dampaknya terhadap pilihan strategi internasional?", "Levitt: teknologi membuat selera konsumen seragam, sehingga perusahaan global yang menjual produk standar menikmati skala ekonomi dan multidomestic corporation akan tamat (contoh Coca-Cola dan Pepsi). Douglas dan Wind: kesamaan hanya ada di sedikit segmen, harga rendah mudah ditiru, teknologi memungkinkan efisiensi pada skala kecil, dan standardisasi bisa mengurangi motivasi manajer lokal; contoh Findus. Ghemawat: perbedaan geografis makin penting dan strategi regional membantu. Hofstede: tidak ada bukti budaya negara-negara menyatu. Dampaknya: kalau dunia makin global, strategi condong ke standardisasi (global); kalau makin lokal, condong ke penyesuaian (multidomestic); pilihan di antaranya adalah international dan transnational."],
["Bandingkan empat tipe international strategy (multidomestic, global, international, transnational) dari sisi konfigurasi aset, peran operasi luar negeri, dan pengetahuan. Apa kelemahan masing-masing, dan apa itu administrative heritage?", "Multidomestic: aset terdesentralisasi, operasi luar negeri menangkap peluang lokal, pengetahuan disimpan di tiap unit; kelemahan biaya variasi dan pembelajaran terhambat (Walmart di Jerman). Global: aset terpusat dan berskala global, anak usaha menjalankan strategi induk, pengetahuan di pusat; kelemahan menganggap selera sudah sama dan tidak ada slack (Walmart keluar dari Korea Selatan). International: kompetensi inti di pusat dan dialihkan ke luar negeri; kurang efisien dari global dan kurang responsif dari multidomestic; rentan kurs, kontrol jauh, manajer lokal kurang termotivasi (Apple). Transnational: sekaligus efisien, responsif, dan memanfaatkan pembelajaran lewat jaringan terintegrasi dengan pemusatan selektif. Administrative heritage: konfigurasi aset, gaya manajemen, dan nilai organisasi yang dibentuk kepemimpinan, budaya negara asal, dan sejarah; ia membatasi kemampuan perusahaan berubah."],
["Sebuah perusahaan makanan ingin masuk ke pasar baru dengan tingkat risiko negara yang dinilai tinggi. Pilih dan justifikasi entry mode yang cocok dengan memakai kerangka risiko dan kontrol, serta sebutkan kelemahannya.", "Pertimbangan Brouthers: seberapa besar komitmen sumber daya dan kontrol yang diperlukan, yang bergantung pada persepsi risiko (Miller: risiko general environment, industry, dan firm-specific). Bila risiko tinggi, perusahaan cenderung membatasi komitmen, misalnya mulai dengan exporting atau membagi risiko lewat joint venture atau franchise. Exporting: risiko dan komitmen rendah tetapi kontrol rendah dan bergantung pada distributor. Franchising: pengetahuan lokal dan penerimaan host country, tetapi risiko free ride dan reputasi rusak. JV: risiko dibagi dan akses pasar, tetapi butuh tujuan jelas, kepercayaan, dan rentan campur tangan negara (Danone dan HSBC di China). Wholly owned subsidiary memberi kontrol penuh tetapi risiko terbesar sehingga kurang cocok untuk risiko tinggi."],
["Jelaskan Porter's diamond of national advantage dan kritik terhadapnya. Mengapa Rugman mengusulkan double diamond?", "Diamond: factor conditions, demand conditions, related and supporting industries, serta firm strategy, structure, and rivalry, ditambah dua variabel eksternal (chance dan government). Kekuatan utama datang dari rivalitas domestik yang kuat dan konsumen yang menuntut, yang mendorong inovasi dan upgrade sehingga perusahaan siap bersaing di luar negeri. Kritik: Rugman dan D'Cruz menilai diamond tunggal cocok untuk MNE dari triad (AS, Jepang, Uni Eropa) tetapi kurang untuk ekonomi kecil dan terbuka seperti Kanada atau Selandia Baru; Rugman dan Verbeke menilai pembedaan home dan host base mengabaikan realitas. Double diamond: manajer MNE dari negara kecil menganalisis diamond negaranya dan diamond negara besar mitra dagangnya (Kanada dan AS). Contoh: sekitar 95% penjualan Nestlé di luar Swiss."]];

const Q7=[["Aktivitas primer (<i>primary activity</i>) apa yang berfokus pada peningkatan atau pemeliharaan nilai produk melalui kegiatan seperti instalasi, pelatihan, dan perbaikan?", ["Human resource management", "Marketing and sales", "Outbound logistics", "Service", "Operations"], 3, "Jawaban: Service."], ["Apa tujuan utama strategi <i>blue ocean</i> dibandingkan dengan strategi bersaing tradisional?", ["Menciptakan ruang pasar baru yang belum diperebutkan dan membuat persaingan menjadi tidak relevan melalui inovasi nilai", "Mengungguli pesaing di pasar yang sudah ada dengan meningkatkan kualitas produk secara signifikan dan mengenakan harga premium", "Mempertahankan pangsa pasar perusahaan saat ini dari lima kekuatan persaingan dengan mencapai kepemimpinan biaya secara menyeluruh", "Memaksimalkan nilai pemegang saham dengan melepas seluruh unit bisnis yang tidak menunjukkan pertumbuhan tinggi", "Menyasar secara agresif pelanggan paling menguntungkan milik pesaing dengan memanfaatkan berbagai keunggulan jangka pendek"], 0, "Jawaban: Menciptakan ruang pasar baru melalui inovasi nilai."], ["Apakah analisis SWOT dapat digunakan untuk analisis lingkungan internal dalam konteks manajemen stratejik?", ["Ya, sebagian; komponen strengths dan weaknesses mencerminkan kondisi internal, tetapi SWOT lebih berperan merangkum hasil analisis internal dan eksternal", "Tidak, karena SWOT hanya menganalisis peluang dan ancaman dari lingkungan eksternal", "Ya, SWOT merupakan alat utama analisis internal karena seluruh komponennya menilai kondisi di dalam perusahaan", "Ya, SWOT dapat menggantikan analisis VRIO dan rantai nilai karena mencakup seluruh sumber daya perusahaan", "Tidak, karena analisis lingkungan internal hanya dapat dilakukan dengan analisis rantai nilai"], 0, "Jawaban: Strengths dan weaknesses mencerminkan kondisi internal, sedangkan opportunities dan threats mencerminkan kondisi eksternal."], ["Bagaimana lingkungan makro memengaruhi lingkungan kompetitif?", ["Perubah
