<body>
<button class="navtoggle" id="navtoggle" onclick="toggleNav()" aria-label="Buka/tutup navigasi"><span></span><span></span><span></span></button>
<div class="backdrop" id="backdrop" onclick="closeNavMobile()"></div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">PPAk FEB UGM</div>
      <h1>SML Hub</h1>
      <div class="sub">Strategic Management and Leadership (AKU6210): ringkasan, latihan, dan esai per sesi sesuai RPKPS.</div>
    </div>
    <div id="nav"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<script>
const CONTENT = {};
const T=(h,rows,cls='')=>`<div class="tw"><table class="${cls}"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>{const tot=String(r[0]).startsWith('!');const rr=tot?[String(r[0]).slice(1),...r.slice(1)]:r;return `<tr class="${tot?'tot':''}">${rr.map(x=>`<td>${x}</td>`).join('')}</tr>`}).join('')}</table></div>`;
const UL=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const P=t=>`<p>${t}</p>`;
const SP=d=>{if(d.length<220||/<br|<ul|<ol/.test(d))return `<p>${d}</p>`;return d.split(/(?<=[.!?])\s+(?=[A-Z<"(])/).map(s=>`<p>${s}</p>`).join('')};
const PUI=(t,d)=>{
 if(/^Contoh\b/.test(t))return `<div class="def exm"><div class="dt">${t}</div><p>${d}</p></div>`;
 let n=null,m=t.match(/^(?:Step\s+)?(\d+)\s*[.:]\s*(.+)$/);if(m){n=m[1];t=m[2]}
 let eg='';const x=d.match(/^([\s\S]*?)\s*Contoh(?: [^:<]{0,20})?:\s*([\s\S]+)$/);
 if(x){d=x[1];eg=x[2]}
 return `<div class="def${n?' nm':''}"><div class="dt">${n?`<span class="nb">${n}</span>`:''}${t}</div>${d?SP(d):''}${eg?`<div class="eg"><span>Contoh</span>${eg}</div>`:''}</div>`};
const PU=a=>`<div class="pu">${a.map(x=>typeof x=='string'?x:PUI(x[0],x[1])).join('')}</div>`;
const C=(t,b,tag)=>`<div class="card"><h2>${t}${tag?` <span class="badge">${tag}</span>`:''}</h2>${b}</div>`;
const DEF=(t,d,eg,tags)=>`<div class="def"><div class="dt">${t}</div>${/^<ul/.test(d)?d:`<p>${d}</p>`}${tags?`<div class="tags">${tags.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${eg?`<div class="eg"><span>Contoh</span>${eg}</div>`:''}</div>`;
const VSC=(x,c)=>`<div class="${c}"><div class="vh">${x[0]}</div>${x[1]?`<p>${x[1]}</p>`:''}${x[3]?`<ul>${x[3].map(i=>`<li>${i}</li>`).join('')}</ul>`:''}${x[2]?`<div class="eg"><span>Contoh</span>${x[2]}</div>`:''}</div>`;
const VS=(t,a,b,note)=>`<div class="def"><div class="dt">${t}</div><div class="vs">${VSC(a,'vl')}<div class="vsb">vs</div>${VSC(b,'vr')}</div>${note?`<div class="callout">${note}</div>`:''}</div>`;
const CALL=t=>`<div class="callout">${t}</div>`;
const AN=t=>`<div class="analogy">${t}</div>`;
const FORM=t=>`<div class="formula">${t}</div>`;
const tg=(a)=>a;
const ps=(x,y)=>`<span class="pill ${x?'ok':'no'}">${y}</span>`;
const CK='✓';
let qi=0,sc=0;
let picked=[],QSTATE={},curK='';
function quizHtml(){const sv=QSTATE[curK]||(QSTATE[curK]={});picked=[];sc=0;QS.forEach((q,i)=>{if(sv[q[0]]!==undefined){picked[i]=sv[q[0]];if(sv[q[0]]===q[2])sc++}});return `<div class="quizbar"><span class="score" id="sc">Skor: ${sc} / ${QS.length}</span><div style="display:flex;gap:8px"><button class="btn secondary" onclick="refreshQuiz()">Ulangi</button><button class="btn" onclick="shuffleQuiz()">Acak soal</button></div></div>`+QS.map((q,i)=>`<div class="qcard" id="qc${i}"><div class="qnum">Soal ${i+1}</div><div class="qtext">${q[0]}</div>${q[1].map((t,j)=>`<button class="opt${picked[i]!==undefined?(j===q[2]?' correct':(j===picked[i]?' wrong':'')):''}"${picked[i]!==undefined?' disabled':''} onclick="pick(${i},${j})">${t}</button>`).join('')}<div class="explain${picked[i]!==undefined?' show':''}" id="ex${i}">${q[3]}</div></div>`).join('')}
function pick(i,j){const q=QS[i];if(picked[i]!==undefined)return;picked[i]=j;QSTATE[curK][q[0]]=j;const bs=document.querySelectorAll('#qc'+i+' .opt');bs.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct')});if(j===q[2])sc++;else bs[j].classList.add('wrong');document.getElementById('ex'+i).classList.add('show');document.getElementById('sc').textContent='Skor: '+sc+' / '+QS.length;}
function refreshQuiz(){QSTATE[curK]={};document.querySelector('.pane').innerHTML=quizHtml();}
function shuffleQuiz(){QS=QS.slice();for(let k=QS.length-1;k>0;k--){const m=Math.floor(Math.random()*(k+1));[QS[k],QS[m]]=[QS[m],QS[k]];}refreshQuiz();}
let QS=[],ES=[];
function esHtml(){return ES.map((e,i)=>`<details class="card"><summary><b>Esai ${i+1}.</b> ${e[0]}</summary><div class="callout">${e[1]}</div></details>`).join('')}

CONTENT.s1={kicker:'Sesi 1 · Henry Ch. 1',title:'Strategy, Business Forms, and Strategic Direction',desc:'Konsep strategy, proses strategic management, vision–mission–values, theory of the business, business model, tiga level strategi, dan dua cara pandang pembuatan strategi. Perbedaan strategic management dan operational management (Henry bagian 1.2) juga dibahas. Materi pelengkap business forms, etika bisnis, corporate governance, dan risiko ditambahkan sebagai ringkasan konseptual untuk mendekati cakupan RPKPS. Catatan: modul IAI Bab I–II belum tersedia untuk verifikasi langsung.',
materi:[
C("Apa itu strategy?",P("Strategy berasal dari dunia militer. Keputusan harus rasional, yaitu menimbang untung dan biayanya, serta diarahkan ke satu tujuan yang jelas. Di dunia bisnis, tujuan strategy adalah meraih <b>competitive advantage</b> atas pesaing.")+DEF("Strategy menurut Porter","Strategy pada dasarnya soal <b>menjadi berbeda</b>. Perusahaan memilih kumpulan aktivitas yang berbeda dari pesaing, dan aktivitas itulah yang menjadi dasar competitive advantage. Perusahaan hanya bisa mengungguli pesaing jika nilai yang diberikannya sulit ditiru.")+UL(["<b>Differentiation</b>: produknya lebih dihargai pelanggan, sehingga perusahaan boleh memasang harga premium.", "<b>Cost advantage</b>: kualitasnya setara dengan pesaing, tetapi harganya lebih rendah karena aktivitasnya dijalankan lebih efisien."])),
C("Strategic management: analysis, formulation, implementation",T(["Tahap", "Isi"],[["Analysis", "Menilai kesiapan organisasi dalam memanfaatkan peluang (opportunities) dan menghadapi ancaman (threats). Tahap ini mencakup analisis lingkungan makro dan industri."], ["Formulation", "Menentukan strategi yang paling sesuai dengan kondisi organisasi dan lingkungannya (strategic fit). Biasanya ada beberapa pilihan strategi yang perlu dipertimbangkan sebelum memilih yang terbaik."], ["Implementation", "Menjalankan strategi yang telah dipilih. Strategi harus dikomunikasikan dengan jelas, didukung struktur organisasi yang sesuai, dan dipimpin oleh pemimpin yang mendorong munculnya ide-ide baru."]])+CALL("<b>Ketiga tahap ini saling berkaitan</b> (co-dependent), bukan urutan yang kaku. Saat menentukan strategi, organisasi juga perlu memikirkan cara menjalankannya.")),
C("Vision, mission, dan values",T(["Elemen", "Artinya"],[["Vision", "Gambaran kondisi masa depan yang ingin dicapai organisasi. Visi harus realistis dan didukung pemimpin agar karyawan percaya."], ["Mission", "Alasan organisasi berdiri dan menjelaskan bisnis atau kegiatan yang dijalankan organisasi."], ["Core values", "Prinsip utama yang dipegang organisasi dan tidak mudah berubah hanya demi keuntungan jangka pendek."]])+P("<b>Stakeholders</b> adalah orang atau kelompok yang dapat memengaruhi atau terkena dampak dari kegiatan organisasi.")+P("<b>Mission dan sense of mission:</b> <i>mission</i> adalah tujuan dan arah organisasi, sedangkan <i>sense of mission</i> adalah perasaan karyawan bahwa tujuan organisasi sesuai dengan nilai pribadi mereka.")+P("<b>Kritik Rumelt:</b> banyak organisasi hanya membuat visi yang terdengar bagus, seperti ingin menjadi yang terbaik, tetapi tidak menjelaskan masalah nyata dan cara mengatasinya. Contohnya, perusahaan memiliki visi yang bagus, tetapi tidak memiliki strategi yang jelas untuk mencapainya.")),
C("Theory of the business (Drucker)",P("Setiap organisasi punya asumsi tentang pasar, pelanggan, pesaing, serta kekuatan dan kelemahannya sendiri. Asumsi inilah yang memengaruhi keputusan manajer dan menentukan apa yang dianggap sebagai hasil yang berarti. Drucker menyebutnya <i>theory of the business</i>, atau secara sederhana: <b>keyakinan organisasi tentang bagaimana bisnisnya bisa menang</b>.")+UL(["Masalah muncul ketika asumsi tersebut tidak lagi sesuai dengan kenyataan.", "Contoh dari kasus Henry: IBM mengira masa depan komputer ada di mainframe, padahal personal computer sudah mulai berkembang.", "Konsep ini berlaku untuk organisasi swasta, publik, maupun nirlaba."])),
C("Business model dan bedanya dengan strategy",P("Menurut Magretta, business model adalah <b>cerita yang menjelaskan bagaimana organisasi bekerja</b>: siapa pelanggannya, apa yang mereka hargai, dan bagaimana organisasi menghasilkan uang dengan biaya yang wajar.")+VS("Business model vs business strategy",["Business model","Menjelaskan <b>bagaimana bisnis berjalan dan menghasilkan uang</b>, yaitu aktivitas-aktivitas yang bekerja bersama (value chain).",null,null],["Business strategy","Menjelaskan <b>bagaimana bisnis bersaing dan menang</b> atas pesaing, lewat posisi yang berbeda dan sulit ditiru.",null,null],"Cara mengingat: business model menjawab 'bagaimana kita menghasilkan uang?', sedangkan business strategy menjawab 'mengapa pelanggan memilih kita dan bukan pesaing?'")+CALL("Business model perlu didukung strategi bersaing yang jelas. Model juga perlu diperbarui ketika siklus produk makin pendek, pesaing datang dari arah yang tidak terduga, atau pelanggan makin sering menerima tawaran pesaing.")),
C("Tiga level strategi",P("Cara mudah membedakannya lewat tiga pertanyaan. <b>Corporate</b> bertanya 'kita main di bisnis apa saja?', <b>business</b> bertanya 'bagaimana kita menang di satu bisnis?', dan <b>functional</b> bertanya 'apa yang harus dikerjakan tiap fungsi agar strategi bisnisnya berjalan?'")+T(["Level", "Fokus", "Contoh"],[["Corporate strategy", "Menentukan industri mana yang dimasuki, termasuk lewat merger dan akuisisi, serta membagi sumber daya antar strategic business unit (SBU). Biasanya ditangani manajemen puncak.", "Sederhana: sebuah grup yang punya restoran memutuskan membuka bisnis hotel.<br>Henry: Unilever mengakuisisi Dollar Shave Club untuk masuk ke pasar pisau cukur."], ["Business strategy", "Menentukan cara bersaing di satu industri atau pasar (competitive strategy). Manajer SBU biasanya punya otonomi yang besar. Dibahas lebih lanjut di Sesi 2 dan 4.", "Sederhana: restoran milik grup itu memutuskan bersaing lewat harga murah atau lewat menu premium."], ["Functional strategy", "Keputusan di tiap fungsi (R&D, marketing, finance) untuk mendukung business strategy. Henry memasukkannya ke dalam business strategy.", "Sederhana: jika memilih menu premium, bagian marketing menyiapkan promosi premium dan bagian R&D mengembangkan resep baru."]])+P("<b>SBU</b> adalah bagian organisasi yang berfokus pada pasar tertentu untuk produk atau jasanya. Henry menilai istilah 'operational strategy' kurang tepat, dan lebih cocok disebut operational management.")),
C("Perkembangan pendekatan strategi",T(["Dekade", "Fokus", "Tokoh atau ide"], [["1960-an", "Corporate planning: rencana jangka panjang berbasis budget (sekitar 5 tahun) untuk pasar yang stabil", "Sistem budgetary control"], ["1970-an", "Diversification untuk menambah market share", "Ansoff: growth vector matrix"], ["1980-an", "Analisis competitive forces, prinsip 'stick to the knitting', dan strategi emergent", "Porter; Peters dan Waterman; Mintzberg"], ["1990-an", "Resource-based view (RBV): sumber daya dan core competences, disertai downsizing dan outsourcing", "Grant, Kay, Prahalad dan Hamel"], ["Kemudian", "Hypercompetition: perusahaan harus terus berinovasi", "D'Aveni"]])+CALL("<b>Porter vs RBV.</b> Menurut Porter, profit ditentukan oleh struktur industri dan posisi perusahaan. Menurut RBV, profit ditentukan oleh sumber daya dan kapabilitas perusahaan. Amit dan Schoemaker melihat RBV sebagai pelengkap analisis industri.")),
C("Dua cara pandang: rationalist vs learning school",T(["", "Rationalist (design) school", "Learning school"], [["Intinya", "Strategi disusun lebih dulu lewat analisis, baru dijalankan.", "Strategi terbentuk sambil berjalan, lewat belajar dari pengalaman."], ["Caranya", "Cocokkan strengths dan weaknesses dengan opportunities dan threats (SWOT), buat beberapa pilihan strategi, lalu pilih yang terbaik.", "Maju dalam langkah kecil dari kondisi sekarang dan menyesuaikan diri (Lindblom menyebutnya 'muddling through')."], ["Siapa yang menentukan", "Manajemen puncak, berdasarkan hasil analisis.", "Banyak pihak di dalam organisasi, karena organisasi dilihat sebagai koalisi dengan kepentingan yang berbeda (Cyert dan March)."], ["Tokoh", "Andrews, Ansoff", "Lindblom, Cyert dan March, Mintzberg"]])+DEF("Intended, realized, unrealized, emergent (Mintzberg dan Waters)","<b>Intended</b> adalah strategi yang dipilih dengan sengaja. <b>Realized</b> adalah strategi yang benar-benar dijalankan. <b>Unrealized</b> adalah strategi intended yang tidak dijalankan karena kondisi berubah. <b>Emergent</b> adalah strategi yang muncul dari pengalaman dan pembelajaran manajer, lalu akhirnya menjadi realized.")+CALL("<b>Contoh (Honda):</b> Mintzberg mengakui bahwa strategi yang viable memiliki unsur <b>deliberate</b> dan <b>emergent</b>. Kaum rationalist melihat dominasi Honda di pasar motor AS sebagai strategi yang disengaja, sedangkan Mintzberg melihatnya sebagai strategi emergent.")),
C("Kerangka strategic management (Figure 1.3)",'<div class="tags flow"><span>Values</span><span>Goals</span><span>Resources and capabilities + structure and processes</span><span>Strategy</span></div>'+UL(["<b>Strategy</b> menjadi penghubung (lynchpin) antara organisasi (strengths dan weaknesses) dan lingkungan (opportunities dan threats). Lingkungan terdiri dari general environment dan competitive environment.", "<b>Stakeholders</b> berada di dalam maupun di luar organisasi, dan hubungannya dengan strategy berjalan dua arah.", "Panah dua arah memberi feedback: intended strategy bisa tidak berjalan jika kondisi pasar berubah."])),
C("Kasus singkat: Intel dan memory chip",UL(["Intel tumbuh besar lewat memory chip. Pada 1978–1988, pangsa pasar perusahaan Jepang naik dari 30% menjadi 60% dengan chip yang murah dan berkualitas tinggi.", "Intel tetap yakin masa depannya ada di memory chip dan berharap bisa menarik harga premium lewat chip yang lebih baik.", "Sumber daya dan kapabilitas Intel masih terpusat di memory chip, padahal microprocessor untuk personal computer mulai tumbuh.", "Pelajarannya: <i>theory of the business</i> yang lama tidak lagi sesuai dengan kenyataan. Menurut Miller (Icarus paradox), kapabilitas yang membuat perusahaan sukses juga bisa menjadi penyebab kegagalannya."]),"Kasus Henry"),
C("Strategic management vs operational management",P("Menurut Henry, jika strategi dipahami sebagai hubungan antara organisasi dan lingkungannya, strategi bisa dipisahkan dari <b>operational management</b>, seperti motivasi karyawan, akuntansi, dan inventory control. Aspek-aspek itu memang memengaruhi strategi, tetapi sendirinya bukan strategi.")+T(["", "Strategic management", "Operational management"],[["Inti", "Mengerjakan hal-hal yang tidak bisa atau tidak mudah dikerjakan pesaing, dengan fokus pada hubungan organisasi dan lingkungannya", "Mengerjakan aktivitas yang serupa dengan lebih baik dan lebih efisien daripada pesaing"], ["Mudah ditiru?", "Sulit ditiru", "Mudah ditiru, karena pesaing bisa menyalin best practice industri"], ["Alat atau contoh", "Teknik analisis untuk memahami dan memengaruhi posisi di pasar", "Total quality management, benchmarking, outsourcing, dan business process re-engineering"]])+CALL("<b>Mengapa bukan strategi?</b> Banyak perusahaan dalam satu industri punya SDM yang baik, akuntansi yang efektif, dan teknologi yang sesuai, tetapi pesaing bisa menirunya. Keberhasilan BMW dan Honda berasal dari mengenali distinctive capabilities masing-masing, bukan dari menyalin best practice pesaing.")),
C("Kasus tugas: Netflix dan Blockbuster",P("Pada tahun 2000, Netflix yang saat itu masih merugi menawarkan diri untuk dijual ke Blockbuster seharga sekitar $50 juta. Tawaran itu ditolak karena Blockbuster merasa jauh lebih dominan, dengan lebih dari 9.000 toko di AS dan ratusan toko di Inggris. Blockbuster akhirnya bangkrut (Chapter 11 pada 2010, lalu tutup total pada 2013).")+T(["Konsep Sesi 1", "Penerapan pada kasus"],[["Theory of the business (Drucker)", "Asumsi tersirat Blockbuster adalah jaringan toko yang besar sudah cukup untuk menang, karena film bisa langsung disewa di tempat. Asumsi ini tidak diuji ulang ketika Netflix menawarkan langganan lewat pos."], ["Icarus paradox", "Keunggulan yang dulu membuat Blockbuster sukses, yaitu dominasi toko, justru menghambatnya beradaptasi."], ["Business model (Magretta)", "Pelanggan Netflix berlangganan, awalnya lewat pos (lebih lambat), lalu lewat streaming (2007). Layanan ini kemudian tersedia di Xbox, PS3, dan smart TV (2010), dan sejak sekitar 2013 Netflix membuat konten sendiri. Loyalitas pelanggan tumbuh lewat word of mouth."]])+CALL("Pelajaran dari kasus ini: asumsi yang dulu benar bisa kedaluwarsa tanpa disadari. Konsep <i>innovator's dilemma</i> dan <i>disruptive innovation</i> dibahas di Sesi 4."),"Kasus tugas dosen"),
C("Business forms: memilih bentuk usaha",P("<b>Business form</b> adalah bentuk hukum atau struktur kepemilikan yang digunakan untuk menjalankan kegiatan usaha. Pilihan bentuk usaha memengaruhi siapa pemiliknya, siapa yang mengambil keputusan, bagaimana laba dibagikan, kewajiban hukum, akses pendanaan, dan keberlanjutan usaha. Bentuk yang tepat bergantung pada skala, tujuan, kebutuhan modal, serta tingkat risiko bisnis.")+T(["Bentuk usaha", "Ciri umum", "Hal yang perlu dipertimbangkan"],[["Usaha perseorangan", "Dimiliki dan dikelola satu orang; relatif sederhana untuk dimulai.", "Keputusan cepat, tetapi modal dan keberlanjutan sangat bergantung pada pemilik. Tanggung jawab pemilik dapat melekat secara pribadi sesuai bentuk dan aturan yang berlaku."], ["Persekutuan / firma", "Dijalankan oleh dua orang atau lebih yang bekerja sama sebagai sekutu.", "Perlu kesepakatan peran, kontribusi modal, pembagian laba, dan tanggung jawab. Dalam firma, sekutu umumnya menanggung tanggung jawab pribadi sesuai ketentuan hukum."], ["Commanditaire vennootschap (CV)", "Ada sekutu aktif yang mengelola usaha dan sekutu pasif yang menanamkan modal.", "Peran dan tanggung jawab sekutu berbeda; perlu pengaturan yang jelas dalam perjanjian pendirian."], ["Perseroan Terbatas (PT)", "Badan hukum dengan modal yang terbagi dalam saham; kepemilikan dan pengelolaan dapat dipisahkan.", "Struktur lebih formal, mendukung kepemilikan saham dan pengembangan modal; wajib memenuhi ketentuan hukum, administrasi, dan pelaporan."], ["Koperasi", "Badan usaha beranggotakan orang-seorang atau badan hukum koperasi yang berlandaskan prinsip koperasi.", "Berorientasi pada manfaat anggota dan pengelolaan demokratis; keputusan perlu mempertimbangkan kepentingan anggota."], ["BUMN / badan usaha milik negara", "Bentuk badan usaha dengan kepemilikan negara sesuai ketentuan perundang-undangan.", "Memiliki tujuan usaha sekaligus dapat menjalankan mandat kepentingan publik; tata kelola dan akuntabilitasnya perlu memperhatikan pemangku kepentingan yang luas."]])+CALL("Contoh pengambilan keputusan: usaha kecil yang dimiliki satu orang mungkin memulai dari bentuk sederhana. Jika membutuhkan investor, pemisahan kepemilikan, dan ekspansi, pemilik dapat mempertimbangkan bentuk badan usaha yang sesuai. Pilihan akhir harus diperiksa berdasarkan hukum Indonesia yang berlaku dan kebutuhan nyata usaha." )+CALL("Catatan sumber: bagian ini merupakan ringkasan konseptual tambahan, bukan kutipan atau verifikasi langsung dari Modul IAI Bab I–II karena modul tersebut belum diunggah.")),
C("Business ethics: etika dalam keputusan bisnis",P("<b>Etika bisnis</b> adalah prinsip untuk menilai apakah keputusan dan tindakan organisasi pantas, adil, jujur, dan bertanggung jawab—bukan hanya apakah tindakan itu legal atau menguntungkan. Kepatuhan hukum adalah batas minimum; keputusan yang legal pun masih dapat dipertanyakan secara etis jika merugikan pihak lain atau menyembunyikan informasi penting." )+T(["Pertanyaan etis", "Cara menerapkannya"],[["Apakah tindakan ini jujur?", "Apakah informasi kepada pelanggan, investor, karyawan, dan regulator akurat serta tidak menyesatkan?"], ["Siapa yang terdampak?", "Identifikasi pemangku kepentingan dan manfaat atau kerugian yang mungkin mereka alami."], ["Apakah prosesnya adil?", "Periksa konflik kepentingan, perlakuan tidak setara, penyalahgunaan wewenang, dan kesempatan pihak terkait untuk menyampaikan keberatan."], ["Apakah keputusan dapat dipertanggungjawabkan?", "Tanyakan apakah alasan keputusan bisa dijelaskan secara terbuka kepada pihak yang terdampak dan apakah keputusan itu tetap layak bila diketahui publik."]])+DEF("Contoh konflik kepentingan","Manajer memilih pemasok milik keluarganya tanpa mengungkap hubungan tersebut, padahal pemasok lain menawarkan harga dan kualitas yang lebih baik. Masalahnya bukan sekadar hasil pembelian, tetapi juga transparansi dan potensi keputusan yang tidak objektif.")+P("<b>Praktik pendukung:</b> kode etik, pelatihan, kanal pelaporan pelanggaran (<i>whistleblowing</i>), perlindungan pelapor, proses investigasi yang adil, dan konsekuensi yang konsisten. Budaya etis bergantung pada contoh dari pimpinan, bukan hanya dokumen kebijakan.")+CALL("Untuk menganalisis kasus, jelaskan fakta, pihak yang terdampak, pilihan tindakan, konsekuensi, prinsip yang relevan, lalu berikan rekomendasi dan alasan yang dapat dipertanggungjawabkan.")),
C("Corporate governance: tata kelola perusahaan",P("<b>Corporate governance</b> adalah sistem yang mengarahkan, mengawasi, dan mempertanggungjawabkan pengelolaan perusahaan. Tata kelola membantu memastikan bahwa pihak yang diberi kewenangan mengelola perusahaan bertindak sesuai tujuan perusahaan, ketentuan hukum, dan kepentingan pemangku kepentingan yang relevan." )+T(["Prinsip", "Makna praktis"],[["Transparency (transparansi)", "Informasi penting disampaikan secara akurat, jelas, dan tepat waktu."], ["Accountability (akuntabilitas)", "Tugas, wewenang, target, dan tanggung jawab setiap pihak ditetapkan dan dapat dievaluasi."], ["Responsibility (tanggung jawab)", "Perusahaan mematuhi hukum dan menjalankan tanggung jawabnya terhadap masyarakat serta lingkungan sesuai konteks dan aturan yang berlaku."], ["Independency (independensi)", "Keputusan dan pengawasan dilakukan secara objektif, bebas dari dominasi atau tekanan yang tidak semestinya."], ["Fairness (kewajaran dan kesetaraan)", "Pemegang saham dan pemangku kepentingan yang relevan diperlakukan secara wajar sesuai hak dan kewajibannya."]])+P("<b>Pembagian peran:</b> pemegang saham memiliki hak kepemilikan; dewan komisaris menjalankan fungsi pengawasan dan pemberian nasihat dalam struktur PT Indonesia; direksi mengurus perusahaan; komite audit dan auditor mendukung pengawasan sesuai mandatnya. Rincian peran bergantung pada bentuk badan usaha dan aturan yang berlaku.")+DEF("Mengapa governance penting?","Tata kelola mengurangi risiko penyalahgunaan wewenang, memperjelas siapa yang bertanggung jawab, memperkuat kualitas pelaporan, dan membantu membangun kepercayaan investor serta pemangku kepentingan.")+CALL("Contoh: bila direksi memiliki hubungan pribadi dengan calon pemasok, proses persetujuan, pengungkapan konflik kepentingan, dokumentasi, dan pengawasan independen membantu memastikan keputusan tidak dibuat semata-mata demi kepentingan pribadi." )+CALL("Catatan sumber: bagian ini adalah ringkasan konseptual tambahan. Kesesuaiannya dengan rincian spesifik Modul IAI Bab I–II masih perlu dicocokkan setelah modul tersedia.")),
C("Risk: mengenali dan mengelola risiko",P("<b>Risiko</b> adalah kemungkinan terjadinya suatu peristiwa yang memengaruhi pencapaian tujuan organisasi. Risiko tidak selalu berarti kerugian; beberapa ketidakpastian juga dapat menciptakan peluang. Pengelolaan risiko membantu organisasi mengenali apa yang dapat menghambat strategi, menentukan prioritas, dan memilih respons yang sesuai." )+T(["Jenis risiko", "Contoh sederhana"],[["Strategis", "Produk utama kehilangan pelanggan karena perubahan teknologi atau munculnya pesaing baru."], ["Operasional", "Gangguan proses, kesalahan manusia, kegagalan sistem, atau pemasok terlambat mengirim barang."], ["Keuangan", "Arus kas tidak cukup, pelanggan gagal membayar, suku bunga berubah, atau kurs mata uang bergerak merugikan."], ["Kepatuhan dan hukum", "Pelanggaran izin, kontrak, aturan pajak, ketenagakerjaan, atau perlindungan data."], ["Reputasi", "Pelanggan kehilangan kepercayaan setelah layanan buruk, informasi menyesatkan, atau skandal etika."], ["Keselamatan, sosial, dan lingkungan", "Kecelakaan kerja, pencemaran, atau dampak negatif terhadap masyarakat." ]])+P("<b>Langkah dasar manajemen risiko:</b>")+UL(["<b>1. Tetapkan tujuan dan konteks.</b> Tentukan tujuan yang ingin dicapai dan kondisi yang relevan.","<b>2. Identifikasi risiko.</b> Catat peristiwa yang mungkin terjadi, penyebabnya, dan dampaknya.","<b>3. Analisis dan evaluasi.</b> Perkirakan kemungkinan dan besarnya dampak; prioritaskan risiko yang paling penting.","<b>4. Pilih respons.</b> Hindari aktivitas berisiko, kurangi kemungkinan atau dampak, alihkan atau bagikan sebagian risiko (misalnya melalui asuransi), atau terima risiko secara sadar dalam batas yang disetujui.","<b>5. Tetapkan pemilik risiko dan kontrol.</b> Tentukan siapa yang bertanggung jawab, tindakan pencegahan, indikator pemantauan, serta rencana jika risiko terjadi.","<b>6. Pantau dan komunikasikan.</b> Perbarui penilaian saat kondisi berubah dan laporkan risiko penting kepada pihak yang berwenang."])+DEF("Contoh matriks risiko","Risiko dengan kemungkinan tinggi dan dampak besar biasanya menjadi prioritas penanganan. Namun, skor matriks hanya alat bantu: organisasi tetap perlu melihat ketergantungan antar-risiko, kecepatan dampak, dan toleransi risikonya.")+CALL("Risiko harus dihubungkan dengan strategi. Misalnya, ekspansi ke pasar luar negeri bisa membuka peluang pertumbuhan, tetapi juga menambah risiko kurs, kepatuhan, logistik, dan perbedaan budaya." )+CALL("Catatan sumber: bagian ini adalah ringkasan konseptual tambahan, bukan ringkasan terverifikasi dari Modul IAI Bab I–II."))
].join('')};
CONTENT.s2={kicker:'Sesi 2 · Henry Ch. 2–3',title:'Macro-environment dan Industry Analysis',desc:'Scanning, monitoring, forecasting, scenario planning, PEST/PESTLE, pengantar SWOT, Porter\'s Five Forces, value net, industry life cycle, strategic groups, hypercompetition, dan disruptive innovation.',
materi:[
C("Macro-environment vs competitive environment",T(["", "Isi", "Dampak"],[["Macro-environment (general environment)", "Faktor political, economic, social, dan technological", "Perubahannya berdampak melampaui satu perusahaan atau satu industri"], ["Competitive environment", "Industri dan pasar tempat organisasi bersaing", "Perubahannya paling langsung dan paling cepat memengaruhi organisasi"]])+P("Meskipun dampaknya tidak sedekat industri, macro-environment tetap harus dipantau karena sering memberi <b>weak signals</b> (sinyal lemah) tentang perubahan yang nantinya akan menyentuh competitive environment.")),
C("Scanning, monitoring, forecasting",T(["Aktivitas", "Artinya", "Beda utama"], [["Scanning", "Memindai lingkungan secara luas untuk menemukan weak signals (seperti kuas lebar)", "Luas, sebelum tahu mana yang penting"], ["Monitoring", "Melacak sinyal tersebut sampai berkembang menjadi pola yang jelas (seperti kuas halus)", "Lebih sempit, mengikuti sinyal tertentu"], ["Forecasting", "Membuat prakiraan tren sebelum menjadi ancaman besar, sehingga strategi bisa disiapkan lebih awal", "Memperkirakan arah tren"], ["Scenario planning", "Membayangkan beberapa masa depan yang mungkin dalam bentuk cerita alternatif (langkahnya di kartu berikut)", "Hasilnya beberapa cerita, bukan satu prediksi. Cocok untuk structural uncertainties"]])+DEF("Tiga jenis ketidakpastian (van der Heijden)","<b>Risks</b> adalah kejadian yang mirip dengan masa lalu sehingga probabilitasnya bisa dihitung. <b>Structural uncertainties</b> adalah kejadian yang cukup unik sehingga probabilitasnya tidak bisa dihitung. <b>Unknowables</b> adalah kejadian yang bahkan tidak bisa dibayangkan.")+CALL("Risks bisa ditangani manajer secara biasa, sedangkan unknowables hanya bisa direspons setelah terjadi. <b>Structural uncertainties</b> adalah wilayah yang cocok untuk scenario planning.")),
C("Scenario planning",P("Shell sudah memakai scenario planning sejak 1970-an. Hasilnya berupa cerita tentang beberapa alternatif masa depan, bukan satu prediksi. Sembilan langkahnya bisa dikelompokkan menjadi empat tahap: <b>persiapan</b> (langkah 1–2), <b>mencari bahan</b> (3–4), <b>menyusun skenario</b> (5–7), dan <b>memperdalam</b> (8–9).")+T(["Langkah", "Yang dikerjakan"], [["1. Define the scope", "Tentukan batas analisis: berapa tahun ke depan, dan untuk produk, pasar, atau wilayah mana."], ["2. Identify major stakeholders", "Daftar pihak yang memengaruhi atau terpengaruh, beserta kepentingannya."], ["3. Identify basic trends", "Catat tren PEST dan industri yang paling berdampak, lalu nilai apakah positif, negatif, atau belum pasti."], ["4. Identify key uncertainties", "Pilih beberapa kejadian tidak pasti yang paling besar pengaruhnya. Batasi jumlahnya agar tidak rumit."], ["5. Construct initial scenario themes", "Kelompokkan elemen positif ke satu skenario dan elemen negatif ke skenario lain."], ["6. Check consistency and plausibility", "Cek apakah skenarionya masuk akal. Misalnya, full employment dan inflasi nol tidak mungkin terjadi bersamaan."], ["7. Develop learning scenarios", "Beri nama tiap skenario agar mudah diingat. Tujuannya untuk belajar, belum untuk memutuskan."], ["8. Identify research needs", "Cari tahu lebih dalam hal-hal yang belum dipahami."], ["9. Develop quantitative models", "Setelah riset selesai, ubah skenario menjadi angka dalam model kuantitatif."]])),
C("PEST / PESTLE analysis",T(["Faktor", "Contoh isi"],[["Political", "Kebijakan pemerintah, stabilitas pemerintahan, pajak, dan regulasi (aspek hukum masuk di sini)"], ["Economic", "Suku bunga, disposable income, pengangguran, inflasi, GDP, dan kurs"], ["Social", "Demografi (misalnya populasi yang menua) dan budaya"], ["Technological", "Rate of obsolescence, yaitu kecepatan teknologi baru menggantikan yang lama. Inovasi dapat menciptakan industri baru dan mengubah cara bersaing"]])+P("PESTLE menambahkan <b>Legal</b> dan <b>Environmental</b>. Henry memasukkan legal ke political dan environmental ke social, jadi yang penting bukan jumlah hurufnya, tetapi cara memakainya.")+CALL("<b>Keterbatasan:</b> PEST bukan 'shopping list'. Setiap faktor harus ditarik implikasinya bagi industri. Perubahan yang cepat dan sulit diprediksi juga membatasi manfaatnya. Porter menilai industri adalah arena yang paling penting, tetapi macro-environment tetap perlu dipantau.")+CALL("RPKPS Sesi 2 memakai istilah <b>PESTEL</b> (legal dan regulatory). Saat mengerjakan tugas, bahas legal dan environmental sebagai faktor yang terpisah.")),
C("Pengantar SWOT",T(["", "Dari mana", "Dikendalikan?"],[["Strengths dan Weaknesses", "Lingkungan internal (sumber daya dan kapabilitas)", "Ya, perusahaan bisa mengendalikannya"], ["Opportunities dan Threats", "Lingkungan eksternal (scenario planning dan PEST membantu menemukannya)", "Kendali terbatas"]])+P("SWOT dipakai untuk menilai apakah strategi yang sekarang masih relevan dengan perubahan kondisi industri. Di level macro-environment, SWOT lebih sulit dipakai karena kejadiannya tidak bisa diprediksi. Henry memandang macro-environment dan industry analysis sebagai satu kontinum.")),
C("Porter's Five Forces",P("Five Forces dianalisis dari sudut pandang <b>incumbent</b>, yaitu perusahaan yang sudah ada di industri, dan paling cocok dipakai di level SBU. <b>Industry</b> adalah kelompok organisasi yang membuat produk atau jasa yang serupa.")+T(["Force", "Kapan semakin kuat"], [["Threat of new entrants", "Bila barriers to entry rendah. Barriers utamanya adalah economies of scale, capital requirement, product differentiation, access to distribution channels, dan cost advantages independent of size. Ancaman juga naik bila pesaing lama tidak akan melakukan retaliation, atau bila profit industri jauh di atas cost of capital."], ["Bargaining power of buyers", "Bila pembeli terkonsentrasi dan membeli dalam volume besar, atau bila produknya standar sehingga pembeli mudah berpindah. Contoh: Wal-Mart membeli dalam volume besar sehingga bisa menekan harga pemasok."], ["Bargaining power of suppliers", "Kebalikan dari kekuatan buyers: bila pemasok terkonsentrasi, substitusinya sedikit, produknya terdiferensiasi dan switching cost tinggi, atau ada ancaman forward integration. Contoh: Ryanair sangat bergantung pada Boeing, sehingga Boeing punya posisi tawar yang kuat."], ["Threat of substitutes", "Bila price-performance ratio substitusi menarik. Substitusi menjadi <b>batas atas harga</b> (ceiling) yang bisa dikenakan industri."], ["Rivalry among competitors", "Bila pesaing banyak atau kekuatannya seimbang, pertumbuhan industri lambat, dan fixed costs tinggi (yang mendorong perang harga)."]])),
C("Keterbatasan Five Forces dan Value Net",UL(["<b>Asumsi zero-sum</b> (menang-kalah): seolah-olah keuntungan satu pemain pasti berasal dari kerugian pemain lain.", "<b>Analisis yang statis:</b> mengasumsikan pasar relatif stabil dan kurang menjelaskan interaksi serta langkah-langkah pesaing."])+DEF("Value net sebagai pelengkap (Brandenburger dan Nalebuff)","Value net memakai <b>game theory</b> dan menambahkan <b>complementors</b> sebagai kekuatan keenam, yaitu pihak yang membuat produkmu lebih bernilai saat dipakai bersama produk mereka. Dengan pandangan ini, bisnis bisa menjadi permainan <b>win–win</b> (semua pihak untung), bukan hanya menang-kalah.")),
C("Industry life cycle",T(["Tahap", "Ciri utama"],[["Introduction", "Penjualan tumbuh lambat dan biaya tinggi karena produksi masih terbatas. R&D besar, harga premium, ada first-mover advantage, tetapi profit masih negatif."], ["Growth", "Penjualan naik cepat dan economies of scale mulai terasa. Profit naik sehingga entrant baru masuk. Perusahaan berebut brand dan mengejar repeat purchase."], ["Maturity", "Pertumbuhan melambat dan pasar jenuh. Persaingan bergeser ke biaya dan efisiensi, dan rivalry makin intens (apalagi bila ada exit barriers). Produk bisa diremajakan lewat inovasi atau pasar baru."], ["Decline", "Penjualan dan profit turun, loyalitas pelanggan pindah ke teknologi baru, terjadi persaingan harga, dan perusahaan mulai keluar atau melakukan konsolidasi."]])+CALL("Industry life cycle adalah versi sisi supply dari product life cycle. Panjang tiap tahap berbeda antar industri, dan strategic group yang berbeda bisa berada di tahap yang berbeda.")),
C("Strategic groups dan mobility barriers",P("Posisi tiap perusahaan di dalam industri digambarkan dalam <b>strategic map</b> (contoh Henry: harga vs product range di industri mobil).")+VS("Strategic group vs mobility barriers",["Strategic group","Kumpulan perusahaan dalam satu industri yang bersaing dengan posisi strategis yang serupa.",null,null],["Mobility barriers","Faktor yang menghambat perusahaan berpindah dari satu group ke group lain. Pada dasarnya ini adalah batasan untuk mereplikasi atau meniru posisi strategis.",null,null],"Bedakan dari <i>barriers to entry</i>: barriers to entry menghambat <b>masuk ke industri</b>, sedangkan mobility barriers menghambat <b>pindah antar group</b> di industri yang sama.")),
C("Hypercompetition dan disruptive innovation",T(["", "Inti", "Contoh"], [["Hypercompetition (D'Aveni)", "Persaingan dengan gerakan yang intens dan cepat. Pesaing harus cepat membangun keunggulan dan sekaligus menggerus keunggulan rival.", "Apple yang terus meluncurkan produk baru dan mengakuisisi calon ancaman sejak dini."], ["Disruptive innovation (Christensen)", "Perusahaan kecil bisa menantang incumbent. Incumbent sibuk melayani pelanggan high-end yang paling menguntungkan dan mengabaikan segmen yang kurang menguntungkan. Entrant masuk lewat segmen itu dengan fungsi yang sesuai dan harga lebih rendah, lalu naik ke upmarket.", "Streaming video menggeser penyewaan DVD."]])),
C("Kasus tugas: PESTLE dan weak signals pada Blockbuster","<h3>Fakta kasus</h3>"+UL(["Tahun 2000 Netflix masih kecil dan merugi. Ia menawarkan diri dijual ke Blockbuster seharga sekitar $50 juta, tetapi ditolak karena Blockbuster merasa jauh lebih dominan.", "Netflix mulai streaming pada 2007, masuk ke Xbox, PS3, dan smart TV pada 2010, dan membuat konten sendiri sejak sekitar 2013. Netflix tumbuh lewat langganan dan word of mouth, sedangkan lisensi konten dari studio makin sulit dan mahal."])+"<h3>Analisis: PESTLE</h3>"+P("Tabel memetakan sinyal lemah dari kasus ke faktor PESTLE. Kolom Dasar membedakan mana yang tertulis di kasus dan mana yang merupakan inferensi untuk latihan.")+T(["Faktor", "Sinyal lemah", "Dasar"], [["Technological", "Netflix mulai streaming (2007), lalu masuk ke Xbox, PS3, dan smart TV (2010)", "Tertulis di kasus"], ["Economic", "Langganan bulanan menggantikan sewa per film, dan lisensi konten dari studio makin sulit dan mahal", "Tertulis di kasus (dampak ke Blockbuster: inferensi)"], ["Social", "Netflix tumbuh lewat word of mouth dan loyalitas pelanggan, sementara kebiasaan menonton tanpa ke toko makin menguat", "Word of mouth tertulis; perubahan kebiasaan inferensi"], ["Legal", "Hak lisensi konten dari studio menentukan siapa yang bisa menyediakan film", "Inferensi dari isu lisensi"], ["Political dan Environmental", "Kasus tidak memberi sinyal yang jelas, jadi boleh dicatat tidak signifikan", "Tidak ada di kasus"]])+"<h3>Kesimpulan</h3>"+CALL("Pada tahun 2000 sinyalnya masih lemah: Netflix kecil dan merugi, tetapi modelnya mulai menarik loyalitas pelanggan. Blockbuster menolak tawaran Netflix dan menganggapnya tidak relevan, sehingga scanning dan monitoring tidak berjalan."),"Kasus tugas dosen"),
C("Kasus tugas: Ryanair (Five Forces dan ketergantungan pada Boeing)","<h3>Pertanyaan 1: Five Forces industri low-cost airline</h3>"+P("Penilaian High, Medium, dan Low di bawah adalah saran untuk latihan berdasarkan fakta kasus, bukan kunci dari dosen. Sudut pandangnya adalah Ryanair sebagai incumbent.")+T(["Force", "Fakta kasus", "Analisis (saran penilaian)"], [["Threat of new entrants", "Open Skies menderegulasi penerbangan Eropa. Ryanair memakai satu jenis pesawat, bandara sekunder, dan load factor tinggi untuk menekan biaya", "<b>Medium</b>. Deregulasi mempermudah masuk, tetapi biaya rendah dan skala incumbent menyulitkan pendatang baru bersaing harga."], ["Bargaining power of buyers", "Daya tarik utamanya adalah tiket murah, dan pelanggan bisa memilih easyJet yang imagenya lebih ramah", "<b>High</b>. Produknya relatif standar dan switching cost rendah (inferensi)."], ["Bargaining power of suppliers", "Ryanair sangat bergantung pada Boeing, dan keterlambatan 737 MAX memengaruhi kapasitas serta pertumbuhannya", "<b>High</b>. Pemasok pesawat sedikit dan sulit digantikan."], ["Threat of substitutes", "Kereta, bus/coach, dan ferry", "<b>Medium</b>. Kuat di jarak dekat dan rute darat, tetapi lemah untuk rute jauh atau seberang laut (inferensi)."], ["Competitive rivalry", "Bersaing dengan easyJet dan maskapai lain, dengan fixed cost yang tinggi", "<b>High</b>. Fixed cost yang tinggi mendorong perang harga (lihat kartu Five Forces)."]])+"<h3>Pertanyaan 2: ketergantungan pada satu pemasok (Boeing)</h3>"+T(["", "Isi dan dasar"], [["Keuntungan", "Satu jenis pesawat (Boeing 737-800) memudahkan maintenance, training, dan persediaan suku cadang (tertulis di kasus). Pembelian dalam jumlah besar bisa memperkuat posisi tawar Ryanair (inferensi)."], ["Risiko", "Kapasitas dan pertumbuhan bergantung pada jadwal pengiriman Boeing, sehingga keterlambatan 737 MAX berdampak langsung (tertulis di kasus). Posisi tawar pemasok tinggi dan tidak ada pemasok alternatif yang mudah menggantikan (inferensi, terkait force supplier)."]])+"<h3>Kesimpulan</h3>"+CALL("Industri low-cost airline kurang menarik secara rata-rata karena banyak force yang kuat. Namun Ryanair tetap untung karena posisinya (cost leadership, dibahas di Sesi 4), sehingga daya tarik industri dan kinerja satu perusahaan tidak selalu sama. Ketergantungan pada Boeing adalah contoh bargaining power of suppliers yang tinggi."),"Kasus tugas dosen")
].join('')};
CONTENT.s3={kicker:'Sesi 3 · Henry Ch. 4–5',title:'Value Creation, Resources, Capabilities, and Competitiveness',desc:'Differential firm performance, value chain dan linkages, SWOT dan TOWS, performance (shareholder vs stakeholder), balanced scorecard, benchmarking, resource-based view, VRIO, make-or-buy, knowledge-based view, dan dynamic capabilities.',
materi:[
C("Mengapa kinerja perusahaan berbeda?",P("<b>Differential firm performance</b> adalah kondisi ketika perusahaan dengan sumber daya yang mirip di industri yang sama menghasilkan profit yang berbeda. Analisis industri saja dianggap kurang mampu menjelaskannya.")+DEF("Contoh sederhana","Dua restoran berada di jalan yang sama, dengan harga dan modal yang mirip. Satu selalu ramai dan untung, satu sepi. Penyebabnya mungkin bukan jalannya (industri), melainkan keahlian koki, sistem dapur, dan layanan yang dimiliki restoran pertama (kapabilitas internal).")+T(["", "Positioning school (Porter)", "Resource-based view / Rumelt"],[["Arah", "<i>Outside-in</i>: mulai dari struktur industri", "<i>Inside-out</i>: mulai dari lingkungan internal"], ["Penentu kinerja", "Daya tarik dan profitabilitas industri (Five Forces). Perusahaan memilih posisi di industri.", "Faktor yang melekat pada perusahaan: sumber daya dan kapabilitas."], ["Akibatnya", "Pilihan strategi untuk bersaing terbatas jumlahnya.", "Kapabilitas internal menentukan pilihan strategi, bahkan bisa menciptakan pasar baru (misalnya Apple dan Toyota hybrid)."]])),
C("Value chain analysis (Porter)",P("Value chain analysis menilai aktivitas-aktivitas yang membentuk sebuah produk atau jasa, untuk melihat <b>seberapa besar nilai yang ditambahkan</b> oleh tiap aktivitas. Porter membuatnya untuk menilai sumber daya internal, dan paling cocok dianalisis di level SBU. Tiga kartu berikutnya (value chain, primary dan support activities, linkages) memakai satu contoh yang sama: <b>sebuah toko roti</b>.")+UL(["<b>Margin</b> adalah total revenue (harga × kuantitas) dikurangi total cost. Semakin besar selisihnya, semakin besar nilai yang ditambahkan. Contoh toko roti: roti dijual Rp10.000 dengan total biaya Rp7.000, maka margin-nya Rp3.000.", "Organisasi juga bisa menambah nilai lewat kerja sama dengan supplier, customer, dan distributor. Ini disebut <b>value chain system</b>: value chain organisasi berinteraksi dengan value chain pihak lain, termasuk upstream value dari supplier.", "Setiap karyawan terlibat dalam suatu aktivitas, jadi strategi harus dikomunikasikan agar semua paham kaitannya dengan aktivitas lain."])),
C("Primary dan support activities",T(["Jenis", "Aktivitas", "Isi singkat"],[["Primary (langsung membuat dan menjual produk)", "Inbound logistics", "Menerima, menyimpan, dan membagikan input (tepung dan mentega masuk gudang toko roti)"], ["", "Operations", "Mengubah input menjadi produk atau jasa (adonan dipanggang menjadi roti)"], ["", "Outbound logistics", "Menyimpan dan mengirim produk jadi ke pelanggan (roti dikemas dan diantar)"], ["", "Marketing and sales", "Membuat pelanggan tahu dan mau membeli (promo dan etalase toko)"], ["", "Service", "Dukungan setelah penjualan, seperti instalasi, pelatihan, dan perbaikan, untuk menjaga atau menambah nilai produk (menerima keluhan dan menukar roti yang bermasalah)"], ["Support (memastikan primary berjalan efisien dan efektif)", "Procurement", "Pembelian input (memilih pemasok tepung)"], ["", "Technology development", "Pengembangan teknologi dan R&D (oven dan resep baru)"], ["", "Human resource management", "Perekrutan, pelatihan, dan pengelolaan SDM (melatih pembuat roti)"], ["", "Firm infrastructure", "Mendukung seluruh value chain (misalnya manajemen umum dan keuangan; pembukuan toko)"]])+CALL("Tiga support activity pertama bisa dikaitkan dengan primary activity tertentu, sedangkan <b>firm infrastructure</b> mendukung seluruh value chain. Tiap kategori punya tiga jenis aktivitas yang memengaruhi competitive advantage: <b>direct</b> (menciptakan nilai langsung bagi pembeli, misalnya desain produk), <b>indirect</b> (memungkinkan aktivitas direct berjalan, misalnya perawatan mesin), dan <b>quality assurance</b> (menjaga mutu aktivitas lain).")),
C("Linkages dalam value chain",P("<b>Linkages</b> adalah hubungan antara cara satu aktivitas dijalankan dengan biaya atau kinerja aktivitas lain. Artinya, value chain bukan rangkaian aktivitas yang berdiri sendiri, melainkan <b>sistem aktivitas yang saling bergantung</b>.")+DEF("Contoh toko roti","Tepung yang lebih berkualitas membuat biaya pembelian naik, tetapi roti gagal berkurang sehingga biaya produksi dan keluhan pelanggan ikut turun. Keputusan di bagian pembelian memengaruhi kinerja bagian lain.")+CALL("<b>Intinya:</b> keputusan pada satu aktivitas bisa memengaruhi biaya atau kinerja aktivitas lain, jadi aktivitas tidak boleh dinilai sendiri-sendiri.")+UL(["Menurut Porter, linkages bisa memberi competitive advantage lewat <b>optimization</b> dan <b>coordination</b>.", "Linkages juga bisa mengarah ke luar, yaitu ke pemasok dan customer dalam value chain system.", "Kemampuan mengelola linkages dalam value chain system bisa menjadi competence sekaligus competitive advantage."])),
C("SWOT dan TOWS",P("SWOT sudah dibahas di Sesi 2. Di sini hasilnya dipakai untuk memilih strategi lewat TOWS, setelah audit lingkungan eksternal dan internal selesai. Pemahaman value chain membantu menunjukkan di mana strengths dan weaknesses berada, dan tujuannya menilai <b>strategic fit</b> antara kapabilitas organisasi dan kebutuhan lingkungannya.")+T(["Strategi TOWS", "Artinya", "Contoh sederhana"],[["SO", "Pakai strengths untuk memanfaatkan opportunities", "Restoran punya koki andal (S) dan melihat tren pesan-antar (O), lalu membuat menu khusus pesan-antar."], ["WO", "Atasi weaknesses agar bisa memanfaatkan opportunities", "Restoran belum punya aplikasi pemesanan (W) padahal pesan-antar sedang naik (O), lalu bekerja sama dengan platform yang sudah ada."], ["ST", "Pakai strengths untuk mengatasi threats", "Restoran punya pelanggan loyal (S) dan menghadapi pesaing baru yang murah (T), lalu membuat program member."], ["WT", "Minimalkan weaknesses agar terhindar dari threats", "Dapur kecil dan boros (W) di tengah naiknya harga bahan (T), lalu menyederhanakan menu."]])+CALL("SWOT adalah alat <b>audit dan analisis</b> yang dipakai di awal. TOWS dipakai sesudahnya untuk <b>merumuskan strategi</b> dengan menggabungkan faktor internal dan eksternal.")+P("<b>Keterbatasan SWOT menurut Henry (ringkas):</b> daftar faktor sering panjang dan dianggap sama bobotnya; strengths dan weaknesses tidak otomatis menjadi opportunities dan threats; satu faktor bisa ambigu (toko di banyak lokasi mudah dijangkau, tetapi fixed cost-nya tinggi); dan SWOT bukan keputusan strategis.")),
C("Performance: shareholder value vs stakeholders",T(["", "Shareholder value", "Stakeholder"],[["Tokoh", "Milton Friedman", "Freeman"], ["Pandangan", "Satu-satunya tanggung jawab sosial organisasi adalah menghasilkan laba sebesar mungkin bagi pemegang saham.", "Organisasi melayani semua pihak yang memengaruhi atau dipengaruhi pencapaian tujuannya (customers, suppliers, employees, government, community, dan shareholders)."]])+P("Kriteria kinerja yang berbeda bisa menghasilkan kesimpulan yang bertentangan, sehingga alokasi sumber daya bisa tidak optimal. Karena itu pertanyaan dasarnya adalah: untuk apa bisnis ada?")+DEF("Contoh konflik kepentingan","Pemegang saham ingin biaya tenaga kerja turun agar laba meningkat, sedangkan karyawan ingin upah dan kesejahteraan yang lebih baik. Dengan pandangan shareholder value, kepentingan pemegang saham didahulukan. Dengan pandangan stakeholder, perusahaan harus menimbang kedua kepentingan itu.")),
C("Balanced scorecard dan benchmarking",P("<b>Balanced scorecard</b> (Kaplan dan Norton) mengukur kinerja secara lebih luas daripada ukuran keuangan saja. Alasannya, rasio keuangan hanya menggambarkan masa lalu, dan strategi sering tidak diterjemahkan menjadi ukuran yang dipahami karyawan. BSC bukan alat untuk merumuskan strategi, melainkan alat untuk memastikan strategi berjalan.")+UL(["Empat perspektif dalam Henry: <b>customer, internal, financial, dan future</b> (inovasi dan pembelajaran).", "Ukuran keuangan tetap penting. BSC melengkapinya, bukan menggantikannya."])+DEF("Contoh sederhana","Restoran mengukur laba (financial), kepuasan pelanggan (customer), waktu penyajian (internal), dan menu baru yang berhasil diluncurkan (future).")+P("<b>Benchmarking</b> adalah membandingkan praktik organisasi dengan organisasi lain, tidak terbatas pada pesaing sejenis, untuk meniru atau memperbaiki praktik yang paling efisien. Xerox dikenal mengembangkannya, dan di Jepang dikenal praktik <i>Shukko</i>.")),
C("Resource-based view: resources dan capabilities",P("RBV melihat organisasi sebagai kumpulan resources dan capabilities yang bisa disusun ulang untuk meraih <b>sustainable competitive advantage</b>. Pendekatannya <i>inside-out</i>, berbeda dari Five Forces yang <i>outside-in</i>.")+T(["Konsep", "Artinya", "Contoh sederhana"],[["Resources", "Input untuk kegiatan organisasi. Ada yang berwujud (tangible): physical, financial, human. Ada yang tidak berwujud (intangible): misalnya brand, paten, pengetahuan. Resources saja tidak bernilai sebelum dipakai.", "Dapur, mesin, kas, dan koki (tangible); merek restoran dan resep rahasia (intangible)."], ["Capabilities", "Kemampuan sekelompok resources bekerja sama untuk melakukan suatu tugas (Grant). Resources adalah sumber capabilities.", "Koki, dapur, dan sistem pesanan yang bekerja sama menyajikan pesanan dengan cepat dan konsisten."], ["Threshold capability", "Kapabilitas yang dibutuhkan hanya untuk bisa bersaing di industri. Semua pesaing memilikinya.", "Semua restoran harus bisa memasak secara higienis."], ["Distinctive capability", "Kapabilitas yang membedakan perusahaan dan menjadi dasar keunggulan atas pesaing.", "Kecepatan dan konsistensi layanan yang tidak bisa disamai restoran lain."]])),
C("VRIO framework (Barney)",T(["Huruf", "Pertanyaan", "Kalau jawabannya ya"],[["V (Value)", "Apakah capability memungkinkan perusahaan memanfaatkan opportunity atau menetralkan threat?", "Ini syarat dasar untuk bisa menjadi keunggulan."], ["R (Rarity)", "Apakah capability hanya dimiliki sedikit pesaing?", "Kalau banyak pesaing memilikinya, capability itu tidak bisa menjadi sustainable advantage."], ["I (Imitability)", "Apakah mahal atau sulit bagi pihak lain untuk memperoleh atau meniru capability itu?", "Valuable dan rare saja hanya memberi keunggulan sementara."], ["O (Organization)", "Apakah organisasi sudah tertata untuk memanfaatkannya (control systems, prosedur, kebijakan)?", "Tanpa organisasi yang mendukung, capability yang valuable, rare, dan sulit ditiru bisa tidak termanfaatkan."]])+CALL("Hanya capability yang <b>valuable, rare, costly to imitate, dan didukung organisasi</b> yang menghasilkan sustainable competitive advantage. Contoh imitasi: perusahaan dot.com 1990-an mendapat keunggulan sementara, lalu ditiru.")+T(["V", "R", "I", "O", "Hasil"],[["Tidak", "–", "–", "–", "Competitive disadvantage: capability tidak membantu memanfaatkan peluang atau menetralkan ancaman."], ["Ya", "Tidak", "–", "–", "Competitive parity (kesetaraan bersaing): banyak pesaing punya capability yang sama."], ["Ya", "Ya", "Tidak", "–", "Temporary competitive advantage: unggul untuk sementara, lalu pesaing menyusul."], ["Ya", "Ya", "Ya", "Tidak", "Potensi keunggulan belum termanfaatkan, karena organisasi belum tertata untuk memakainya."], ["Ya", "Ya", "Ya", "Ya", "Sustainable competitive advantage."]])+CALL("Cara membaca: V = valuable, R = rare, I = costly to imitate, O = organization. Tanda – berarti tidak perlu dinilai lagi. Hasil tiap kombinasi berasal dari kerangka umum Barney, bukan dari Henry. Cocokkan dengan catatan dosen.")),
C("Make-or-buy dan core competence",UL(["Aktivitas yang dikerjakan organisasi dengan sangat baik disebut <b>core competence</b>.", "Aktivitas non-core bisa di-outsource ke pihak lain yang mampu menyediakannya dengan biaya lebih rendah.", "Aktivitas yang menjadi core competence biasanya lebih layak dipertahankan secara internal, tetapi tetap perlu mempertimbangkan risiko dan kemampuan pemasok, misalnya apakah pemasok mampu menjaga kualitas dan pasokan.", "Contoh dari Henry: British Airways menilai penyediaan makanan di pesawat bernilai tambah kecil dan lebih murah jika dibuat pihak lain di pasar."])+T(["Keputusan", "Cocok bila"],[["Make (kerjakan sendiri)", "Aktivitas itu core competence atau sumber keunggulan, dan pasar tidak bisa diandalkan menyediakannya dengan mutu dan syarat yang memadai."], ["Buy (outsource)", "Aktivitas itu non-core, dan pihak lain bisa menyediakannya dengan biaya lebih rendah dan mutu yang cukup."]])+DEF("Contoh sederhana","Sebuah restoran yang keunggulannya ada di resep dan teknik memasak (core competence) sebaiknya memasak sendiri. Mencuci piring dan mengantar pesanan (non-core) bisa diserahkan ke pihak lain yang lebih murah dan andal. Tetapi jika jasa pengiriman itu sering terlambat, restoran perlu menimbang risikonya sebelum menyerahkannya.")),
C("Kritik RBV dan pengembangannya",UL(["<b>Kritik RBV:</b> kurang menjelaskan bagaimana resources dan capabilities berkembang dan berubah dari waktu ke waktu, serta bagaimana capabilities baru dibangun. Miller memperkenalkan <i>asymmetries</i>, yaitu cara-cara sulit ditiru yang membedakan perusahaan dari pesaingnya.", "<b>Knowledge-based view</b> (Nonaka, Grant): sumber utama sustainable competitive advantage adalah pengetahuan, yaitu apa yang diketahui perusahaan dan kemampuannya menciptakan serta memakai pengetahuan baru. Contoh: sebuah bengkel yang rutin membagikan teknik perbaikan terbaik dari montir senior ke seluruh montir, sehingga seluruh bengkel menjadi cepat dan akurat.", "<b>Dynamic capabilities</b> (Teece, Pisano, Shuen) adalah kemampuan perusahaan untuk mengembangkan dan mengubah cara kerjanya agar tetap mampu bersaing ketika keadaan pasar berubah. Konsep ini dibuat untuk mengatasi keterbatasan RBV. Rumusan aslinya: mengintegrasikan, membangun, dan mengkonfigurasi ulang kompetensi internal dan eksternal."])+CALL("<b>Intinya:</b> perusahaan bukan hanya harus memiliki kemampuan yang bagus, tetapi juga harus mampu memperbarui kemampuan itu ketika kondisi pasar berubah.")+DEF("Contoh sederhana dynamic capabilities","Sebuah toko yang awalnya hanya menjual langsung mulai memakai aplikasi pemesanan dan layanan antar saat kebiasaan pelanggan berubah. Toko itu tidak hanya punya kemampuan menjual, tetapi mampu memperbarui kemampuannya mengikuti perubahan.")),
C("Dynamic capabilities lebih dalam (kasus Buffett)",P("Definisi dynamic capabilities ada di kartu Kritik RBV. Di sini dipakai sebagai ilustrasi singkat: kemampuan Buffett dipakai bukan hanya untuk menjalankan bisnis yang ada, tetapi untuk mengubah cara Berkshire menghasilkan value.")+T(["Dimensi", "Artinya", "Contoh Berkshire dan Buffett (pemetaan latihan)"], [["Sensing", "Mengenali peluang dan ancaman", "Menghindari tren dot-com akhir 1990-an karena tidak memahaminya, dan hanya membeli perusahaan yang ia pahami"], ["Seizing", "Mengambil peluang lewat keputusan dan alokasi sumber daya", "Capital allocation: membeli perusahaan dengan competitive advantage dan perlindungan dari kompetitor, serta memakai insurance float untuk mendukung investasi"], ["Reconfiguring", "Menyusun ulang aset dan cara menciptakan value", "Bergeser dari untung terutama lewat investment activities menjadi kepemilikan langsung atas berbagai bisnis, serta menarik dan mempertahankan manajer yang andal"]])+CALL("Sensing, seizing, dan reconfiguring adalah penjabaran umum dari Teece, bukan dari Henry. Henry hanya mendefinisikan dynamic capabilities seperti di kartu Kritik RBV."),"Kasus tugas dosen"),
C("Mengapa capabilities sulit ditiru: path dependency, causal ambiguity, social complexity",P("Ketiganya menjelaskan huruf <b>I (Imitability)</b> pada VRIO, yaitu mengapa meniru sebuah capability itu mahal atau tidak mungkin. Istilah ini masuk daftar konsep tugas dosen. Penjelasan umumnya berasal dari literatur RBV, bukan dari Henry.")+T(["Mekanisme", "Artinya"], [["Path dependency", "Keunggulan terbentuk lewat urutan sejarah dan pengalaman yang tidak bisa diulang dari nol."], ["Causal ambiguity", "Pesaing tidak tahu persis faktor mana yang menyebabkan kinerja, sehingga tidak tahu apa yang harus ditiru."], ["Social complexity", "Keunggulan lahir dari hubungan dan budaya antarorang yang sulit direkayasa."]])+DEF("Contoh bersama: Berkshire","<b>Path dependency:</b> pengalaman, reputasi, dan hubungan dengan manajer yang terbentuk selama puluhan tahun. <b>Causal ambiguity:</b> model tampak sederhana, tetapi judgement Buffett dan Munger serta budaya sulit diuraikan. <b>Social complexity:</b> kepercayaan besar pada manajer perusahaan akuisisi dan budaya Berkshire.")+CALL("Struktur bisnis Berkshire (kepemilikan banyak bisnis, asuransi, insurance float) bisa dilihat dan ditiru. Capabilities yang menjalankannya tidak. Itu sebabnya model yang tampak sederhana tetap sulit disamai."),"Kasus tugas dosen"),
C("Kasus tugas: Berkshire tanpa Buffett dan Munger (suksesi)",UL(["<b>Risiko:</b> sebagian capability melekat pada orang (judgement, reputasi, hubungan), sehingga tidak otomatis berpindah ke penerus. Kasus menyebut ini sebagai tantangan succession.", "<b>Penopang yang sudah ada:</b> banyak manajer bisnis tetap menjalankan operasinya dalam jangka panjang dan Berkshire tidak mengendalikan operasi harian. Model insurance float dan kepemilikan langsung atas banyak bisnis juga tetap berjalan.", "<b>Arah jawaban:</b> Berkshire bisa bertahan bila budaya dan kebiasaan pengambilan keputusan sudah melembaga dalam organisasi (dimensi Organization pada VRIO), bukan hanya pada dua orang. Bila tidak, keunggulannya bisa menjadi temporary."])+CALL("Ini ringkasan argumen untuk latihan, bukan kunci dosen."),"Kasus tugas dosen")
].join('')};

["Huruf O (Organization) dalam VRIO menanyakan apakah…", ["Perusahaan punya struktur divisi yang lebih besar dan lebih lengkap dari pesaing", "Perusahaan punya struktur, sistem, dan proses untuk memanfaatkan resource tersebut", "Resource tersebut dimiliki oleh banyak organisasi lain di dalam industri yang sama", "Pelanggan menilai resource tersebut berharga dan bersedia membayar lebih untuknya"], 1, "Tanpa dukungan organisasi, capability yang valuable, rare, dan sulit ditiru bisa tidak dimanfaatkan."],
["Make-or-buy decision: aktivitas non-core biasanya…", ["Selalu dikerjakan sendiri", "Dijual ke pesaing", "Bisa di-outsource", "Dihentikan"], 2, "Contoh British Airways dan makanan di pesawat."],
["Kritik utama terhadap RBV adalah…", ["Tidak memakai resources", "Terlalu fokus pada industri", "Kurang menjelaskan perubahan capabilities", "Terlalu banyak variabel keuangan"], 2, "Dynamic capabilities dibuat untuk mengatasi keterbatasan ini."],
["Knowledge-based view menganggap sumber utama sustainable competitive advantage adalah…", ["Modal finansial yang besar", "Pengetahuan dan kemampuan memakainya", "Lokasi yang strategis", "Skala produksi yang besar"], 1, "Terkait Nonaka dan Grant."],
["Dynamic capabilities (Teece, Pisano, Shuen) adalah kemampuan untuk…", ["Menaikkan harga produk secara berkala", "Memotong biaya operasional secara agresif", "Mengakuisisi pesaing yang lebih kecil", "Mengonfigurasi ulang kompetensi"], 3, "Fokus pada pembaruan kapabilitas agar tetap cocok dengan lingkungan."],
["Mana contoh intangible resources?",["Pabrik dan mesin","Kas di bank","Merek dan paten","Gudang distribusi"],2,"Tangible: physical, financial, human. Intangible: misalnya brand, paten, pengetahuan."],
["Perawatan mesin yang memungkinkan aktivitas produksi berjalan, tanpa langsung menciptakan nilai bagi pembeli, termasuk aktivitas…",["Direct","Quality assurance","Indirect","Outbound logistics"],2,"Indirect memungkinkan aktivitas direct berjalan (misalnya perawatan). Direct menciptakan nilai langsung bagi pembeli."],
["Aktivitas yang memastikan kualitas aktivitas lain dalam value chain tetap terjaga termasuk jenis…",["Quality assurance","Direct","Indirect","Linkage"],0,"Tiap kategori value chain punya tiga jenis aktivitas: direct, indirect, dan quality assurance."],
["Toko di banyak lokasi mudah dijangkau pelanggan, tetapi fixed cost-nya tinggi. Contoh ini menunjukkan keterbatasan SWOT berupa…",["Daftar faktor yang terlalu panjang dan tidak berbobot","Satu faktor bisa ambigu: strength sekaligus weakness","Opportunities tidak bisa dikendalikan perusahaan","SWOT mengabaikan lingkungan eksternal sama sekali"],1,"Henry menyebut ambiguitas: satu faktor bisa menjadi strength sekaligus weakness, atau opportunity sekaligus threat."],
["Balanced scorecard paling tepat dipahami sebagai alat untuk…",["Merumuskan strategi baru","Menemukan opportunities dan threats","Menganalisis struktur industri","Menerjemahkan strategi menjadi ukuran"],3,"BSC bukan alat merumuskan strategi, tetapi alat memastikan strategi berjalan. Ukuran keuangan tetap penting dan dilengkapi, bukan digantikan."],["Pesaing bisa meniru struktur bisnis Berkshire, tetapi tidak bisa memastikan faktor mana yang sebenarnya menghasilkan kinerjanya. Situasi ini paling tepat disebut…", ["Path dependency", "Social complexity", "Causal ambiguity", "Threshold capability"], 2, "Causal ambiguity: hubungan sebab dan akibat kinerja tidak jelas bagi pesaing, sehingga tidak tahu apa yang harus ditiru."],
["Capabilities Berkshire terbentuk lewat puluhan tahun pengalaman, reputasi, dan hubungan yang tidak bisa diulang dari nol. Hal ini paling tepat disebut…", ["Economies of scale", "Make-or-buy", "Causal ambiguity", "Path dependency"], 3, "Path dependency: keunggulan terbentuk lewat urutan sejarah yang tidak bisa diputar ulang."],
["Dynamic capabilities Buffett berbeda dari sekadar resources karena…", ["Berupa saham perusahaan besar yang dimiliki Berkshire", "Dipakai mengubah cara Berkshire menciptakan value", "Hanya dimiliki perusahaan asuransi", "Tidak terpengaruh perubahan lingkungan"], 1, "Dynamic capabilities adalah kemampuan membangun, mengintegrasikan, dan mengkonfigurasi ulang kompetensi untuk lingkungan yang berubah."],
["Netflix mulai membuat konten sendiri karena lisensi dari studio makin sulit dan mahal. Dalam kerangka make-or-buy, alasan ini menunjukkan…", ["Pasar tidak lagi menyediakan input yang memadai", "Aktivitas itu tidak penting dan sebaiknya dilepas", "Outsourcing selalu lebih murah dibanding produksi sendiri", "Netflix menghentikan model langganan"], 0, "Bila aktivitas penting dan pasar sulit atau mahal diandalkan, perusahaan cenderung mengerjakan sendiri (make)."]];
const E3=[["Bandingkan positioning school (Porter) dan resource-based view dalam menjelaskan perbedaan kinerja perusahaan.", "Positioning: outside-in; profit ditentukan struktur industri dan posisi perusahaan. RBV: inside-out; ditentukan resources dan capabilities. Keduanya bisa saling melengkapi."],
["Jelaskan value chain Porter beserta primary dan support activities. Apa arti linkages?", "Primary: inbound logistics, operations, outbound logistics, marketing and sales, service. Support: procurement, technology development, HRM, firm infrastructure. Linkages: hubungan antara cara satu aktivitas dijalankan dan biaya atau kinerja aktivitas lain; keunggulan bisa lewat optimization dan coordination."],
["Jelaskan SWOT, TOWS, dan keterbatasan SWOT.", "SWOT: audit strengths dan weaknesses (internal) serta opportunities dan threats (eksternal). TOWS: SO, WO, ST, WT untuk merumuskan strategi. Keterbatasan: daftar panjang tanpa bobot, S dan W tidak otomatis jadi O dan T, ambigu, dan bukan keputusan."],
["Apa yang diukur balanced scorecard, dan mengapa ukuran keuangan saja tidak cukup?", "Customer, internal, financial, dan future. Ukuran keuangan hanya menggambarkan masa lalu, dan strategi perlu diterjemahkan menjadi ukuran yang dipahami karyawan."],
["Terapkan VRIO pada sebuah capability. Kapan menghasilkan sustainable competitive advantage?", "Cek Value, Rarity, Imitability, Organization. Sustainable bila valuable, rare, costly to imitate, dan organisasi mendukung. Valuable dan rare saja hanya memberi keunggulan sementara."],
["Mengapa muncul knowledge-based view dan dynamic capabilities sebagai pengembangan RBV?", "RBV kurang menjelaskan bagaimana capabilities berkembang. Knowledge-based view menekankan pengetahuan sebagai sumber keunggulan. Dynamic capabilities menekankan kemampuan membangun dan mengkonfigurasi ulang kompetensi di lingkungan yang cepat berubah."]];
CONTENT.s13={kicker:'Sesi 13 · CA Syllabus Topic 16 · Henry selected Ch. 4, 7 & 9',title:'Strategic Information, Data Analytics, and Digital Business',desc:'Sesi ini membahas bagaimana informasi dan teknologi membantu pengambilan keputusan strategis. Cakupan mengikuti RPKPS: MIS, data strategis/keuangan/operasional, analytics dan big data, IT governance, e-commerce, fintech, dan cryptocurrency. Penjelasan digital-business di bawah merupakan pengembangan konseptual; isi terperinci Modul IAI Bab XI dan bacaan tambahan belum tersedia untuk diverifikasi langsung.',materi:[
C("1. Mengapa informasi penting bagi strategi?",P("Informasi membantu manajemen memahami kondisi perusahaan, pelanggan, pesaing, dan risiko sebelum mengambil keputusan. Data mentah belum otomatis menjadi informasi yang berguna; data perlu diperiksa, diberi konteks, dan dihubungkan dengan pertanyaan bisnis." )+T(["Istilah","Penjelasan sederhana","Contoh"],[["Data","Catatan atau fakta mentah.","Tanggal transaksi, jumlah penjualan, jumlah keluhan."],["Informasi","Data yang diolah sehingga menjawab pertanyaan.","Penjualan turun 12% di wilayah tertentu dibanding bulan sebelumnya."],["Insight","Pemahaman tentang kemungkinan penyebab atau tindakan.","Penurunan terjadi setelah waktu pengiriman memburuk; perusahaan perlu memeriksa proses distribusi." ]])+CALL("Keputusan yang baik tidak hanya bergantung pada banyaknya data, tetapi juga pada kualitas, relevansi, ketepatan waktu, dan cara menafsirkannya.")),
C("2. Management Information System (MIS)",P("Management Information System (MIS) atau sistem informasi manajemen adalah gabungan orang, proses, data, dan teknologi yang membantu organisasi mengumpulkan, mengolah, menyimpan, serta menyampaikan informasi untuk menjalankan dan mengelola bisnis." )+T(["Jenis sistem","Fungsi","Contoh"],[["Transaction Processing System (TPS)","Mencatat transaksi rutin.","Penjualan, pembayaran, penggajian."],["Management Information System (MIS)","Menyediakan laporan rutin untuk manajer.","Laporan penjualan mingguan per cabang."],["Decision Support System (DSS)","Membantu membandingkan pilihan atau skenario.","Simulasi dampak kenaikan harga terhadap laba."],["Executive Information/Support System (EIS/ESS)","Menyajikan ringkasan indikator penting bagi pimpinan.","Dashboard KPI dan risiko perusahaan."]])+P("Sistem-sistem ini dapat saling terhubung. Namun, sistem yang canggih tidak otomatis menghasilkan keputusan yang baik jika datanya salah, definisi ukuran berbeda, atau pengguna tidak memahami laporan.")),
C("3. Data strategis, keuangan, dan operasional",P("Data yang dibutuhkan bergantung pada keputusan yang akan dibuat. Data strategis membantu menilai arah jangka panjang; data keuangan menunjukkan kondisi ekonomi; sedangkan data operasional memperlihatkan bagaimana proses berjalan sehari-hari." )+T(["Jenis data","Pertanyaan yang dijawab","Contoh ukuran"],[["Strategis","Apakah perusahaan bergerak ke arah yang tepat?","Pangsa pasar, retensi pelanggan, pertumbuhan segmen."],["Keuangan","Apakah kegiatan menghasilkan hasil keuangan yang sehat?","Pendapatan, margin, arus kas, biaya, piutang."],["Operasional","Apakah proses berjalan efektif dan efisien?","Waktu proses, tingkat kesalahan, persediaan, pengiriman tepat waktu."],["Pelanggan","Apa yang dibutuhkan dan dikeluhkan pelanggan?","Kepuasan, keluhan, pembelian ulang." ]])+P("Contoh: jika pendapatan naik tetapi kas menurun, manajemen perlu melihat data keuangan seperti piutang dan arus kas, lalu memeriksa data operasional seperti keterlambatan penagihan atau persediaan berlebih.")),
C("4. Data analytics dan big data",P("Data analytics adalah proses memeriksa data untuk menemukan pola, menjelaskan hasil, memperkirakan kemungkinan, atau membantu memilih tindakan. Big data merujuk pada kumpulan data yang besar, cepat bertambah, atau beragam sehingga membutuhkan cara pengelolaan dan analisis yang sesuai." )+T(["Jenis analisis","Pertanyaan utama","Contoh"],[["Descriptive analytics","Apa yang terjadi?","Laporan penjualan bulan ini."],["Diagnostic analytics","Mengapa hal itu terjadi?","Mencari alasan penjualan turun di cabang tertentu."],["Predictive analytics","Apa yang mungkin terjadi?","Memperkirakan permintaan bulan depan."],["Prescriptive analytics","Tindakan apa yang sebaiknya dipilih?","Membandingkan rencana persediaan atau jadwal pengiriman." ]])+P("Analisis dapat menggunakan dashboard, statistik, visualisasi, atau model prediksi. Hasil model tetap perlu diperiksa karena data yang tidak lengkap, bias, atau perubahan kondisi dapat menghasilkan kesimpulan keliru." )+CALL("Urutan sederhana: tentukan pertanyaan bisnis → periksa kualitas data → analisis → jelaskan hasil → ambil tindakan → pantau dampaknya.")),
C("5. IT governance dan risiko teknologi",P("IT governance adalah pengaturan tanggung jawab, keputusan, dan pengawasan agar teknologi informasi mendukung tujuan organisasi, menggunakan sumber daya dengan baik, dan mengelola risiko. Teknologi bukan hanya urusan bagian TI karena keputusan teknologi dapat memengaruhi keuangan, operasi, pelanggan, dan kepatuhan." )+T(["Area pengawasan","Yang perlu diperhatikan","Contoh kontrol"],[["Keselarasan strategi","Apakah investasi TI mendukung tujuan bisnis?","Kasus bisnis, prioritas, evaluasi manfaat."],["Keamanan dan akses","Siapa boleh melihat atau mengubah data?","Hak akses sesuai peran, autentikasi, tinjauan akses."],["Kualitas dan integritas data","Apakah data akurat, lengkap, dan konsisten?","Validasi input, rekonsiliasi, pemilik data."],["Keberlangsungan layanan","Apa yang dilakukan saat sistem gagal?","Backup, rencana pemulihan, uji pemulihan."],["Pihak ketiga dan kepatuhan","Apakah vendor dan penggunaan data memenuhi ketentuan?","Uji kelayakan vendor, kontrak, pemantauan dan audit." ]])+P("Risiko penting meliputi kebocoran data, serangan siber, sistem berhenti, kesalahan data, ketergantungan pada vendor, biaya proyek yang membengkak, serta model analitik yang bias. Kontrol harus disesuaikan dengan tingkat risiko dan kebutuhan bisnis.")),
C("6. E-commerce dan strategi bisnis digital",P("E-commerce adalah kegiatan membeli atau menjual barang dan jasa melalui saluran elektronik. Strategi bisnis digital lebih luas: teknologi digital dapat mengubah cara perusahaan menawarkan nilai, berinteraksi dengan pelanggan, menjalankan operasi, dan memperoleh pendapatan." )+T(["Model","Cara kerja","Contoh"],[["Business-to-Consumer (B2C)","Perusahaan menjual langsung kepada konsumen.","Toko daring milik merek."],["Business-to-Business (B2B)","Transaksi antarperusahaan.","Portal pemesanan bahan baku untuk pelanggan bisnis."],["Marketplace/platform","Platform mempertemukan penjual dan pembeli.","Marketplace dengan banyak penjual."],["Omnichannel","Kanal daring dan luring terhubung.","Pelanggan memesan lewat aplikasi lalu mengambil di toko." ]])+P("Saat memilih strategi digital, perusahaan perlu menilai kebutuhan pelanggan, biaya memperoleh dan melayani pelanggan, logistik, pembayaran, keamanan, pengalaman pengguna, serta kemampuan menghubungkan data antar-kanal.")),
C("7. Fintech dan cryptocurrency",P("Fintech (financial technology) adalah penggunaan teknologi untuk menyediakan atau memperbaiki layanan keuangan, seperti pembayaran digital, pinjaman, investasi, dan pengelolaan keuangan. Cryptocurrency adalah aset digital yang menggunakan teknik kriptografi; sebagian menggunakan jaringan blockchain. Keduanya bukan hal yang sama: fintech adalah bidang layanan berbasis teknologi, sedangkan cryptocurrency merupakan salah satu jenis aset digital." )+T(["Topik","Peluang","Risiko yang perlu dinilai"],[["Pembayaran digital","Transaksi lebih praktis dan cepat.","Penipuan, gangguan layanan, keamanan akun, biaya."],["Pinjaman digital","Akses pembiayaan lebih mudah.","Kelayakan peminjam, privasi, penagihan, kepatuhan."],["Blockchain/crypto-assets","Pencatatan atau transfer aset digital melalui jaringan tertentu.","Volatilitas harga, penipuan, kehilangan akses, risiko operasional dan regulasi." ]])+P("Untuk keputusan bisnis, jangan hanya melihat tren atau potensi keuntungan. Nilai model bisnis, manfaat bagi pengguna, tata kelola, perlindungan data, risiko operasional, dan ketentuan yang berlaku. Cryptocurrency tidak boleh dianggap selalu stabil atau selalu cocok untuk transaksi perusahaan.")),
C("8. Contoh kasus: perusahaan ritel yang mengembangkan kanal digital",P("Sebuah jaringan toko melihat penjualan daring meningkat, tetapi keluhan pengiriman dan selisih persediaan juga bertambah. Manajemen ingin menentukan apakah perlu mengembangkan aplikasi baru atau memperbaiki sistem yang sudah ada." )+UL(["Tentukan tujuan keputusan: misalnya meningkatkan ketepatan pesanan dan pengalaman pelanggan, bukan sekadar membuat aplikasi baru.","Gabungkan data penjualan, keluhan, stok, biaya pengiriman, retur, dan arus kas.","Gunakan analisis deskriptif untuk melihat lokasi masalah, lalu analisis diagnostik untuk mencari penyebab.","Nilai alternatif dari manfaat, biaya total, keamanan, integrasi dengan sistem lama, dan kesiapan pegawai.","Tetapkan kontrol TI: hak akses, validasi stok, pencatatan perubahan, backup, dan prosedur jika sistem gagal.","Uji coba di beberapa cabang, ukur hasilnya, perbaiki kelemahan, lalu putuskan apakah perlu diperluas."])+P("Kasus ini menunjukkan bahwa keputusan digital membutuhkan kerja sama strategi, keuangan, operasi, layanan pelanggan, dan TI.")),
C("9. Kesalahan umum dalam keputusan berbasis data",UL(["Menganggap korelasi selalu berarti sebab-akibat.","Menggunakan data yang tidak lengkap, terlambat, atau memiliki definisi berbeda.","Mengejar dashboard atau teknologi baru tanpa pertanyaan bisnis yang jelas.","Mengabaikan keamanan, privasi, hak akses, dan keberlangsungan sistem.","Menganggap prediksi sebagai kepastian, bukan perkiraan yang memiliki ketidakpastian.","Mengukur keberhasilan digital hanya dari jumlah pengguna tanpa menilai manfaat, biaya, dan risiko.","Menganggap cryptocurrency sama dengan semua layanan fintech."])),
C("10. Ringkasan inti",UL(["MIS mengubah data menjadi informasi yang mendukung pengelolaan dan keputusan.","Data strategis, keuangan, operasional, dan pelanggan saling melengkapi.","Analytics dapat menjelaskan apa yang terjadi, mengapa terjadi, apa yang mungkin terjadi, dan pilihan tindakan.","Big data memerlukan tata kelola dan kualitas data yang baik; ukuran data besar tidak menjamin insight yang baik.","IT governance menyelaraskan teknologi dengan strategi serta mengawasi risiko, kontrol, dan manfaat investasi.","E-commerce adalah bagian dari peluang bisnis digital, tetapi keberhasilannya juga bergantung pada proses, logistik, dan pengalaman pelanggan.","Fintech dan cryptocurrency berbeda; keduanya memerlukan penilaian risiko, keamanan, tata kelola, dan kepatuhan.","Tujuan akhir teknologi dan analitik adalah membantu keputusan dan hasil bisnis, bukan sekadar mengumpulkan data."]))
]};
